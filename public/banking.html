<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banking</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#222F34">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/tiles.css">
<style>
  .banking-page .shell{max-width:none;padding:18px 24px 30px}
  .banking-page .topline{padding-left:24px;padding-right:24px}
  .pills{display:inline-flex;gap:3px;flex-wrap:wrap;margin-bottom:16px;padding:4px;
    border:1px solid var(--line);border-radius:11px;background:#fff}
  .pills button{padding:7px 13px;border-radius:7px;border:0;background:transparent;
    font:500 12px var(--sans);color:var(--muted);cursor:pointer}
  .pills button:hover{background:var(--panel-2);color:var(--ink)}
  .pills button.on{background:var(--ink);color:#fff}
  .pills{display:flex;width:100%;box-sizing:border-box}
  .bank-readonly #tabs [data-tab]:not([data-tab="report"]),.bank-readonly .bk-settings-tabs{display:none!important}
  .bk-settings-tabs{margin-left:auto;display:flex;gap:3px;border-left:1px solid var(--line);padding-left:8px}
  .bk-help{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-left:4px;border:1px solid #98b5b3;border-radius:50%;font:600 10px var(--sans);color:var(--muted);cursor:help;vertical-align:middle}
  .bk-help:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .bk-account-fields{grid-template-columns:minmax(220px,2fr) minmax(130px,1fr);margin:16px 0}
  .bk-opening-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
  .bk-opening-group{padding:16px;border:1px solid var(--line);border-radius:9px;background:#f8fbfa;min-width:0}
  .bk-opening-group h3{margin:0 0 14px;font:600 14px var(--sans)}
  .bk-opening-group label{display:block;margin:12px 0 6px;font-size:11px}
  .bk-opening-group input{width:100%;box-sizing:border-box;height:40px;min-width:0}
  .banking-page .form input:not([type="checkbox"]):not([type="radio"]),.banking-page .form select{box-sizing:border-box;min-width:0;width:100%;height:40px;font:13px var(--sans)}
  .bk-opening-group input{font:13px var(--sans);font-variant-numeric:tabular-nums}
  .bk-launcher{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin:20px 0}
  .bk-door{text-align:left;border:1px solid var(--line);border-radius:14px;background:#fff;padding:24px;cursor:pointer;color:var(--ink)}
  .bk-door:hover{border-color:var(--accent);box-shadow:0 8px 24px #153b3612;transform:translateY(-2px)}
  .bk-door b{display:block;font:700 17px var(--sans);margin:14px 0 7px}.bk-door small{font:13px var(--sans);color:var(--muted)}
  .bk-door .bk-icon{display:block;width:58px;height:58px}.bk-icon svg{width:100%;height:100%}
  .banking-page #view .form{padding:16px;border:1px solid var(--line);border-radius:10px;background:#f8fbfa;gap:16px;align-items:start;margin:16px 0}
  .banking-page #view .bk-account-fields{padding:0;border:0;background:none}
  .banking-page #view .form label{display:block;min-height:16px;margin-bottom:7px;letter-spacing:.07em;font-size:11px}
  .banking-page #view .form .wide{grid-column:1/-1}
  #bkBack{margin-right:10px}.banking-page .sec>h2{font:600 15px var(--sans)}
  @media(max-width:640px){.bk-launcher{grid-template-columns:1fr}.banking-page #view .form{grid-template-columns:1fr}}
  @media(max-width:800px){.bk-opening-grid{grid-template-columns:1fr}.bk-settings-tabs{margin-left:0;border-left:0;padding-left:0}.bk-account-fields{grid-template-columns:1fr}}
  table.plain{width:100%;border-collapse:collapse;font:11.5px var(--sans)}
  table.plain th{font:500 11px var(--sans);letter-spacing:0;text-transform:none;
    color:var(--muted);padding:7px 8px;border-bottom:1px solid #bccfce;white-space:nowrap;background:#edf4f3}
  table.plain td{padding:5px 8px;border-bottom:1px solid #cfdddc;border-right:1px solid #e3eae9}
  table.plain tbody tr:nth-child(even) td{background:#f5f9f8}
  table.plain td:last-child{border-right:0}
  table.plain tr:last-child td{border-bottom:0}
  table.plain td.n,table.plain th.n{text-align:right}
  table.plain td.n{font-family:var(--sans);font-variant-numeric:tabular-nums}
  table.plain td.nm{font-weight:500}
  table.plain tr.click{cursor:pointer}
  table.plain tr.click:hover td{background:var(--panel-2)}
  table.plain tfoot td{border-top:1px solid #adc6c3;background:#eaf3f2;font-weight:600;padding-top:8px;padding-bottom:8px}
  .neg{color:var(--neg)} .pos{color:var(--ok)} .wrapx{overflow-x:auto}
  .banking-page #view .sheet{border-radius:12px;overflow:hidden}
  .banking-page #view button.mini{border:1px solid var(--line);border-radius:8px;padding:6px 11px;
    font:500 12px var(--sans);background:#fff;color:var(--ink)}
  .banking-page #view button.mini:hover{border-color:var(--accent-deep);color:var(--accent-deep);background:var(--accent-soft)}
  .banking-page #view button.solid{background:var(--accent-deep);border-radius:8px}
  .banking-page #view button.solid:hover{background:var(--ink)}
  .bkstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
  .bkstat{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;min-width:0}
  .bkstat-label{display:block;font:500 11.5px var(--sans);color:var(--muted);margin-bottom:7px}
  .bkstat-value{display:block;font:500 clamp(19px,1.8vw,28px) var(--sans);letter-spacing:-.04em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .bkstat small{display:block;margin-top:6px;color:var(--muted);font:11px var(--sans)}
  .bkstat.live{background:var(--ink);border-color:var(--ink);color:#fff}
  .bkstat.live .bkstat-label,.bkstat.live small{color:#c6d6d7}
  .bkstat.live .bkstat-value{color:var(--aqua)}
  .bkstat-value.unavailable{font-size:17px;letter-spacing:0}
  .bk-toolbar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .bk-toolbar h2{margin:0;font:600 14px var(--sans);letter-spacing:0}
  .bk-toolbar .bk-account-count{color:var(--muted);font-size:11px;font-weight:400;margin-left:7px}
  .bk-toolbar-actions{display:flex;align-items:center;gap:9px;margin-left:auto}
  .bk-segments{display:flex;gap:2px;padding:3px;border-radius:8px;background:#edf2f2}
  .bk-segments button{font:500 11px var(--sans);padding:5px 9px;background:transparent;border:0;border-radius:6px;color:var(--muted);cursor:pointer}
  .bk-segments button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px #18232a14}
  .bk-issues{margin:0 0 12px;border:1px solid #ebdfc9;border-radius:9px;background:#fffaf2;color:var(--warn);font-size:12px}
  .bk-issues summary{cursor:pointer;padding:8px 12px;font-weight:500}
  .bk-issues-body{padding:0 12px 8px;max-height:220px;overflow:auto}
  .bk-issues-body>div{padding:5px 0;border-top:1px solid #eee4d4}
  .bk-star{font-size:11px;color:var(--warn);padding-left:2px;cursor:help}
  .bkstat.live .bk-star{color:#f4d495}
  .bk-na{font-size:11px;color:var(--warn);font-weight:500}
  .bk-total-note{display:block;font-size:10px;font-weight:400;color:var(--muted);margin-top:3px}
  @media(max-width:900px){.bkstats{gap:8px}.bkstat{padding:12px}.banking-page .shell{padding:14px 16px 24px}}
  @media(max-width:620px){.bkstats{grid-template-columns:repeat(2,minmax(0,1fr))}.bkstat-value{font-size:22px}.bk-toolbar-actions{width:100%;margin-left:0;justify-content:space-between}}

  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .form label{margin:0 0 5px}
  .form .wide{grid-column:1 / -1}
  .acts{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .acts .msg{font-size:12.5px}
  .msg.bad{color:var(--neg)} .msg.good{color:var(--ok)}
  button.danger{padding:7px 13px;background:#fff;border:1px solid var(--line-2);
    border-radius:6px;font:inherit;font-size:12.5px;color:var(--neg);cursor:pointer}
  button.danger:hover{border-color:var(--neg)}

  .lognote{font-size:12px;color:var(--faint);padding:8px 14px}
  .chg{display:flex;gap:10px;align-items:baseline;padding:7px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
  .chg:last-child{border-bottom:0}
  .chg b{font-family:var(--mono);font-size:12px}
  .chg .who{margin-left:auto;color:var(--faint);font-size:11.5px}
  .warn{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:7px;
    font-size:12.5px;margin-bottom:12px}
  .bkidentity strong{display:block;font:500 12px var(--sans);color:var(--ink);line-height:1.25}
  .bkidentity small,.bkdate{display:block;color:var(--muted);font:10.5px var(--sans);margin-top:3px;line-height:1.25}
  .bkbanks{table-layout:fixed}
  table.bkbanks th{background:#edf4f3;white-space:normal;padding:7px 8px;font-size:10.5px}
  .bkbanks th:first-child{width:25%}
  .bkbanks th:not(:first-child){width:12.5%}
  table.bkbanks td{vertical-align:middle;padding:5px 8px;font-size:11.5px;line-height:1.2}
  .bkbanks td.bkidentity{white-space:normal}
  .bkbanks .bkidentity strong,.bkbanks .bkidentity small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bkbanks td.n{white-space:nowrap;letter-spacing:-.025em;font-weight:500}
  .bkbanks tbody tr:hover td{background:#f6fafa}
  .bkbanks td.bklive,.bkbanks th.bklive{background:#eff9f8;color:var(--accent-deep);font-weight:600}
  .bkbanks tfoot td.bklive{background:#e0f1ef}
  .bk-amount-button{display:inline-flex;align-items:center;justify-content:flex-end;gap:4px;width:100%;
    border:1px solid transparent;border-radius:6px;padding:2px 0;background:transparent;color:inherit;
    font:500 11.5px var(--sans);font-variant-numeric:tabular-nums;letter-spacing:-.025em;cursor:pointer;white-space:nowrap}
  .bk-amount-button:hover{color:var(--accent-deep);background:var(--accent-soft);border-color:#cfe9e6}
  .bk-amount-button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .bk-open-icon{width:11px;height:11px;flex-shrink:0;color:var(--faint)}
  .bk-amount-button:hover .bk-open-icon{color:var(--accent-deep)}
  .bk-count{display:block;font:10px var(--sans);color:var(--faint);margin-top:2px}
  @media(min-width:1500px){table.bkbanks td{font-size:12px}.bk-amount-button{font-size:12px}}
  @media(max-width:1150px){table.bkbanks th,table.bkbanks td{padding-left:6px;padding-right:6px}
    table.bkbanks td,.bk-amount-button{font-size:11.5px}.bkidentity strong{font-size:12px}.bkidentity small,.bkdate{font-size:10px}}
  @media(max-width:650px){.bkbanks{min-width:650px}}
  .bkheading{display:flex;align-items:center;gap:12px;padding-bottom:12px}
  .bkheading h2{margin:0;flex:1}
  .bkreceipts{margin-top:20px;scroll-margin-top:18px}
  .bkref{border:0;background:transparent;color:var(--accent-deep);text-decoration:underline;
    cursor:pointer;font:500 12px var(--mono);padding:3px 0;text-align:left}
  .bkstatus{display:inline-block;border-radius:20px;padding:3px 9px;background:var(--panel-2);
    font:500 11px var(--sans);white-space:nowrap;color:var(--muted)}
  .bkstatus.received{background:var(--ok-soft);color:var(--ok)}
  .bkstatus.waiting{background:var(--warn-soft);color:var(--warn)}
  .bkdialog{width:min(1380px,96vw);max-height:90vh;border:1px solid var(--line);border-radius:12px;
    padding:0;color:var(--text);background:var(--panel);box-shadow:0 20px 80px #18232a40}
  .bkdialog::backdrop{background:#18232a99}
  .bkdialog .bkheading{position:sticky;top:0;background:var(--panel);z-index:1;padding:16px 20px;
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  #bkDetailBody{padding:18px 20px}
  .bksummary{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:14px 0}
  .bksummary div{padding:10px 14px;border:1px solid var(--line);border-radius:7px}
  .bksummary span{display:block;font-size:11px;color:var(--muted)}
  .bksummary b{font:500 16px var(--mono)}
  .bksummary .bknet{background:var(--accent-soft);border-color:var(--accent)}
  .bkdialog td{white-space:nowrap}
  .bkdialog a.mini{display:inline-block;padding:6px 11px;border:1px solid var(--line);border-radius:8px;
    background:#fff;color:var(--ink);font:500 12px var(--sans);text-decoration:none;white-space:nowrap}
</style>
</head>
<body class="banking-page">

<div class="layout">
  <aside class="rail"></aside>

  <div class="main">
    <div class="topline">
      <div>
        <h1>Banking</h1>
        <div class="sub">Every bank account, what came in and what went out.</div>
      </div>
      <div class="right"><span class="mono" id="yearNote" style="font-size:12px;color:var(--muted)"></span></div>
    </div>

    <div class="shell">
      <div id="body" class="hide">
        <button class="mini" id="bkBack" type="button" aria-label="Back to previous Banking screen">&#8592; Back</button>
        <div class="pills" id="tabs">
          <button data-tab="report" class="on">Live balance &amp; CPRs</button>
          <button data-tab="entries">Transactions</button>
          <span class="bk-settings-tabs"><button data-tab="couriers">Bank / courier links</button><button data-tab="add">Bank settings</button></span>
        </div>
        <div id="view"><div class="fxnone">One moment…</div></div>
      </div>

      <div id="gate" class="gate hide">
        <img src="/logo.svg" alt="">
        <h2>Banking access required</h2>
        <p>Ask your administrator for Banking reports or Manage Banking access.</p>
        <a class="solid" href="/">Back</a>
      </div>
    </div>
  </div>
</div>

<dialog id="bkDialog" class="bkdialog" aria-labelledby="bkDetailTitle">
  <div class="bkheading"><h2 id="bkDetailTitle">CPR</h2>
    <button class="mini" id="bkDownload" disabled>Download Excel</button>
    <button class="mini" id="bkDetailClose" aria-label="Close CPR detail">Close</button></div>
  <div id="bkDetailBody"></div>
</dialog>
<dialog id="bkPaymentDialog" class="bkdialog" aria-label="Bank payments"><div class="bkheading"><h2>Google Sheet payments</h2><button class="mini" id="bkPaymentsClose">Close</button></div><div id="spendingPreview" style="padding:12px"></div></dialog>
<dialog id="bkLogDialog" class="bkdialog" aria-labelledby="bkLogTitle"><div class="bkheading"><h2 id="bkLogTitle">Banking log</h2><a class="mini" id="bkLogDownload">Download Excel</a><button class="mini" id="bkLogClose">Close</button></div><div id="bkLogMsg" class="msg bad"></div><div id="bkLogBody" style="padding:12px"></div></dialog>
<script src="/nav.js"></script>
<script src="/tiles.js"></script>
<script src="/messages.js"></script>
<script>
"use strict";
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var NAMES = { postex:'PostEx', trax:'Trax', mnp:'M&P', daewoo:'Daewoo' };
  var S = { canWrite:true, tab:'report', report:null, links:null, drift:[], today:'', editing:null, selectedBank:null, receiptFilter:'receivable', bankView:'accounts', loadedAt:0, spendingRows:[], spendingMonth:'', spendingBank:null, history:{transactions:[],setups:[]}, breakdown:null, editTransaction:null, editSetup:null };

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  var draftDirty=false,draftRevision=0;
  function markFormDirty(){draftDirty=true;draftRevision++;}
  function trackFormInput(e){if(e.target.matches('input,select,textarea'))markFormDirty();}
  $('view').addEventListener('input',trackFormInput);
  $('view').addEventListener('change',trackFormInput);
  function refreshOnReturn(){
    if(!document.hidden && !draftDirty && Date.now()-S.loadedAt>60000)return load(false,true);
  }
  function money(n){
    var v = Math.round((Number(n) || 0) * 100) / 100;
    var s = Math.abs(v).toFixed(2).replace(/\B(?=(\d{3})+(?!\d)\.)/g, ',');
    return (v < 0 ? '-' : '') + s;
  }
  function cname(k){ return NAMES[k] || k; }

  var detailRequest = 0;
  var currentDetail = null;
  function wireReceiptLinks(host){
    host.querySelectorAll('[data-cpr]').forEach(function(button){
      button.addEventListener('click', function(){
        openReceipt(button.getAttribute('data-account'), button.getAttribute('data-cpr'));
      });
    });
    var close = host.querySelector('#bkListClose');
    if(close) close.addEventListener('click', function(){
      S.selectedBank = null;
      $('bankCprList').innerHTML = '';
    });
  }

  function openReceipt(account, ref){
    var request = ++detailRequest;
    currentDetail = null;
    $('bkDetailTitle').textContent = 'CPR ' + ref;
    $('bkDownload').disabled = true;
    $('bkDetailBody').innerHTML = '<div class="fxnone">Reading CPR…</div>';
    if(!$('bkDialog').open) $('bkDialog').showModal();
    get('/api/bank/cpr?account=' + encodeURIComponent(account) + '&ref=' + encodeURIComponent(ref))
      .then(function(d){
        if(request !== detailRequest) return;
        currentDetail = { account:account, ref:ref };
        $('bkDownload').disabled = false;
        var r = d.receipt;
        var fields = [ ['gross','COD / gross collections'], ['charges','Courier charges / recovered invoices'],
          ['tax','GST'], ['salesTax','Withholding sales tax'], ['incomeTax','Withholding income tax'],
          ['withholding','Total withholding'], ['miscellaneous','Miscellaneous charges'],
          ['bankFee','IBFT / bank fee'], ['shipping','Shipping charges (within invoice)'],
          ['fuel','Fuel surcharge (within invoice)'], ['invoiceGst','GST (included in invoice)'],
          ['extraCharges','Extra charges (within invoice)'],
          ['carryForward','Carry forward'], ['adjustment','Adjustment'],
          ['otherDifference','Other deductions / difference'], ['net','Net bank amount'] ];
        var columns = [ ['tracking','Tracking'], ['orderRef','Order'], ['status','Status'], ['city','City'],
          ['bookedOn','Booked'], ['deliveredOn','Delivered / returned'], ['settledOn','Paid'],
          ['amount','COD'], ['received','Collected'], ['fee','Courier charges'], ['upfrontCharges','Upfront charges'],
          ['tax','GST'], ['whSalesTax','WH sales tax'], ['whIncomeTax','WH income tax'],
          ['upfront','Upfront paid'], ['reserve','Reserve'], ['net','Net'], ['notes','Notes'],
          ['invoiceAmount','Invoice allocation'], ['taxableAmount','Taxable amount'], ['withholding','Total WH tax'] ];
        var numeric = ['amount','received','fee','upfrontCharges','tax','whSalesTax','whIncomeTax','upfront','reserve','net','invoiceAmount','taxableAmount','withholding'];
        var bank = r.paidToBank || r.paidToAccount ? '<div class="lognote">Paid to ' +
          esc(r.paidToBank) + ' · ' + esc(r.paidToAccount) +
          (r.instrument ? ' · ' + esc(r.instrument) : '') + '</div>' : '';
        var adjustments = (d.adjustments || []).length ? '<h3>Adjustments</h3><div class="wrapx">' +
          '<table class="plain"><tbody>' + d.adjustments.map(function(a){
            return '<tr>' + Object.keys(a).map(function(k){
              return '<td><small class="bkdate">' + esc(k) + '</small>' +
                esc(typeof a[k] === 'object' ? JSON.stringify(a[k]) : a[k]) + '</td>';
            }).join('') + '</tr>';
          }).join('') + '</tbody></table></div>' : '';
        $('bkDetailBody').innerHTML =
          (d.warning ? '<div class="warn">' + esc(d.warning) + '</div>' : '') +
          (d.archive?'<div class="lognote">'+(d.archive.complete?'Saved Banking detail':'Partial Banking detail')+
            (d.archive.savedAt?' - '+esc(d.archive.savedAt):'')+'</div>':'')+
          '<div>' + esc(cname(r.courier)) + ' · ' + esc(r.account) + ' · ' +
            statusPill(r.status, (S.report.receipts.find(function(x){
              return x.accountId === Number(account) && x.cpr === ref;
            }) || {}).state) + '</div>' + bank +
          '<div class="bksummary">' + fields.filter(function(f){
            if(f[0] === 'tax' && d.summary.invoiceGst != null) return false;
            return ['gross','charges','tax','withholding','net'].indexOf(f[0]) >= 0 || d.summary[f[0]] != null;
          }).map(function(f){
            return '<div class="' + (f[0] === 'net' ? 'bknet' : '') + '"><span>' + f[1] +
              '</span><b>' + amount(d.summary[f[0]]) + '</b></div>';
          }).join('') + '</div>' + adjustments +
          '<h3>Orders · ' + d.orders.length + '</h3>' +
          (d.orders.length ? '<div class="wrapx"><table class="plain"><thead><tr>' +
            columns.map(function(f){ return '<th>' + f[1] + '</th>'; }).join('') + '</tr></thead><tbody>' +
            d.orders.map(function(o){ return '<tr>' + columns.map(function(f){
              return '<td class="' + (numeric.indexOf(f[0]) >= 0 ? 'n' : '') + '">' +
                (numeric.indexOf(f[0]) >= 0 ? amount(o[f[0]]) : esc(o[f[0]] || '—')) + '</td>';
            }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' :
            '<div class="fxnone">Order detail has not been supplied for this CPR yet.</div>');
      }).catch(function(e){
        if(request === detailRequest) $('bkDetailBody').innerHTML = '<div class="warn">' + esc(e.message) + '</div>';
      });
  }
  $('bkDetailClose').addEventListener('click', function(){ $('bkDialog').close(); });
  $('bkDialog').addEventListener('close', function(){ ++detailRequest; currentDetail = null; });
  $('bkDownload').addEventListener('click', function(){
    if(!currentDetail) return;
    var current = currentDetail;
    var button = $('bkDownload');
    button.disabled = true;
    fetch('/api/bank/cpr?account=' + encodeURIComponent(current.account) + '&ref=' +
      encodeURIComponent(current.ref) + '&download=xlsx', { cache:'no-store' }).then(function(r){
        if(!r.ok) return r.json().then(function(d){ throw new Error(d.error || 'Download failed'); });
        return r.blob();
      }).then(function(blob){
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'CPR-' + current.ref.replace(/[^A-Za-z0-9_.-]/g,'_') + '.xlsx';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      }).catch(function(e){
        var warning = document.createElement('div'); warning.className = 'warn';
        warning.textContent = e.message; $('bkDetailBody').prepend(warning);
      }).finally(function(){ button.disabled = !currentDetail; });
  });

  function get(url){
    return fetch(url, { cache:'no-store', signal:AbortSignal.timeout(45000) }).then(function(r){ return r.json(); })
      .then(function(d){ if(d.error) throw new Error(d.error); return d; });
  }
  function post(url, body){
    return fetch(url, { method:'POST', headers:{'Content-Type':'application/json'},
                        body:JSON.stringify(body || {}) })
      .then(function(r){ return r.json(); })
      .then(function(d){ if(d.error) throw new Error(d.error); return d; });
  }

  /* ---------- the banks ---------- */

  function amount(value){ return value == null ? '—' : money(value); }
  function statusPill(status, state){
    return '<span class="bkstatus ' + (state === 'received' ? 'received' :
      state === 'receivable' ? 'waiting' : '') + '">' + esc(status || 'Unknown') + '</span>';
  }
  function cprButton(r){
    return '<button class="bkref" data-cpr="' + esc(r.cpr || r.ref) +
      '" data-account="' + r.accountId + '">' + esc(r.cpr || r.ref) + '</button>';
  }

  function columnAmount(b,key,value){
    return '<button class="bk-amount-button" data-column="'+key+'" data-bank-id="'+b.id+'" aria-label="View '+key+' entries">'+(value==null?'<span class="bk-na">Needs check</span>':amount(value))+' <span aria-hidden="true">&#8250;</span></button>';
  }
  function breakdownView(){
    var d=S.breakdown;
    return '<div class="sheet bkreceipts"><div class="sec bkheading"><h2>'+esc(d.bank.title || d.bank.name)+' - '+esc(d.column)+'</h2><button class="mini" id="closeBreakdown">Close list</button></div>'+
      (d.warning?'<div class="warn">'+esc(d.warning)+'</div>':'')+
      '<div class="wrapx"><table class="plain"><thead><tr><th>Date / start</th><th>Source</th><th>Reference / description</th><th class="n">Amount</th></tr></thead><tbody>'+d.rows.map(function(r){
        return '<tr><td>'+esc(r.on || '')+'</td><td>'+esc(r.source)+'</td><td>'+ (r.source==='courier'?cprButton(r):esc(r.note || r.ref || ''))+
          (r.source==='sheet'?' <button class="mini" data-open-payments="'+d.bank.id+'">View payments</button>':'')+'</td><td class="n">'+amount(r.amount)+'</td></tr>';
      }).join('')+'</tbody><tfoot><tr><td colspan="3">Total</td><td class="n">'+amount(d.total)+'</td></tr></tfoot></table></div>'+
      (d.column==='opening'?'<div class="sec"><button class="mini" data-open-bank="'+d.bank.id+'">Edit bank opening</button></div>':'')+'</div>';
  }
  function bankLabel(id){
    var b=S.report.banks.find(function(x){return x.id===Number(id);});
    return b ? (b.title || b.name)+' - '+b.name : 'Bank '+id;
  }
  var LOG_NAMES={setup:'Fiscal opening log',transfer:'Transfer log',entry:'Transaction In / Out log',opening:'Bank opening / details history',sheet:'Sheet connection log'};
  function logButton(kind){
    return '<div class="acts" style="margin-bottom:14px"><button class="mini" data-view-log="'+kind+'">View '+esc(LOG_NAMES[kind])+'</button></div>';
  }
  function closeLog(){if($('bkLogDialog').open)$('bkLogDialog').close();}
  function openLog(kind){
    if(!LOG_NAMES[kind])return;
    $('bkLogTitle').textContent=LOG_NAMES[kind];$('bkLogMsg').textContent='';
    $('bkLogDownload').href='/api/bank/history?download=xlsx&kind='+encodeURIComponent(kind);
    $('bkLogBody').innerHTML=kind==='setup'?setupLog():kind==='opening'?openingLog():kind==='sheet'?sheetLog():transactionLog(kind);
    wireLogActions($('bkLogBody'));
    if(!$('bkLogDialog').open)$('bkLogDialog').showModal();
  }
  $('bkLogClose').addEventListener('click',closeLog);
  function sheetLog(){return '<div class="wrapx"><table class="plain"><thead><tr><th>Bank</th><th>Previous start</th><th>Pick payments from</th><th>Sheet</th><th>Saved by / when</th></tr></thead><tbody>'+(S.history.sheets||[]).map(function(r){return '<tr><td>'+esc(bankLabel(r.bankId))+'</td><td>'+esc(r.before&&r.before.sheet_from||'')+'</td><td>'+esc(r.after&&r.after.sheet_from||'Not set')+'</td><td>'+esc(r.after&&r.after.sheet_url||'Not linked')+'</td><td>'+esc(r.actor)+'<small class="bkdate">'+esc(r.createdAt)+'</small></td></tr>';}).join('')+'</tbody></table></div>';}
  function transactionLog(kind){
    var rows=(S.history.transactions || []).filter(function(t){return kind==='transfer'?t.type==='transfer':t.type!=='transfer';});
    return '<h3 style="font-size:13px;margin-top:18px">'+(kind==='transfer'?'Transfer log':'Transaction In / Out log')+'</h3><div class="wrapx"><table class="plain"><thead><tr><th>Entry</th><th>Date</th><th>Bank / direction</th><th class="n">Amount</th><th>Reference / note</th><th>Status / saved by</th><th>Actions</th></tr></thead><tbody>'+rows.map(function(t){
      var e=t.entries[0] || {};
      return '<tr><td>#'+esc(t.id)+' '+esc(t.type)+'</td><td>'+esc(e.on)+'</td><td>'+t.entries.map(function(x){return esc(bankLabel(x.bankId))+' ('+(Number(x.amount)<0?'Out':'In')+')';}).join('<br>')+'</td><td class="n">'+amount(Math.abs(Number(e.amount)))+'</td><td>'+esc(e.note)+'</td><td>'+ (t.reversed?'Updated':'Active')+'<small class="bkdate">'+esc(t.actor)+'<br>'+esc(t.createdAt)+'</small></td><td>'+(S.canWrite && !t.reversed?'<button class="mini" data-edit-transaction="'+t.id+'">Edit</button> <button class="mini" data-remove-transaction="'+t.id+'">Remove</button>':'')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
  }
  function setupLog(){
    var rows=S.history.setups || [];
    return '<div class="sheet" style="margin-bottom:16px"><div class="sec"><h3 style="font-size:13px">Fiscal opening log - all banks</h3><div id="historyMsg" class="msg"></div><div class="wrapx"><table class="plain"><thead><tr><th>Record / bank</th><th>Fiscal year</th><th class="n">Opening In</th><th class="n">Opening Out</th><th>In / Out start</th><th>Status / saved by</th><th>Actions</th></tr></thead><tbody>'+rows.map(function(r){
      return '<tr><td>#'+esc(r.id)+' '+esc(bankLabel(r.bankId))+'</td><td>'+esc(r.fiscalYear)+'</td><td class="n">'+amount(r.openingIn)+'</td><td class="n">'+amount(r.openingOut)+'</td><td>'+esc(r.inFrom)+'<br>'+esc(r.outFrom)+'</td><td>'+(r.active?'Current':'Superseded')+'<small class="bkdate">'+esc(r.actor)+'<br>'+esc(r.createdAt)+'</small></td><td>'+(S.canWrite && r.active?'<button class="mini" data-edit-setup="'+r.id+'">Edit</button> <button class="mini" data-remove-setup="'+r.id+'">Remove</button>':'')+'</td></tr>';
    }).join('')+'</tbody></table></div></div></div>';
  }
  function openingLog(){
    return '<div class="sheet"><div class="sec"><h3 style="font-size:13px">Bank opening / details history</h3><p class="hint">Opening changes are recorded here. Older edits may not have saved history.</p><div class="wrapx"><table class="plain"><thead><tr><th>Record / bank</th><th>Saved by / when</th><th class="n">Previous opening</th><th class="n">New opening</th><th>Opening date</th></tr></thead><tbody>'+(S.history.openings||[]).map(function(r){return '<tr><td>#'+esc(r.id)+' '+esc(bankLabel(r.bankId))+'</td><td>'+esc(r.actor)+'<small class="bkdate">'+esc(r.createdAt)+'</small></td><td class="n">'+amount(r.before && r.before.opening)+'</td><td class="n">'+amount(r.after && r.after.opening)+'</td><td>'+esc(r.after && (r.after.opening_balance_on || r.after.opening_on) || '')+'</td></tr>';}).join('')+'</tbody></table></div></div></div>';
  }
  function openPayments(id){
    var request=++paymentRequest;
    S.spendingRows=[];S.spendingMonth='';
    $('spendingPreview').innerHTML='<div class="fxnone">Reading payments...</div>';
    if(!$('bkPaymentDialog').open)$('bkPaymentDialog').showModal();
    get('/api/bank/spending?bank='+encodeURIComponent(id)+'&year='+S.report.year.year).then(function(d){
      if(request!==paymentRequest)return;
      S.spendingRows=d.rows;S.spendingBank=d.bank;renderSpending();
    }).catch(function(e){if(request!==paymentRequest)return;$('spendingPreview').innerHTML='<div class="warn">'+esc(e.message)+'</div>';});
  }
  $('bkPaymentsClose').addEventListener('click',function(){$('bkPaymentDialog').close();});
  function coverage(key){
    var d = S.report;
    return d.totals.coverage && d.totals.coverage[key] ||
      { included:d.banks.length, total:d.banks.length, complete:true };
  }
  function partialMark(key){
    var c = coverage(key);
    return c.complete ? '' : '<sup class="bk-star" title="' + c.included + ' of ' + c.total +
      ' accounts included; other accounts need checking">*</sup>';
  }
  function statCard(key, label, live){
    var value = S.report.totals[key], c = coverage(key);
    return '<div class="bkstat' + (live ? ' live' : '') + '"><span class="bkstat-label">' + label +
      '</span><b class="bkstat-value' + (value == null ? ' unavailable' : '') + '">' +
      (value == null ? 'Needs checking' : money(value)) + partialMark(key) + '</b><small>' +
      (c.complete ? c.total + ' accounts' : c.included + ' of ' + c.total + ' accounts · available total') + '</small></div>';
  }
  function cprAmount(b, state){
    var received = state === 'received';
    var count = received ? b.receivedCprs : b.receivableCprs;
    return '<button class="bk-amount-button" data-cpr-list="' + state + '" data-bank-id="' + b.id +
      '" aria-label="View ' + state + ' CPR (' + count + ')" title="View ' + state + ' CPRs">' +
      '<span>' + amount(received ? b.fromCouriersYear : b.receivable) + '</span>' +
      '<svg class="bk-open-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">' +
      '<path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
      '</button><small class="bk-count">' + count + ' CPR' + (count === 1 ? '' : 's') + '</small>';
  }
  function totalCell(key, extra){
    return '<td class="n' + (key === 'balance' ? ' bklive' : '') + '">' +
      amount(S.report.totals[key]) + partialMark(key) + (extra ? '<small class="bk-total-note">' + extra + '</small>' : '') + '</td>';
  }
  function reportView(){
    var d = S.report;
    if(!d) return '<div class="fxnone">One moment…</div>';
    if(!d.banks.length) return '<div class="sheet"><div class="sec"><h2>No bank accounts yet</h2>' +
      '<div class="fxnone">Add one under <b>Add or edit a bank</b>.</div></div></div>';
    var warnings = (d.warnings || []).map(function(w){
      return '<div>' + esc(w.bank) + ' · ' + esc(w.message) + '</div>';
    }).join('');
    var unplaced = (d.unplaced || []).filter(function(r){ return r.why !== 'Before the opening balance date' && r.why !== 'Before the Transaction In start date'; });
    var issueCount = unplaced.length + (d.warnings || []).length;
    var issues = issueCount ? '<details class="bk-issues"><summary>' + issueCount +
      ' items need checking</summary><div class="bk-issues-body">' + warnings + unplaced.map(function(r){
        return '<div>' + cprButton(r) + ' · ' + esc(r.account) + ' · ' +
          esc(r.status || 'Unknown') + ' · ' + esc(r.why) + '</div>';
      }).join('') + '</div></details>' : '';
    var receivedCount = d.totals.receivedCprs == null ? d.banks.reduce(function(n,b){ return n + b.receivedCprs; },0) : d.totals.receivedCprs;
    var pendingCount = d.totals.receivableCprs == null ? d.banks.reduce(function(n,b){ return n + b.receivableCprs; },0) : d.totals.receivableCprs;
    var rows = d.banks.map(function(b){
      return '<tr><td class="bkidentity"><strong title="' + esc(b.title || b.name) + '">' +
        esc(b.title || b.name) + '</strong><small title="' + esc(b.name) + '">' +
        esc(b.name) + (b.active ? '' : ' · Closed') + '</small></td>' +
        '<td class="n">' + columnAmount(b,'opening',b.opening) + '<small class="bkdate">' + esc(b.openingBalanceOn || 'Balance date not set') +
          '</small></td>' +
        '<td class="n pos">' + columnAmount(b,'inYear',(b.incomeIncomplete ?? b.balanceIncomplete)?null:b.inYear) + '</td>' +
        '<td class="n neg">' + columnAmount(b,'outYear',b.expenseIncomplete?null:b.outYear) + '</td>' +
        '<td class="n">' + cprAmount(b,'received') + '</td><td class="n">' + cprAmount(b,'receivable') + '</td>' +
        '<td class="n bklive">' + (b.balance == null ? '<span class="bk-na">Needs check</span>' : money(b.balance)) + '</td></tr>';
    }).join('');
    var totals = '<tfoot><tr><td>Total<small class="bk-total-note">' + d.banks.length + ' accounts</small></td>' +
      totalCell('opening') + totalCell('inYear') + totalCell('outYear') + totalCell('received', receivedCount + ' CPRs') +
      totalCell('receivable', pendingCount + ' CPRs') + totalCell('balance') + '</tr></tfoot>';
    var activity = S.bankView === 'activity';
    var toolbar = '<div class="bk-toolbar"><h2>' + (activity ? 'Recent activity' : 'Bank accounts') +
      '<span class="bk-account-count">' + d.banks.length + ' accounts</span></h2><div class="bk-toolbar-actions">' +
      '<div class="bk-segments" aria-label="Banking view"><button data-bank-view="accounts" class="' + (!activity ? 'on' : '') +
      '">Accounts</button><button data-bank-view="activity" class="' + (activity ? 'on' : '') + '">Recent activity</button></div>' +
      '<button class="mini" id="bkRefresh">Refresh</button></div></div>';
    return '<div class="bkstats">' + statCard('inYear','Fiscal year In') + statCard('outYear','Fiscal year Out') +
      statCard('receivable','To receive · pending CPRs') + statCard('balance','Live balance',true) + '</div>' + issues +
      (d.archive?'<div class="lognote">Saved CPRs: '+d.archive.receipts+' &middot; Full details saved: '+d.archive.details+' <a href="/api/bank/archive-export">Export saved CPRs</a> &middot; Auto-save: 3 PM / 10 PM PKT '+help('The server retains available courier CPRs daily at 3 PM and 10 PM Pakistan time, even when logged out or Banking is closed. Full details are saved in limited batches; the database budget guard may pause a run. Banking refreshes also retain summaries. Keep portals connected until full detail coverage is complete. If the server is down, the latest missed slot is checked after restart.')+'</div>':'')+'<div class="sheet">' + toolbar + (activity ? '<div class="wrapx">' + movesTable(d.moves) + '</div>' :
        '<div class="wrapx"><table class="plain bkbanks"><thead><tr><th>Bank account</th><th class="n">Opening</th>' +
        '<th class="n">Year in</th><th class="n">Year out</th><th class="n">Received · FY</th><th class="n">To receive</th>' +
        '<th class="n bklive">Live balance</th></tr></thead><tbody>' + rows + '</tbody>' + totals + '</table></div>') +
      '</div>' + (!activity ? '<div id="bankCprList">' + (S.breakdown ? breakdownView() : receiptListView()) + '</div>' : '');
  }

  function receiptListView(){
    if(!S.selectedBank || !S.report) return '';
    var b = S.report.banks.find(function(x){ return x.id === S.selectedBank; });
    if(!b) return '';
    var received = S.receiptFilter === 'received';
    var rows = (S.report.receipts || []).filter(function(r){
      return r.bankId === b.id && r.included && r.state === S.receiptFilter &&
        (r.nonCash || !received || r.on >= S.report.year.from && r.on <= S.report.year.to);
    });
    return '<div class="sheet bkreceipts"><div class="sec bkheading"><h2>' +
      esc(b.title || b.name) + ' · ' + (received ? 'Received CPRs' : 'Receivable CPRs') +
      '</h2><button class="mini" id="bkListClose">Close list</button></div>' +
      (rows.length ? '<div class="wrapx"><table class="plain"><thead><tr>' +
        '<th>CPR reference</th><th>Courier / account</th><th>Created</th><th>Paid</th><th>Status</th>' +
        '<th class="n">Net amount</th></tr></thead><tbody>' + rows.map(function(r){
          return '<tr><td>' + cprButton(r) + '</td><td>' + esc(cname(r.courier)) +
            '<small class="bkdate">' + esc(r.account) + '</small></td><td>' + esc(r.createdOn || '—') +
            '</td><td>' + esc(r.paidOn || '—') + '</td><td>' + statusPill(r.status, r.state) +
            '</td><td class="n' + (Number(r.net)<0 ? ' neg' : '') + '">' + amount(r.net) +
            (Number(r.net)<0 ? '<small class="bkdate">Courier due; no bank movement</small>' : '') + '</td></tr>';
        }).join('') + '</tbody><tfoot><tr><td colspan="5">Total</td><td class="n">' +
          amount(received ? b.fromCouriersYear : b.receivable) + '</td></tr></tfoot></table></div>' : '<div class="fxnone">No ' +
          (received ? 'received' : 'pending') + ' CPRs.</div>') + '</div>';
  }

  function movesTable(moves){
    if(!moves.length) return '<div class="lognote">No movements or generated CPRs yet.</div>';
    return '<table class="plain"><thead><tr><th>Date</th><th>Bank</th><th>What</th>' +
      '<th>Reference</th><th>Status</th><th class="n">Net amount</th></tr></thead><tbody>' +
      moves.map(function(m){
        return '<tr><td>' + esc(m.on || '—') + '</td><td>' + esc(m.bank) + '</td>' +
          '<td>' + esc(kindWord(m)) + '</td><td>' + (m.kind === 'courier' ? cprButton(m) :
          esc(m.note || m.ref || '')) + '</td><td>' + statusPill(m.status, m.state) + '</td>' +
          '<td class="n ' + (m.state === 'receivable' ? '' : Number(m.amount) < 0 ? 'neg' : 'pos') +
          '">' + amount(m.amount) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  function kindWord(m){
    if(m.kind === 'courier') return 'Courier payment' + (m.account ? ' · ' + m.account : '');
    if(m.kind === 'spend')   return 'Spending sheet';
    if(m.kind === 'transfer')return 'Transfer';
    return 'Adjustment';
  }

  /* ---------- courier payments ---------- */

  function couriersView(){
    var d = S.links;
    if(!d) return '<div class="fxnone">One moment…</div>';

    var banks = (S.report && S.report.banks.filter(function(b){ return b.active; })) || [];
    var byAccount = {};
    d.links.forEach(function(l){
      if(!byAccount[l.accountId]) byAccount[l.accountId] = [];
      byAccount[l.accountId].push(l);
    });

    // What the couriers themselves say about where they are paying. M&P name
    // the account on every payment, so a bank changed with the courier turns
    // up here by itself.
    var drift = (S.drift || []).map(function(x){
      if(x.state === 'unset'){
        return '<div class="warn"><b>' + esc(x.label) + '</b> is paying into ' +
          esc(x.bank || 'a bank') + ' · <span class="mono">' + esc(x.account) +
          '</span>' + (x.name ? ' (' + esc(x.name) + ')' : '') +
          ' — and no bank is set for it here. ' +
          '<button class="mini" data-follow="' + x.accountId + '">Use this bank</button></div>';
      }
      return '<div class="warn"><b>' + esc(x.label) + ' has started paying somewhere else.</b> ' +
        esc(x.courier.toUpperCase()) + ' say the money went to <span class="mono">' +
        esc(x.account) + '</span> at ' + esc(x.bank || 'another bank') +
        (x.on ? ' on ' + esc(x.on) : '') +
        ', and Fusion has it against <b>' + esc(x.bankName) + '</b>. ' +
        '<button class="mini" data-follow="' + x.accountId + '">Follow the change</button></div>';
    }).join('');

    var waiting = (d.waiting || []).filter(function(w){ return w.net > 0; });
    var warn = waiting.length
      ? '<div class="warn"><b>' + waiting.length + ' courier account' +
        (waiting.length === 1 ? ' has' : 's have') + ' paid money with nowhere to put it.</b> ' +
        waiting.map(function(w){
          return esc(w.label) + ' — ' + money(w.net) + ' over ' + w.receipts +
                 ' receipt' + (w.receipts === 1 ? '' : 's') + ' (' + esc(w.why) + ')';
        }).join('; ') + '</div>'
      : '';

    var cards = (d.accounts || []).map(function(a){
      var mine = byAccount[a.id] || [];
      var now = mine[0] || null;

      var log = mine.length
        ? mine.map(function(l){
            return '<div class="chg"><b>' + esc(l.from) + '</b> → ' + esc(l.bankName) +
              (l.note ? ' · ' + esc(l.note) : '') +
              '<span class="who">' + esc(l.madeBy || '') + '</span>' +
              ' <button class="mini" data-unlink="' + l.id + '">Remove</button></div>';
          }).join('')
        : '<div class="lognote">No bank set yet. Payments from this account are held ' +
          'until one is.</div>';

      return '<div class="sheet" style="margin-bottom:16px">' +
        '<div class="sec" style="padding-bottom:12px">' +
          '<h2>' + esc(a.label) + '<span class="aside">' + esc(cname(a.courier)) +
            (now ? ' · paying into <b>' + esc(now.bankName) + '</b> since ' + esc(now.from)
                 : ' · no bank set') + '</span></h2>' +
          '<div class="form">' +
            '<div><label>Pays into</label><select data-k="bank" data-acc="' + a.id + '">' +
              banks.map(function(b){
                return '<option value="' + b.id + '"' +
                  (now && now.bankId === b.id ? ' selected' : '') + '>' + esc((b.title || b.name) + ' ? ' + b.name) + '</option>';
              }).join('') + '</select></div>' +
            '<div><label>From this date</label>' +
              '<input type="date" data-k="from" data-acc="' + a.id + '" value="' +
              esc(S.today) + '"></div>' +
            '<div><label>Note</label><input type="text" data-k="note" data-acc="' + a.id +
              '" placeholder="why it changed"></div>' +
            '<div><label>&nbsp;</label><button class="solid" data-link="' + a.id +
              '">Save the change</button></div>' +
          '</div>' +
          '<div class="msg" data-msg="' + a.id + '"></div>' +
        '</div>' +
        '<div class="sec" style="padding:0">' + log + '</div>' +
      '</div>';
    }).join('');

    return drift + warn +
      '<div class="sheet" style="margin-bottom:16px"><div class="sec">' +
        '<h2>Bank / courier links '+help('Payments use the bank linked on their payment date. A new link does not move old payments. Each account keeps its dated link history below.')+'</h2>' +
        '<div class="acts"><button class="solid" id="postNow">Refresh the couriers’ ' +
        'CPRs</button><span class="msg" id="postMsg"></span></div>' +
      '</div></div>' + cards;
  }

  function spendingView(){
    var months=Array.from(new Set(S.spendingRows.map(function(r){return r.on.slice(0,7);}))).sort().reverse();
    var rows=S.spendingRows.filter(function(r){return !S.spendingMonth || r.on.slice(0,7)===S.spendingMonth;});

    return '<div class="sheet bkreceipts"><div class="sec bkheading"><h2>'+esc(S.spendingBank && (S.spendingBank.title || S.spendingBank.name) || 'Bank payments')+' - '+rows.length+' rows</h2>' +
      '<a class="mini" href="/api/bank/spending?bank='+encodeURIComponent(S.spendingBank && S.spendingBank.id || '')+'&year='+S.report.year.year+'&download=xlsx&month='+encodeURIComponent(S.spendingMonth)+'">Download Excel</a><select id="spendMonth" aria-label="Payment month"><option value="">All matched months</option>'+months.map(function(m){return '<option'+(m===S.spendingMonth?' selected':'')+'>'+esc(m)+'</option>';}).join('')+'</select></div>' +
      '<div class="wrapx"><table class="plain"><thead><tr><th>Date</th><th>Receiver</th><th class="n">Amount sent</th><th>Sender bank</th><th>Receiver bank</th><th>Remarks / combined narration</th><th>Account head</th><th>Reference</th></tr></thead><tbody>'+rows.map(function(r){
        var url=r.rowUrl || '';
        var ref=value(r,7), link=r.details && r.details[7] && r.details[7].link;

        return '<tr><td>'+esc(r.on)+'</td><td>'+esc(value(r,2) || r.note)+'</td><td class="n">'+money(Math.abs(Number(r.amount)))+'</td><td>'+esc(value(r,6))+'</td><td>'+esc(value(r,1))+'</td><td>'+esc(value(r,15) || value(r,12) || r.note)+'</td><td>'+esc(value(r,13))+'</td><td>'+
          (safe(link)?'<a target="_blank" rel="noopener noreferrer" href="'+esc(link)+'">'+esc(ref || 'Proof')+'</a>':esc(ref))+

      }).join('')+'</tbody><tfoot><tr><td colspan="2">Total</td><td class="n">'+money(String(total/100n)+'.'+String(total%100n).padStart(2,'0'))+'</td><td colspan="5"></td></tr></tfoot></table></div></div>';
  }

  /* ---------- drawing and wiring ---------- */

  function homeView(){return '<h2>Banking</h2><div class="bk-launcher">'+[
    ['report','cash','Live balance & CPRs','Balances, received payments and receivables'],
    ['entries','shuffle','Transactions','Opening totals, bank transfers and entries'],
    ['couriers','box','Bank / courier links','Choose where each courier pays'],
    ['add','wallet','Bank settings','Bank details and Google Sheet start dates']
  ].filter(function(t){return S.canWrite || t[0]==='report';}).map(function(t){return '<button class="bk-door" data-open-tab="'+t[0]+'"><span class="bk-icon">'+window.FUSION.mark(t[1])+'</span><b>'+t[2]+'</b><small>'+t[3]+'</small></button>';}).join('')+'</div>';}
  function openTab(tab,push){
    if(!S.canWrite && tab!=='home' && tab!=='report')tab='report';
    S.tab=tab;
    if(push)history.pushState({bankTab:tab},'',tab==='home'?'/banking':'/banking?view='+tab);
    draw();window.scrollTo({top:0,behavior:'smooth'});
  }
  function draw(){
    draftDirty=false;
    var v = $('view');
    $('tabs').style.display=S.tab==='home'?'none':'flex';
    $('tabs').querySelectorAll('[data-tab]').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')===S.tab);});
    v.innerHTML = S.tab === 'home' ? homeView() : S.tab === 'report'   ? reportView()
                : S.tab === 'couriers' ? couriersView()
                : S.tab === 'entries'  ? entriesView()
                : addView()+logButton('opening');
    v.querySelectorAll('[data-open-tab]').forEach(function(b){b.addEventListener('click',function(){openTab(b.dataset.openTab,true);});});
    wire();
  }

  function say(el, cls, text){
    if(!el) return;
    el.className = 'msg ' + (cls || '');
    el.textContent = text;
  }

  var breakdownRequest=0, paymentRequest=0;
  function wireLogActions(host){
    host.querySelectorAll('[data-edit-transaction]').forEach(function(b){b.addEventListener('click',function(){
      closeLog();S.editTransaction=S.history.transactions.find(function(t){return String(t.id)===b.getAttribute('data-edit-transaction');});
      draw();markFormDirty();
    });});
    host.querySelectorAll('[data-cancel-edit]').forEach(function(b){b.addEventListener('click',function(){S.editTransaction=null;draw();});});
    host.querySelectorAll('[data-remove-transaction]').forEach(function(b){b.addEventListener('click',function(){
      if(!window.confirm('Remove this entry and reverse its bank impact? Its audit record will remain.'))return;
      b.disabled=true;post('/api/bank/correct-transaction',{id:b.getAttribute('data-remove-transaction')})
        .then(function(){closeLog();S.editTransaction=null;return load();}).catch(function(e){say($('bkLogMsg'),'bad',e.message);b.disabled=false;});
    });});
    host.querySelectorAll('[data-edit-setup]').forEach(function(b){b.addEventListener('click',function(){
      closeLog();var r=S.history.setups.find(function(x){return String(x.id)===b.getAttribute('data-edit-setup');});
      S.setupBankId=r.bankId;
      $('sBank').value=r.bankId;$('sBank').disabled=false;S.editSetupSource=r.bankId;fillOpeningBalance(r.bankId);$('sYear').value=r.fiscalYear;S.editSetup=r.id;
      $('sIn').value=r.openingIn;$('sOut').value=r.openingOut;$('sInFrom').value=r.inFrom;$('sOutFrom').value=r.outFrom;
      $('sSave').textContent='Save correction';$('sSave').scrollIntoView({behavior:'smooth',block:'center'});
      markFormDirty();
      say($('sMsg'),'','Choose the correct bank and save. The previous bank is cleared and the edit history is retained.');
    });});
    host.querySelectorAll('[data-remove-setup]').forEach(function(b){b.addEventListener('click',function(){
      if(!window.confirm('Remove these historical Opening In/Out amounts? A zero replacement and the full history will remain.'))return;
      b.disabled=true;post('/api/bank/remove-setup',{id:b.getAttribute('data-remove-setup')})
        .then(function(){closeLog();return load();}).catch(function(e){say($('bkLogMsg'),'bad',e.message);b.disabled=false;});
    });});

  }
  function wire(){
    ++breakdownRequest;
    var v = $('view');
    function wireBreakdown(host){
      wireReceiptLinks(host);
      host.querySelectorAll('[data-open-payments]').forEach(function(b){b.addEventListener('click',function(){openPayments(b.getAttribute('data-open-payments'));});});
      host.querySelectorAll('[data-open-bank]').forEach(function(b){b.addEventListener('click',function(){
        S.editing=S.report.banks.find(function(x){return x.id===Number(b.getAttribute('data-open-bank'));});S.tab='add';draw();
      });});
      var close=$('closeBreakdown');if(close)close.addEventListener('click',function(){S.breakdown=null;$('bankCprList').innerHTML='';});
    }
    v.querySelectorAll('[data-column]').forEach(function(b){b.addEventListener('click',function(){
      var request=++breakdownRequest;
      $('bankCprList').innerHTML='<div class="fxnone">Reading entries...</div>';
      get('/api/bank/breakdown?bank='+b.getAttribute('data-bank-id')+'&column='+b.getAttribute('data-column')+'&year='+S.report.year.year)
        .then(function(d){if(request!==breakdownRequest||!$('bankCprList'))return;S.breakdown=d;S.selectedBank=null;
          $('bankCprList').innerHTML=breakdownView();wireBreakdown($('bankCprList'));$('bankCprList').scrollIntoView({behavior:'smooth',block:'start'});})
        .catch(function(e){if($('bankCprList'))$('bankCprList').innerHTML='<div class="warn">'+esc(e.message)+'</div>';});
    });});
    if(S.breakdown && $('bankCprList'))wireBreakdown($('bankCprList'));
    wireLogActions(v);
    v.querySelectorAll('[data-view-log]').forEach(function(b){b.addEventListener('click',function(){openLog(b.getAttribute('data-view-log'));});});

    v.querySelectorAll('[data-bank-view]').forEach(function(button){
      button.addEventListener('click', function(){
        ++breakdownRequest;
        S.bankView = button.getAttribute('data-bank-view');
        draw();
      });
    });

    v.querySelectorAll('[data-cpr-list]').forEach(function(button){
      button.addEventListener('click', function(){
        ++breakdownRequest;S.breakdown=null;S.selectedBank = Number(button.getAttribute('data-bank-id'));
        S.receiptFilter = button.getAttribute('data-cpr-list');
        var list = $('bankCprList');
        list.innerHTML = receiptListView();
        wireReceiptLinks(list);
        list.scrollIntoView({ behavior:'smooth', block:'start' });
      });
    });
    wireReceiptLinks(v);
    var refresh = $('bkRefresh');
    if(refresh) refresh.addEventListener('click', function(){
      refresh.disabled = true;
      refresh.textContent = 'Refreshing…';
      load(true);
    });

    var postNow = $('postNow');
    if(postNow) postNow.addEventListener('click', function(){
      postNow.disabled = true;
      say($('postMsg'), '', 'Working…');
      post('/api/bank/post', {}).then(function(d){
        say($('postMsg'), 'good', d.posted + ' received CPR' + (d.posted === 1 ? '' : 's') + ' linked.');
        return load();
      }).catch(function(e){
        postNow.disabled = false;
        say($('postMsg'), 'bad', e.message);
      });
    });

    v.querySelectorAll('[data-link]').forEach(function(b){
      b.addEventListener('click', function(){
        var acc = b.getAttribute('data-link');
        var pick = function(k){
          var el = v.querySelector('[data-k="' + k + '"][data-acc="' + acc + '"]');
          return el ? el.value : '';
        };
        var msg = v.querySelector('[data-msg="' + acc + '"]');
        b.disabled = true;
        say(msg, '', 'Saving…');
        post('/api/bank/link', { accountId: Number(acc), bankId: Number(pick('bank')),
                                 from: pick('from'), note: pick('note') })
          .then(function(d){
            say(msg, 'good', 'Saved' + (d.posted ? ' · ' + d.posted + ' payments placed' : '') + '.');
            return load();
          })
          .catch(function(e){ b.disabled = false; say(msg, 'bad', e.message); });
      });
    });

    // "Follow the change" only ever takes you to the account's own card with
    // today's date in it. It does not set the bank by itself: which of your
    // banks that account number is, and from what day, is a decision about
    // money and is not one to guess at from an IBAN.
    v.querySelectorAll('[data-follow]').forEach(function(b){
      b.addEventListener('click', function(){
        var acc = b.getAttribute('data-follow');
        var row = v.querySelector('[data-k="from"][data-acc="' + acc + '"]');
        if(!row) return;
        row.value = S.today;
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        row.focus();
      });
    });

    v.querySelectorAll('[data-unlink]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        post('/api/bank/unlink', { id: Number(b.getAttribute('data-unlink')) })
          .then(load).catch(function(){});
      });
    });

    var tGo = $('tGo');
    if(tGo) tGo.addEventListener('click', function(){
      tGo.disabled=true;
      say($('tMsg'), '', 'Working…');
      var body={type:'transfer',fromBank:Number($('tFrom').value),toBank:Number($('tTo').value),
        on:$('tOn').value,amount:$('tAmt').value,note:$('tNote').value};
      var edit=S.editTransaction && S.editTransaction.type==='transfer';
      post(edit?'/api/bank/correct-transaction':'/api/bank/transaction',edit?{id:S.editTransaction.id,replacement:body}:body)
        .then(function(){S.editTransaction=null;return load();})
        .catch(function(e){ say($('tMsg'), 'bad', e.message); }).finally(function(){tGo.disabled=false;});
    });

    var aGo = $('aGo');
    if(aGo) aGo.addEventListener('click', function(){
      aGo.disabled=true;
      say($('aMsg'), '', 'Working…');
      var body={type:$('aType').value,bankId:Number($('aBank').value),on:$('aOn').value,
        amount:$('aAmt').value,note:$('aNote').value};
      var edit=S.editTransaction && S.editTransaction.type!=='transfer';
      post(edit?'/api/bank/correct-transaction':'/api/bank/transaction',edit?{id:S.editTransaction.id,replacement:body}:body)
        .then(function(){S.editTransaction=null;return load();})
        .catch(function(e){ say($('aMsg'), 'bad', e.message); }).finally(function(){aGo.disabled=false;});
    });

    [['sBank','setupBankId'],['aBank','entryBankId'],['tFrom','transferFromId'],['tTo','transferToId']].forEach(function(pair){
      var select=$(pair[0]);if(!select)return;
      if(S[pair[1]] && S.report.banks.some(function(b){return b.id===Number(S[pair[1]]);}))select.value=S[pair[1]];
      select.addEventListener('change',function(){S[pair[1]]=Number(select.value);});
    });
    if($('sCancel'))$('sCancel').addEventListener('click',function(){draw();});
    if($('sBank')) {
      function fillSetup(){
        S.editSetupSource=null;fillOpeningBalance($('sBank').value);
        var b=S.report.banks.find(function(x){return x.id===Number($('sBank').value);}) || {};
        $('sIn').value=b.openingIn || '0.00'; $('sOut').value=b.openingOut || '0.00';
        $('sInFrom').value=b.inFrom || b.openingOn || S.today;
        $('sOutFrom').value=b.sheetFrom || b.outFrom || b.openingOn || S.today;
        S.editSetup=b.setupId || null;
        $('sYear').value=S.report.year.year;
      }
      $('sBank').addEventListener('change',function(){fillOpeningBalance($('sBank').value);if(!S.editSetupSource)fillSetup();});fillSetup();
      $('sSave').addEventListener('click',function(){
        var button=$('sSave');button.disabled=true;
        post('/api/bank/setup',{bankId:Number($('sBank').value),fiscalYear:Number($('sYear').value),
          openingIn:$('sIn').value,openingOut:$('sOut').value,inFrom:$('sInFrom').value,
          outFrom:$('sOutFrom').value,openingBalance:$('sBalance').value,openingBalanceOn:$('sBalanceOn').value,expectedId:S.editSetup || undefined,sourceBankId:S.editSetupSource || undefined})
          .then(function(){return load();}).catch(function(e){say($('sMsg'),'bad',e.message);})
          .finally(function(){button.disabled=false;});
      });
    }
    v.querySelectorAll('[data-sheet]').forEach(function(b){
      b.addEventListener('click',function(){openPayments(b.getAttribute('data-sheet'));});
    });

    var bSave = $('bSave');
    if(S.editTransaction && $('aBank')){
      var editing=S.editTransaction,first=editing.entries[0];
      if(editing.type==='transfer'){
        var from=editing.entries.find(function(e){return Number(e.amount)<0;}),to=editing.entries.find(function(e){return Number(e.amount)>0;});
        $('tFrom').value=from.bankId;$('tTo').value=to.bankId;$('tOn').value=from.on;$('tAmt').value=Math.abs(Number(from.amount));$('tNote').value=from.note;
        $('tGo').textContent='Save transfer correction';
      }else{
        $('aBank').value=first.bankId;$('aType').value=editing.type;$('aOn').value=first.on;$('aAmt').value=Math.abs(Number(first.amount));$('aNote').value=first.note;
        $('aGo').textContent='Save entry correction';
      }
    }
    if(bSave) bSave.addEventListener('click', function(){
      var body = {
        id: S.editing && S.editing.id,
        name: $('bName').value, title: $('bTitle').value,
        ownerName: $('bOwner').value, accountNo: $('bNo').value,
        iban: $('bIban').value, branch: $('bBranch').value,
        opening: S.editing ? S.editing.opening : null, openingOn: $('bOpenOn').value,
        openingAt: $('bOpenAt') ? $('bOpenAt').value : '',
        sheetUrl: $('bSheet').value, sheetFrom:$('bSheetFrom').value, notes: $('bNotes').value
      };
      bSave.disabled = true;
      say($('bMsg'), '', 'Saving…');
      post('/api/bank/save', body).then(function(){
        S.editing = null;
        say($('bMsg'), 'good', 'Saved.');
        return load();
      }).catch(function(e){
        bSave.disabled = false;
        say($('bMsg'), 'bad', e.message);
      });
    });

    var bNew = $('bNew');
    if(bNew) bNew.addEventListener('click', function(){ S.editing = null; draw(); });

    var bClose = $('bClose');
    if(bClose) bClose.addEventListener('click', function(){
      post('/api/bank/close', { id: S.editing && S.editing.id })
        .then(function(){ S.editing = null; return load(); })
        .catch(function(e){ say($('bMsg'), 'bad', e.message); });
    });

    v.querySelectorAll('[data-edit]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = Number(b.getAttribute('data-edit'));
        S.editing = (S.report.banks || []).filter(function(x){ return x.id === id; })[0] || null;
        draw();
      });
    });
  }

  function load(fresh,background){
    if(background && draftDirty)return Promise.resolve();
    var revision=draftRevision,tab=S.tab;
    return Promise.all([ get('/api/bank/report' + (fresh === true ? '?fresh=1' : '')), S.canWrite ? get('/api/bank/links') : Promise.resolve({accounts:[],links:[],waiting:[]}),
                         get('/api/bank/drift').catch(function(){ return { drift: [] }; }), get('/api/bank/history') ])
      .then(function(a){
        if(background && (draftDirty || draftRevision!==revision || S.tab!==tab))return;
        S.report = a[0]; S.history=a[3];S.breakdown=null;
        S.loadedAt = Date.now();
        S.links = a[1];
        S.drift = (a[2] && a[2].drift) || [];
        S.today = a[0].today || S.today;
        $('yearNote').textContent = 'Tax year ' + a[0].year.year +
          ' · ' + a[0].year.from + ' to ' + a[0].year.to;
        draw();
      })
      .catch(function(e){
        if(background && (draftDirty || draftRevision!==revision || S.tab!==tab))return;
        $('view').innerHTML = '<div class="sheet"><div class="sec"><div class="fxnone">' +
          'Could not read it: ' + esc(e.message) + '</div></div></div>';
      });
  }

  window.APP.ready.then(function(s){
    if(!s.bankingAccess || !s.bankingAccess.read){ $('gate').classList.remove('hide'); return; }
    S.canWrite=!!s.bankingAccess.write;
    document.documentElement.classList.toggle('bank-readonly',!S.canWrite);
    $('body').classList.remove('hide');

    $('tabs').addEventListener('click', function(e){
      var b = e.target.closest('button[data-tab]');
      if(!b) return;
      openTab(b.getAttribute('data-tab'),true);
    });

    try {
      var kept = new URLSearchParams(location.search).get('view') || 'home';
      if(!['home','report','entries','couriers','add'].includes(kept))kept='home';
      if(!S.canWrite && kept!=='home' && kept!=='report')kept='report';
      if(kept){
        S.tab = kept;
        [].slice.call($('tabs').querySelectorAll('button')).forEach(function(x){
          x.classList.toggle('on', x.getAttribute('data-tab') === kept);
        });
      }
    } catch (err) {}
    $('bkBack').addEventListener('click',function(){if(S.tab==='home')location.href='/';else if(history.state&&history.state.bankTab)history.back();else openTab('home',false);});
    window.addEventListener('popstate',function(){openTab(new URLSearchParams(location.search).get('view')||'home',false);});

    document.addEventListener('visibilitychange',refreshOnReturn);
    load();
  }).catch(function(){
    $('view').innerHTML = '<div class="fxnone">Could not reach the server.</div>';
  });
})();
</script>
</body>
</html>
