<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banking</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#222F34">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  .pills{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:16px}
  .pills button{padding:7px 14px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel);font:inherit;font-size:13px;color:var(--muted);cursor:pointer}
  .pills button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:500}

  .figs4{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line)}
  .figs4 > div{padding:16px 22px;border-right:1px solid var(--line)}
  .figs4 > div:last-child{border-right:0}
  .figs4 span{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--faint);margin-bottom:5px}
  .figs4 b{font-family:var(--mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
  .figs4 small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
  @media (max-width:820px){ .figs4{grid-template-columns:repeat(2,1fr)} }

  table.plain{width:100%;border-collapse:collapse;font-size:13px}
  table.plain th{font-family:var(--mono);font-size:10px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--faint);font-weight:400;text-align:left;
    padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.plain td{padding:10px 14px;border-bottom:1px solid var(--line)}
  table.plain tr:last-child td{border-bottom:0}
  table.plain td.n,table.plain th.n{text-align:right}
  table.plain td.n{font-family:var(--mono);font-variant-numeric:tabular-nums}
  table.plain td.nm{font-weight:500}
  table.plain tr.click{cursor:pointer}
  table.plain tr.click:hover td{background:var(--panel-2)}
  .neg{color:var(--neg)}
  .pos{color:var(--ok)}
  .wrapx{overflow-x:auto}

  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
  .form label{margin:0 0 5px}
  .form .wide{grid-column:1 / -1}
  .acts{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .acts .msg{font-size:12.5px}
  .msg.bad{color:var(--neg)} .msg.good{color:var(--ok)}
  button.danger{padding:7px 13px;background:#fff;border:1px solid var(--line-2);
    border-radius:6px;font:inherit;font-size:12.5px;color:var(--neg);cursor:pointer}
  button.danger:hover{border-color:var(--neg)}

  .lognote{font-size:12px;color:var(--faint);padding:8px 14px}
  .chg{display:flex;gap:10px;align-items:baseline;padding:7px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
  .chg:last-child{border-bottom:0}
  .chg b{font-family:var(--mono);font-size:12px}
  .chg .who{margin-left:auto;color:var(--faint);font-size:11.5px}
  .warn{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:7px;
    font-size:12.5px;margin-bottom:12px}
  .bkidentity strong{display:block;font-family:var(--head);font-size:14px;white-space:nowrap}
  .bkidentity small,.bkdate{display:block;color:var(--muted);font-family:var(--sans);font-size:11px;margin-top:4px}
  .bkbanks td{vertical-align:middle;padding:16px 14px!important}
  .bkbanks th{background:var(--panel-2)}
  .bklive{background:var(--accent-soft);font-weight:600;color:var(--ink);white-space:nowrap}
  .bktotal{background:var(--ink);color:white;border-radius:0 10px 10px 0}
  .bktotal span{color:var(--line)}
  .bkactions{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .bkactions button{white-space:nowrap}
  .bkheading{display:flex;align-items:center;gap:12px;padding-bottom:12px}
  .bkheading h2{margin:0;flex:1}
  .bkreceipts{margin-top:20px;scroll-margin-top:18px}
  .bkref{border:0;background:transparent;color:var(--accent-deep);text-decoration:underline;
    cursor:pointer;font:500 12px var(--mono);padding:3px 0;text-align:left}
  .bkstatus{display:inline-block;border-radius:20px;padding:3px 9px;background:var(--panel-2);
    font:500 11px var(--sans);white-space:nowrap;color:var(--muted)}
  .bkstatus.received{background:var(--ok-soft);color:var(--ok)}
  .bkstatus.waiting{background:var(--warn-soft);color:var(--warn)}
  .bkdialog{width:min(1380px,96vw);max-height:90vh;border:1px solid var(--line);border-radius:12px;
    padding:0;color:var(--text);background:var(--panel);box-shadow:0 20px 80px #18232a40}
  .bkdialog::backdrop{background:#18232a99}
  .bkdialog .bkheading{position:sticky;top:0;background:var(--panel);z-index:1;padding:16px 20px;
    border-bottom:1px solid var(--line);flex-wrap:wrap}
  #bkDetailBody{padding:18px 20px}
  .bksummary{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:14px 0}
  .bksummary div{padding:10px 14px;border:1px solid var(--line);border-radius:7px}
  .bksummary span{display:block;font-size:11px;color:var(--muted)}
  .bksummary b{font:500 16px var(--mono)}
  .bksummary .bknet{background:var(--accent-soft);border-color:var(--accent)}
  .bkdialog td{white-space:nowrap}
</style>
</head>
<body>

<div class="layout">
  <aside class="rail"></aside>

  <div class="main">
    <div class="topline">
      <div>
        <h1>Banking</h1>
        <div class="sub">Every bank account, what came in and what went out.</div>
      </div>
      <div class="right"><span class="mono" id="yearNote" style="font-size:12px;color:var(--muted)"></span></div>
    </div>

    <div class="shell">
      <div id="body" class="hide">
        <div class="pills" id="tabs">
          <button data-tab="report" class="on">The banks</button>
          <button data-tab="couriers">Courier payments</button>
          <button data-tab="entries">Transfers and entries</button>
          <button data-tab="add">Add or edit a bank</button>
        </div>
        <div id="view"><div class="fxnone">One moment…</div></div>
      </div>

      <div id="gate" class="gate hide">
        <img src="/logo.svg" alt="">
        <h2>Banking is Fusion's own</h2>
        <p>These are the company's bank accounts, so only Fusion's own administrator opens them.</p>
        <a class="solid" href="/">Back</a>
      </div>
    </div>
  </div>
</div>

<dialog id="bkDialog" class="bkdialog" aria-labelledby="bkDetailTitle">
  <div class="bkheading"><h2 id="bkDetailTitle">CPR</h2>
    <button class="mini" id="bkDownload" disabled>Download Excel</button>
    <button class="mini" id="bkDetailClose" aria-label="Close CPR detail">Close</button></div>
  <div id="bkDetailBody"></div>
</dialog>
<script src="/nav.js"></script>
<script>
"use strict";
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var NAMES = { postex:'PostEx', trax:'Trax', mnp:'M&P' };
  var S = { tab:'report', report:null, links:null, drift:[], today:'', editing:null, selectedBank:null, receiptFilter:'receivable', loadedAt:0 };

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function money(n){
    var v = Math.round((Number(n) || 0) * 100) / 100;
    var s = Math.abs(v).toFixed(2).replace(/\B(?=(\d{3})+(?!\d)\.)/g, ',');
    return (v < 0 ? '-' : '') + s;
  }
  function cname(k){ return NAMES[k] || k; }

  var detailRequest = 0;
  var currentDetail = null;
  function wireReceiptLinks(host){
    host.querySelectorAll('[data-cpr]').forEach(function(button){
      button.addEventListener('click', function(){
        openReceipt(button.getAttribute('data-account'), button.getAttribute('data-cpr'));
      });
    });
    var close = host.querySelector('#bkListClose');
    if(close) close.addEventListener('click', function(){
      S.selectedBank = null;
      $('bankCprList').innerHTML = '';
    });
  }

  function openReceipt(account, ref){
    var request = ++detailRequest;
    currentDetail = null;
    $('bkDetailTitle').textContent = 'CPR ' + ref;
    $('bkDownload').disabled = true;
    $('bkDetailBody').innerHTML = '<div class="fxnone">Reading CPR…</div>';
    if(!$('bkDialog').open) $('bkDialog').showModal();
    get('/api/bank/cpr?account=' + encodeURIComponent(account) + '&ref=' + encodeURIComponent(ref))
      .then(function(d){
        if(request !== detailRequest) return;
        currentDetail = { account:account, ref:ref };
        $('bkDownload').disabled = false;
        var r = d.receipt;
        var fields = [ ['gross','COD / gross collections'], ['charges','Courier charges / recovered invoices'],
          ['tax','GST'], ['salesTax','Withholding sales tax'], ['incomeTax','Withholding income tax'],
          ['withholding','Total withholding'], ['miscellaneous','Miscellaneous charges'],
          ['carryForward','Carry forward'], ['adjustment','Adjustment'],
          ['otherDifference','Other deductions / difference'], ['net','Net bank amount'] ];
        var columns = [ ['tracking','Tracking'], ['orderRef','Order'], ['status','Status'], ['city','City'],
          ['bookedOn','Booked'], ['deliveredOn','Delivered / returned'], ['settledOn','Paid'],
          ['amount','COD'], ['received','Collected'], ['fee','Courier charges'], ['upfrontCharges','Upfront charges'],
          ['tax','GST'], ['whSalesTax','WH sales tax'], ['whIncomeTax','WH income tax'],
          ['upfront','Upfront paid'], ['reserve','Reserve'], ['net','Net'], ['notes','Notes'] ];
        var numeric = ['amount','received','fee','upfrontCharges','tax','whSalesTax','whIncomeTax','upfront','reserve','net'];
        var bank = r.paidToBank || r.paidToAccount ? '<div class="lognote">Paid to ' +
          esc(r.paidToBank) + ' · ' + esc(r.paidToAccount) +
          (r.instrument ? ' · ' + esc(r.instrument) : '') + '</div>' : '';
        var adjustments = (d.adjustments || []).length ? '<h3>Adjustments</h3><div class="wrapx">' +
          '<table class="plain"><tbody>' + d.adjustments.map(function(a){
            return '<tr>' + Object.keys(a).map(function(k){
              return '<td><small class="bkdate">' + esc(k) + '</small>' +
                esc(typeof a[k] === 'object' ? JSON.stringify(a[k]) : a[k]) + '</td>';
            }).join('') + '</tr>';
          }).join('') + '</tbody></table></div>' : '';
        $('bkDetailBody').innerHTML =
          (d.warning ? '<div class="warn">' + esc(d.warning) + '</div>' : '') +
          '<div>' + esc(cname(r.courier)) + ' · ' + esc(r.account) + ' · ' +
            statusPill(r.status, (S.report.receipts.find(function(x){
              return x.accountId === Number(account) && x.cpr === ref;
            }) || {}).state) + '</div>' + bank +
          '<div class="bksummary">' + fields.filter(function(f){
            return ['gross','charges','tax','withholding','net'].indexOf(f[0]) >= 0 || d.summary[f[0]] != null;
          }).map(function(f){
            return '<div class="' + (f[0] === 'net' ? 'bknet' : '') + '"><span>' + f[1] +
              '</span><b>' + amount(d.summary[f[0]]) + '</b></div>';
          }).join('') + '</div>' + adjustments +
          '<h3>Orders · ' + d.orders.length + '</h3>' +
          (d.orders.length ? '<div class="wrapx"><table class="plain"><thead><tr>' +
            columns.map(function(f){ return '<th>' + f[1] + '</th>'; }).join('') + '</tr></thead><tbody>' +
            d.orders.map(function(o){ return '<tr>' + columns.map(function(f){
              return '<td class="' + (numeric.indexOf(f[0]) >= 0 ? 'n' : '') + '">' +
                (numeric.indexOf(f[0]) >= 0 ? amount(o[f[0]]) : esc(o[f[0]] || '—')) + '</td>';
            }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' :
            '<div class="fxnone">Order detail has not been supplied for this CPR yet.</div>');
      }).catch(function(e){
        if(request === detailRequest) $('bkDetailBody').innerHTML = '<div class="warn">' + esc(e.message) + '</div>';
      });
  }
  $('bkDetailClose').addEventListener('click', function(){ $('bkDialog').close(); });
  $('bkDialog').addEventListener('close', function(){ ++detailRequest; currentDetail = null; });
  $('bkDownload').addEventListener('click', function(){
    if(!currentDetail) return;
    var current = currentDetail;
    var button = $('bkDownload');
    button.disabled = true;
    fetch('/api/bank/cpr?account=' + encodeURIComponent(current.account) + '&ref=' +
      encodeURIComponent(current.ref) + '&download=xlsx', { cache:'no-store' }).then(function(r){
        if(!r.ok) return r.json().then(function(d){ throw new Error(d.error || 'Download failed'); });
        return r.blob();
      }).then(function(blob){
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'CPR-' + current.ref.replace(/[^A-Za-z0-9_.-]/g,'_') + '.xlsx';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
      }).catch(function(e){
        var warning = document.createElement('div'); warning.className = 'warn';
        warning.textContent = e.message; $('bkDetailBody').prepend(warning);
      }).finally(function(){ button.disabled = !currentDetail; });
  });

  function get(url){
    return fetch(url, { cache:'no-store', signal:AbortSignal.timeout(45000) }).then(function(r){ return r.json(); })
      .then(function(d){ if(d.error) throw new Error(d.error); return d; });
  }
  function post(url, body){
    return fetch(url, { method:'POST', headers:{'Content-Type':'application/json'},
                        body:JSON.stringify(body || {}) })
      .then(function(r){ return r.json(); })
      .then(function(d){ if(d.error) throw new Error(d.error); return d; });
  }

  /* ---------- the banks ---------- */

  function amount(value){ return value == null ? '—' : money(value); }
  function statusPill(status, state){
    return '<span class="bkstatus ' + (state === 'received' ? 'received' :
      state === 'receivable' ? 'waiting' : '') + '">' + esc(status || 'Unknown') + '</span>';
  }
  function cprButton(r){
    return '<button class="bkref" data-cpr="' + esc(r.cpr || r.ref) +
      '" data-account="' + r.accountId + '">' + esc(r.cpr || r.ref) + '</button>';
  }

  function reportView(){
    var d = S.report;
    if(!d) return '<div class="fxnone">One moment…</div>';
    if(!d.banks.length) return '<div class="sheet"><div class="sec"><h2>No bank accounts yet</h2>' +
      '<div class="fxnone">Add one under <b>Add or edit a bank</b>.</div></div></div>';
    var warnings = (d.warnings || []).map(function(w){
      return '<div class="warn">' + esc(w.bank) + ': ' + esc(w.message) +
        '. Live balance is unavailable until the sheet can be read.</div>';
    }).join('');
    var unplaced = (d.unplaced || []).filter(function(r){
      return r.why !== 'Before the opening balance date';
    });
    if(unplaced.length) warnings += '<details class="warn"><summary>' + unplaced.length +
      ' CPRs need checking</summary>' + unplaced.map(function(r){
        return '<div>' + cprButton(r) + ' · ' + esc(r.account) + ' · ' +
          esc(r.status || 'Unknown') + ' · ' + esc(r.why) + '</div>';
      }).join('') + '</details>';
    var rows = d.banks.map(function(b){
      return '<tr><td class="bkidentity"><strong>' + esc(b.title || b.name) + '</strong>' +
        '<small>' + esc(b.name) + (b.accountNo ? ' · ' + esc(b.accountNo) : '') +
        (b.active ? '' : ' · Closed') + '</small></td>' +
        '<td class="n">' + amount(b.opening) + '<small class="bkdate">' +
          esc(b.openingOn || 'Opening not set') + (b.openingAt ? ' ' + esc(b.openingAt) : '') + '</small></td>' +
        '<td class="n pos">' + (b.balanceIncomplete ? '—' : money(b.inYear)) + '</td>' +
        '<td class="n neg">' + (b.expenseIncomplete ? '—' : money(b.outYear)) + '</td>' +
        '<td class="n">' + money(b.fromCouriersYear) + '</td>' +
        '<td class="n">' + money(b.receivable) + '</td>' +
        '<td><div class="bkactions"><button class="mini" data-cpr-list="received" data-bank-id="' + b.id +
          '">View received CPR (' + b.receivedCprs + ')</button>' +
          '<button class="mini" data-cpr-list="receivable" data-bank-id="' + b.id +
          '">View receivable CPR (' + b.receivableCprs + ')</button></div></td>' +
        '<td class="n bklive">' + amount(b.balance) + '</td></tr>';
    }).join('');
    return warnings + '<div class="sheet"><div class="figs4">' +
      '<div><span>Fiscal year In</span><b>' + amount(d.totals.inYear) + '</b></div>' +
      '<div><span>Fiscal year Out</span><b>' + amount(d.totals.outYear) + '</b></div>' +
      '<div><span>To receive · pending CPRs</span><b>' + amount(d.totals.receivable) + '</b></div>' +
      '<div class="bktotal"><span>Live balance</span><b>' + amount(d.totals.balance) + '</b></div>' +
      '</div></div>' +
      '<div class="sheet" style="margin-top:20px"><div class="sec bkheading">' +
        '<h2>Bank accounts</h2><button class="mini" id="bkRefresh">Refresh</button></div>' +
        '<div class="wrapx"><table class="plain bkbanks"><thead><tr>' +
        '<th>Account title / Bank</th><th class="n">Opening</th><th class="n">Fiscal year In</th>' +
        '<th class="n">Fiscal year Out</th><th class="n">Received CPRs · FY</th><th class="n">To receive</th>' +
        '<th>CPRs</th><th class="n bklive">Live balance</th></tr></thead><tbody>' + rows + '</tbody>' +
        '</table></div></div><div id="bankCprList">' + receiptListView() + '</div>' +
      '<div class="sheet" style="margin-top:20px"><div class="sec bkheading">' +
      '<h2>What moved last</h2><span class="aside">Latest 60 · CPR status included</span></div>' +
      '<div class="wrapx">' + movesTable(d.moves) + '</div></div>';
  }

  function receiptListView(){
    if(!S.selectedBank || !S.report) return '';
    var b = S.report.banks.find(function(x){ return x.id === S.selectedBank; });
    if(!b) return '';
    var received = S.receiptFilter === 'received';
    var rows = (S.report.receipts || []).filter(function(r){
      return r.bankId === b.id && r.included && r.state === S.receiptFilter &&
        (!received || r.on >= S.report.year.from && r.on <= S.report.year.to);
    });
    return '<div class="sheet bkreceipts"><div class="sec bkheading"><h2>' +
      esc(b.title || b.name) + ' · ' + (received ? 'Received CPRs' : 'Receivable CPRs') +
      '</h2><button class="mini" id="bkListClose">Close list</button></div>' +
      (rows.length ? '<div class="wrapx"><table class="plain"><thead><tr>' +
        '<th>CPR reference</th><th>Courier / account</th><th>Created</th><th>Paid</th><th>Status</th>' +
        '<th class="n">Net amount</th></tr></thead><tbody>' + rows.map(function(r){
          return '<tr><td>' + cprButton(r) + '</td><td>' + esc(cname(r.courier)) +
            '<small class="bkdate">' + esc(r.account) + '</small></td><td>' + esc(r.createdOn || '—') +
            '</td><td>' + esc(r.paidOn || '—') + '</td><td>' + statusPill(r.status, r.state) +
            '</td><td class="n">' + amount(r.net) + '</td></tr>';
        }).join('') + '</tbody></table></div>' : '<div class="fxnone">No ' +
          (received ? 'received' : 'pending') + ' CPRs.</div>') + '</div>';
  }

  function movesTable(moves){
    if(!moves.length) return '<div class="lognote">No movements or generated CPRs yet.</div>';
    return '<table class="plain"><thead><tr><th>Date</th><th>Bank</th><th>What</th>' +
      '<th>Reference</th><th>Status</th><th class="n">Net amount</th></tr></thead><tbody>' +
      moves.map(function(m){
        return '<tr><td>' + esc(m.on || '—') + '</td><td>' + esc(m.bank) + '</td>' +
          '<td>' + esc(kindWord(m)) + '</td><td>' + (m.kind === 'courier' ? cprButton(m) :
          esc(m.note || m.ref || '')) + '</td><td>' + statusPill(m.status, m.state) + '</td>' +
          '<td class="n ' + (m.state === 'receivable' ? '' : Number(m.amount) < 0 ? 'neg' : 'pos') +
          '">' + amount(m.amount) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  function kindWord(m){
    if(m.kind === 'courier') return 'Courier payment' + (m.account ? ' · ' + m.account : '');
    if(m.kind === 'spend')   return 'Spending sheet';
    if(m.kind === 'transfer')return 'Transfer';
    return 'Adjustment';
  }

  /* ---------- courier payments ---------- */

  function couriersView(){
    var d = S.links;
    if(!d) return '<div class="fxnone">One moment…</div>';

    var banks = (S.report && S.report.banks.filter(function(b){ return b.active; })) || [];
    var byAccount = {};
    d.links.forEach(function(l){
      if(!byAccount[l.accountId]) byAccount[l.accountId] = [];
      byAccount[l.accountId].push(l);
    });

    // What the couriers themselves say about where they are paying. M&P name
    // the account on every payment, so a bank changed with the courier turns
    // up here by itself.
    var drift = (S.drift || []).map(function(x){
      if(x.state === 'unset'){
        return '<div class="warn"><b>' + esc(x.label) + '</b> is paying into ' +
          esc(x.bank || 'a bank') + ' · <span class="mono">' + esc(x.account) +
          '</span>' + (x.name ? ' (' + esc(x.name) + ')' : '') +
          ' — and no bank is set for it here. ' +
          '<button class="mini" data-follow="' + x.accountId + '">Use this bank</button></div>';
      }
      return '<div class="warn"><b>' + esc(x.label) + ' has started paying somewhere else.</b> ' +
        esc(x.courier.toUpperCase()) + ' say the money went to <span class="mono">' +
        esc(x.account) + '</span> at ' + esc(x.bank || 'another bank') +
        (x.on ? ' on ' + esc(x.on) : '') +
        ', and Fusion has it against <b>' + esc(x.bankName) + '</b>. ' +
        '<button class="mini" data-follow="' + x.accountId + '">Follow the change</button></div>';
    }).join('');

    var waiting = (d.waiting || []).filter(function(w){ return w.net > 0; });
    var warn = waiting.length
      ? '<div class="warn"><b>' + waiting.length + ' courier account' +
        (waiting.length === 1 ? ' has' : 's have') + ' paid money with nowhere to put it.</b> ' +
        waiting.map(function(w){
          return esc(w.label) + ' — ' + money(w.net) + ' over ' + w.receipts +
                 ' receipt' + (w.receipts === 1 ? '' : 's') + ' (' + esc(w.why) + ')';
        }).join('; ') + '</div>'
      : '';

    var cards = (d.accounts || []).map(function(a){
      var mine = byAccount[a.id] || [];
      var now = mine[0] || null;

      var log = mine.length
        ? mine.map(function(l){
            return '<div class="chg"><b>' + esc(l.from) + '</b> → ' + esc(l.bankName) +
              (l.note ? ' · ' + esc(l.note) : '') +
              '<span class="who">' + esc(l.madeBy || '') + '</span>' +
              ' <button class="mini" data-unlink="' + l.id + '">Remove</button></div>';
          }).join('')
        : '<div class="lognote">No bank set yet. Payments from this account are held ' +
          'until one is.</div>';

      return '<div class="sheet" style="margin-bottom:16px">' +
        '<div class="sec" style="padding-bottom:12px">' +
          '<h2>' + esc(a.label) + '<span class="aside">' + esc(cname(a.courier)) +
            (now ? ' · paying into <b>' + esc(now.bankName) + '</b> since ' + esc(now.from)
                 : ' · no bank set') + '</span></h2>' +
          '<div class="form">' +
            '<div><label>Pays into</label><select data-k="bank" data-acc="' + a.id + '">' +
              banks.map(function(b){
                return '<option value="' + b.id + '"' +
                  (now && now.bankId === b.id ? ' selected' : '') + '>' + esc(b.name) + '</option>';
              }).join('') + '</select></div>' +
            '<div><label>From this date</label>' +
              '<input type="date" data-k="from" data-acc="' + a.id + '" value="' +
              esc(S.today) + '"></div>' +
            '<div><label>Note</label><input type="text" data-k="note" data-acc="' + a.id +
              '" placeholder="why it changed"></div>' +
            '<div><label>&nbsp;</label><button class="solid" data-link="' + a.id +
              '">Save the change</button></div>' +
          '</div>' +
          '<div class="msg" data-msg="' + a.id + '"></div>' +
        '</div>' +
        '<div class="sec" style="padding:0">' + log + '</div>' +
      '</div>';
    }).join('');

    return drift + warn +
      '<div class="sheet" style="margin-bottom:16px"><div class="sec">' +
        '<h2>How this works<span class="aside">read once</span></h2>' +
        '<p class="hint" style="margin:0">A courier payment goes into the bank that ' +
        'account was paying into <b>on the day it paid</b>, not the bank it pays into ' +
        'today. So changing the bank never moves money that has already landed, and the ' +
        'list underneath each account is the record of every change.</p>' +
        '<div class="acts"><button class="solid" id="postNow">Refresh the couriers’ ' +
        'CPRs</button><span class="msg" id="postMsg"></span></div>' +
      '</div></div>' + cards;
  }

  /* ---------- transfers, adjustments ---------- */

  function entriesView(){
    var banks = (S.report && S.report.banks.filter(function(b){ return b.active; })) || [];
    if(!banks.length) return '<div class="fxnone">Add a bank first.</div>';

    var opts = banks.map(function(b){
      return '<option value="' + b.id + '">' + esc(b.name) + '</option>';
    }).join('');

    return '<div class="sheet" style="margin-bottom:16px"><div class="sec">' +
        '<h2>Move money between banks</h2>' +
        '<div class="form">' +
          '<div><label>Out of</label><select id="tFrom">' + opts + '</select></div>' +
          '<div><label>Into</label><select id="tTo">' + opts + '</select></div>' +
          '<div><label>Date</label><input type="date" id="tOn" value="' + esc(S.today) + '"></div>' +
          '<div><label>Amount</label><input type="number" id="tAmt" step="0.01"></div>' +
          '<div class="wide"><label>Note</label><input type="text" id="tNote"></div>' +
        '</div>' +
        '<div class="acts"><button class="solid" id="tGo">Transfer</button>' +
        '<span class="msg" id="tMsg"></span></div>' +
      '</div></div>' +

      '<div class="sheet" style="margin-bottom:16px"><div class="sec">' +
        '<h2>Adjustment<span class="aside">a minus takes it off</span></h2>' +
        '<div class="form">' +
          '<div><label>Bank</label><select id="aBank">' + opts + '</select></div>' +
          '<div><label>Date</label><input type="date" id="aOn" value="' + esc(S.today) + '"></div>' +
          '<div><label>Amount</label><input type="number" id="aAmt" step="0.01"></div>' +
          '<div class="wide"><label>What it is for</label><input type="text" id="aNote"></div>' +
        '</div>' +
        '<div class="acts"><button class="solid" id="aGo">Save the entry</button>' +
        '<span class="msg" id="aMsg"></span></div>' +
      '</div></div>' +

      '<div class="sheet"><div class="sec" style="padding-bottom:0;border-bottom:0">' +
        '<h2>Spending sheets</h2></div>' +
        '<div class="sec" style="padding:0"><div class="wrapx"><table class="plain"><thead><tr>' +
          '<th>Bank</th><th>Sheet</th><th class="n">Out this year</th><th></th>' +
        '</tr></thead><tbody>' +
        banks.map(function(b){
          return '<tr><td class="nm">' + esc(b.name) + '</td>' +
            '<td>' + (b.sheetUrl
              ? '<span style="font-size:12px;color:var(--muted)">linked</span>'
              : '<span style="font-size:12px;color:var(--faint)">none — add it when ' +
                'you edit the bank</span>') + '</td>' +
            '<td class="n neg">' + money(b.outYear) + '</td>' +
            '<td>' + (b.sheetUrl
              ? '<button class="mini" data-sheet="' + b.id + '">Read it now</button>' : '') +
              '<span class="msg" data-sheetmsg="' + b.id + '"></span></td></tr>';
        }).join('') +
        '</tbody></table></div></div></div>';
  }

  /* ---------- add or edit a bank ---------- */

  function addView(){
    var b = S.editing || { opening:0, openingOn:S.today, active:true };
    var banks = (S.report && S.report.banks) || [];

    return '<div class="sheet" style="margin-bottom:16px"><div class="sec">' +
        '<h2>' + (b.id ? 'Edit ' + esc(b.title || b.name) : 'A new bank account') +
          '<span class="aside">nothing before the opening date is ever counted</span></h2>' +
        '<p class="hint" style="margin:0 0 12px">Leave the opening balance blank ' +
        'until you have the statement — the account still works, and what ' +
        'moves is recorded. The time is kept with the balance; every feed here ' +
        'carries a date and no clock, so the cut itself is by day.</p>' +
        '<div class="form">' +
          '<div><label>Bank name</label><input type="text" id="bName" value="' +
            esc(b.name || '') + '" placeholder="Alfalah — current"></div>' +
          '<div><label>Account title</label><input type="text" id="bTitle" value="' +
            esc(b.title || '') + '"></div>' +
          '<div><label>In whose name</label><input type="text" id="bOwner" value="' +
            esc(b.ownerName || '') + '" placeholder="the business it belongs to"></div>' +
          '<div><label>Account number</label><input type="text" id="bNo" value="' +
            esc(b.accountNo || '') + '"></div>' +
          '<div><label>IBAN</label><input type="text" id="bIban" value="' +
            esc(b.iban || '') + '"></div>' +
          '<div><label>Branch</label><input type="text" id="bBranch" value="' +
            esc(b.branch || '') + '"></div>' +
          '<div><label>Opening balance</label><input type="number" id="bOpen" step="0.01" value="' +
            esc(b.opening == null ? '' : b.opening) +
            '" placeholder="leave it blank until you have the statement"></div>' +
          '<div><label>True on</label><input type="date" id="bOpenOn" value="' +
            esc(b.openingOn || S.today) + '"></div>' +
          '<div><label>At</label><input type="time" id="bOpenAt" value="' +
            esc(b.openingAt || '') + '"></div>' +
          '<div class="wide"><label>Spending sheet (published CSV)</label>' +
            '<input type="text" id="bSheet" value="' + esc(b.sheetUrl || '') + '" ' +
            'placeholder="Google Sheets → File → Share → Publish to the web → CSV"></div>' +
          '<div class="wide"><label>Notes</label><input type="text" id="bNotes" value="' +
            esc(b.notes || '') + '"></div>' +
        '</div>' +
        '<div class="acts">' +
          '<button class="solid" id="bSave">' + (b.id ? 'Save' : 'Add this bank') + '</button>' +
          (b.id ? '<button id="bNew">Add a different one instead</button>' : '') +
          (b.id ? '<button class="danger" id="bClose">Close this account</button>' : '') +
          '<span class="msg" id="bMsg"></span>' +
        '</div>' +
      '</div></div>' +

      (banks.length
        ? '<div class="sheet"><div class="sec" style="padding:0"><div class="wrapx">' +
          '<table class="plain"><thead><tr><th>Account title</th><th>IBAN</th><th>In whose name</th>' +
          '<th class="n">Opening</th><th></th></tr></thead><tbody>' +
          banks.map(function(x){
            return '<tr><td class="nm">' + esc(x.title || x.name) +
              (x.active ? '' : ' <span style="color:var(--faint)">closed</span>') + '</td>' +
              '<td class="mono" style="font-size:11.5px">' + esc(x.iban || '') + '</td>' +
              '<td>' + esc(x.ownerName || '') + '</td>' +
              '<td class="n">' + (x.openingKnown ? money(x.opening) : 'not set') + '</td>' +
              '<td><button class="mini" data-edit="' + x.id + '">Edit</button></td></tr>';
          }).join('') + '</tbody></table></div></div></div>'
        : '');
  }

  /* ---------- drawing and wiring ---------- */

  function draw(){
    var v = $('view');
    v.innerHTML = S.tab === 'report'   ? reportView()
                : S.tab === 'couriers' ? couriersView()
                : S.tab === 'entries'  ? entriesView()
                : addView();
    wire();
  }

  function say(el, cls, text){
    if(!el) return;
    el.className = 'msg ' + (cls || '');
    el.textContent = text;
  }

  function wire(){
    var v = $('view');

    v.querySelectorAll('[data-cpr-list]').forEach(function(button){
      button.addEventListener('click', function(){
        S.selectedBank = Number(button.getAttribute('data-bank-id'));
        S.receiptFilter = button.getAttribute('data-cpr-list');
        var list = $('bankCprList');
        list.innerHTML = receiptListView();
        wireReceiptLinks(list);
        list.scrollIntoView({ behavior:'smooth', block:'start' });
      });
    });
    wireReceiptLinks(v);
    var refresh = $('bkRefresh');
    if(refresh) refresh.addEventListener('click', function(){
      refresh.disabled = true;
      refresh.textContent = 'Refreshing…';
      load(true);
    });

    var postNow = $('postNow');
    if(postNow) postNow.addEventListener('click', function(){
      postNow.disabled = true;
      say($('postMsg'), '', 'Working…');
      post('/api/bank/post', {}).then(function(d){
        say($('postMsg'), 'good', d.posted + ' received CPR' + (d.posted === 1 ? '' : 's') + ' linked.');
        return load();
      }).catch(function(e){
        postNow.disabled = false;
        say($('postMsg'), 'bad', e.message);
      });
    });

    v.querySelectorAll('[data-link]').forEach(function(b){
      b.addEventListener('click', function(){
        var acc = b.getAttribute('data-link');
        var pick = function(k){
          var el = v.querySelector('[data-k="' + k + '"][data-acc="' + acc + '"]');
          return el ? el.value : '';
        };
        var msg = v.querySelector('[data-msg="' + acc + '"]');
        b.disabled = true;
        say(msg, '', 'Saving…');
        post('/api/bank/link', { accountId: Number(acc), bankId: Number(pick('bank')),
                                 from: pick('from'), note: pick('note') })
          .then(function(d){
            say(msg, 'good', 'Saved' + (d.posted ? ' · ' + d.posted + ' payments placed' : '') + '.');
            return load();
          })
          .catch(function(e){ b.disabled = false; say(msg, 'bad', e.message); });
      });
    });

    // "Follow the change" only ever takes you to the account's own card with
    // today's date in it. It does not set the bank by itself: which of your
    // banks that account number is, and from what day, is a decision about
    // money and is not one to guess at from an IBAN.
    v.querySelectorAll('[data-follow]').forEach(function(b){
      b.addEventListener('click', function(){
        var acc = b.getAttribute('data-follow');
        var row = v.querySelector('[data-k="from"][data-acc="' + acc + '"]');
        if(!row) return;
        row.value = S.today;
        row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        row.focus();
      });
    });

    v.querySelectorAll('[data-unlink]').forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        post('/api/bank/unlink', { id: Number(b.getAttribute('data-unlink')) })
          .then(load).catch(function(){});
      });
    });

    var tGo = $('tGo');
    if(tGo) tGo.addEventListener('click', function(){
      say($('tMsg'), '', 'Working…');
      post('/api/bank/transfer', { fromBank: Number($('tFrom').value),
          toBank: Number($('tTo').value), on: $('tOn').value,
          amount: $('tAmt').value, note: $('tNote').value })
        .then(function(){ say($('tMsg'), 'good', 'Moved.'); return load(); })
        .catch(function(e){ say($('tMsg'), 'bad', e.message); });
    });

    var aGo = $('aGo');
    if(aGo) aGo.addEventListener('click', function(){
      say($('aMsg'), '', 'Working…');
      post('/api/bank/adjust', { bankId: Number($('aBank').value), on: $('aOn').value,
          amount: $('aAmt').value, note: $('aNote').value })
        .then(function(){ say($('aMsg'), 'good', 'Saved.'); return load(); })
        .catch(function(e){ say($('aMsg'), 'bad', e.message); });
    });

    v.querySelectorAll('[data-sheet]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-sheet');
        var msg = v.querySelector('[data-sheetmsg="' + id + '"]');
        b.disabled = true;
        say(msg, '', ' Reading…');
        post('/api/bank/sheet', { id: Number(id), fresh: true }).then(function(d){
          say(msg, 'good', ' ' + d.written + ' rows in' +
            (d.gone ? ', ' + d.gone + ' taken off' : '') +
            (d.before ? ', ' + d.before + ' before the opening date left out' : '') + '.');
          b.disabled = false;
          return load();
        }).catch(function(e){ b.disabled = false; say(msg, 'bad', ' ' + e.message); });
      });
    });

    var bSave = $('bSave');
    if(bSave) bSave.addEventListener('click', function(){
      var body = {
        id: S.editing && S.editing.id,
        name: $('bName').value, title: $('bTitle').value,
        ownerName: $('bOwner').value, accountNo: $('bNo').value,
        iban: $('bIban').value, branch: $('bBranch').value,
        opening: $('bOpen').value, openingOn: $('bOpenOn').value,
        openingAt: $('bOpenAt') ? $('bOpenAt').value : '',
        sheetUrl: $('bSheet').value, notes: $('bNotes').value
      };
      bSave.disabled = true;
      say($('bMsg'), '', 'Saving…');
      post('/api/bank/save', body).then(function(){
        S.editing = null;
        say($('bMsg'), 'good', 'Saved.');
        return load();
      }).catch(function(e){
        bSave.disabled = false;
        say($('bMsg'), 'bad', e.message);
      });
    });

    var bNew = $('bNew');
    if(bNew) bNew.addEventListener('click', function(){ S.editing = null; draw(); });

    var bClose = $('bClose');
    if(bClose) bClose.addEventListener('click', function(){
      post('/api/bank/close', { id: S.editing && S.editing.id })
        .then(function(){ S.editing = null; return load(); })
        .catch(function(e){ say($('bMsg'), 'bad', e.message); });
    });

    v.querySelectorAll('[data-edit]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = Number(b.getAttribute('data-edit'));
        S.editing = (S.report.banks || []).filter(function(x){ return x.id === id; })[0] || null;
        draw();
      });
    });
  }

  function load(fresh){
    return Promise.all([ get('/api/bank/report' + (fresh === true ? '?fresh=1' : '')), get('/api/bank/links'),
                         get('/api/bank/drift').catch(function(){ return { drift: [] }; }) ])
      .then(function(a){
        S.report = a[0];
        S.loadedAt = Date.now();
        S.links = a[1];
        S.drift = (a[2] && a[2].drift) || [];
        S.today = a[0].today || S.today;
        $('yearNote').textContent = 'Tax year ' + a[0].year.year +
          ' · ' + a[0].year.from + ' to ' + a[0].year.to;
        draw();
      })
      .catch(function(e){
        $('view').innerHTML = '<div class="sheet"><div class="sec"><div class="fxnone">' +
          'Could not read it: ' + esc(e.message) + '</div></div></div>';
      });
  }

  window.APP.ready.then(function(s){
    if(!s.boss){ $('gate').classList.remove('hide'); return; }
    $('body').classList.remove('hide');

    $('tabs').addEventListener('click', function(e){
      var b = e.target.closest('button[data-tab]');
      if(!b) return;
      S.tab = b.getAttribute('data-tab');
      [].slice.call($('tabs').querySelectorAll('button')).forEach(function(x){
        x.classList.toggle('on', x === b);
      });
      try { sessionStorage.setItem('bank:tab', S.tab); } catch (err) {}
      draw();
    });

    try {
      var kept = sessionStorage.getItem('bank:tab');
      if(kept){
        S.tab = kept;
        [].slice.call($('tabs').querySelectorAll('button')).forEach(function(x){
          x.classList.toggle('on', x.getAttribute('data-tab') === kept);
        });
      }
    } catch (err) {}

    document.addEventListener('visibilitychange', function(){
      if(!document.hidden && Date.now() - S.loadedAt > 60000) load();
    });
    load();
  }).catch(function(){
    $('view').innerHTML = '<div class="fxnone">Could not reach the server.</div>';
  });
})();
</script>
</body>
</html>
