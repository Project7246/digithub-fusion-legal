<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daewoo ? Fusion</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#222F34">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/courier-dashboard.css">
</head>
<body><div class="layout"><aside class="rail"></aside><div class="main">
<div class="topline"><div><h1 id="ttl">Daewoo</h1><div class="sub" id="sourceNote">Courier dashboard</div></div></div>
<div class="shell"><div class="tabs" id="mainTabs">
<button data-main="parcels" class="on">Parcels</button><button data-main="finance">Finance</button><button data-main="receipts">Receipts</button></div>
<div class="cdbar"><button data-days="0">Today</button><button data-days="6" class="on">7 days</button><button data-days="29">30 days</button><button data-days="89">3 months</button><button id="btnPick">Date range</button>
<span id="picker" class="hide"><input id="from" type="date" aria-label="From"><input id="to" type="date" aria-label="To"></span>
<select id="account" aria-label="Daewoo account"></select><button id="load">Refresh</button><a href="/couriers?add=daewoo">Manage account</a></div>
<div class="fresh" id="message" role="status" aria-live="polite"></div>
<div class="subtabs" id="subTabs"></div><div class="cards" id="cards"></div>
<div class="box"><h3 id="tableTitle">Parcels</h3><div class="cdbar"><input id="search" type="search" placeholder="Tracking or invoice reference"><button id="back" hidden>Back to CPRs</button></div>
<div style="overflow:auto"><table class="t"><thead id="head"></thead><tbody id="rows"></tbody></table></div><p class="note" id="empty">Reading?</p>
<div class="cdbar"><button id="prev">Previous</button><span id="count"></span><button id="next">Next</button></div></div>
<p class="note" id="coverage">Daewoo reports keep COD, delivery/tax invoices and bank payments separate. Unmatched net amounts remain unavailable.</p>
</div></div></div><script src="/nav.js"></script><script src="/daewoo-dashboard.js"></script></body></html>
