<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Load sheet</title>
<meta name="theme-color" content="#222F34">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dispatch">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Fusion's palette, in the names this tool already uses. Slate for the body
     of a thing, teal only for what is being acted on - the same rule as the
     rest of the app, so this does not read as a different product. */
  --side:#222F34; --side2:#2C3B41; --sideTx:#AEBEC4; --sideHi:#FFFFFF;
  --accent:#11BAB5;
  --surface:#F6F8F9; --card:#FFFFFF;
  --line:#E3E8EB; --line2:#EFF2F4;
  --text:#222F34; --muted:#5E6E75; --faint:#92A1A7;
  --ok:#11BAB5; --warn:#B45309; --danger:#C2410C;
  --disp:'Montserrat',system-ui,sans-serif;
  --body:'Roboto',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --mono:'Roboto Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --r2:4px;
  --sh:0 1px 2px rgba(20,33,27,.05),0 1px 3px rgba(20,33,27,.04);
  --shL:0 12px 34px rgba(20,33,27,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--surface);color:var(--text);font-family:var(--body);font-size:14px;
  line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;min-height:100%}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.n{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ------------------------------------------------------------- sidebar */
.side{width:262px;flex:none;background:var(--side);color:var(--sideTx);
  display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.brand{padding:20px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.brand b{display:block;font-family:var(--disp);font-size:19px;letter-spacing:.13em;
  text-transform:uppercase;color:#fff;line-height:1.15}
.brand i{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--accent)}
.snav{flex:1;overflow-y:auto;padding:12px 10px 20px}
.slab{font-family:var(--mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;
  color:#6E8C7C;padding:16px 10px 7px}
.si{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 10px;
  border-radius:var(--r2);color:var(--sideTx);font-size:13.5px;transition:background .12s,color .12s}
.si:hover{background:rgba(255,255,255,.06);color:var(--sideHi)}
.si[aria-current=true]{background:rgba(255,255,255,.12);color:#fff;font-weight:600}
.si .ic{width:15px;flex:none;opacity:.75;font-size:12px;text-align:center}
.si .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:#7F9E8C}
.si[aria-current=true] .ct{color:var(--accent)}
.co{display:flex;align-items:center;gap:7px;width:100%;padding:9px 10px;border-radius:var(--r2);
  color:var(--sideHi);font-size:13.5px;font-weight:600;transition:background .12s}
.co:hover{background:rgba(255,255,255,.06)}
.co[aria-current=true]{background:rgba(255,255,255,.12)}
.co .caret{width:12px;flex:none;font-size:9px;color:#6E8C7C;transition:transform .15s}
.co.open .caret{transform:rotate(90deg)}
.co .dot{width:7px;height:7px;border-radius:50%;background:var(--c,#4B6B5A);flex:none}
.co .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:#7F9E8C;font-weight:400}
.acs{padding:2px 0 6px}
.ac{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  padding:7px 10px 7px 32px;border-radius:var(--r2);color:#94B3A2;font-size:12.5px}
.ac:hover{background:rgba(255,255,255,.05);color:var(--sideHi)}
.ac[aria-current=true]{background:rgba(255,255,255,.09);color:#fff}
.ac .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:#7F9E8C}
.addl{display:block;width:100%;text-align:left;padding:6px 10px 6px 32px;color:#6E8C7C;
  font-size:12px;border-radius:var(--r2)}
.addl:hover{color:var(--accent);background:rgba(255,255,255,.05)}
.addc{display:block;width:100%;text-align:left;padding:9px 10px;margin-top:6px;
  color:var(--accent);font-size:13px;border-radius:var(--r2);
  border:1px dashed rgba(143,209,79,.35)}
.addc:hover{background:rgba(143,209,79,.09)}
.sfoot{padding:10px;border-top:1px solid rgba(255,255,255,.07)}

/* ---------------------------------------------------------------- main */
.main{flex:1;min-width:0;overflow-x:hidden}
.wrap{max-width:1120px;margin:0 auto;padding:30px 30px 90px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-family:var(--disp);font-size:33px;letter-spacing:.04em;text-transform:uppercase;
  margin:0;line-height:1}
.facts{display:flex;gap:22px;flex-wrap:wrap;align-items:baseline}
.fact{display:flex;align-items:baseline;gap:7px}
.fact b{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600}
.fact span{font-family:var(--disp);font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted)}
.grow{flex:1}

.drop{border:2px dashed var(--line);border-radius:10px;background:var(--card);
  padding:60px 26px;text-align:center;box-shadow:var(--sh);transition:.15s}
.drop.hot{border-color:var(--accent);background:#F4FBEE}
.drop h1{font-family:var(--disp);font-size:clamp(26px,4vw,40px);letter-spacing:.03em;
  text-transform:uppercase;margin:0 0 8px}
.drop p{margin:0 auto 22px;color:var(--muted);max-width:420px}
.btn{display:inline-block;font-family:var(--disp);font-size:16px;letter-spacing:.08em;
  text-transform:uppercase;background:var(--side);color:#fff;padding:12px 28px;
  border-radius:var(--r2);box-shadow:var(--sh)}
.btn:hover{background:var(--side2)}
.paste{width:100%;max-width:540px;margin:14px auto 0;display:block;min-height:62px;
  font-family:var(--mono);font-size:11.5px;border:1px solid var(--line);border-radius:var(--r2);
  padding:10px;background:#FBFCFB;color:var(--muted);resize:vertical}
.tiny{font-size:12px;color:var(--faint);margin-top:14px}
.srcs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn.ghost{background:#fff;color:var(--text);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line2)}
.btn[disabled]{opacity:.55;cursor:default}

.alloc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:20px 22px;margin-bottom:22px}
.cap{font-family:var(--disp);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:12px}
.track{display:flex;height:44px;border-radius:var(--r2);overflow:hidden;background:var(--line2)}
.seg{background:var(--c);display:flex;align-items:center;justify-content:center;color:#fff;
  width:0;min-width:0;transition:width .6s cubic-bezier(.22,.7,.24,1)}
.seg u{text-decoration:none;font-family:var(--mono);font-weight:600;font-size:15px;
  white-space:nowrap;padding:0 8px;opacity:0;transition:opacity .3s .34s}
.alloc.on .seg u{opacity:1}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px}
.lg{display:flex;align-items:center;gap:8px;font-size:13px}
.lg i{width:11px;height:11px;border-radius:3px;background:var(--c);flex:none}
.lg b{font-family:var(--disp);font-size:14.5px;letter-spacing:.06em;text-transform:uppercase}
.lg span{color:var(--muted);font-family:var(--mono);font-size:12.5px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);overflow:hidden;margin-bottom:20px}
.card>header{display:flex;align-items:center;gap:12px;padding:14px 18px;
  border-bottom:1px solid var(--line);flex-wrap:wrap}
.card>header h3{font-family:var(--disp);font-size:17px;letter-spacing:.07em;
  text-transform:uppercase;margin:0}
.note{font-size:12.5px;color:var(--faint);margin-left:auto}
.scroll{overflow:auto;max-height:520px}
/* the first column must stay put - it is the one you are deciding about */
.stickycol th:first-child,.stickycol td:first-child{position:sticky;left:0;z-index:2;
  background:var(--card);box-shadow:1px 0 0 var(--line)}
.stickycol th:first-child{z-index:3;background:#FAFBFA}
.stickycol tbody tr:hover td:first-child{background:#FAFCFA}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-family:var(--disp);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;
  text-align:left;padding:10px 14px;background:#FAFBFA;color:var(--muted);
  border-bottom:1px solid var(--line);position:sticky;top:0;white-space:nowrap;z-index:1}
td{padding:9px 14px;border-bottom:1px solid var(--line2);white-space:nowrap}
tbody tr:hover{background:#FAFCFA}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tot td{background:#F6F8F7;font-weight:600}
.mixbar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--line2);min-width:74px}
.mixbar i{background:var(--c)}
.empty{padding:48px 24px;text-align:center;color:var(--faint)}
.empty b{display:block;color:var(--muted);font-size:15px;margin-bottom:6px}
.sec{font-family:var(--disp);font-size:19px;letter-spacing:.07em;text-transform:uppercase;
  margin:28px 0 14px;display:flex;align-items:center;gap:12px}
.sec::after{content:'';flex:1;height:1px;background:var(--line)}

.mini{font-family:var(--disp);font-size:13.5px;letter-spacing:.07em;text-transform:uppercase;
  padding:8px 13px;border:1px solid var(--line);border-radius:var(--r2);color:var(--muted);
  background:var(--card)}
.mini:hover{border-color:var(--side2);color:var(--text)}
.mini.dark{background:var(--side);color:#fff;border-color:var(--side)}
.mini.dark:hover{background:var(--side2)}
.mini:disabled{opacity:.35;cursor:not-allowed}
.mini.sm{padding:5px 9px;font-size:12.5px}

.accrow input.share{width:64px;padding:6px;text-align:right;border:1px solid var(--line);
  border-radius:var(--r2);font-family:var(--mono);font-size:13px}
.accrow input.nm{width:100%;min-width:150px;padding:6px 8px;border:1px solid transparent;
  border-radius:var(--r2);font-size:13px;background:transparent}
.accrow input.nm:hover{border-color:var(--line)}
.accrow input.nm:focus{border-color:var(--accent);background:#fff}
.bal{font-family:var(--mono);font-size:12.5px;padding:4px 9px;border-radius:99px}
.bal.good{background:#E8F5EE;color:var(--ok)}
.bal.bad{background:#FDECE4;color:var(--danger)}

.scrim{position:fixed;inset:0;background:rgba(20,33,27,.5);opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:50}
.scrim.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;height:100%;width:min(640px,100%);background:var(--card);
  box-shadow:var(--shL);transform:translateX(101%);z-index:51;display:flex;flex-direction:column;
  transition:transform .26s cubic-bezier(.22,.7,.24,1)}
.panel.on{transform:none}
.panel>header{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;gap:12px}
.panel>header h2{font-family:var(--disp);font-size:21px;letter-spacing:.07em;
  text-transform:uppercase;margin:0}
.pb{padding:20px 22px;overflow:auto;flex:1}
.x{font-size:20px;line-height:1;color:var(--faint);margin-left:auto;padding:4px 8px;
  border-radius:var(--r2)}
.x:hover{color:var(--text);background:var(--line2)}
.fld{margin-bottom:15px}
.fld label{display:block;font-family:var(--disp);font-size:13px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.fld input,.fld select{width:100%;padding:9px 11px;border:1px solid var(--line);
  border-radius:var(--r2);font-family:var(--mono);font-size:13px;background:#FBFCFB}
.fld input:focus{background:#fff;border-color:var(--accent)}
.hint{font-size:12px;color:var(--faint);margin-top:4px}
.sub{font-family:var(--disp);font-size:15px;letter-spacing:.08em;text-transform:uppercase;
  margin:26px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line);color:var(--side2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r2);
  font-size:14px;margin:14px 0 12px}
.ptbl{width:100%;border-collapse:collapse;font-size:13px}
.ptbl th{position:static;padding:8px 6px}
.ptbl td{padding:5px 6px;border-bottom:1px solid var(--line2)}
.ptbl input{width:58px;padding:6px 4px;text-align:center;border:1px solid var(--line);
  border-radius:var(--r2);font-family:var(--mono);font-size:13px}
.city{font-family:var(--mono);font-size:12.5px}
.info{background:#EFF6F2;border:1px solid #C6E2D4;border-left:3px solid var(--ok);
  border-radius:var(--r2);padding:11px 14px;font-size:13px;color:#14503A;margin-bottom:12px}
.warn{background:#FEF3E8;border:1px solid #F6D2AE;border-left:3px solid var(--warn);
  border-radius:var(--r2);padding:11px 14px;font-size:13px;color:#7C4A11;margin-bottom:12px}
.save{width:100%;margin-top:8px;font-family:var(--disp);font-size:16px;letter-spacing:.08em;
  text-transform:uppercase;background:var(--side);color:#fff;padding:12px;border-radius:var(--r2)}
.save:hover{background:var(--side2)}
.tmpl td{padding:4px 6px}
.tmpl input.h{width:100%;min-width:120px;padding:6px 8px;border:1px solid var(--line);
  border-radius:var(--r2);font-size:12.5px}
.tmpl select{padding:6px;border:1px solid var(--line);border-radius:var(--r2);font-size:12.5px;
  max-width:150px}
.tmpl input.v{width:120px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--r2);
  font-size:12.5px}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);background:var(--side);
  color:#fff;padding:12px 22px;border-radius:var(--r);font-family:var(--disp);font-size:15px;
  letter-spacing:.07em;text-transform:uppercase;opacity:0;pointer-events:none;z-index:60;
  box-shadow:var(--shL);transition:.18s}
.toast.on{opacity:1;transform:translate(-50%,0)}

.burger{display:none}
@media (max-width:900px){
  body{display:block}
  .side{position:fixed;left:0;top:0;z-index:45;transform:translateX(-100%);
    transition:transform .25s;box-shadow:var(--shL)}
  .side.on{transform:none}
  .main{width:100%}
  .wrap{padding:18px 16px 80px}
  .burger{display:inline-flex;align-items:center;gap:8px;position:sticky;top:0;z-index:30;
    width:100%;background:var(--side);color:#fff;padding:13px 16px;
    font-family:var(--disp);font-size:16px;letter-spacing:.1em;text-transform:uppercase}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  .seg u{opacity:1!important}}
</style>
</head>
<body>

<aside class="side" id="side">
  <div class="brand"><b>Dispatch</b><i>Courier Router</i></div>
  <div class="snav" id="snav"></div>
  <div class="sfoot">
    <button class="si" data-go="settings"><span class="ic">⚙</span>Settings</button>
  </div>
</aside>

<div class="main">
  <button class="burger" id="burger">☰ &nbsp;Dispatch</button>
  <div class="wrap"><div id="view"></div></div>
</div>

<div class="scrim" id="scrim"></div>

<aside class="panel" id="panel" aria-hidden="true">
  <header><h2 id="panTitle"></h2><button class="x" data-close>&times;</button></header>
  <div class="pb" id="panBody"></div>
</aside>

<div class="toast" id="toast"></div>

<script>
/* ---------------------------------------------------------------
   Dispatch core. Kept DOM-free so it can be unit tested outside a browser.
   --------------------------------------------------------------- */

function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQ = false;
  text = String(text).replace(/^\uFEFF/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else if (c === '"') inQ = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows.filter(r => r.length > 1 || (r[0] || '').trim() !== '');
}

function parseTable(text) {
  const rows = parseCSV(text);
  if (!rows.length) return { headers: [], rows: [] };
  return { headers: rows[0].map(h => String(h || '').trim()), rows: rows.slice(1) };
}

function colIndex(headers, ...wanted) {
  const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const H = headers.map(norm);
  for (const w of wanted) { const i = H.indexOf(norm(w)); if (i !== -1) return i; }
  return -1;
}

function cleanPhone(v) {
  let d = String(v == null ? '' : v).replace(/\D/g, '');
  if (d.length === 14 && d.startsWith('0092')) d = '0' + d.slice(4);
  else if (d.length === 13 && d.startsWith('092')) d = '0' + d.slice(3);
  else if (d.length === 12 && d.startsWith('92')) d = '0' + d.slice(2);
  else if (d.length === 10 && d.startsWith('3')) d = '0' + d;
  return d;
}

const num = v => {
  const n = parseFloat(String(v == null ? '' : v).replace(/[^0-9.\-]/g, ''));
  return isNaN(n) ? 0 : n;
};
const pick = (a, b) => (String(a || '').trim() !== '' ? String(a).trim() : String(b || '').trim());

/* Shopify puts every line item on its own row and fills the customer fields
   only on the first row of each order. */
function buildOrders(text, opt) {
  /* Which pair of columns wins when both are filled. Shopify fills both from
     one checkout address most of the time, so this only matters for gift
     orders, where the two genuinely differ. */
  const preferBilling = !!(opt && opt.prefer === 'bill');
  const { headers, rows } = parseTable(text);
  const at = {
    id: colIndex(headers, 'Name'), email: colIndex(headers, 'Email'),
    total: colIndex(headers, 'Total'), created: colIndex(headers, 'Created at'),
    qty: colIndex(headers, 'Lineitem quantity'), item: colIndex(headers, 'Lineitem name'),
    bName: colIndex(headers, 'Billing Name'), bAddr: colIndex(headers, 'Billing Address1'),
    bCity: colIndex(headers, 'Billing City'), bPhone: colIndex(headers, 'Billing Phone'),
    sName: colIndex(headers, 'Shipping Name'), sAddr: colIndex(headers, 'Shipping Address1'),
    sCity: colIndex(headers, 'Shipping City'), sPhone: colIndex(headers, 'Shipping Phone'),
    vendor: colIndex(headers, 'Vendor'),
    fin: colIndex(headers, 'Financial Status', 'Financial status', 'Payment Status')
  };
  if (at.id === -1) throw new Error('Column "Name" nahi mila — kya yeh Shopify orders export hai?');

  const out = [];
  let cur = null;
  for (const r of rows) {
    const id = String(r[at.id] || '').trim();
    if (!id || id.toLowerCase() === 'name') { cur = null; continue; }
    if (!cur || cur.id !== id) {
      cur = {
        id,
        city: preferBilling ? pick(r[at.bCity], r[at.sCity]) : pick(r[at.sCity], r[at.bCity]),
        name: preferBilling ? pick(r[at.bName], r[at.sName]) : pick(r[at.sName], r[at.bName]),
        address: preferBilling ? pick(r[at.bAddr], r[at.sAddr]) : pick(r[at.sAddr], r[at.bAddr]),
        phone: cleanPhone(preferBilling ? pick(r[at.bPhone], r[at.sPhone])
                                        : pick(r[at.sPhone], r[at.bPhone])),
        billCity: String(r[at.bCity] == null ? '' : r[at.bCity]).trim(),
        shipCity: String(r[at.sCity] == null ? '' : r[at.sCity]).trim(),
        email: String(r[at.email] || '').trim(),
        date: String(r[at.created] || '').trim().slice(0, 10),
        cod: num(r[at.total]),
        vendor: String(r[at.vendor] || '').trim(),
        fin: String(r[at.fin] || '').trim().toLowerCase(),
        qty: 0, items: []
      };
      out.push(cur);
    }
    cur.qty += num(r[at.qty]);
    const nm = String(r[at.item] || '').trim();
    if (nm) cur.items.push(nm);
  }
  out.forEach(o => { o.itemText = o.items.join(' | '); });
  return out;
}

/* ===================================================================
   COMPANIES
   A company is whatever the user says it is: a name, a booking-sheet
   layout, and one or more accounts (each account is a separate portal
   login, so each needs its own file).
   =================================================================== */

const uid = p => p + '_' + Math.random().toString(36).slice(2, 9);

/* ===================================================================
   SERVICE AREAS
   Every courier serves some cities and not others. A company with an
   empty list is treated as serving everywhere, so nothing breaks until
   a list is actually uploaded.
   =================================================================== */

/* Customers type city names loosely, so compare on a squashed form. */
const areaKey = s => String(s == null ? '' : s).toUpperCase()
  .replace(/[^A-Z0-9]+/g, ' ').trim();

/* Squashed further for fuzzy comparison: vowels and doubles dropped. */
const fuzzKey = s => areaKey(s).replace(/\s+/g, '')
  .replace(/([A-Z])\1+/g, '$1');

function parseAreaList(text) {
  const rows = parseCSV(text);
  if (!rows.length) return [];
  const out = [];
  const head = rows[0].map(h => areaKey(h));
  const HEADERS = ['CITY','CITIES','CITY NAME','AREA','AREAS','AREA NAME','SERVICE AREA',
    'SERVICE AREAS','DESTINATION','DESTINATION CITY','LOCATION','LOCATION NAME','TOWN','NAME'];
  const looksHeader = head.some(h => HEADERS.includes(h));
  let col = 0;
  if (looksHeader) {
    const i = head.findIndex(h => HEADERS.includes(h));
    if (i >= 0) col = i;
  }
  for (let r = looksHeader ? 1 : 0; r < rows.length; r++) {
    const raw = rows[r][col];
    const k = areaKey(raw);
    if (k) out.push({ key: k, label: String(raw).trim() });
  }
  const seen = new Set();
  return out.filter(a => (seen.has(a.key) ? false : (seen.add(a.key), true)));
}

const servesArea = (company, key) =>
  !company.areas || !company.areas.length || company.areas.some(a => a.key === key);

const anyAreaLists = companies => companies.some(c => c.areas && c.areas.length);

/* How close two names are, 0..1. Cheap on purpose - this runs over every
   service area for every unmatched city. */
function similar(a, b) {
  if (a === b) return 1;
  const fa = fuzzKey(a), fb = fuzzKey(b);
  if (fa === fb) return 0.97;
  const s = fa.length <= fb.length ? fa : fb;
  const l = fa.length <= fb.length ? fb : fa;
  if (!l.length) return 0;
  if (l.startsWith(s) || l.includes(s)) return 0.9 - (l.length - s.length) * 0.03;
  /* RWP -> RAWALPINDI, FSD -> FAISALABAD: short input against the consonants */
  if (s.length <= 4 && l.length >= 5) {
    const skel = l.replace(/[AEIOU]/g, '');
    let i = 0;
    for (const ch of skel) if (ch === s[i]) i++;
    if (i === s.length && s[0] === l[0]) return 0.62;
  }
  // edit distance on the squashed forms
  const dp = Array.from({ length: s.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= l.length; j++) dp[0][j] = j;
  for (let i = 1; i <= s.length; i++) {
    for (let j = 1; j <= l.length; j++) {
      dp[i][j] = Math.min(dp[i-1][j] + 1, dp[i][j-1] + 1,
        dp[i-1][j-1] + (s[i-1] === l[j-1] ? 0 : 1));
    }
  }
  return Math.max(0, 1 - dp[s.length][l.length] / l.length);
}

/* All distinct service areas across every company. */
function allAreas(companies) {
  const m = new Map();
  for (const c of companies) for (const a of (c.areas || [])) {
    if (!m.has(a.key)) m.set(a.key, { key: a.key, label: a.label, by: [] });
    m.get(a.key).by.push(c.id);
  }
  return [...m.values()];
}

function suggestAreas(cityKey, areas, limit) {
  return areas.map(a => ({ area: a, score: similar(cityKey, a.key) }))
    .filter(x => x.score > 0.45)
    .sort((a, b) => b.score - a.score)
    .slice(0, limit || 6);
}

/* A city the customer typed, resolved through the manual alias map. */
const canonCity = (city, map) => {
  const k = areaKey(city);
  return (map && map[k]) || k;
};

/* codOverride wins over everything; then prepaid orders take the set value. */
function effectiveCod(o, opt) {
  const ov = opt && opt.overrides && opt.overrides[o.id];
  if (ov !== undefined && ov !== null && ov !== '') return Number(ov) || 0;
  if (opt && opt.prepaidOn && (o.fin === 'paid')) return Number(opt.prepaidCod) || 0;
  return o.cod;
}

/* ===================================================================
   SPLITTING
   =================================================================== */

function clampShares(raw, floor, cap, target) {
  const T2 = target == null ? 100 : target;
  const live = raw.map(v => v > 0);
  const k = live.filter(Boolean).length;
  if (!k || T2 <= 0) return raw.map(() => 0);
  const lo = Math.min(floor, T2 / k), hi = Math.max(cap, T2 / k);
  let s = raw.map(v => (v > 0 ? v : 0));
  const sum = s.reduce((a, b) => a + b, 0);
  s = s.map(v => (v > 0 ? v * T2 / sum : 0));
  for (let pass = 0; pass < 40; pass++) {
    s = s.map(v => (v > 0 ? Math.min(hi, Math.max(lo, v)) : 0));
    const diff = T2 - s.reduce((a, b) => a + b, 0);
    if (Math.abs(diff) < 1e-9) break;
    const movable = [];
    s.forEach((v, i) => { if (!live[i]) return;
      if (diff > 0 ? v < hi - 1e-9 : v > lo + 1e-9) movable.push(i); });
    if (!movable.length) break;
    movable.forEach(i => { s[i] += diff / movable.length; });
  }
  return s;
}

function roundShares(s) {
  const sum = s.reduce((a, b) => a + b, 0);
  const norm = sum > 0 ? s.map(v => v * 100 / sum) : s.slice();
  const floors = norm.map(v => Math.floor(v));
  let left = Math.round(100 - floors.reduce((a, b) => a + b, 0));
  const order = norm.map((v, i) => ({ i, frac: v - Math.floor(v), live: v > 0 }))
    .filter(o => o.live).sort((a, b) => b.frac - a.frac);
  const out = floors.slice();
  while (left > 0 && order.length) {
    for (let j = 0; j < order.length && left > 0; j++, left--) out[order[j].i]++;
  }
  return out;
}

/* Split a whole number by percentages without losing or inventing a parcel. */
function apportion(total, shares) {
  const live = shares.map(v => Math.max(0, Number(v) || 0));
  const sum = live.reduce((a, b) => a + b, 0);
  if (!total || sum <= 0) return shares.map(() => 0);
  const exact = live.map(v => total * v / sum);
  const out = exact.map(v => Math.floor(v));
  let left = total - out.reduce((a, b) => a + b, 0);
  const order = exact.map((v, i) => ({ i, frac: v - Math.floor(v) }))
    .sort((a, b) => b.frac - a.frac);
  for (let j = 0; left > 0 && j < order.length; j++, left--) out[order[j].i]++;
  return out;
}

const sharesFromPriority = (row, n) => {
  if (!row) return null;
  const out = new Array(n).fill(0);
  let best = Infinity, bi = -1;
  for (let i = 0; i < n; i++) {
    const p = row[i];
    if (p == null || p === '' || isNaN(p)) continue;
    if (Number(p) < best) { best = Number(p); bi = i; }
  }
  if (bi === -1) return null;
  out[bi] = 100;
  return out;
};

/* Lowest priority number takes the whole city. */
function routeOrders(orders, priority, n, fallbackKey, opt) {
  const o2 = opt || {};
  const companies = o2.companies || [];
  const cityMap = o2.cityMap || {};
  const unrouted = new Map();
  for (const o of orders) {
    o.rawCity = String(o.city || '').trim();
    o.cityKey = canonCity(o.city, cityMap);
    o.mapped = areaKey(o.city) !== o.cityKey;
    const row = priority[o.cityKey] || priority[fallbackKey || 'DEFAULT'];
    let best = Infinity, bi = -1;
    if (row) for (let i = 0; i < n; i++) {
      const p = row[i];
      if (p == null || p === '' || isNaN(p)) continue;
      if (companies.length === n && !servesArea(companies[i], o.cityKey)) continue;
      if (Number(p) < best) { best = Number(p); bi = i; }
    }
    o.ci = bi;
    o.shareVec = null;
    if (bi === -1) unrouted.set(o.cityKey || '(city khaali)',
      (unrouted.get(o.cityKey) || 0) + 1);
  }
  return { unrouted: [...unrouted.entries()].map(([city, k]) => ({ city, n: k })) };
}

/* Percentage split, city by city, using exact apportionment. */
function routeOrdersByShare(orders, shares, priority, n, fallbackKey, opt) {
  const o2 = opt || {};
  const floor = o2.minShare == null ? 10 : Number(o2.minShare);
  const cap = o2.maxShare == null ? 70 : Number(o2.maxShare);
  const fromPriority = key => {
    const row = priority[key] || priority[fallbackKey || 'DEFAULT'];
    if (!row) return null;
    let any = false;
    const raw = [];
    for (let i = 0; i < n; i++) {
      const p = row[i];
      if (p == null || p === '' || isNaN(p)) { raw.push(0); continue; }
      any = true; raw.push(Math.exp(-(Number(p) - 1)));
    }
    return any ? roundShares(clampShares(raw, floor, cap, 100)) : null;
  };

  const companies = o2.companies || [];
  const cityMap = o2.cityMap || {};
  const groups = new Map();
  for (const o of orders) {
    o.rawCity = String(o.city || '').trim();
    o.cityKey = canonCity(o.city, cityMap);
    o.mapped = areaKey(o.city) !== o.cityKey;
    if (!groups.has(o.cityKey)) groups.set(o.cityKey, []);
    groups.get(o.cityKey).push(o);
  }

  const unrouted = new Map();
  for (const [key, list] of groups) {
    let sh = shares[key] || shares[fallbackKey || 'DEFAULT'] || fromPriority(key);
    if (!sh || !sh.some(v => v > 0)) {
      list.forEach(o => { o.ci = -1; o.shareVec = null; });
      unrouted.set(key || '(city khaali)', list.length);
      continue;
    }
    sh = sh.slice(0, n);
    while (sh.length < n) sh.push(0);
    /* a company that does not serve this city cannot take any of it */
    if (companies.length === n) {
      sh = sh.map((v, i) => servesArea(companies[i], key) ? v : 0);
      if (!sh.some(v => v > 0)) {
        list.forEach(o => { o.ci = -1; o.shareVec = null; o.noService = true; });
        unrouted.set(key || '(city khaali)', list.length);
        continue;
      }
      sh = roundShares(sh);
    }
    const counts = apportion(list.length, sh);
    let k = 0;
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < counts[i]; j++, k++) { list[k].ci = i; list[k].shareVec = sh; }
    }
    for (; k < list.length; k++) { list[k].ci = sh.findIndex(v => v > 0); list[k].shareVec = sh; }
  }
  return { unrouted: [...unrouted.entries()].map(([city, k]) => ({ city, n: k })) };
}

/* Hand a company's parcels out to its accounts, in city order so each account
   gets a spread of cities rather than one city each. */
function splitToAccounts(list, accounts) {
  const shares = accounts.map(a => Number(a.share) || 0);
  const counts = apportion(list.length, shares.some(v => v > 0)
    ? shares : accounts.map(() => 1));
  const out = accounts.map(() => []);
  let k = 0;
  for (let i = 0; i < accounts.length; i++) {
    for (let j = 0; j < counts[i]; j++, k++) { list[k].account = accounts[i].id; out[i].push(list[k]); }
  }
  for (; k < list.length; k++) { list[k].account = accounts[0] && accounts[0].id; if (out[0]) out[0].push(list[k]); }
  return out;
}

const csvCell = v => {
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
const toCSV = t => [t.headers.map(csvCell).join(','),
  ...t.rows.map(r => r.map(csvCell).join(','))].join('\r\n');
const toTSV = t => [t.headers.join('\t'),
  ...t.rows.map(r => r.map(v => String(v == null ? '' : v)

/* ===================================================================
   PRIORITY CSV
   =================================================================== */

function detectFileKind(text, names) {
  const { headers } = parseTable(text);
  if (!headers.length) return { kind: 'unknown', headers };
  const has = (...n) => colIndex(headers, ...n) !== -1;
  if (has('Lineitem quantity') || has('Lineitem name') || has('Lineitem price')) {
    return { kind: 'shopify', headers };
  }
  const cityCol = colIndex(headers, 'City', 'Cities', 'Destination', 'City Name');
  if (cityCol !== -1 && (names || []).some(c => colIndex(headers, c) !== -1)) {
    return { kind: 'priority', headers };
  }
  if (has('Name') && has('Total')) return { kind: 'shopify', headers };
  return { kind: 'unknown', headers };
}

function priorityToCSV(table, names, type) {
  const headers = ['City'].concat(names).concat(['Type']);
  const rows = Object.keys(table)
    .sort((a, b) => a === 'DEFAULT' ? -1 : b === 'DEFAULT' ? 1 : a.localeCompare(b))
    .map(city => [city].concat(names.map((_, i) => {
      const v = (table[city] || [])[i];
      return v == null || v === '' ? '' : v;
    })).concat([type]));
  return toCSV({ headers, rows });
}

function priorityFromCSV(text, names) {
  const { headers, rows } = parseTable(text);
  const cityCol = colIndex(headers, 'City', 'Cities', 'Destination', 'City Name');
  if (cityCol === -1) throw new Error('"City" column nahi mila');
  const typeCol = colIndex(headers, 'Type', 'Mode');
  const idx = names.map(c => colIndex(headers, c));
  if (idx.every(i => i === -1)) throw new Error('Company columns nahi mile: ' + names.join(', '));
  const table = {};
  let shareVotes = 0, priorityVotes = 0, declared = null;
  for (const r of rows) {
    const city = String(r[cityCol] == null ? '' : r[cityCol]).trim().toUpperCase();
    if (!city) continue;
    const vals = idx.map(i => {
      if (i === -1) return null;
      const raw = String(r[i] == null ? '' : r[i]).replace('%', '').trim();
      if (raw === '') return null;
      const n = Number(raw);
      return isNaN(n) ? null : n;
    });
    if (vals.every(v => v == null)) continue;
    if (typeCol !== -1 && !declared) {
      const t = String(r[typeCol] || '').trim().toLowerCase();
      if (t === 'share' || t === 'priority') declared = t;
    }
    const sum = vals.reduce((a, b) => a + (b || 0), 0);
    if (sum > 90 && sum < 110) shareVotes++; else priorityVotes++;
    table[city] = vals;
  }
  const type = declared || (shareVotes >= priorityVotes ? 'share' : 'priority');
  if (type === 'share') {
    for (const city of Object.keys(table)) {
      const v = table[city].map(x => (x == null ? 0 : x));
      table[city] = v.reduce((a, b) => a + b, 0) > 0 ? roundShares(v) : v;
    }
  }
  return { table, type, count: Object.keys(table).length };
}


/* ===================================================================
   ONE CUSTOMER, SEVERAL ORDERS
   The same person often places 2-3 orders in a day. They travel in one
   parcel with one shipping charge, so they must be merged before the
   booking sheet is made.
   =================================================================== */

const normPhone = p => String(p == null ? '' : p).replace(/\D/g, '').slice(-10);
const normText = s => String(s == null ? '' : s).toUpperCase()
  .replace(/[^A-Z0-9]+/g, ' ').trim();

/* Phone is the reliable handle; name+address catches the ones where the
   customer typed a different number for the same delivery. */
function customerKey(o) {
  const ph = normPhone(o.phone);
  if (ph.length >= 9) return 'P:' + ph;
  const em = String(o.email || '').trim().toLowerCase();
  if (em) return 'E:' + em;
  return 'N:' + normText(o.name) + '|' + normText(o.address).slice(0, 24);
}

/* Two orders belong together if the phone matches, or the email, or the name
   and address both match. Linking them transitively catches the case where the
   customer typed a different number the second time. */
function groupCustomers(orders) {
  const parent = orders.map((_, i) => i);
  const find = a => { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; };
  const union = (a, b) => { a = find(a); b = find(b); if (a !== b) parent[b] = a; };

  const byPhone = new Map(), byEmail = new Map(), byNameAddr = new Map();
  orders.forEach((o, i) => {
    const ph = normPhone(o.phone);
    if (ph.length >= 9) { if (byPhone.has(ph)) union(byPhone.get(ph), i); else byPhone.set(ph, i); }
    const em = String(o.email || '').trim().toLowerCase();
    if (em) { if (byEmail.has(em)) union(byEmail.get(em), i); else byEmail.set(em, i); }
    const na = normText(o.name) + '|' + normText(o.address);
    if (normText(o.name) && normText(o.address)) {
      if (byNameAddr.has(na)) union(byNameAddr.get(na), i); else byNameAddr.set(na, i);
    }
  });

  const buckets = new Map();
  orders.forEach((o, i) => {
    const r = find(i);
    if (!buckets.has(r)) buckets.set(r, []);
    buckets.get(r).push(o);
  });

  return [...buckets.values()].filter(list => list.length > 1).map(list => {
    const f = list[0];
    const sameAddr = list.every(o => normText(o.address) === normText(f.address));
    const sameName = list.every(o => normText(o.name) === normText(f.name));
    const sameCity = list.every(o => areaKey(o.city) === areaKey(f.city));
    return {
      key: customerKey(f), orders: list,
      name: f.name, phone: f.phone, address: f.address, city: f.city, email: f.email,
      count: list.length,
      cod: list.reduce((s, o) => s + (o.codFinal != null ? o.codFinal : o.cod), 0),
      qty: list.reduce((s, o) => s + (o.qty || 0), 0),
      ids: list.map(o => o.id),
      sure: sameAddr && sameName && sameCity,
      warn: !sameAddr ? 'address alag hai' : !sameCity ? 'city alag hai'
            : !sameName ? 'naam alag hai' : ''
    };
  }).sort((a, b) => b.count - a.count);
}

/* Turn the groups the user kept switched on into single parcels. */
function applyMerges(orders, groups, settings) {
  const cfg = settings || {};
  const merged = [];
  const drop = new Set();
  for (const g of groups) {
    const s = cfg[g.key];
    const on = s ? s.on !== false : g.sure;      // confident groups merge by default
    if (!on) continue;
    const f = g.orders[0];
    const ship = s && s.ship !== undefined && s.ship !== '' ? Number(s.ship) || 0 : 0;
    const base = g.orders.reduce((t, o) => t + (o.codFinal != null ? o.codFinal : o.cod), 0);
    const cod = s && s.cod !== undefined && s.cod !== null && s.cod !== ''
      ? Number(s.cod) || 0 : base + ship;
    const parcel = Object.assign({}, f, {
      id: f.id,
      mergedIds: g.orders.map(o => o.id),
      mergedFrom: g.key,
      mergedCount: g.orders.length,
      qty: g.orders.reduce((t, o) => t + (o.qty || 0), 0),
      items: g.orders.reduce((t, o) => t.concat(o.items || []), []),
      cod: base,
      codFinal: cod,
      shipping: ship
    });
    parcel.itemText = parcel.items.join(' | ');
    merged.push(parcel);
    g.orders.forEach(o => drop.add(o.id));
  }
  const kept = orders.filter(o => !drop.has(o.id));
  return { list: kept.concat(merged), mergedCount: merged.length,
           savedParcels: [...drop].length - merged.length };
}

/* ===================================================================
   CUSTOMER HISTORY
   Kept so a customer who has caused returns before can be flagged the
   next time they order.
   =================================================================== */

function rememberCustomers(book, orders, day) {
  const date = day || new Date().toISOString().slice(0, 10);
  for (const o of orders) {
    const k = customerKey(o);
    const c = book[k] || (book[k] = { key: k, name: o.name, phone: o.phone,
      flag: '', note: '', orders: [] });
    c.name = o.name || c.name;
    c.phone = o.phone || c.phone;
    if (!c.orders.some(x => x.id === o.id)) {
      c.orders.push({ id: o.id, date, city: o.city, cod: o.cod });
      if (c.orders.length > 60) c.orders = c.orders.slice(-60);
    }
  }
  return book;
}

/* Orders booked before today's batch — that is what makes them a repeat. */
function customerStatus(book, o, batchIds) {
  const c = book[customerKey(o)];
  if (!c) return { flag: '', past: 0 };
  const ids = batchIds || new Set();
  const past = c.orders.filter(x => !ids.has(x.id)).length;
  return { flag: c.flag || '', past, note: c.note || '', name: c.name, key: c.key };
}


/* ===================================================================
   FEEDBACK LIST
   A customer added by hand, before they have ever ordered here. When an
   order matches on phone, email or name+address, it is flagged.
   =================================================================== */

function makeEntry(f) {
  return { id: uid('f'), name: (f.name||'').trim(), phone: (f.phone||'').trim(),
    email: (f.email||'').trim(), address: (f.address||'').trim(),
    kind: f.kind || 'risk', note: (f.note || '').trim(),
    added: f.added || new Date().toISOString().slice(0, 10) };
}

function matchEntry(entry, o) {
  const ph = normPhone(entry.phone);
  if (ph.length >= 9 && ph === normPhone(o.phone)) return 'phone';
  const em = (entry.email || '').trim().toLowerCase();
  if (em && em === String(o.email || '').trim().toLowerCase()) return 'email';
  const en = normText(entry.name), ea = normText(entry.address);
  if (en && ea && en === normText(o.name) && ea === normText(o.address)) return 'name';
  return '';
}

/* Every feedback entry that applies to this order. */
function matchFeedback(list, o) {
  const out = [];
  for (const e of (list || [])) {
    const how = matchEntry(e, o);
    if (how) out.push({ entry: e, how });
  }
  return out;
}

function feedbackFromCSV(text) {
  const { headers, rows } = parseTable(text);
  const at = { name: colIndex(headers, 'Name', 'Customer', 'Customer Name'),
    phone: colIndex(headers, 'Phone', 'Mobile', 'Contact', 'Contact Number'),
    email: colIndex(headers, 'Email'),
    address: colIndex(headers, 'Address', 'Address1'),
    kind: colIndex(headers, 'Kind', 'Type', 'Mark'),
    note: colIndex(headers, 'Note', 'Comment', 'Remarks', 'Reason') };
  if (at.name === -1 && at.phone === -1 && at.email === -1) {
    throw new Error('Name, Phone ya Email column chahiye');
  }
  const g = (r, k) => (at[k] === -1 ? '' : String(r[at[k]] == null ? '' : r[at[k]]).trim());
  return rows.map(r => makeEntry({ name: g(r,'name'), phone: g(r,'phone'),
    email: g(r,'email'), address: g(r,'address'),
    kind: /watch/i.test(g(r,'kind')) ? 'watch' : 'risk', note: g(r,'note') }))
    .filter(e => e.name || e.phone || e.email);
}

/* ===================================================================
   BASES
   The numbers the user keeps about each company. They are typed in or
   uploaded - the app does not invent them - and can be turned into the
   percentage split.
   =================================================================== */

const BASE_FIELDS = [
  { key: 'delivered', label: 'Delivered %',   dir: 'up',   def: 85 },
  { key: 'returned',  label: 'Return %',      dir: 'down', def: 15 },
  { key: 'payDays',   label: 'Payment days',  dir: 'down', def: 10 },
  { key: 'cost',      label: 'Cost / parcel', dir: 'down', def: 150 }
];

const defaultBases = () => {
  const b = {};
  BASE_FIELDS.forEach(f => { b[f.key] = f.def; });
  b.weight = {};
  return b;
};

/* Weights say how much each number matters. All zero = bases ignored. */
const defaultWeights = () => ({ delivered: 3, returned: 2, payDays: 1, cost: 1 });

/* Turn each company's numbers into a 0..1 score, then into percentages. */
function scoreFromBases(companies, weights, opt) {
  const W = Object.assign(defaultWeights(), weights || {});
  const vals = {};
  BASE_FIELDS.forEach(f => {
    vals[f.key] = companies.map(c => {
      const v = (c.bases || {})[f.key];
      return v === '' || v == null || isNaN(v) ? null : Number(v);
    });
  });
  const scores = companies.map(() => 0);
  let used = 0;
  BASE_FIELDS.forEach(f => {
    const wgt = Number(W[f.key]) || 0;
    if (!wgt) return;
    const col = vals[f.key];
    const present = col.filter(v => v != null);
    if (present.length < 2) return;
    const lo = Math.min(...present), hi = Math.max(...present);
    used += wgt;
    companies.forEach((c, i) => {
      const v = col[i];
      let norm = v == null ? 0.5 : (hi === lo ? 0.5 : (v - lo) / (hi - lo));
      if (f.dir === 'down') norm = 1 - norm;
      scores[i] += wgt * norm;
    });
  });
  if (!used) return null;
  return scores.map(s => s / used);
}

function sharesFromBases(companies, weights, opt) {
  const sc = scoreFromBases(companies, weights, opt);
  if (!sc) return null;
  const o = opt || {};
  const floor = o.minShare == null ? 10 : Number(o.minShare);
  const cap = o.maxShare == null ? 70 : Number(o.maxShare);
  const sharp = Number(o.sharpness) || 3;
  const best = Math.max(...sc);
  const raw = sc.map(s => Math.exp((s - best) * sharp * 3));
  return roundShares(clampShares(raw, floor, cap, 100));
}

function basesToCSV(companies) {
  return toCSV({ headers: ['Company'].concat(BASE_FIELDS.map(f => f.label)),
    rows: companies.map(c => [c.name].concat(BASE_FIELDS.map(f => {
      const v = (c.bases || {})[f.key]; return v == null ? '' : v; }))) });
}

function basesFromCSV(text, companies) {
  const { headers, rows } = parseTable(text);
  const nameCol = colIndex(headers, 'Company', 'Courier', 'Name');
  if (nameCol === -1) throw new Error('"Company" column nahi mila');
  const at = {};
  BASE_FIELDS.forEach(f => { at[f.key] = colIndex(headers, f.label, f.key); });
  let n = 0;
  for (const r of rows) {
    const nm = normText(r[nameCol]);
    const c = companies.find(x => normText(x.name) === nm);
    if (!c) continue;
    c.bases = c.bases || {};
    BASE_FIELDS.forEach(f => {
      if (at[f.key] === -1) return;
      const raw = String(r[at[f.key]] == null ? '' : r[at[f.key]]).replace('%','').trim();
      if (raw === '') return;
      const v = Number(raw);
      if (!isNaN(v)) c.bases[f.key] = v;
    });
    n++;
  }
  if (!n) throw new Error('Kisi company ka naam match nahi hua');
  return n;
}


/* ===================================================================
   FILE DECODING
   Excel on Windows saves CSV as windows-1252, not UTF-8. Reading such a
   file as UTF-8 turns "HUNZA-NAGAR" (en dash) into a broken character,
   so fall back when a strict UTF-8 decode fails.
   =================================================================== */
function decodeBytes(buf) {
  const bytes = new Uint8Array(buf);
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  } catch (e) {
    try { return new TextDecoder('windows-1252').decode(bytes); }
    catch (e2) { return new TextDecoder('utf-8').decode(bytes); }
  }
}

/* ===================================================================
   AREA GROUPING
   Trax lists localities; Daewoo and PostEx list whole cities. They must
   NOT be merged - a locality stays its own bookable area. This only
   works out which city to file it under for display.
   =================================================================== */

/* Longest city name first, and an area that IS a city is its own parent.
   That is what keeps DERA GHAZI KHAN out of GHAZI, and CHOTA LAHORE out
   of LAHORE (both are cities in their own right). */
function groupAreas(areas, vocab, overrides) {
  const cities = [...new Set((vocab || []).map(v => areaKey(v)))]
    .filter(c => c.length > 4).sort((a, b) => b.length - a.length);
  const isCity = new Set(cities);
  const ov = overrides || {};
  const out = new Map();
  for (const a of areas) {
    let parent = ov[a.key];
    if (!parent) {
      if (isCity.has(a.key)) parent = a.key;
      else {
        parent = cities.find(c =>
          new RegExp('(^|[^A-Z0-9])' + c.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') +
                     '([^A-Z0-9]|$)').test(a.key)) || '';
      }
    }
    const key = parent || '~OTHER';
    if (!out.has(key)) out.set(key, { parent: key, label: parent || 'Other areas', items: [] });
    out.get(key).items.push(a);
  }
  return [...out.values()].sort((a, b) => {
    if (a.parent === '~OTHER') return 1;
    if (b.parent === '~OTHER') return -1;
    return b.items.length - a.items.length || a.parent.localeCompare(b.parent);
  });
}

/* ===================================================================
   ORDER HISTORY
   =================================================================== */

function pushHistory(hist, orders, companies, day) {
  const date = day || new Date().toISOString().slice(0, 10);
  const seen = new Set(hist.map(h => h.id + '|' + h.date));
  for (const o of orders) {
    const k = o.id + '|' + date;
    if (seen.has(k)) continue;
    seen.add(k);
    hist.push({ id: o.id, date, name: o.name, phone: o.phone,
      city: o.rawCity || o.city, cod: o.codFinal != null ? o.codFinal : o.cod,
      co: o.ci >= 0 && companies[o.ci] ? companies[o.ci].name : '',
      merged: o.mergedIds && o.mergedIds.length > 1 ? o.mergedIds.length : 0 });
  }
  if (hist.length > 40000) hist.splice(0, hist.length - 40000);
  return hist;
}

function searchHistory(hist, q, from, to) {
  const s = String(q || '').trim().toUpperCase();
  return hist.filter(h => {
    if (from && h.date < from) return false;
    if (to && h.date > to) return false;
    if (!s) return true;
    return (h.id || '').toUpperCase().includes(s)
        || (h.name || '').toUpperCase().includes(s)
        || (h.phone || '').includes(s)
        || (h.city || '').toUpperCase().includes(s);
  }).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
}

function historyByDay(hist) {
  const m = new Map();
  for (const h of hist) {
    if (!m.has(h.date)) m.set(h.date, { date: h.date, n: 0, cod: 0, co: {} });
    const e = m.get(h.date);
    e.n++; e.cod += Number(h.cod) || 0;
    if (h.co) e.co[h.co] = (e.co[h.co] || 0) + 1;
  }
  return [...m.values()].sort((a, b) => a.date < b.date ? 1 : -1);
}


/* ===================================================================
   CITY RESOLUTION
   A customer writes "LHR", "lahor" or "Lahore". All three must land on
   the same service area before routing happens.
   =================================================================== */

/* Order matters: an exact area wins, then a manual mapping the user made,
   then a short name, and only then a guess. */
function resolveCity(raw, ctx) {
  const k = areaKey(raw);
  if (!k) return { key: '', how: 'empty' };
  const known = ctx.known || new Set();
  const map = ctx.cityMap || {};
  const alias = ctx.alias || {};

  if (known.has(k)) return { key: k, how: 'exact' };
  if (map[k]) return { key: map[k], how: 'mapped' };
  if (alias[k] && known.has(alias[k])) return { key: alias[k], how: 'short' };

  /* strip a trailing qualifier customers add: "Lahore City", "Lahore Punjab" */
  const trimmed = k.replace(/\s+(CITY|PUNJAB|SINDH|KPK|BALOCHISTAN|PAKISTAN|CANTT?)$/, '');
  if (trimmed !== k) {
    if (known.has(trimmed)) return { key: trimmed, how: 'exact' };
    if (alias[trimmed] && known.has(alias[trimmed])) return { key: alias[trimmed], how: 'short' };
  }

  if (ctx.areas && ctx.areas.length) {
    const s = suggestAreas(k, ctx.areas, 2);
    if (s.length) {
      const clear = s.length < 2 || (s[0].score - s[1].score) >= 0.08;
      if (s[0].score >= 0.85 && clear) return { key: s[0].area.key, how: 'guess', score: s[0].score };
    }
  }
  return { key: k, how: 'unknown' };
}

const store = {

  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
let companies = store.get('d_companies', null) || seedCompanies();
function seedCompanies(){
  const cs = defaultCompanies();
  if(SEED.areas && SEED.member){
    cs.forEach(c=>{
      const idxs = SEED.member[c.name];
      if(idxs) c.areas = idxs.map(i=>({ key: areaKey(SEED.areas[i]), label: SEED.areas[i] }));
    });
  }
  return cs;
}

let rawOrders = [], groups = [];
let orders = [], routed = null, view = 'dispatch';

const PALETTE = ['#1D4ED8','#111827','#0D9488','#B45309','#BE185D','#7C3AED','#4D7C0F','#0369A1'];
const BYNAME = { DAEWOO:'#1D4ED8', POSTEX:'#111827', TRAX:'#0D9488' };
const colorOf = i => {
  const c = companies[i];
  const n = c && BYNAME[String(c.name).toUpperCase().replace(/[^A-Z]/g,'')];
  return n || PALETTE[i % PALETTE.length];
};

  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2000); }

const saveCo = ()=>{ store.set('d_companies',companies); reroute(); };

/* every area key any company serves */
function knownKeys(){
  const s=new Set();
  companies.forEach(c=>(c.areas||[]).forEach(a=>s.add(a.key)));
  return s;
}
const saveCod= ()=>{ store.set('d_cod',cod); reroute(); };

/* seed % shares from the priority list once, so behaviour matches day one */
if(mode==='share' && !Object.keys(shares).length){
  const n = companies.length;
  Object.keys(priority).forEach(k=>{
    const raw=[]; let any=false;
    for(let i=0;i<n;i++){ const p=priority[k][i];
      if(p==null||p===''||isNaN(p)){ raw.push(0); continue; } any=true;
      raw.push(Math.exp(-(Number(p)-1))); }
    if(any) shares[k]=roundShares(clampShares(raw,10,70,100));
  });
  store.set('d_shares',shares);
}

/* ========================================================== routing */
function route(){
  const n = companies.length;
  const rctx = { known: knownKeys(), cityMap, alias, areas: allAreas(companies) };
  rawOrders.forEach(o=>{
    o.codFinal = effectiveCod(o, cod);
    const r = resolveCity(o.city, rctx);
    o.rawCity = String(o.city||'').trim();
    o.resolved = r.key; o.how = r.how; o.score = r.score || 0;
  });
  groups = groupCustomers(rawOrders);
  orders = applyMerges(rawOrders, groups, mergeCfg).list;
  const resolvedMap = {};
  rawOrders.forEach(o=>{ if(o.resolved) resolvedMap[areaKey(o.city)] = o.resolved; });
  const ctx = { minShare:10, maxShare:70, companies,
                cityMap: Object.assign({}, resolvedMap, cityMap) };
  routed = mode==='priority'
    ? routeOrders(orders, priority, n, 'DEFAULT', ctx)
    : routeOrdersByShare(orders, shares, priority, n, 'DEFAULT', ctx);
  orders.forEach(o=>{ if(o.codFinal==null) o.codFinal = effectiveCod(o, cod); });
  /* a parcel moved by hand beats the percentage split */
  orders.forEach(o=>{
    const ids = (o.mergedIds && o.mergedIds.length) ? o.mergedIds : [o.id];
    const hit = ids.map(id=>special[id]).find(Boolean);
    o.forced = null;
    if(hit){
      /* company ids are generated per install, so fall back to the name —
         otherwise a restored backup would quietly lose these overrides */
      let ci = companies.findIndex(c=>c.id===hit.co);
      if(ci<0 && hit.coName) ci = companies.findIndex(c=>c.name===hit.coName);
      if(ci>=0){
        o.ci = ci;
        const c = companies[ci];
        let acc = hit.acc;
        if(acc && !c.accounts.some(a=>a.id===acc)){
          const byName = c.accounts.find(a=>a.name===hit.accName);
          acc = byName ? byName.id : null;
        }
        o.forced = { co:c.id, acc, coName:c.name, accName:hit.accName };
      }
    }
  });
  companies.forEach((c,i)=>{
    const mine = orders.filter(o=>o.ci===i);
    c._buckets = splitToAccounts(mine, c.accounts);
    mine.forEach(o=>{
      if(!o.forced || !o.forced.acc) return;
      const want = c.accounts.findIndex(a=>a.id===o.forced.acc);
      if(want<0) return;
      const from = c._buckets.findIndex(b=>b.indexOf(o)>=0);
      if(from===want || from<0) return;
      c._buckets[from].splice(c._buckets[from].indexOf(o),1);
      c._buckets[want].push(o);
      o.account = c.accounts[want].id;
    });
  });
}
function reroute(){ if(orders.length){ route(); } render(); }

/* Excel writes CSV as windows-1252; reading it as UTF-8 corrupts rows. */
const readFile = f => f.arrayBuffer().then(decodeBytes);

function handleFile(text){
  let kind='unknown';
  try{ kind = detectFileKind(text, names()).kind; }catch(e){}
  if(kind==='priority'){
    try{ const r=priorityFromCSV(text, names());
      if(!r.count) return toast('Is file mein koi city nahi');
      if(r.type==='share'){ mode='share'; Object.assign(shares,r.table); store.set('d_mode',mode); saveSh(); }
      else { mode='priority'; Object.assign(priority,r.table); store.set('d_mode',mode); savePr(); }
      toast(r.count+' cities load ho gayin');
    }catch(err){ toast(err.message||'CSV parh nahi saka'); }
    return;
  }
  if(kind!=='shopify') return toast('Yeh file pehchani nahi — Shopify export ya priority CSV chahiye');
  let list;
  try{ list = buildOrders(text, { prefer: settings.prefer }); }catch(e){ return toast(e.message); }
  if(!list.length) return toast('Koi order nahi mila');
  rawOrders = list;
  rememberCustomers(book, list); saveBk();
  route();
  pushHistory(hist, orders, companies); saveHist();
  view='dispatch'; render(); autoBackup();
}

/* ============================================================ views */
function setView(v){ view=v; render(); window.scrollTo({top:0});
  if(window.innerWidth<=900) $('#side').classList.remove('on'); }

function render(){ paintSide();
  if(view==='dispatch') return paintDispatch();
  if(view==='all') return paintAll();
  if(view==='priority') return paintPriority();
  if(view==='mapping') return paintMapping();
  if(view==='advance') return paintAdvance();
  if(view==='special') return paintSpecial();
  if(view==='merge') return paintMerge();
  if(view==='customers') return paintCustomers();
  if(view==='history') return paintHistory();
  if(view==='bases') return paintBases();
  if(view==='feedback') return paintFeedback();
  if(view.startsWith('co:')) return paintCompany(view.slice(3));
  if(view.startsWith('ac:')){ const [,cid,aid]=view.split(':'); return paintAccount(cid,aid); }
  paintDispatch();
}

const tally = () => companies.map((c,i)=>({
  n: orders.filter(o=>o.ci===i).length,
  cod: orders.filter(o=>o.ci===i).reduce((s,o)=>s+(o.cod||0),0) }));

function byCity(){
  const m=new Map();
  for(const o of orders){
    if(o.ci<0||o.ci==null) continue;
    if(!m.has(o.cityKey)) m.set(o.cityKey,{key:o.cityKey,city:o.city||o.cityKey,
      per:companies.map(()=>0),cod:companies.map(()=>0),total:0,vec:o.shareVec||null});
    const e=m.get(o.cityKey); e.per[o.ci]++; e.cod[o.ci]+=o.cod||0; e.total++;
  }
  return [...m.values()].sort((a,b)=>b.total-a.total);
}

/* The user wants to see the paid ORDERS, not the merged parcels. */
const prepaidOrders = () => rawOrders.filter(o=>o.fin==='paid');

/* Cities in this batch that appear in nobody's uploaded service-area list.
   Usually a spelling the customer got wrong, so it is worth reviewing even if a
   company without a list would still have taken it. */
function unmatchedCities(){
  if(!anyAreaLists(companies)) return [];
  const known=knownKeys();
  const m=new Map();
  for(const o of orders){
    const k=o.cityKey||areaKey(o.city);
    if(!k) continue;
    if(known.has(k)) continue;
    if(!m.has(k)) m.set(k,{key:k,typed:o.rawCity||o.city,n:0,cod:0,ids:[]});
    const e=m.get(k); e.n++; e.cod+=o.codFinal!=null?o.codFinal:o.cod;
    (o.mergedIds&&o.mergedIds.length?o.mergedIds:[o.id]).forEach(id=>e.ids.push(id));
  }
  return [...m.values()].sort((a,b)=>b.n-a.n);
}

let mapFind='';
/* cities that did not match letter-for-letter but were understood anyway */
function autoResolved(){
  const known=knownKeys(), m=new Map();
  for(const o of rawOrders){
    if(!o.resolved||o.how==='exact'||o.how==='unknown'||o.how==='empty') continue;
    if(o.how==='mapped') continue;              // those belong in the manual list
    const t=o.rawCity||o.city;
    if(!m.has(t)) m.set(t,{typed:t,key:o.resolved,how:o.how,score:o.score||0,n:0,co:{}});
    const e=m.get(t); e.n++;
    /* follow the order into whatever parcel it became, to see the company */
    const p=orders.find(x=>x.id===o.id||(x.mergedIds||[]).indexOf(o.id)>=0);
    const ci=p?p.ci:-1;
    e.co[ci]=(e.co[ci]||0)+1;
  }
  return [...m.values()].sort((a,b)=>b.n-a.n);
}
/* Every city you changed by hand — including ones not in today's batch. */
function manualMappings(){
  const perCity=new Map();
  for(const o of rawOrders){
    if(o.how!=='mapped') continue;
    const k=areaKey(o.city);
    if(!perCity.has(k)) perCity.set(k,{n:0,co:{}});
    const e=perCity.get(k); e.n++;
    const p=orders.find(x=>x.id===o.id||(x.mergedIds||[]).indexOf(o.id)>=0);
    const ci=p?p.ci:-1; e.co[ci]=(e.co[ci]||0)+1;
  }
  return Object.keys(cityMap).sort().map(k=>{
    const hit=perCity.get(k)||{n:0,co:{}};
    return { from:k, to:cityMap[k], n:hit.n, co:hit.co,
             inBatch:perCity.has(k), known:knownKeys().has(cityMap[k]) };
  }).sort((a,b)=>b.n-a.n || a.from.localeCompare(b.from));
}

const riskCount = () => {
  const seen=new Set();
  return rawOrders.filter(o=>{
    const k=customerKey(o);
    if(seen.has(k)) return false;
    const c=book[k];
    const flagged=(c&&c.flag==='risk')||matchFeedback(feedback,o).some(h=>h.entry.kind==='risk');
    if(flagged) seen.add(k);
    return flagged;
  }).length;
};

function flagOf(o){
  const batch=new Set(rawOrders.map(x=>x.id));
  const st=customerStatus(book,o,batch);
  const hits=matchFeedback(feedback,o);
  if(hits.length){
    const risk=hits.find(h=>h.entry.kind==='risk');
    st.flag = risk ? 'risk' : (st.flag||'watch');
    st.note = (risk||hits[0]).entry.note || st.note;
    st.via  = (risk||hits[0]).how;
    st.entry= (risk||hits[0]).entry;
  }
  return st;
}
const flaggedOrders = () => rawOrders.filter(o=>flagOf(o).flag);

let spQuery='', spFound=[];
function findOrders(text){
  const ids=String(text||'').split(/[\s,;]+/).map(x=>x.trim()).filter(Boolean);
  const out=[];
  for(const raw of ids){
    const want=raw.replace(/^#/,'').toUpperCase();
    const parcel=orders.find(o=>{
      const list=(o.mergedIds&&o.mergedIds.length)?o.mergedIds:[o.id];
      return list.some(id=>String(id).replace(/^#/,'').toUpperCase()===want);
    });
    const src=rawOrders.find(o=>String(o.id).replace(/^#/,'').toUpperCase()===want);
    out.push({ q:raw, parcel, src });
  }
  return out;
}

/* =========================================================== export */
function dl(name,text,mime){
  const b=new Blob(['\ufeff'+text],{type:(mime||'text/csv')+';charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
async function copyText(text,label){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){
    const ta=document.createElement('textarea'); ta.value=text;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let done=false; try{ done=document.execCommand('copy'); }catch(_){}
    document.body.removeChild(ta);
    if(!done) return toast('Copy nahi hua — CSV use karein');
  }
  toast(label);
}

/* ---------------------------------------------------- orders out of Fusion
 *
 * Shopify's own export is one row per line item with the customer filled in
 * only on the first row of each order, and buildOrders() is written against
 * exactly that. So rather than teach the router a second shape, the rows
 * Fusion already holds are written back out in Shopify's shape and handed to
 * the same door the file goes through. One parser, one set of rules, and the
 * day's orders need no file at all.
 */
function shopifyShape(orders){
  const head = ['Name','Email','Financial Status','Created at','Total',
                'Lineitem quantity','Lineitem name','Vendor',
                'Shipping Name','Shipping Address1','Shipping City','Shipping Phone',
                'Billing Name','Billing Address1','Billing City','Billing Phone'];

  const cell = v => {
    const s = v == null ? '' : String(v);
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };

  const lines = [head.map(cell).join(',')];

  orders.forEach(o => {
    const to = o.shipTo || {};
    const items = (o.lines && o.lines.length) ? o.lines : [{ title:'Order', qty:1 }];

    items.forEach((L, i) => {
      // Shopify fills the customer columns on the first row of an order only.
      const first = i === 0;
      lines.push([
        o.name || ('#' + (o.number || '')),
        first ? (o.email || '') : '',
        first ? (o.financial || '') : '',
        first ? (o.placedAt || '') : '',
        first ? (o.total == null ? '' : o.total) : '',
        L.qty == null ? 1 : L.qty,
        L.title || L.sku || '',
        first ? (o.shop || '') : '',
        first ? (to.name || o.customer || '') : '',
        first ? (to.address || '') : '',
        first ? (to.city || o.city || '') : '',
        first ? (to.phone || o.phone || '') : '',
        first ? (to.name || o.customer || '') : '',
        first ? (to.address || '') : '',
        first ? (to.city || o.city || '') : '',
        first ? (to.phone || o.phone || '') : ''
      ].map(cell).join(','));
    });
  });

  return lines.join('\r\n');
}

function wireFusion(){
  const b = $('#fromFusion');
  if(!b) return;

  b.addEventListener('click', () => {
    const note = $('#srcNote');
    b.disabled = true;
    const was = b.textContent;
    b.textContent = 'Laa raha hoon…';

    // Today and yesterday: a day's dispatch is usually made in the morning
    // for what came in overnight, and an order placed at 11pm is part of it.
    const d = new Date(), y = new Date();
    y.setDate(y.getDate() - 1);
    const iso = x => x.getFullYear() + '-' +
      String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0');

    const p = new URLSearchParams();
    p.set('from', iso(y)); p.set('to', iso(d));
    p.set('state', 'waiting');

    fetch('/api/shopify/orders?' + p.toString(), { cache:'no-store' })
      .then(r => r.json())
      .then(j => {
        b.disabled = false; b.textContent = was;
        if(j.error) return toast(j.error);

        const list = (j.orders || []).filter(o => !o.cancelled);
        if(!list.length){
          if(note) note.textContent =
            'Kal aur aaj ka koi naya Shopify order nahi mila. Shopify page se ' +
            'orders pehle le aayein, ya CSV chunein.';
          return;
        }
        handleFile(shopifyShape(list));
      })
      .catch(e => {
        b.disabled = false; b.textContent = was;
        toast(e.message || 'Fusion se orders nahi aaye');
      });
  });
}

      /* strong on its own AND clearly ahead of the runner-up, so a close call

      const clear = s.length<2 || (s[0].score - s[1].score) >= 0.08;
      if(s[0].score>=0.85 && clear){ cityMap[u.key]=s[0].area.key; n++; }
    });
    if(!n) return toast('Koi pakki match nahi mili — khud chunein');
    saveMap(); paintMapping(); toast(n+' cities khud map ho gayin'); return; }
  if(d.setparent!==undefined){
    const [cid,k]=d.setparent.split('|');
    const cur=areaParent[k]||'';
    const t=prompt('"'+k+'" kis city ke neeche rakhein?\n(khaali chhorein to app khud tay karegi)',cur);
    if(t===null) return;
    if(t.trim()==='') delete areaParent[k]; else areaParent[k]=areaKey(t);
    store.set('d_areaparent',areaParent); autoBackup(); paintCompany(cid); return; }
  if(d.hday!==undefined){ hFrom=d.hday; hTo=d.hday; hq=''; paintHistory(); return; }
  if(d.hreset!==undefined){ hq=''; hFrom=''; hTo=''; paintHistory(); return; }
  if(d.hcsv!==undefined){
    dl('order_history_'+stamp()+'.csv', toCSV({
      headers:['Date','Order','Customer','Phone','City','COD','Company'],
      rows:searchHistory(hist,hq,hFrom,hTo).map(h=>[h.date,h.id,h.name||'',h.phone||'',
        h.city||'',h.cod||0,h.co||''])}));
    return toast('History download'); }
  if(d.hclear!==undefined){
    if(!confirm('Poori history mit jayegi ('+hist.length+' orders). Backup le liya hai?')) return;
    hist=[]; saveHist(); paintHistory(); toast('History khaali'); return; }
  if(d.spset!==undefined){
    const [id,co]=d.spset.split('|');
    const c=companies.find(x=>x.id===co);
    special[id]=Object.assign({}, special[id], {co, coName:c?c.name:''});
    if(special[id].acc && c && !c.accounts.some(a=>a.id===special[id].acc)) delete special[id].acc;
    saveSpecial(); spFound=findOrders(spQuery); paintSpecial();
    toast(id+' → '+(c?c.name:'')); return; }
  if(d.spacc!==undefined){
    const [id,co,acc]=d.spacc.split('|');
    const c2=companies.find(x=>x.id===co);
    const a2=c2&&c2.accounts.find(x=>x.id===acc);
    special[id]=Object.assign({}, special[id],
      {co, acc, coName:c2?c2.name:'', accName:a2?a2.name:''});
    saveSpecial(); spFound=findOrders(spQuery); paintSpecial(); return; }
  if(d.spdel!==undefined){
    delete special[d.spdel]; saveSpecial(); spFound=findOrders(spQuery); paintSpecial();
    toast('Auto par wapas'); return; }
  if(d.spclear!==undefined){
    if(!confirm('Sab special orders auto par wapas chale jayenge. Aage barhein?')) return;
    special={}; saveSpecial(); spFound=findOrders(spQuery); paintSpecial(); return; }
  if(d.cust!==undefined) return showHistory(d.cust);
  if(d.crisk!==undefined){
    const c=book[d.crisk]; if(!c) return;
    c.flag = c.flag==='risk' ? '' : 'risk';
    saveBk(); autoBackup();
    if($('#panel').classList.contains('on')) showHistory(d.crisk);
    render(); toast(c.flag==='risk'?'Risk mark laga':'Risk hat gaya'); return;
  }
  if(d.dlbook!==undefined){
    dl('customers_'+stamp()+'.csv', toCSV({headers:['Name','Phone','Orders','Flag','Note','Last order'],
      rows:Object.values(book).map(c=>[c.name||'',c.phone||'',c.orders.length,c.flag||'',
        c.note||'',(c.orders[c.orders.length-1]||{}).date||''])}));
    return toast('Customers download'); }
  if(d.bkfolder!==undefined) return chooseBackupFolder();
  if(d.bknow!==undefined){ autoBackup(true).then(okd=>{
    if(!okd) dl('dispatch-backup-'+stamp()+'.json', snapshot(),'application/json'); }); return; }
  if(d.rmov!==undefined){ delete cod.overrides[d.rmov]; saveCod(); paintAdvance(); return; }
  if(d.mode!==undefined){ mode=d.mode; store.set('d_mode',mode); reroute(); return; }
  if(d.addcity!==undefined){
    const nm=prompt('City ka naam'); if(!nm) return;
    const k=nm.trim().toUpperCase(); if(!k) return;
    const T=mode==='share'?shares:priority;
    if(!T[k]) T[k]= mode==='share' ? roundShares(companies.map(()=>1))
                                   : companies.map((_,i)=>i+1);
    pFind=k; mode==='share'?saveSh():savePr(); toast(k+' add ho gaya'); return;
  }
  if(d.delcity!==undefined){
    const k=el.closest('tr').dataset.city;
    if(k==='DEFAULT') return toast('DEFAULT rehne dein — yeh baqi sab cities sambhalta hai');
    delete (mode==='share'?shares:priority)[k];
    mode==='share'?saveSh():savePr(); return;
  }
  if(d.pcsvout!==undefined){
    dl('priority_'+stamp()+'.csv',
      priorityToCSV(mode==='share'?shares:priority, names(), mode==='share'?'share':'priority'));
    return toast('CSV download — Excel mein edit kar ke wapas upload karein');
  }
  if(d.backup!==undefined){
    dl('dispatch_backup_'+stamp()+'.json',
      snapshot(), 'application/json');
    return toast('Backup download');
  }
});

document.addEventListener('input',e=>{
  const t=e.target, d=t.dataset;
  if(d.accname!==undefined){
    for(const c of companies){ const a=c.accounts.find(x=>x.id===d.accname);
      if(a){ a.name=t.value; store.set('d_companies',companies); paintSide(); return; } }
  }
  if(d.accshare!==undefined){
    for(const c of companies){ const a=c.accounts.find(x=>x.id===d.accshare);
      if(a){ a.share=Math.max(0,Number(t.value)||0); store.set('d_companies',companies);
        route(); paintSide(); refreshAccountNumbers(c); return; } }
  }
  if(d.acccount!==undefined){
    for(const c of companies){ const j=c.accounts.findIndex(x=>x.id===d.acccount);
      if(j>=0){
        const i=companies.indexOf(c);
        const total=orders.filter(o=>o.ci===i).length;
        const want=Math.max(0,Math.min(total,Number(t.value)||0));
        /* typed parcels become the share, the rest keep their relative weights */
        const others=c.accounts.filter((_,k)=>k!==j);
        const rest=100-(total?Math.round(want/total*100):0);
        const osum=others.reduce((s,a)=>s+(Number(a.share)||0),0);
        c.accounts[j].share=total?Math.round(want/total*100):0;
        others.forEach(a=>{ a.share=osum? Math.round((Number(a.share)||0)/osum*rest)
                                        : Math.round(rest/Math.max(1,others.length)); });
        const fix=100-c.accounts.reduce((s,a)=>s+a.share,0);
        if(fix) c.accounts[0].share=Math.max(0,c.accounts[0].share+fix);
        store.set('d_companies',companies); route(); paintSide(); refreshAccountNumbers(c);
        return; } }
  }
  if(d.base!==undefined){
    const [cid,key]=d.base.split('|'); const c=findCo(cid); if(!c) return;
    c.bases=c.bases||{};
    const v=t.value.trim();
    if(v==='') delete c.bases[key]; else c.bases[key]=Number(v)||0;
    store.set('d_companies',companies); autoBackup();
    const row=t.closest('tr'), i=companies.indexOf(c);
    const sh=sharesFromBases(companies,baseW,{minShare:10,maxShare:70});
    companies.forEach((_,j)=>{ const r=document.querySelectorAll('#view tbody tr')[j];
      if(r) r.lastElementChild.textContent = sh?sh[j]+'%':'—'; });
    return; }
  if(d.bw!==undefined){
    baseW[d.bw]=Math.max(0,Number(t.value)||0); saveBw();
    const sh=sharesFromBases(companies,baseW,{minShare:10,maxShare:70});
    companies.forEach((_,j)=>{ const r=document.querySelectorAll('#view tbody tr')[j];
      if(r) r.lastElementChild.textContent = sh?sh[j]+'%':'—'; });
    return; }
  if(d.fbf!==undefined){
    const [id,key]=d.fbf.split('|'); const f=feedback.find(x=>x.id===id);
    if(f){ f[key]=t.value; store.set('d_feedback',feedback); autoBackup(); paintSide(); }
    return; }
  if(d.ship!==undefined){
    mergeCfg[d.ship]=Object.assign({},mergeCfg[d.ship],{ship:t.value});
    store.set('d_merge',mergeCfg); route(); paintSide(); refreshMergeRow(d.ship); return; }
  if(d.mcod!==undefined){
    mergeCfg[d.mcod]=Object.assign({},mergeCfg[d.mcod],{cod:t.value});
    store.set('d_merge',mergeCfg); route(); paintSide(); return; }
  if(d.cnote!==undefined){
    const c=book[d.cnote]; if(c){ c.note=t.value; saveBk(); } return; }
  if(t.id==='custFind'){ custFind=t.value.trim(); return; }
  if(d.ov!==undefined){
    cod.overrides[d.ov]=Math.max(0,Number(t.value)||0);
    store.set('d_cod',cod); route(); paintSide(); return;
  }
  if(t.id==='areaFind'){ areaFind=t.value.trim();
    const cid=view.slice(3); paintCompany(cid);
    const f=$('#areaFind'); if(f){ f.focus(); f.setSelectionRange(f.value.length,f.value.length); }
    return; }
  if(t.id==='mapFind'){ mapFind=t.value.trim(); paintMapping(); return; }
  if(d.ci!==undefined){
    const tr=t.closest('tr'), k=tr.dataset.city, i=+d.ci, v=t.value.trim();
    const pct=mode==='share', T=pct?shares:priority;
    if(!T[k]) T[k]=companies.map(()=>pct?0:null);
    T[k][i]= v==='' ? (pct?0:null) : (isNaN(+v)?(pct?0:null):+v);
    if(pct){ const sm=companies.reduce((a,c,j)=>
        a+(servesArea(c,k)?(Number(T[k][j])||0):0),0);
      const cell=tr.children[companies.length+1];
      if(cell){ cell.textContent=sm; cell.style.color=sm===100?'var(--ok)':'var(--danger)'; }
      store.set('d_shares',shares);
    } else store.set('d_priority',priority);
    if(orders.length) route();
    paintSide();
  }
});

/* update just the numbers so the input the user is typing in keeps focus */
function refreshMergeRow(key){
  const g=groups.find(x=>x.key===key); if(!g) return;
  const tr=document.querySelector(`tr[data-grp="${CSS.escape(key)}"]`); if(!tr) return;
  const s=mergeCfg[key]||{};
  const ship=s.ship===undefined||s.ship===''?0:Number(s.ship)||0;
  const fin=s.cod===undefined||s.cod===null||s.cod===''?g.cod+ship:Number(s.cod)||0;
  const codIn=tr.querySelector('[data-mcod]');
  if(codIn&&document.activeElement!==codIn) codIn.placeholder=fin;
}

function refreshAccountNumbers(c){
  const j0=companies.indexOf(c);
  c.accounts.forEach((a,j)=>{
    const tr=document.querySelector(`tr[data-acc="${a.id}"]`); if(!tr) return;
    const list=(c._buckets&&c._buckets[j])||[];
    const sh=tr.querySelector('[data-accshare]'), ct=tr.querySelector('[data-acccount]');
    if(sh&&document.activeElement!==sh) sh.value=a.share;
    if(ct&&document.activeElement!==ct) ct.value=list.length;
    const codCell=tr.children[3];
    if(codCell) codCell.textContent=rs(list.reduce((s,o)=>s+(o.cod||0),0));
  });
  const sum=c.accounts.reduce((s,a)=>s+(Number(a.share)||0),0);
  const bal=document.querySelector('.bal');
  if(bal){ bal.textContent=sum+'%'+(sum===100?'':' — 100 hona chahiye');
    bal.className='bal '+(sum===100?'good':'bad'); }
}

      if(j.cod) cod=Object.assign({prepaidOn:true,prepaidCod:0,overrides:{}},j.cod);
      if(j.mergeCfg) mergeCfg=j.mergeCfg;
      if(j.book) book=j.book;
      if(j.feedback) feedback=j.feedback;
      if(j.baseW) baseW=Object.assign(defaultWeights(),j.baseW);
      if(j.areaParent) areaParent=j.areaParent;
      if(j.alias) alias=j.alias; store.set('d_alias',alias);
      if(j.special) special=j.special; store.set('d_special',special);
      if(j.hist) hist=j.hist;
      store.set('d_areaparent',areaParent); store.set('d_hist',hist);
      store.set('d_merge',mergeCfg); store.set('d_book',book);
      store.set('d_feedback',feedback); store.set('d_basew',baseW);
      store.set('d_citymap',cityMap); store.set('d_cod',cod);
      store.set('d_companies',companies); store.set('d_priority',priority);
      store.set('d_shares',shares); store.set('d_mode',mode); store.set('d_settings',settings);
      reroute(); toast('Backup restore ho gaya');
    }catch(err){ toast('Backup parh nahi saka'); }});
    e.target.value=''; }
});

/* Chrome can write to a folder the user picks, after a one-time permission.
   Anything else falls back to a manual download. */
const canAutoBackup = () => typeof window.showDirectoryPicker === 'function';

async function chooseBackupFolder(){
  if(!canAutoBackup())
    return toast('Yeh browser folder access nahi deta — Backup button use karein');
  try{
    backupDir = await window.showDirectoryPicker({ id:'dispatch', mode:'readwrite' });
    store.set('d_bkname', backupDir.name);
    toast('Backup folder set: '+backupDir.name);
    await autoBackup(true);
  }catch(e){ /* user cancelled */ }
}

function snapshot(){
  return JSON.stringify({ savedAt:new Date().toISOString(),
    companies, priority, shares, mode, settings, cityMap, cod, mergeCfg, book,
    feedback, baseW, areaParent, hist, alias, special }, null, 1);
}

async function autoBackup(force){
  if(!backupDir) return false;
  try{
    const perm = await backupDir.queryPermission({ mode:'readwrite' });
    if(perm!=='granted'){
      const ask = await backupDir.requestPermission({ mode:'readwrite' });
      if(ask!=='granted') return false;
    }
    const name = 'dispatch-backup-'+stamp()+'.json';
    const fh = await backupDir.getFileHandle(name, { create:true });
    const wr = await fh.createWritable();
    await wr.write(snapshot()); await wr.close();
    store.set('d_bklast', stamp());
    if(force) toast('Backup saved: '+name);
    return true;
  }catch(e){ return false; }
}
