<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fusion</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#222F34">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/tiles.css">
<style>
  /* The way in. Not a page of the books - a shelf of everything the app can do,
     with the four sections across the top.

     Going into a section is what opens its own rail, which nav.js builds from
     the same list these tiles come from. So this screen is for choosing and the
     rail is for working, and neither can drift from the other. */

  /* The window does not scroll. The page inside it does.
     
     The bar was sticky, then fixed, and both kept coming up short: sticky is
     only at the top while the page is, and fixed depends on nothing above it
     ever becoming a containing block. So the window itself is now held still -
     body is a column the height of the screen, the bar is the first row of it
     and the tiles are the second, and only that second row scrolls.
     
     The bar cannot be scrolled off, clipped or pushed about, because there is
     no scrolling going on around it at all. Nothing measures anything either. */
  html,body{height:100%}
  body{background:var(--page);margin:0;overflow:hidden;
    display:flex;flex-direction:column}

  /* The bar is the brand: slate, with the mark and name on the left, search in
     the middle, and the person on the right. */
  .fxbar{flex:0 0 auto;background:var(--ink,#222F34);z-index:5;
    box-shadow:0 8px 20px -14px rgba(0,0,0,.6)}
  .fxbarin{max-width:1180px;margin:0 auto;padding:11px 20px;display:grid;
    grid-template-columns:auto minmax(180px,420px) auto;justify-content:space-between;
    align-items:center;gap:18px;min-height:64px}
  .fxlogo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
  .fxlogo img{width:46px;height:auto;display:block}
  .fxlogo b{display:block;font:700 19px/1.1 var(--head);letter-spacing:.01em}
  .fxlogo i{display:block;font:600 11.5px var(--head);color:var(--aqua);margin-top:3px;font-style:normal}

  .fxfind{position:relative;display:block}
  .fxfind svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;
    fill:none;stroke:#9DB0B5;stroke-width:1.8;stroke-linecap:round;pointer-events:none}
  .fxfind input{width:100%;border:1px solid rgba(255,255,255,.14);border-radius:999px;
    padding:10px 16px 10px 38px;font:inherit;font-size:13.5px;background:rgba(255,255,255,.07);
    color:#fff}
  .fxfind input::placeholder{color:#8EA1A6}
  .fxfind input:focus{outline:0;background:#fff;color:#18212A;border-color:#fff}
  .fxfind input:focus::placeholder{color:#7C8E93}

  .fxbar .fxright{display:flex;gap:12px;align-items:center;justify-content:flex-end}
  .fxtool{width:38px;height:38px;border:0;background:rgba(255,255,255,.08);
    border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;
    color:#DDE8EA;padding:0;position:relative;flex:0 0 38px}
  .fxtool:hover{background:rgba(255,255,255,.16);color:var(--aqua)}
  .fxtool svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round}
  .fxtool .fxcount{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;
    border-radius:9px;background:var(--neg);color:#fff;font-size:10px;font-weight:600;
    line-height:17px;padding:0 4px;display:none;font-family:var(--mono);text-align:center}
  .fxtool .fxcount.on{display:block}

  /* The sections, as the second row of the bar. */
  .fxsecs{border-top:1px solid rgba(255,255,255,.09);background:rgba(0,0,0,.16)}
  .fxsecs nav{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;gap:6px;
    overflow-x:auto;scrollbar-width:none}
  .fxsecs nav::-webkit-scrollbar{display:none}
  .fxsecs a{position:relative;padding:13px 20px;font:600 13.5px var(--head);
    letter-spacing:.02em;color:#B9CACD;text-decoration:none;white-space:nowrap;
    transition:color .15s,background .15s}
  .fxsecs a:after{content:"";position:absolute;left:18px;right:18px;bottom:0;height:3px;
    border-radius:3px 3px 0 0;background:var(--aqua);transform:scaleX(0);transition:transform .18s}
  .fxsecs a:hover{color:#fff;background:rgba(255,255,255,.05)}
  .fxsecs a:hover:after{transform:scaleX(1)}

  .fxscroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden}
  .fxwrap{max-width:1180px;margin:0 auto;padding:0 20px 60px}

  .fxhead{font:700 16px var(--head);color:var(--ink-3);margin:28px 0 16px}

  @media (max-width:780px){
    .fxbarin{grid-template-columns:auto auto;gap:10px 12px;padding:10px 16px}
    .fxfind{grid-column:1 / -1;order:3}
    .fxlogo i{display:none}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="fxbar" id="bar">
  <div class="fxbarin">
    <a class="fxlogo" href="/">
      <img src="/logo.svg" alt="">
      <span><b>Fusion</b><i>AI-powered OS for e-commerce</i></span>
    </a>

    <label class="fxfind">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="seek" type="search" placeholder="Search" autocomplete="off" aria-label="Search">
    </label>

    <div class="fxright">
      <div id="co"></div>
      <button class="fxtool" id="btnBell" title="Notifications" aria-label="Notifications">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-2 8-2 8h16s-2-1-2-8"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        <span class="fxcount" id="bellN"></span>
      </button>
      <div id="me"></div>
    </div>
  </div>
  <div class="fxsecs"><nav id="secs" aria-label="Sections"></nav></div>
</div>


<main class="fxscroll" id="scroll">
  <div class="fxwrap">

    <h2 class="fxhead" id="apps">All apps</h2>
    <div id="board"></div>

  </div>
</main>

<div class="fxsheet" id="sheet">
  <div class="fxcard">
    <div class="fxcap"><span>Notifications</span><button id="bellClear">Clear all</button></div>
    <div class="fxlist" id="bellList"><div class="fxitem">Loading…</div></div>
  </div>
</div>

<script src="/nav.js"></script>
<script src="/tiles.js"></script>
<script>
"use strict";
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var find = '';

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // The sections, straight out of the list nav.js holds. Pressing one goes into
  // it, where that section's own rail is waiting.
  (function drawSections(){
    var all = (window.APP && window.APP.sections) || [];
    $('secs').innerHTML = all.map(function(s){
      return '<a href="' + esc(s.home) + '" data-sec="' + esc(s.key) + '">' + esc(s.label) + '</a>';
    }).join('');
    $('secs').querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){
        try { sessionStorage.setItem('fusion:section', a.getAttribute('data-sec')); } catch (e) {}
      });
    });
  })();

  function drawBoard(){
    if (window.FUSION) window.FUSION.draw($('board'), null, find);
  }

  /* ==================== the bar ==================== */

  // A launcher is opened to choose something, so it opens at the top of itself.
  // The scrolling happens inside .scroll now, so that is what is put back to
  // the top - and the browser is asked not to restore yesterday's position.
  try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
  $('scroll').scrollTop = 0;

  $('seek').addEventListener('input', function(){
    find = $('seek').value;
    drawBoard();
  });
  $('seek').addEventListener('keydown', function(e){
    if (e.key === 'Escape') { $('seek').value = ''; find = ''; drawBoard(); $('seek').blur(); }
  });

  /* The bell. The same list the rest of the app shows, read from the same place
     - this screen has no toolbar for nav.js to hang its own on. */
  function when(t){
    if (!t) return '';
    var d = new Date(t);
    return d.toLocaleDateString() + ' ' +
      d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  }
  function countBell(){
    fetch('/api/notifications/count', { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var n = Number(d && d.count) || 0;
        $('bellN').textContent = n > 9 ? '9+' : String(n);
        $('bellN').classList.toggle('on', n > 0);
      })
      .catch(function(){});
  }
  $('btnBell').addEventListener('click', function(){
    $('sheet').classList.add('on');
    $('bellList').innerHTML = '<div class="fxitem">Loading…</div>';
    fetch('/api/notifications', { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var rows = (d && d.items) || (d && d.notifications) || [];
        if (!rows.length) {
          $('bellList').innerHTML = '<div class="fxitem"><small>Nothing waiting.</small></div>';
        } else {
          $('bellList').innerHTML = rows.map(function(n){
            var body = '<b>' + esc(n.title || '') + '</b>' +
              '<small>' + esc(n.body || '') + '</small>';
            return '<div class="fxitem">' +
              (n.link ? '<a href="' + esc(n.link) + '">' + body + '</a>' : body) +
              '<small style="display:block;margin-top:3px;opacity:.7">' +
              esc(when(n.created_at || n.at)) + '</small></div>';
          }).join('');
        }
        return fetch('/api/notifications/read', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
        });
      })
      .then(function(){ countBell(); })
      .catch(function(){
        $('bellList').innerHTML = '<div class="fxitem"><small>Could not read them.</small></div>';
      });
  });
  $('sheet').addEventListener('click', function(e){
    if (e.target === $('sheet')) $('sheet').classList.remove('on');
  });
  $('bellClear').addEventListener('click', function(){
    fetch('/api/notifications/clear', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
    }).then(function(){
      $('bellList').innerHTML = '<div class="fxitem"><small>Nothing waiting.</small></div>';
      countBell();
    });
  });

  /* ==================== what the server knows ==================== */
  window.FUSION.companyChip($('co'), { dark: true });
  window.FUSION.profileMenu($('me'));

  // The tiles wait for the server, because which of them are this person's to
  // open is the server's answer, not the page's.
  window.APP.ready.then(function(s){
    drawBoard();
    countBell();
  }).catch(function(){ drawBoard(); });
})();
</script>
</body>
</html>
