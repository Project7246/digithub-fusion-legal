<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courier dashboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#222F34">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/courier-dashboard.css">
</head>
<body>

<div class="layout">
  <aside class="rail"></aside>

  <div class="main">
    <div class="topline">
      <div>
        <h1 id="ttl">Courier dashboard</h1>
        <div class="sub" id="sub">Loading…</div>
      </div>
    </div>

    <div class="shell">

      <div id="gate" class="gate hide">
        <img src="/logo.svg" alt="">
        <h2>Connect your QuickBooks company</h2>
        <p>Courier accounts are kept per company.</p>
        <button class="solid" id="btnConnect">Connect to QuickBooks</button>
      </div>

      <div id="body" class="hide">
        <div class="tabs" id="tabs">
          <button data-tab="parcels" class="on">Parcels</button>
          <button data-tab="finance">Finance</button>
          <button data-go="receipts">Receipts</button>
        </div>

        <div class="cdbar">
          <button data-days="0">Today</button>
          <button data-days="6">7 days</button>
          <button data-days="29">30 days</button>
          <button data-days="89">3 months</button>
          <button id="btnPick">Date range</button>
          <button id="btnDaewooSync" class="hide">Sync Daewoo reports</button>
          <span id="picker" class="hide">
            <input type="date" id="from">
            <input type="date" id="to">
          </span>
          <div class="find">
            <input id="track" placeholder="Tracking number">
            <button id="btnTrack">Find</button>
          </div>
        </div>
        <div class="fresh" id="fresh"></div>
        <div id="out"><div class="loading">Reading…</div></div>
      </div>

    </div>
  </div>
</div>

<div class="drawer" id="drawer">
  <div class="panel">
    <div class="hd"><b id="dTitle">Orders</b><span class="note" id="dNote"></span>
      <button class="dl" id="dCsv" title="Download what is open here as a CSV file">Download CSV</button>
      <button class="x" id="dClose">&times;</button></div>
    <div class="bd" id="dBody"></div>
  </div>
</div>

<script src="/nav.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  var chaseTimer = null;

  // Watch the asking finish. Every twenty seconds while anything is left, and
  // only while somebody is looking; when the count stops falling for a few
  // rounds it gives up rather than polling for ever.
  function watchChase(was){
    var stuck = 0;
    function look(){
      chaseTimer = null;
      if(document.hidden){ chaseTimer = setTimeout(look, 20000); return; }
      fetch('/api/courier/cpr-progress?account=' + encodeURIComponent(account || ''),
            { cache:'no-store' })
        .then(function(r){ return r.json(); })
        .then(function(pg){
          if(!pg || pg.error) return;
          var bar = document.querySelector('.chasebar');
          if(bar && pg.delivered){
            var left = pg.left, donePc = Math.round(100 * (pg.delivered - left) / pg.delivered);
            bar.innerHTML = '<div><b>' + n0(left) + '</b> of ' + n0(pg.delivered) +
              ' delivered parcels have not been matched to a CPR yet. Asking the courier now.</div>' +
              '<div class="meter" style="margin-top:9px"><i style="width:' + donePc +
              '%;background:#4FB477"></i></div>';
          }
          if(pg.left <= 0){ load(); return; }
          stuck = (pg.left >= was) ? stuck + 1 : 0;
          was = pg.left;
          if(stuck >= 5) return;               // nothing is moving; stop looking
          chaseTimer = setTimeout(look, 20000);
        })
        .catch(function(){ chaseTimer = setTimeout(look, 60000); });
    }
    chaseTimer = setTimeout(look, 20000);
  }

  var qs = new URLSearchParams(location.search);
  var account = qs.get('account');
  var courier = qs.get('courier');
  var daewooMode = courier === 'daewoo';
  var keeperTimer = null;
  // true while a catch-up is running, so the one quiet refresh happens when it
  // ends rather than every few seconds while it goes on
  var keeperRan = false;

  // The tab bar lives in the page, not in the drawn output, so it stays put
  // while the numbers underneath it reload. The choice is remembered.
  // Two tabs, and the line between them is the whole point: one is about
  // parcels and carries no money anywhere, the other is about money and
  // reads like a statement. Four tabs meant "where are my parcels" and
  // "what am I owed" were half-answered on every one of them.
  var TABS = ['parcels','finance'];
  // ?tab= wins, so coming back from the receipts page lands where it said.
  // A tab name saved by the old four-tab page is not one of these, so it
  // falls through to Parcels rather than opening nothing.
  var tab = qs.get('tab') || localStorage.getItem('cdTab');
  if(TABS.indexOf(tab) < 0) tab = 'parcels';

  function showTab(k){
    if(TABS.indexOf(k) < 0) k = 'parcels';
    tab = k;
    localStorage.setItem('cdTab', k);

    document.querySelectorAll('#tabs button[data-tab]').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-tab') === k);
    });
    document.querySelectorAll('#out .pane').forEach(function(p){
      p.classList.toggle('on', p.getAttribute('data-pane') === k);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.querySelectorAll('#tabs button[data-tab]').forEach(function(b){
    b.addEventListener('click', function(){ showTab(b.getAttribute('data-tab')); });
  });

  // Receipts belongs to this account like the others, but a receipt of two
  // thousand orders needs a page of its own rather than a panel.
  document.querySelectorAll('#tabs button[data-go]').forEach(function(b){
    b.addEventListener('click', function(){
      location.href = '/receipts' + (account ? '?account=' + account : '');
    });
  });

  showTab(tab);

  var COLOR = {
    delivered:'#1F9D5A', returned:'#C9453F', returning:'#E08A2E', transit:'#2F7DD1',
    booked:'#6A6FD6', unbooked:'#8A99A8', cancelled:'#95A3B1', expired:'#B07A2E',
    review:'#C98B1E', transferred:'#4AA3C7', lost:'#8B2F2F', damaged:'#8B2F6B',
    other:'#B6C1CC'
  };

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  var DASH = '\u2014';

  function ask(url, body){
    return fetch(url, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body || {})
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){
        if(!r.ok) throw new Error(j.error || ('Server said ' + r.status));
        return j;
      });
    });
  }
  function n0(v){ return Number(v||0).toLocaleString('en-US'); }
  function full(v){ return Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function money(v){
    var x = Number(v||0);
    if(Math.abs(x) >= 1000000) return (x/1000000).toFixed(2)+'M';
    if(Math.abs(x) >= 1000)    return (x/1000).toFixed(1)+'K';
    return x.toFixed(0);
  }
  function iso(d){ return d.toISOString().slice(0,10); }
  function monthStart(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'; }
  function short(day){ var p = String(day).split('-'); return p[2]+'/'+p[1]; }

  var fromEl = $('from'), toEl = $('to');

  function setRange(days){
    var t = new Date(), f = new Date();
    f.setDate(f.getDate() - days);
    fromEl.value = iso(f); toEl.value = iso(t);
  }

  // `noDates` is for the statement, which is all-time on purpose: a receivable
  // does not stop being owed because the date boxes say last week. Opening one
  // of those figures and getting a drawer cut to the dates on screen would show
  // fewer parcels than the figure it was opened from, which is how somebody
  // stops believing the figures.
  function params(extra, noDates){
    var p = new URLSearchParams();
    if(!noDates){ p.set('from', fromEl.value); p.set('to', toEl.value); }
    if(account) p.set('account', account);
    if(courier) p.set('courier', courier);
    Object.keys(extra||{}).forEach(function(k){ if(extra[k]) p.set(k, extra[k]); });
    return p.toString();
  }

  $('btnConnect').addEventListener('click', function(){ location.href = '/auth/connect'; });
  $('btnDaewooSync').addEventListener('click', function(){
    if(!account)return;
    var button=$('btnDaewooSync');button.disabled=true;button.textContent='Syncing portal reports…';
    fetch('/api/daewoo/sync',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({account:account,from:fromEl.value,to:toEl.value})})
      .then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Daewoo sync failed');return d;});})
      .then(function(d){$('fresh').textContent='Daewoo reports saved · '+n0(d.orders)+' parcels · '+n0(d.documents)+' source records';load();})
      .catch(function(e){$('fresh').textContent=e.message;})
      .finally(function(){button.disabled=false;button.textContent='Sync Daewoo reports';});
  });

  window.APP.ready.then(function(s){
    if(!s.connected){ $('gate').classList.remove('hide'); return; }
    $('body').classList.remove('hide');

    var sf = localStorage.getItem('cdFrom'), st = localStorage.getItem('cdTo');
    if(sf && st){ fromEl.value = sf; toEl.value = st; } else setRange(6);

    // Which pill is lit has to be worked out from the dates, not left on
    // whichever one the markup happened to carry: the page used to open with
    // "7 days" lit over whatever range was last saved, so pressing Today and
    // seeing nothing move looked like a dead button.
    function markPills(){
      var days = null;
      document.querySelectorAll('.cdbar button[data-days]').forEach(function(x){
        var f = new Date(), t = new Date();
        f.setDate(f.getDate() - Number(x.getAttribute('data-days')));
        var hit = (fromEl.value === iso(f) && toEl.value === iso(t));
        x.classList.toggle('on', hit);
        if(hit) days = x;
      });
      $('btnPick').classList.toggle('on', !days);
      if(!days) $('picker').classList.remove('hide');
    }

    document.querySelectorAll('.cdbar button[data-days]').forEach(function(b){
      b.addEventListener('click', function(){
        setRange(Number(b.getAttribute('data-days')));
        $('picker').classList.add('hide');
        markPills();
        load();
      });
    });

    // The two date boxes are behind a button, and changing either one reloads
    // on the spot. There is no Show: a button that only repeats what the boxes
    // already say is a button to forget to press.
    $('btnPick').addEventListener('click', function(){
      $('picker').classList.toggle('hide');
      if(!$('picker').classList.contains('hide')) fromEl.focus();
    });
    [fromEl, toEl].forEach(function(el){
      el.addEventListener('change', function(){
        if(!fromEl.value || !toEl.value) return;
        if(fromEl.value > toEl.value){
          if(el === fromEl) toEl.value = fromEl.value; else fromEl.value = toEl.value;
        }
        markPills();
        load();
      });
    });
    markPills();
    $('btnTrack').addEventListener('click', findOne);
    $('track').addEventListener('keydown', function(e){ if(e.key === 'Enter') findOne(); });

    head();
    load();
    watchKeeper();
  });

  // courier key -> the name a person knows it by, read once from the same list
  // the rail is built from, so a courier added there needs nothing here
  var COURIER_NAME = {};
  fetch('/api/courier/kinds', { cache:'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      (d.kinds || []).forEach(function(k){ COURIER_NAME[k.key] = k.name; });
    })
    .catch(function(){});

  // "postex" is not a word anybody says. Falls back to the key itself, so a
  // courier whose adapter was taken out still reads sensibly on old rows.
  function courierName(key){
    return COURIER_NAME[key] || String(key || '');
  }

  function head(){
    var p = new URLSearchParams();
    if(account) p.set('account', account);
    if(courier) p.set('courier', courier);
    fetch('/api/courier/scope?'+p.toString(), { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error) return;
        $('ttl').textContent = d.title || 'Courier dashboard';
        $('sub').textContent = d.sub || '';
        if(d.courier==='daewoo'){
          daewooMode=true;TABS.push('source');$('btnDaewooSync').classList.remove('hide');
          var tabButton=document.createElement('button');tabButton.setAttribute('data-tab','source');tabButton.textContent='Invoices';
          $('tabs').insertBefore(tabButton,$('tabs').querySelector('[data-go]'));
          tabButton.addEventListener('click',function(){showTab('source');load();});
        }
      })
      .catch(function(){});
  }

  /* ---------- the quiet catch-up, so you can see it is current ---------- */

  function watchKeeper(){
    if(document.hidden){
      if(keeperTimer) clearTimeout(keeperTimer);
      keeperTimer = setTimeout(watchKeeper, 60000);
      return;
    }
    fetch('/api/courier/keeper', { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var el = $('fresh');
        if(d.running){
          el.innerHTML = 'Catching up with the courier\u2026';
          keeperRan = true;
          // Only the one-line status is watched while it runs. It used to call
          // load() here as well, every eight seconds, and load() blanks the
          // page down to "Reading\u2026" - so the whole screen was thrown away and
          // rebuilt every few seconds for as long as the sweep lasted, with
          // any open tab, drawer and scroll position going with it. The catch
          // up is background work: it may say so, and nothing more.
          if(keeperTimer) clearTimeout(keeperTimer);
          keeperTimer = setTimeout(watchKeeper, 8000);
          return;
        }
        if(d.finishedAt){
          el.innerHTML = '<b>Up to date</b> \u00b7 last checked ' +
            new Date(d.finishedAt).toLocaleTimeString();
        }
        // It has just finished, so the figures on screen are one sweep old:
        // read them again **once**, quietly, without blanking the page.
        if(keeperRan){ keeperRan = false; load(true); }
        // Nothing is running, so there is nothing to watch closely. A minute
        // apart was close enough to Neon's five-minute sleep that one open
        // dashboard kept the database awake all day; five minutes lets it
        // sleep in between, and a tab in the background does not ask at all.
        if(keeperTimer) clearTimeout(keeperTimer);
        keeperTimer = setTimeout(watchKeeper, 5 * 60000);
      })
      .catch(function(){});
  }

  /* ---------- the page ---------- */

  var live = null;

  // `quiet` is a background read: it leaves whatever is on screen alone until
  // the new figures are in hand, and if it fails it says nothing and keeps the
  // last good screen. A read nobody asked for must not blank the page, and must
  // not report its own failure over figures that are still perfectly readable.
  function load(quiet){
    localStorage.setItem('cdFrom', fromEl.value);
    localStorage.setItem('cdTo', toEl.value);
    if(tab==='source'&&daewooMode){loadDaewooSource(quiet);return;}
    if(!quiet) $('out').innerHTML = '<div class="loading">Reading\u2026</div>';

    Promise.all([
      fetch('/api/courier/dash?'+params(), { cache:'no-store' }).then(function(r){ return r.json(); }),
      // receipts come from the courier's own portal now, not our order table
      fetch('/api/receipts/recent?'+new URLSearchParams({
        account: account || '', courier: courier || '', limit: 6
      }).toString(), { cache:'no-store' }).then(function(r){ return r.json(); }),
      fetch('/api/courier/pickups?'+params({ limit: 8 }), { cache:'no-store' })
        .then(function(r){ return r.json(); })
    ])
    .then(function(all){
      var d = all[0];
      if(d.error){
        if(!quiet) $('out').innerHTML = '<div class="msg">'+esc(d.error)+'</div>';
        return;
      }
      live = d;
      draw(d, all[1].cprs || [], all[2].days || []);
    })
    .catch(function(e){
      if(!quiet) $('out').innerHTML = '<div class="msg">'+esc(e.message)+'</div>';
    });
  }

  function loadDaewooSource(quiet){
    if(!quiet)$('out').innerHTML='<div class="loading">Loading saved Daewoo invoices…</div>';
    var p=new URLSearchParams({account:account||'',from:fromEl.value,to:toEl.value});
    fetch('/api/daewoo/stored?'+p.toString(),{cache:'no-store'}).then(function(r){return r.json().then(function(d){if(!r.ok)throw new Error(d.error||'Could not read Daewoo records');return d;});})
      .then(function(d){renderDaewooSource(d.sourceReports||[]);})
      .catch(function(e){if(!quiet)$('out').innerHTML='<div class="msg">'+esc(e.message)+'</div>';});
  }

  function renderDaewooSource(rows){
    var kinds=[['all','All source records'],['cod-cpr','COD / CPR invoices'],['cod-cpr-detail','Invoice parcel details'],['payment-report','Payment reports'],['delivery-charge','Delivery charges'],['tax','Tax / withholding']];
    var selected=localStorage.getItem('daewooSourceKind')||'all';
    function show(){
      var filtered=selected==='all'?rows:rows.filter(function(r){return r.kind===selected;});
      var columns={
        'cod-cpr':['invoice_no','invoice_date','invoice_period_start_date','invoice_period_end_date','TotalCODAmount','TotalServiceCharges','TotalReimbursementAmount'],
        'cod-cpr-detail':['invoice_no','booking_id','Barcode','amount_cod','amount_wr','RST_Amt','RWHT_Amt'],
        'payment-report':['Payment_invoice_no','invoice_status','booking_id','BarCode','AmountPaid2'],
        'delivery-charge':['Service_invoice_no','invoice_no','booking_id','Barcode','amount_wr'],
        'tax':['invoice_no','booking_id','Barcode','RST_Amt','RWHT_Amt']
      };
      var html='<div class="subtabs">'+kinds.map(function(k){return '<button data-dkind="'+k[0]+'"'+(selected===k[0]?' class="on"':'')+'>'+esc(k[1])+'</button>';}).join('')+'</div>'+
        '<div class="box"><h3>Daewoo source records <span class="aside">'+n0(filtered.length)+' saved in Fusion</span></h3><div class="note">Source documents stay separate. A COD or charge invoice is not proof that a bank payment was received.</div>';
      if(!filtered.length)html+='<div class="note">No saved records for this period yet. Use Sync Daewoo reports above.</div>';
      else{
        html+='<div style="overflow:auto"><table class="t"><thead><tr><th>Type</th><th>Reference</th>';
        var fields=['invoice_no','invoice_date','invoice_period_start_date','invoice_period_end_date','booking_id','Barcode','Payment_invoice_no','Service_invoice_no','invoice_status','TotalCODAmount','TotalServiceCharges','TotalReimbursementAmount','amount_cod','amount_wr','AmountPaid2','RST_Amt','RWHT_Amt'];
        html+=fields.map(function(f){return '<th>'+esc(f.replace(/_/g,' '))+'</th>';}).join('')+'</tr></thead><tbody>';
        filtered.forEach(function(r){var p=r.payload||{};html+='<tr><td>'+esc(r.kind)+'</td><td>'+esc(r.reference)+'</td>'+fields.map(function(f){return '<td>'+esc(p[f]==null?'':String(p[f]))+'</td>';}).join('')+'</tr>';});
        html+='</tbody></table></div>';
      }
      html+='</div>';$('out').innerHTML=html;
      document.querySelectorAll('#out button[data-dkind]').forEach(function(b){b.addEventListener('click',function(){selected=b.getAttribute('data-dkind');localStorage.setItem('daewooSourceKind',selected);show();});});
    }
    show();
  }

  function donut(done, total, colDone, colRest){
    var R = 46, C = 2*Math.PI*R;
    var part = total ? C * (done/total) : 0;
    return '<svg width="128" height="128" viewBox="0 0 130 130">' +
      '<circle cx="65" cy="65" r="'+R+'" fill="none" stroke="'+colRest+'" stroke-width="19"></circle>' +
      (part ? '<circle cx="65" cy="65" r="'+R+'" fill="none" stroke="'+colDone+'" stroke-width="19" ' +
        'stroke-dasharray="'+part.toFixed(2)+' '+(C-part).toFixed(2)+'" ' +
        'transform="rotate(-90 65 65)"></circle>' : '') +
      '<text x="65" y="63" text-anchor="middle" font-size="17" font-weight="600" fill="#123">' +
        n0(done) + '</text>' +
      '<text x="65" y="80" text-anchor="middle" font-size="10" fill="#8A99A8">of ' + n0(total) + '</text>' +
      '</svg>';
  }

  // three bars a day: booked, delivered, returned
  function dayChart(days){
    if(!days.length) return '<div class="note">No days in this range.</div>';

    var W = 700, H = 250, PL = 46, PR = 14, PT = 14, PB = 34;
    var iw = W-PL-PR, ih = H-PT-PB;

    var max = 0;
    days.forEach(function(d){
      max = Math.max(max, d.booked, d.delivered, d.returned);
    });
    if(!max) max = 1;

    var slot = iw/days.length;
    var bw = Math.max(2, (slot - 6) / 3);
    var svg = '';

    for(var i=0;i<=4;i++){
      var y = PT + ih - (ih*i/4);
      svg += '<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="#EEF3F8"></line>';
      svg += '<text x="'+(PL-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="#9AA8B6">'+n0(Math.round(max*i/4))+'</text>';
    }

    days.forEach(function(d, i){
      var x0 = PL + i*slot + 3;

      // Parcels, not money. This chart lives on the Parcels tab, and what a
      // day was worth is the Finance tab's question - it was in the tooltip,
      // which is the kind of place money leaks back onto a page that is
      // supposed to be free of it.
      function bar(n, off, fill, label){
        if(!n) return '';
        var h = ih * (n/max);
        return '<rect x="'+(x0+off*bw).toFixed(1)+'" y="'+(PT+ih-h).toFixed(1)+'" ' +
               'width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+fill+'" rx="1.5">' +
               '<title>'+esc(d.day)+' \u00b7 '+label+': '+n0(n)+' parcels</title></rect>';
      }

      svg += bar(d.booked,    0, '#9EC9EE', 'booked');
      svg += bar(d.delivered, 1, '#1F9D5A', 'delivered');
      svg += bar(d.returned,  2, '#E48B85', 'returned');

      if(days.length <= 16 || i % Math.ceil(days.length/14) === 0){
        svg += '<text x="'+(x0 + bw*1.5).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" ' +
               'font-size="10" fill="#9AA8B6">'+esc(short(d.day))+'</text>';
      }
    });

    return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+svg+'</svg>' +
      '<div class="note"><span style="color:#9EC9EE">\u25AE</span> booked &nbsp; ' +
      '<span style="color:#1F9D5A">\u25AE</span> delivered &nbsp; ' +
      '<span style="color:#E48B85">\u25AE</span> returned</div>';
  }

  // the same two marks the receipts page uses - green when the money agreed,
  // amber when it did not, a hundred rupees either way being rounding
  function cprBadges(c){
    var out = '';
    if(c.dcJournalId) out += '<span class="cpill ok">posted DC</span> ';

    if(c.qbPaymentId){
      var gap = (c.expected == null || c.received == null)
        ? null : Math.abs(c.expected - c.received);
      out += (gap === null || gap <= 100)
        ? '<span class="cpill ok">received</span>'
        : '<span class="cpill wait">off by ' + full(gap) + '</span>';
    }

    return out || '<span class="cpill grey">not yet</span>';
  }

  function card(k, v, n, cls){
    return '<div class="card' + (cls ? ' '+cls : '') + '"><div class="k">' + esc(k) + '</div>' +
           '<div class="v">' + esc(v) + '</div><div class="n">' + esc(n) + '</div></div>';
  }

  /* ---------- small pieces the panels are built from ---------- */

  function pct(part, whole){ return whole ? (100 * part / whole) : 0; }
  function pc(v){ return (Math.round(v * 10) / 10) + '%'; }

  // green when it is going well, amber when it is slipping, red when it is not
  function gradeColour(rate){
    return rate >= 90 ? '#1F9D5A' : (rate >= 75 ? '#C98B1E' : '#C9453F');
  }

  function meter(parts){
    var total = parts.reduce(function(a, p){ return a + p.n; }, 0) || 1;
    return '<div class="meter" style="display:flex">' + parts.map(function(p){
      return '<i style="background:' + p.c + ';width:' +
             (100 * p.n / total).toFixed(2) + '%"></i>';
    }).join('') + '</div>';
  }

  function legend(parts){
    return '<div class="legend">' + parts.filter(function(p){ return p.n; })
      .map(function(p){
        return '<span><span class="sw" style="background:' + p.c + '"></span>' +
               esc(p.l) + ' <b>' + n0(p.n) + '</b></span>';
      }).join('') + '</div>';
  }

  // every panel can send you to the tab that explains it
  // The arrow on a tile used to carry you to another tab. With two tabs the
  // tile and the table it summarises are on the same one, so it would have
  // been a button that did nothing - it scrolls down to that table instead,
  // which is what somebody pressing it wanted either way.
  function more(where, words){
    return '<button class="more" data-jump="' + where + '">' + esc(words) + ' →</button>';
  }

  function panel(title, right, body, cls){
    return '<div class="p' + (cls ? ' ' + cls : '') + '"><h4>' + esc(title) +
           (right ? '<span class="rt">' + right + '</span>' : '') + '</h4>' + body + '</div>';
  }

  function draw(d, cprs, picks){
    var t = d.totals, st = d.statuses || [], days = d.days || [];

    var g = {};
    (d.groups || []).forEach(function(x){ g[x.group] = x; });
    var gc = function(k){ return (g[k] || {}).count || 0; };
    var ga = function(k){ return (g[k] || {}).amount || 0; };

    // Everything is sorted into one of four tabs. Overview is a wall of small
    // panels - enough of each thing to know whether it needs looking at, and a
    // way through to the tab that shows it properly.
    var T = { parcels:'', finance:'' };

    var settled  = gc('delivered') + gc('returned');
    var lost     = gc('lost') + gc('damaged');
    var expired  = gc('expired') + gc('other');
    var moving   = gc('unbooked') + gc('booked') + gc('transit') +
                   gc('review') + gc('returning');

    var deliveredRate = pct(gc('delivered'), settled);
    var returnRate    = pct(gc('returned'), settled);
    var lostRate      = pct(lost, t.orders);

    /* ==================== Overview ==================== */

    // Everything on this page is about the parcels booked inside the chosen
    // dates - not parcels delivered in them. That is the only way a rate
    // means anything: of the ones handed over, this many arrived.

    var html = '';

    var collected = t.deliveredAmount;
    var owed      = t.pendingAmount;

    /* --- what the courier is holding that is ours --- */
    //
    // First thing on the page, because it is the first thing anybody wants
    // from it. Everything below says where parcels got to; this says what
    // that is worth and how much of it has actually come back.
    //
    // The figures are all-time, not the chosen dates: money owed on a parcel
    // delivered last month is still owed today, and a date filter is no
    // reason to leave it off the screen. The dates get their own line under
    // it so both questions are answered at once.
    var M = d.money || {};
    var P = M.range || {}, EV = M.ever || {};
    var C = M.cprRange || {}, CE = M.cprEver || {};
    var rec = M.receipts || null;

    /* ==================== Finance ====================

       Her formula, given in full and followed line for line:

         "jo parcels delivered hoy un ki payment ko minus krna h un sy jis ki
          payment cpr k through hmy received hoi - ye hmra net receivable ka
          formula h. ap taxes ko dkh lyna sth kiu k courier wly apna tax cut
          kr k hmy payment dyty hn. delivered parcals hn un ki payment cpr k
          through receive ni hoi - ye lazmi show krna."

       And the dates drive all of it: "today pr today ka result ay ga, 7 days
       pr 7 din k parcals or un k cprs ka record show ho ga." So the period is
       the first column and the one everything is read from; all time sits
       beside it for the running total.                                     */

    function amt(v, kind){
      if(v === null || v === undefined) return DASH;
      var t = full(Math.abs(Number(v) || 0));
      return kind === 'less' ? '<span class="neg">(' + t + ')</span>' : t;
    }
    function pcs(n){ return (n === null || n === undefined) ? '' : n0(n); }

    // Net receivable, in one place so the card and the table cannot disagree:
    // what the courier owes on receipts they have issued and not paid, plus
    // what they have delivered and issued no receipt for at all. `c` is the
    // CPR side of the period (cprRange / cprEver), `p` the parcel side
    // (range / ever). Rounded to the paisa, because a column of figures that
    // does not add up is a column nobody trusts.
    function netRec(c, p){
      return Math.round((((c && c.due) || 0) + ((p && p.noCpr) || 0)) * 100) / 100;
    }

    // one line: its parcels, this period, and all time
    // One count per column, because the two columns count different parcels.
    //
    // It used to be a single Parcels column beside a period amount and an
    // all-time amount, which on Today read "0 parcels - 0.00 - 8,136.00": a
    // count that belonged to one column sitting next to an amount from the
    // other. "tu kia ye paid ho gy jo net receiveble mn show ni ho rhy? ye
    // ksy pta chla?" - it could not be worked out from the row, and that is
    // the row's fault.
    function sRow(label, na, a, nb, b, cls, attr, kind){
      return '<tr' + (cls ? ' class="' + cls + '"' : '') + (attr || '') + '>' +
        '<td class="lbl">' + label + '</td>' +
        '<td class="n">' + pcs(na) + '</td>' +
        '<td class="v">' + amt(a, kind) + '</td>' +
        '<td class="n">' + pcs(nb) + '</td>' +
        '<td class="v">' + amt(b, kind) + '</td></tr>';
    }

    var F = { statement:'', months:'', ageing:'', carriers:'', cprs:'',
              pending:'', cities:'' };

    // Parcels is six screens too, for the same reason Finance is: one long
    // scroll of ten tables is not a picture of anything.
    var Pz = { summary:'', days:'', status:'', cities:'', handed:'', carriers:'' };

    var period = esc(d.from) + ' \u2192 ' + esc(d.to);

    /* ---------- Statement ---------- */

    F.statement +=
      '<div class="kpi">' +
        // The first card is a **balance** and is all-time on purpose: what
        // the courier still owes does not become nought because the dates on
        // screen say today. It said 0.00 over a table whose own closing line
        // said 8,136.00, which is one screen giving two answers.
        // One Net receivable, and its two halves named underneath it, because
        // they are two different kinds of figure and both have to be visible:
        //
        //   unpaid CPR net        the courier's OWN net on a receipt they have
        //                         issued but not paid - charges, GST and
        //                         withholding already taken off by them
        //   delivered, no CPR     a parcel they have delivered and said nothing
        //                         about yet. Fusion's estimate, COD less the
        //                         charges and tax on the parcel
        //
        // Added, they are what the courier is holding of ours. The card used to
        // show the first one alone under the label "Unpaid CPR net" while its
        // own footnote counted the parcels of both, so the amount and the count
        // underneath it were answers to two different questions.
        //
        // And it reads correctly as the CPRs get paid: that half goes to nought
        // and what is left standing is the delivered parcels nobody has issued
        // a receipt for.
        '<div class="k1 c-net open" data-due="1" data-alltime="1">' +
          '<div class="lb">Net receivable &middot; all time</div>' +
          '<div class="vl">' + full(netRec(CE, EV)) + '</div>' +
          '<div class="fn">Unpaid CPR ' + full(CE.due || 0) +
            ' &middot; delivered, no CPR ' + full(EV.noCpr || 0) + '</div>' +
          '<div class="fn">' + n0(EV.dueOrders || 0) + ' parcels not received' +
            (EV.noCpr ? ' &middot; the no-CPR half is an estimate' : '') + '</div>' +
        '</div>' +
        // **Delivery dates, not booking dates.** The figure beside it is cut
        // on the day the courier handed the parcel over - that is what the
        // whole statement is cut on - so opening it with the booking dates
        // showed a different set of parcels from the one it counted.
        '<div class="k1 c-cod open" data-group="delivered" data-dates="delivered">' +
          '<div class="lb">Delivered in this period</div>' +
          '<div class="vl">' + n0(P.delivered || 0) + '</div>' +
          '<div class="fn">COD ' + full(P.cod || 0) + '</div>' +
        '</div>' +
        // Charges and tax are earned on the parcels that were **delivered** in
        // this period, which is what the figure beside them is made of.
        // The same shape as the card above: one figure, and its two halves
        // named underneath. "ye lazmi h tax ka b pta chlna chahiy" - the tax
        // is a figure of its own and has to be readable as one, not hidden
        // inside a sum beside a plus sign.
        '<div class="k1 c-chg open" data-charges="1" data-dates="delivered">' +
          '<div class="lb">Charges &amp; tax &middot; this period</div>' +
          '<div class="vl">' + full(P.charges || 0) + '</div>' +
          '<div class="fn">This period &mdash; charges ' + full(P.fee || 0) +
            ' &middot; tax ' + full(P.tax || 0) + '</div>' +
          '<div class="fn">All time &mdash; charges ' + full(EV.fee || 0) +
            ' &middot; tax ' + full(EV.tax || 0) + '</div>' +
          // The same two halves as the Net receivable card above, so the one
          // question the total cannot answer is answered here: of the money
          // still to come, how much is the courier keeping, and on which half.
          '<div class="fn">Still to receive &mdash; unpaid CPR: charges ' +
            full(EV.pendingFee || 0) + ', tax ' + full(EV.pendingTax || 0) +
            ' &middot; no CPR: charges ' + full(EV.noCprFee || 0) +
            ', tax ' + full(EV.noCprTax || 0) + '</div>' +
        '</div>' +
        '<div class="k1 c-cpr open" data-due="0">' +
          '<div class="lb">Received on CPRs &middot; this period</div>' +
          '<div class="vl">' + full(P.got || 0) + '</div>' +
          '<div class="fn">' + n0(P.gotOrders || 0) + ' parcels</div>' +
        '</div>' +
      '</div>';

    // "In no CPR at all" is only true once the courier has been asked, and
    // PostEx names a receipt one parcel at a time. The asking is the app's
    // own job - the sweep does it and so does opening this tab - so the strip
    // only says how far it has got. It had a button on it for one version and
    // that was wrong: "asking by the courier krna zarori h? result khud show
    // kiu ni ho jata?"
    var prog = d.cprProgress || null;
    if (prog && prog.left > 0) {
      var pcDone = prog.delivered
        ? Math.round(100 * (prog.delivered - prog.left) / prog.delivered) : 0;
      F.statement +=
        '<div class="chasebar">' +
          '<div><b>' + n0(prog.left) + '</b> of ' + n0(prog.delivered) +
          ' delivered parcels have not been matched to a CPR yet \u2014 ' +
          'they count as not received until they are. Asking the courier now.</div>' +
          '<div class="meter" style="margin-top:9px"><i style="width:' + pcDone +
          '%;background:#4FB477"></i></div>' +
        '</div>';
    }

    F.statement +=
      '<div class="sched">' +
        '<h3>Delivered parcel estimate' +
          '<span class="aside">click a line for its parcels</span></h3>' +
        '<table class="stmt">' +
          '<tr><th>&nbsp;</th><th>Parcels</th><th>' + period + ' (Rs)</th>' +
            '<th>Parcels</th><th>All time (Rs)</th></tr>' +

          sRow('Parcels delivered &mdash; COD collected',
               P.delivered, P.cod, EV.delivered, EV.cod,
               'open', ' data-group="delivered" data-dates="delivered"') +
          sRow('Less: courier charges', null, P.fee, null, EV.fee,
               'less', '', 'less') +
          sRow('Less: tax', null, P.tax, null, EV.tax,
               'less', '', 'less') +
          sRow('<b>Receivable</b>', null, P.receivable, null, EV.receivable, 'sub') +
          sRow('Less: received on closed CPRs',
               P.gotOrders, P.got, EV.gotOrders, EV.got,
               'less open', ' data-due="0"', 'less') +
          sRow('<b>Estimated parcel balance</b>',
               P.dueOrders, P.due, EV.dueOrders, EV.due,
               'close open', ' data-due="1"') +
        '</table>' +
      '</div>';

    // The two halves of what is still to come, and the second one is the
    // point: "courier wly parcals ko delivered to show krwa dyty hn likn us
    // ki payment hmy ni dyty."
    F.statement +=
      '<div class="sched">' +
        '<h3>What is still to come' +
          '<span class="aside">' + period + '</span></h3>' +
        '<table class="stmt">' +
          '<tr><th>&nbsp;</th><th>Parcels</th><th>' + period + ' (Rs)</th>' +
            '<th>Parcels</th><th>All time (Rs)</th></tr>' +
          sRow('Unpaid CPR net (by CPR issue date)',
               C.dueCprs, C.due, CE.dueCprs, CE.due,
               'open', ' data-gotab="cprs"') +
          sRow('<b>In no CPR at all</b>',
               P.noCprOrders, P.noCpr, EV.noCprOrders, EV.noCpr,
               'open', ' data-nocpr="1"') +
          // The closing line is the two lines above it added up, and it was
          // not: it carried the parcel-based estimate of both halves, so a
          // table of three figures did not add up and the card over it said a
          // fourth thing. Same arithmetic as the card now - netRec().
          sRow('<b>Net receivable</b>',
               P.dueOrders, netRec(C, P), EV.dueOrders, netRec(CE, EV),
               'close open', ' data-due="1"') +
        '</table>' +
        (P.lateOrders
          ? '<div class="lateline click" data-late="1" style="margin-top:13px">' +
              '<b>' + n0(P.lateOrders) + ' parcels</b> delivered over a fortnight ' +
              'ago and still not received \u2014 ' + full(P.lateAmount) + '.' +
            '</div>'
          : '') +
      '</div>';

    // The CPRs the courier issued in these same dates.
    F.statement +=
      '<div class="sched">' +
        '<h3>CPRs issued in this period' +
          '<a href="/receipts' + (account ? '?account=' + account : '') +
          '">Open the receipt book</a></h3>' +
        '<table class="stmt">' +
          '<tr><th>&nbsp;</th><th>CPRs</th><th>' + period + ' (Rs)</th>' +
            '<th>CPRs</th><th>All time (Rs)</th></tr>' +
          '<tr class="open" data-gotab="cprs"><td class="lbl">Paid &mdash; status closed</td>' +
            '<td class="n">' + n0(C.paidCprs || 0) + '</td>' +
            '<td class="v">' + full(C.paid || 0) + '</td>' +
            '<td class="n">' + n0(CE.paidCprs || 0) + '</td>' +
            '<td class="v">' + full(CE.paid || 0) + '</td></tr>' +
          '<tr class="open" data-gotab="cprs"><td class="lbl">Not paid &mdash; open or approved</td>' +
            '<td class="n">' + n0(C.dueCprs || 0) + '</td>' +
            '<td class="v">' + full(C.due || 0) + '</td>' +
            '<td class="n">' + n0(CE.dueCprs || 0) + '</td>' +
            '<td class="v">' + full(CE.due || 0) + '</td></tr>' +
          '<tr class="close"><td class="lbl">CPRs issued</td>' +
            '<td class="n">' + n0(C.cprs || 0) + '</td>' +
            '<td class="v">' + full(C.worth || 0) + '</td>' +
            '<td class="n">' + n0(CE.cprs || 0) + '</td>' +
            '<td class="v">' + full(CE.worth || 0) + '</td></tr>' +
        '</table>' +
      '</div>';

    /* ---------- month by month ---------- */

    var MONTH_NAME = ['January','February','March','April','May','June','July',
                      'August','September','October','November','December'];
    function monthLabel(m){
      var bits = String(m || '').split('-');
      if(bits.length !== 2) return esc(m || '');
      return MONTH_NAME[Number(bits[1]) - 1] + ' ' + bits[0];
    }

    var ms = M.months || [];
    var mt = { parcels:0, cod:0, charges:0, receivable:0, got:0, pending:0,
               nocpr:0, due:0 };
    var mRows = ms.map(function(x){
      mt.parcels += x.parcels; mt.cod += x.cod; mt.charges += x.charges;
      mt.receivable += x.receivable; mt.got += x.got; mt.pending += x.pending;
      mt.nocpr += x.noCpr; mt.due += x.due;
      return '<tr class="open" data-month="' + esc(x.month) + '">' +
        '<td class="lbl">' + monthLabel(x.month) + '</td>' +
        '<td class="n">' + n0(x.parcels) + '</td>' +
        '<td class="v">' + full(x.cod) + '</td>' +
        '<td class="v"><span class="neg">(' + full(x.charges) + ')</span></td>' +
        '<td class="v">' + full(x.receivable) + '</td>' +
        '<td class="v"><span class="neg">(' + full(x.got) + ')</span></td>' +
        '<td class="n">' + (x.noCprOrders ? n0(x.noCprOrders) : '') + '</td>' +
        '<td class="v" style="font-weight:600">' + full(x.due) + '</td></tr>';
    }).join('');

    F.months +=
      '<div class="sched">' +
      '<h3>Monthly parcel estimates' +
        '<span class="aside">by the month the parcel was delivered</span></h3>' +
      '<table class="stmt">' +
      '<tr><th class="l">Month</th><th>Delivered</th><th>COD collected</th>' +
      '<th>Charges &amp; tax</th><th>Receivable</th><th>Received on CPR</th>' +
      '<th>In no CPR</th><th>Net receivable</th></tr>' +
      (mRows || '<tr><td colspan="8" style="color:var(--muted);padding:14px 10px">' +
        'Nothing delivered yet.</td></tr>') +
      (mRows
        ? '<tr class="close"><td class="lbl">Total</td>' +
          '<td class="n">' + n0(mt.parcels) + '</td>' +
          '<td class="v">' + full(mt.cod) + '</td>' +
          '<td class="v"><span class="neg">(' + full(mt.charges) + ')</span></td>' +
          '<td class="v">' + full(mt.receivable) + '</td>' +
          '<td class="v"><span class="neg">(' + full(mt.got) + ')</span></td>' +
          '<td class="n"></td>' +
          '<td class="v">' + full(mt.due) + '</td></tr>'
        : '') +
      '</table></div>';

    /* ---------- Ageing ---------- */

    var AGE_KEY = ['a1','a2','a3','a4','a5','a0'];
    var ageAll = EV.ageing || [];
    var ageMax = ageAll.reduce(function(m, x){ return Math.max(m, Math.abs(x.amount)); }, 0) || 1;
    var ageHtml = ageAll.map(function(x, i){
      if(!x.n) return '';
      var col = x.old ? '#C9453F' : (x.unknown ? '#B0B7BE' : (i >= 2 ? '#C98B1E' : '#4FB477'));
      return '<div class="a1" data-age="' + AGE_KEY[i] + '">' +
        '<div>' + esc(x.label) + '</div>' +
        '<div class="tr2"><i class="fl" style="width:' +
          (100 * Math.abs(x.amount) / ageMax).toFixed(1) + '%;background:' + col + '"></i></div>' +
        '<div class="nn">' + n0(x.n) + ' pcs</div>' +
        '<div class="vv">' + full(x.amount) + '</div></div>';
    }).join('');

    F.ageing +=
      '<div class="sched">' +
      '<h3>Age of unreceived parcels (estimated amounts)' +
        '<span class="aside">all time, from the day each parcel was delivered</span></h3>' +
      '<div class="age">' + (ageHtml ||
        '<div class="a1" style="cursor:default;color:var(--muted)">' +
        '<div>Nothing outstanding.</div><div></div><div></div><div></div></div>') +
        '<div class="a1 sum"><div>Net receivable</div><div></div>' +
          '<div class="nn">' + n0(EV.dueOrders || 0) + ' pcs</div>' +
          '<div class="vv">' + full(EV.due || 0) + '</div></div>' +
      '</div></div>';

    /* --- each courier company, by its own name --- */
    // Two PostEx accounts are one PostEx. On "All courier companies" this is
    // the table that was missing: who is carrying how much, and who is
    // sitting on our money.
    var cs = d.couriers || [];
    // one row for the company you are already standing in is noise - this
    // table earns its place on "All courier companies" and wherever more than
    // one of them is in the answer
    if (cs.length > 1 || (!account && !courier && cs.length)) {
      var cRows = cs.map(function(c){
        return '<tr class="open" data-courier="' + esc(c.courier) + '">' +
          '<td class="lbl"><b>' + esc(courierName(c.courier)) + '</b>' +
            (c.accounts > 1 ? ' <span class="why">' + c.accounts + ' accounts</span>' : '') +
          '</td>' +
          '<td class="n">' + n0(c.delivered) + '</td>' +
          '<td class="v">' + full(c.deliveredAmount) + '</td>' +
          '<td class="v"><span class="neg">(' + full(c.charges) + ')</span></td>' +
          '<td class="v">' + full(c.net) + '</td></tr>';
      }).join('');

      // The same companies twice with different columns, because they are
      // two different questions. Parcels: how many, how far, how often they
      // come back. Finance: what they collected, what they kept, what is
      // still ours.
      var cRowsP = cs.map(function(c){
        return '<tr class="click" data-courier="' + esc(c.courier) + '">' +
          '<td><b>' + esc(courierName(c.courier)) + '</b>' +
            (c.accounts > 1 ? ' <span class="aside">' + c.accounts + ' accounts</span>' : '') +
          '</td>' +
          '<td class="r">' + n0(c.orders) + '</td>' +
          '<td class="r">' + n0(c.delivered) + '</td>' +
          '<td class="r">' + n0(c.returned) + '</td>' +
          '<td class="r">' + n0(c.moving) + '</td>' +
          '<td class="r" style="color:' + gradeColour(c.successRate) + ';font-weight:600">' +
            (c.delivered + c.returned ? pc(c.successRate) : '\u2014') + '</td></tr>';
      }).join('');

      Pz.carriers += '<div class="box" style="margin-bottom:13px"><h3>' +
        'Each courier company' +
        '<span class="aside">' + esc(d.from) + ' &rarr; ' + esc(d.to) + '</span></h3>' +
        '<table class="t"><tr><th>Courier</th><th class="r">Parcels</th>' +
        '<th class="r">Delivered</th><th class="r">Returned</th><th class="r">Moving</th>' +
        '<th class="r">Rate</th></tr>' + cRowsP + '</table></div>';

      // One carrier is one debtor. This is the schedule that says which of
      // them is sitting on the money - PostEx against M&P by name, not two
      // PostEx accounts to be added up by eye.
      F.carriers += '<div class="sched">' +
        '<h3>By carrier' +
        '<span class="aside">' + esc(d.from) + ' &rarr; ' + esc(d.to) +
        ' &middot; click a carrier for its own statement</span></h3>' +
        '<table class="stmt"><tr><th>Carrier</th><th>Delivered</th>' +
        '<th>COD collected</th><th>Charges &amp; GST</th>' +
        '<th>Net of charges</th></tr>' + cRows + '</table></div>';
    }

    // Where a parcel got to, and what stopped it. Every group the courier can
    // report appears in exactly one row, so the rows add up to what was booked
    // - a stage that quietly swallowed a hundred parcels is worse than no
    // stage at all.
    var stages = [
      { l:'Picked up by the courier', n:t.picked, a:null, c:'#7FA8D4', picked:1,
        note:'stamped with a pickup date' },
      { l:'Not picked up yet', n:t.unpicked, a:t.unpickedAmount, c:'#C9B8A0', picked:0,
        note:'still with you, or never collected' }
    ];

    var ends = [
      { l:'Delivered',     g:'delivered',            c:'#4FB477' },
      { l:'Returned',      g:'returned',             c:'#E48B85' },
      { l:'Coming back',   g:'returning',            c:'#E9B0A0' },
      { l:'On the way',    g:'transit',              c:'#9EC9EE' },
      { l:'Under review',  g:'review',               c:'#B7A6D6' },
      { l:'Waiting to be booked', g:'unbooked,booked', c:'#C7CDD4' },
      { l:'Cancelled',     g:'cancelled',            c:'#A8A8A8' },
      { l:'Transferred',   g:'transferred',          c:'#8FB0A8' },
      { l:'Expired',       g:'expired',              c:'#B9A24A' },
      { l:'Lost or damaged', g:'lost,damaged',       c:'#B3453F' },
      { l:'Unknown status', g:'other',               c:'#D0A0C0' }
    ].map(function(x){
      var n = 0, a = 0;
      x.g.split(',').forEach(function(k){ n += gc(k); a += ga(k); });
      return { l:x.l, g:x.g, n:n, a:a, c:x.c };
    }).filter(function(x){ return x.n; });

    function stageRow(x){
      var attr = x.picked === undefined
        ? ' class="click" data-group="' + esc(x.g) + '"'
        : ' class="click" data-picked="' + x.picked + '"';
      return '<tr' + attr + '>' +
        '<td><span class="sw" style="background:' + x.c + '"></span>' + esc(x.l) +
        (x.note ? ' <span style="color:var(--faint)">· ' + esc(x.note) + '</span>' : '') +
        '</td>' +
        '<td class="r">' + n0(x.n) + '</td>' +
        '<td class="r">' + pc(pct(x.n, t.orders)) + '</td></tr>';
    }

    var trackRows =
      '<tr class="tot"><td>Booked in this range</td>' +
      '<td class="r">' + n0(t.orders) + '</td><td class="r">100%</td></tr>' +
      stages.map(stageRow).join('') +
      '<tr class="tot"><td colspan="3" style="font-size:10px;letter-spacing:.06em;' +
        'text-transform:uppercase;color:var(--faint)">Where they ended up</td></tr>' +
      ends.map(stageRow).join('');

    // Four figures, and each one a different question. There were eight
    // tiles here and most of them said what the table above already said:
    // "where the parcels went" was the stage table in a bar, "best and worst
    // city" was the city table in two numbers, and the delivery and return
    // rates are two sides of one figure.
    Pz.summary +=
      '<div class="kpi">' +
        '<div class="k1 c-cod open" data-group="">' +
          '<div class="lb">Booked in this period</div>' +
          '<div class="vl">' + n0(t.orders) + '</div>' +
          // **Not "handed to the courier".** Booking a parcel and the courier
          // collecting it are two different days and two different numbers -
          // 9,801 booked against 9,315 picked up on one account - and saying
          // the first is the second hides every parcel still sitting here.
          '<div class="fn">booked with the courier' +
            (t.unpicked ? ' &middot; ' + n0(t.unpicked) + ' not picked up yet' : '') +
            // Said out loud rather than folded into the line above it: these
            // were collected and the courier simply never stamped a date, and
            // calling them "not picked up" is a different and untrue thing.
            (t.pickedUndated ? ' &middot; ' + n0(t.pickedUndated) +
              ' collected, no pickup date given' : '') +
          '</div>' +
        '</div>' +
        '<div class="k1 c-ok open" data-group="delivered">' +
          '<div class="lb">Delivered</div>' +
          '<div class="vl">' + n0(gc('delivered')) + '</div>' +
          '<div class="fn">' + pc(deliveredRate) + ' of ' + n0(settled) + ' settled</div>' +
        '</div>' +
        '<div class="k1 c-bad open" data-group="returned">' +
          '<div class="lb">Returned</div>' +
          '<div class="vl">' + n0(gc('returned')) + '</div>' +
          '<div class="fn">' + pc(returnRate) + ' of settled</div>' +
        '</div>' +
        '<div class="k1 c-cpr open" data-group="unbooked,booked,transit,review,returning">' +
          '<div class="lb">Still moving</div>' +
          '<div class="vl">' + n0(moving) + '</div>' +
          '<div class="fn">not settled either way yet</div>' +
        '</div>' +
      '</div>';

    // Only when there is something wrong to show. An empty card saying
    // "nothing lost or damaged" is a card to read and then ignore.
    if (lost) {
      Pz.summary +=
        '<div class="kpi" style="margin-bottom:13px">' +
          '<div class="k1 c-bad open" data-group="lost,damaged">' +
            '<div class="lb">Lost or damaged</div>' +
            '<div class="vl">' + n0(lost) + '</div>' +
            '<div class="fn">' + pc(lostRate) + ' of booked &middot; to claim for</div>' +
          '</div>' +
        '</div>';
    }

    // No money column, deliberately. This table answers "where did the
    // parcels get to"; what each stage is worth is the Finance tab's
    // question, and it was on here too - which is how one page ends up
    // answering neither question properly.
    Pz.summary += '<div class="box" style="margin-bottom:13px"><h3>' +
      'What happened to them' +
      '<span class="aside">' + esc(d.from) + ' &rarr; ' + esc(d.to) + '</span>' +
      '<button class="dl" id="dlBooked">Download the lot</button></h3>' +
      '<table class="t"><tr><th>Stage</th><th class="r">Parcels</th>' +
      '<th class="r">Of booked</th></tr>' + trackRows +
      '</table></div>';

    var pickTotal = picks.reduce(function(a, p){ return a + p.parcels; }, 0);

    /* the chart and the newest deliveries belong with the orders, not the summary */
    Pz.days += '<div class="box" id="cd-days" style="margin-bottom:13px"><h3>Day by day' +
      '<span class="aside">' + esc(d.from) + ' → ' + esc(d.to) + '</span></h3>' +
      dayChart(days) + '</div>';

    var tx = (d.recent || []).map(function(o){
      return '<a href="#" data-find="' + esc(o.tracking) + '">' +
             '<div><div class="tk">' + esc(o.tracking) + '</div>' +
             '<div class="rf">' + esc(o.orderRef || '') + '</div></div>' +
             '<div><div class="dt">' + esc(o.on || '') + '</div></div></a>';
    }).join('');

    Pz.summary += '<div class="box" id="cd-recent" style="margin-bottom:13px"><h3>Latest deliveries' +
      '<span class="aside">newest first</span></h3>' +
      '<div class="tx">' + (tx || '<div class="note">Nothing yet.</div>') + '</div></div>';

    /* ==================== Orders ==================== */

    var cells = '<button class="cell tot" data-group=""><div class="l">All parcels</div>' +
                '<div class="n">' + n0(t.orders) + '</div>' +
                '<div class="m">booked in this range</div></button>';

    st.forEach(function(s){
      cells += '<button class="cell" data-status="' + esc(s.status) + '">' +
               '<div class="l">' + esc(s.status) + '</div>' +
               '<div class="n">' + n0(s.count) + '</div>' +
               '<div class="m">' + pc(pct(s.count, t.orders)) + ' of booked</div></button>';
    });

    Pz.status += '<div class="box" id="cd-status" style="margin-bottom:13px"><h3>Every status' +
                '<span class="aside">click any number to see the parcels</span></h3>' +
                '<div class="grid">' + cells + '</div></div>';

    var dayRows = '';
    var dt = { booked:0, picked:0, delivered:0, returned:0 };

    days.slice().reverse().forEach(function(x){
      if(!x.booked && !x.delivered && !x.returned && !x.picked) return;
      var s = x.delivered + x.returned;
      dayRows += '<tr><td class="mono">' + esc(x.day) + '</td>' +
                 '<td class="r">' + n0(x.booked) + '</td>' +
                 '<td class="r">' + n0(x.picked || 0) + '</td>' +
                 '<td class="r">' + n0(x.delivered) + '</td>' +
                 '<td class="r">' + n0(x.returned) + '</td>' +
                 '<td class="r">' + (s ? pc(pct(x.delivered, s)) : '—') + '</td></tr>';

      dt.booked += x.booked; dt.picked += (x.picked || 0);
      dt.delivered += x.delivered; dt.returned += x.returned;
    });

    var dts = dt.delivered + dt.returned;
    dayRows += '<tr class="tot"><td>Total</td>' +
               '<td class="r">' + n0(dt.booked) + '</td>' +
               '<td class="r">' + n0(dt.picked) + '</td>' +
               '<td class="r">' + n0(dt.delivered) + '</td>' +
               '<td class="r">' + n0(dt.returned) + '</td>' +
               '<td class="r">' + (dts ? pc(pct(dt.delivered, dts)) : '—') + '</td></tr>';

    Pz.days += '<div class="box" style="margin-bottom:13px"><h3>Every day, in numbers' +
                '<span class="aside">what happened on each day</span></h3>' +
                '<div style="max-height:360px;overflow:auto"><table class="t">' +
                '<tr><th>Day</th><th class="r">Booked that day</th>' +
                '<th class="r">Picked up that day</th>' +
                '<th class="r">Delivered that day</th>' +
                '<th class="r">Returned that day</th><th class="r">Rate</th></tr>' +
                dayRows + '</table></div></div>';

    var pickRows = picks.map(function(p){
      return '<tr class="click" data-pickup="' + esc(p.day) + '">' +
             '<td class="mono">' + esc(p.day) + '</td>' +
             '<td class="r">' + n0(p.parcels) + '</td>' +
             '<td class="r">' + n0(p.delivered) + '</td>' +
             '<td class="r">' + (p.parcels ? pc(pct(p.delivered, p.parcels)) : '—') +
             '</td></tr>';
    }).join('');

    Pz.handed += '<div class="box" id="cd-picked" style="margin-bottom:13px"><h3>Handed over' +
                '<a href="/pickups' + (account ? '?account='+account : '') +
                '">View every day</a></h3>' +
                '<table class="t"><tr><th>Day</th><th class="r">Parcels</th>' +
                '<th class="r">Delivered since</th>' +
                '<th class="r">Rate</th></tr>' +
                (pickRows || '<tr><td colspan="4" style="color:var(--muted)">' +
                  'Nothing picked up in this range.</td></tr>') +
                '</table></div>';

    /* ==================== Payments ==================== */

    // NEW means the courier has not paid this one out yet, CLOSED means it is
    // paid. The badge on the right is our own side of it.
    var cprRows = cprs.map(function(c){
      var s = String(c.status || '').toUpperCase();
      var scls = s === 'CLOSED' ? 'ok' : (s === 'NEW' || s === 'OPEN' ? 'wait' : 'grey');

      return '<tr class="click" data-goto="' + esc(c.remoteId) + '">' +
             '<td class="lbl mono">' + esc(c.cpr) + '</td>' +
             '<td class="lbl mono" style="width:auto">' + esc(c.createdOn || '') + '</td>' +
             '<td class="lbl" style="width:auto">' +
               '<span class="cpill ' + scls + '">' + esc(c.status || '—') + '</span></td>' +
             '<td class="v">' + full(c.netAmount) + '</td>' +
             '<td class="lbl" style="width:auto">' + cprBadges(c) + '</td></tr>';
    }).join('');

    /* ---------- the remittance side, and our own books ---------- */

    // The money chain used to be printed here a second time, once for all
    // time and once for the range, side by side - which is exactly what the
    // statement at the top now does in two columns. Two tables saying one
    // thing is how a page stops being read.

    // The CPR tab is the documents themselves - every CPR this courier has
    // issued, what it is worth, and whether it has been paid. The statement
    // works from the parcels; this is the paperwork behind it.
    if (CE.cprs) {
      F.cprs += '<div class="kpi">' +
        '<div class="k1 c-net open" data-cprs="due">' +
          '<div class="lb">Not paid &middot; open or approved</div>' +
          '<div class="vl">' + full(CE.due || 0) + '</div>' +
          '<div class="fn">' + n0(CE.dueCprs || 0) + ' of ' + n0(CE.cprs) + ' CPRs' +
          (CE.oldestDue ? ' &middot; oldest ' + esc(CE.oldestDue) : '') + '</div>' +
        '</div>' +
        '<div class="k1 c-cod open" data-cprs="paid">' +
          '<div class="lb">Paid &middot; closed</div>' +
          '<div class="vl">' + full(CE.paid || 0) + '</div>' +
          '<div class="fn">' + n0(CE.paidCprs || 0) + ' of ' + n0(CE.cprs) + ' CPRs</div>' +
        '</div>' +
        (rec && rec.notInBooks
          ? '<div class="k1 c-cpr open" data-cprs="unposted">' +
              '<div class="lb">Not in QuickBooks yet</div>' +
              '<div class="vl">' + full(rec.notInBooksAmount || 0) + '</div>' +
              '<div class="fn">' + n0(rec.notInBooks) + ' CPRs to post</div>' +
            '</div>'
          : '') +
      '</div>';

      if (rec && rec.receipts) {
        F.cprs += '<div class="sched">' +
          '<h3>Gross COD against QuickBooks' +
          '<a href="/receipts' + (account ? '?account=' + account : '') +
          '">Open the receipt book</a></h3>' +
          '<table class="stmt">' +
          '<tr><th>&nbsp;</th><th>CPRs</th><th>Amount (Rs)</th></tr>' +
          '<tr><td class="lbl">CPRs issued by the courier</td>' +
            '<td class="n">' + n0(rec.receipts) + '</td>' +
            '<td class="v">' + full(rec.worth) + '</td></tr>' +
          '<tr class="less"><td class="lbl">Less: posted in QuickBooks</td>' +
            '<td class="n">' + n0(rec.inBooks) + '</td>' +
            '<td class="v"><span class="neg">(' + full(rec.inBooksAmount) + ')</span></td></tr>' +
          '<tr class="close"><td class="lbl">Not in QuickBooks yet</td>' +
            '<td class="n">' + n0(rec.notInBooks) + '</td>' +
            '<td class="v">' + full(rec.notInBooksAmount) + '</td></tr>' +
          '</table></div>';
      }
    }

    var accs = d.accounts || [];
    if (accs.length > 1) {
      F.carriers += '<div class="sched">' +
        '<h3>By account' +
        '<span class="aside">one line per set of credentials</span></h3>' +
        '<table class="stmt"><tr><th>Account</th><th>Carrier</th>' +
        '<th>Parcels</th><th>Delivered</th>' +
        '<th>COD collected</th><th>Charges &amp; GST</th></tr>' +
        accs.map(function(a){
          return '<tr class="open" data-account="' + a.id + '">' +
            '<td class="lbl"><b>' + esc(a.label) + '</b></td>' +
            '<td class="lbl" style="width:auto">' + esc(courierName(a.courier)) + '</td>' +
            '<td class="n">' + n0(a.orders) + '</td>' +
            '<td class="n">' + n0(a.delivered) + '</td>' +
            '<td class="v">' + full(a.deliveredAmount) + '</td>' +
            '<td class="v"><span class="neg">(' + full(a.fee + a.tax) + ')</span></td></tr>';
        }).join('') + '</table></div>';
    }

    F.cprs += '<div class="sched" id="cd-receipts">' +
      '<h3>CPRs' +
      '<a href="/receipts' + (account ? '?account='+account : '') + '">Open the receipt book</a></h3>' +
      '<table class="stmt"><tr><th class="l">CPR no.</th><th class="l">Issued</th>' +
      '<th class="l">Status</th><th>Net amount (Rs)</th><th class="l">QuickBooks</th></tr>' +
      (cprRows || '<tr><td colspan="5" style="color:var(--muted);padding:14px 10px">' +
        'No CPR yet. <a href="/receipts' + (account ? '?account='+account : '') +
        '">Open the receipt book</a>.</td></tr>') +
      '</table></div>';

    // Delivered and returned are settled one way or the other. Everything
    // else is stock in the carrier's hands: money that has not been collected
    // at all yet, which is a different thing from money collected and not
    // remitted. Keeping the two apart is the whole reason this schedule is
    // not part of the statement above.
    var OWED = [
      { g:'unbooked',    label:'Not booked yet',        why:'still with you' },
      { g:'booked',      label:'Booked, awaiting pickup', why:'carrier has not collected it' },
      { g:'transit',     label:'In transit',            why:'on its way to the buyer' },
      { g:'review',      label:'Under verification',    why:'held by the carrier' },
      { g:'returning',   label:'Return in transit',     why:'coming back to you' },
      { g:'cancelled',   label:'Cancelled',             why:'' },
      { g:'transferred', label:'Transferred',           why:'' },
      { g:'expired',     label:'Expired',               why:'' },
      { g:'lost',        label:'Lost',                  why:'claim against the carrier' },
      { g:'damaged',     label:'Damaged',               why:'claim against the carrier' }
    ];

    var owedRows = '', owedCount = 0, owedAmount = 0;
    OWED.forEach(function(o){
      var x = g[o.g];
      if(!x || !x.count) return;
      owedCount += x.count; owedAmount += x.amount;
      owedRows += '<tr class="open" data-group="' + o.g + '">' +
                  '<td class="lbl">' + esc(o.label) +
                    (o.why ? '<span class="why">' + esc(o.why) + '</span>' : '') + '</td>' +
                  '<td class="n">' + n0(x.count) + '</td>' +
                  '<td class="v">' + full(x.amount) + '</td>' +
                  '<td class="n">' + pc(pct(x.count, t.orders)) + '</td></tr>';
    });

    if(owedRows){
      owedRows += '<tr class="close"><td class="lbl">Order value not yet collected</td>' +
                  '<td class="n">' + n0(owedCount) + '</td>' +
                  '<td class="v">' + full(owedAmount) + '</td>' +
                  '<td class="n">' + pc(pct(owedCount, t.orders)) + '</td></tr>';
    }

    F.pending += '<div class="sched" id="cd-notin">' +
      '<h3>Not collected yet' +
      '<span class="aside">' + esc(d.from) + ' &rarr; ' + esc(d.to) +
      ' &middot; click a line for its parcels</span></h3>' +
      '<table class="stmt"><tr><th>Where it stands</th><th>Parcels</th>' +
      '<th>Order value (Rs)</th><th>Of booked</th></tr>' +
      (owedRows || '<tr><td colspan="4" style="color:var(--muted);padding:14px 10px">' +
        'Every parcel booked in this range has settled one way or the other.</td></tr>') +
      '</table></div>';

    /* ==================== Cities ==================== */

    // This table is what decides which courier gets which city, so it holds
    // every number that bears on that - and only those. What each city is
    // worth is a finance question and has a table of its own below.
    var cityRows = (d.cities || []).map(function(c){
      return '<tr class="click" data-city="' + esc(c.city) + '">' +
             '<td>' + esc(c.city) + '</td>' +
             '<td class="r">' + n0(c.count) + '</td>' +
             '<td class="r">' + n0(c.delivered) + '</td>' +
             '<td class="r">' + n0(c.returned) + '</td>' +
             '<td class="r">' + n0(c.moving) + '</td>' +
             '<td class="r">' + (c.lost ? n0(c.lost) : '—') + '</td>' +
             '<td class="r" style="color:' + gradeColour(c.rate) + ';font-weight:600">' +
               (c.settled ? pc(c.rate) : '—') + '</td>' +
             '<td class="r">' + (c.settled ? pc(c.returnRate) : '—') + '</td></tr>';
    }).join('');

    Pz.cities += '<div class="box" id="cd-cities" style="margin-bottom:13px"><h3>Every city' +
      '<span class="aside">rate is delivered out of settled · click a row for the parcels' +
      '</span></h3>' +
      '<div style="max-height:560px;overflow:auto"><table class="t">' +
      '<tr><th>City</th><th class="r">Parcels</th><th class="r">Delivered</th>' +
      '<th class="r">Returned</th><th class="r">Moving</th><th class="r">Lost</th>' +
      '<th class="r">Rate</th><th class="r">Return %</th></tr>' +
      (cityRows || '<tr><td colspan="8" style="color:var(--muted)">No cities.</td></tr>') +
      '</table></div></div>';

    var cityMoney = (d.cities || []).slice()
      .sort(function(a, b){ return (b.amount || 0) - (a.amount || 0); })
      .map(function(c){
        return '<tr class="open" data-city="' + esc(c.city) + '">' +
               '<td class="lbl">' + esc(c.city) + '</td>' +
               '<td class="n">' + n0(c.delivered) + '</td>' +
               '<td class="v">' + full(c.amount) + '</td>' +
               '<td class="v"><span class="neg">(' + full(c.fee + c.tax) + ')</span></td>' +
               '<td class="v">' + full((c.amount || 0) - (c.fee || 0) - (c.tax || 0)) +
               '</td></tr>';
      }).join('');

    F.cities += '<div class="sched">' +
      '<h3>Order value by city' +
      '<span class="aside">largest first &middot; click a row for its parcels</span></h3>' +
      '<div style="max-height:420px;overflow:auto"><table class="stmt">' +
      '<tr><th>City</th><th>Parcels</th><th>Order value (Rs)</th>' +
      '<th>Charges &amp; GST</th><th>Net (Rs)</th></tr>' +
      (cityMoney || '<tr><td colspan="5" style="color:var(--muted);padding:14px 10px">' +
        'No cities in this range.</td></tr>') +
      '</table></div></div>';

    var cmax = 0;
    (d.cities || []).forEach(function(c){ if(c.count > cmax) cmax = c.count; });

    var bars = (d.cities || []).slice(0, 15).map(function(c){
      return '<div class="b"><span>' + esc(c.city) + '</span>' +
        '<span class="track"><span class="fill" style="background:' + gradeColour(c.rate) +
        ';width:' + (cmax ? 100*c.count/cmax : 0).toFixed(1) + '%"></span></span>' +
        '<span class="num">' + n0(c.count) + ' · ' + pc(c.rate) + '</span></div>';
    }).join('');

    Pz.cities += '<div class="box" style="margin-bottom:13px"><h3>Busiest cities' +
      '<span class="aside">bar is volume, colour is delivery rate</span></h3>' +
      '<div class="bars">' + (bars || '<div class="note">No cities.</div>') + '</div></div>';

    // Standing over every courier, or over one courier's accounts, the first
    // question is which account this is - so the breakdown by account opens the
    // overview rather than hiding at the foot of the cities tab. Inside a single
    // account there is nothing to break down and it is left off.
    if((d.accounts || []).length > 1 || !account){
      var wide = !account && !courier;   // every courier at once: say which
      var head = '<tr><th>Account</th>' + (wide ? '<th>Courier</th>' : '');
      var who = function(a){
        return '<td><a href="/courier-dash?account=' + a.id + '">' +
               esc(a.label) + '</a></td>' +
               (wide ? '<td>' + esc(COURIER_NAME[a.courier] || a.courier || '') + '</td>' : '');
      };

      var accP = (d.accounts || []).map(function(a){
        return '<tr>' + who(a) +
               '<td class="r">' + n0(a.orders) + '</td>' +
               '<td class="r">' + n0(a.delivered) + '</td>' +
               '<td class="r">' + n0(a.returned) + '</td>' +
               '<td class="r" style="color:' + gradeColour(a.successRate) +
                 ';font-weight:600">' + pc(a.successRate) + '</td></tr>';
      }).join('');

      Pz.carriers += '<div class="box"><h3>Accounts side by side' +
              '<span class="aside">every account on its own line, kept apart</span></h3>' +
              '<table class="t">' + head +
              '<th class="r">Parcels</th><th class="r">Delivered</th>' +
              '<th class="r">Returned</th><th class="r">Rate</th></tr>' +
              (accP || '<tr><td colspan="6" style="color:var(--muted)">No accounts.</td></tr>') +
              '</table></div>';

    }

    /* ==================== put it together ==================== */

    // Parcels, the same way: one table a screen.
    var PTABS = [
      { k:'summary',  l:'Summary' },
      { k:'days',     l:'Day by day' },
      { k:'status',   l:'Every status' },
      { k:'cities',   l:'Cities' },
      { k:'handed',   l:'Handed over' },
      { k:'carriers', l:'By carrier' }
    ].filter(function(x){ return Pz[x.k]; });

    if (PTABS.length) {
      var wantP = localStorage.getItem('cdParTab');
      if (!PTABS.some(function(x){ return x.k === wantP; })) wantP = PTABS[0].k;

      T.parcels =
        '<div class="subtabs">' + PTABS.map(function(x){
          return '<button data-ptab="' + x.k + '"' +
                 (x.k === wantP ? ' class="on"' : '') + '>' + esc(x.l) + '</button>';
        }).join('') + '</div>' +
        PTABS.map(function(x){
          return '<div class="fpane' + (x.k === wantP ? ' on' : '') +
                 '" data-ppane="' + x.k + '">' + Pz[x.k] + '</div>';
        }).join('');
    }

    // Finance is six screens, not one scroll. Said in as many words:
    // "finance ke tab ko itna complicated na banao... sab tab bhi to ban
    // sakte hain". One table at a time, and the one anybody opens first -
    // the statement - is the one that opens.
    var FTABS = [
      { k:'statement', l:'Statement' },
      { k:'months',    l:'By month' },
      { k:'ageing',    l:'Ageing' },
      { k:'carriers',  l:'By carrier' },
      { k:'cprs',      l:'CPRs' },
      { k:'pending',   l:'Not collected' },
      { k:'cities',    l:'Cities' }
    ].filter(function(x){ return F[x.k]; });

    if (FTABS.length) {
      var want = localStorage.getItem('cdFinTab');
      if (!FTABS.some(function(x){ return x.k === want; })) want = FTABS[0].k;

      T.finance =
        '<div class="subtabs">' + FTABS.map(function(x){
          return '<button data-ftab="' + x.k + '"' +
                 (x.k === want ? ' class="on"' : '') + '>' + esc(x.l) + '</button>';
        }).join('') + '</div>' +
        FTABS.map(function(x){
          return '<div class="fpane' + (x.k === want ? ' on' : '') +
                 '" data-fpane="' + x.k + '">' + F[x.k] + '</div>';
        }).join('');
    }

    ['parcels','finance'].forEach(function(k){
      html += '<div class="pane' + (k === tab ? ' on' : '') + '" data-pane="' + k + '">' +
              (T[k] || '<div class="box"><div class="note">Nothing here.</div></div>') +
              '</div>';
    });

    // This is MAX(seen_at) - the last time Fusion wrote any parcel in this
    // view - and `seen_at` is set to NOW() on every read from the courier. It
    // is not the newest order's own date, which is what it used to claim: a
    // sweep at 10:54 made it read "Newest order in the store: 10:54", so a
    // quiet morning looked like a shop that had just taken an order.
    if(t.lastSeen){
      html += '<div class="note">These parcels were last read from the courier: ' +
              esc(new Date(t.lastSeen).toLocaleString()) + '</div>';
    }

    $('out').innerHTML = html;

    // the red dot marks a tab that has something wrong sitting in it
    var dotOn = lost > 0;
    var ob = document.querySelector('#tabs button[data-tab="parcels"]');
    if(ob){
      var had = ob.querySelector('.dot');
      if(dotOn && !had) ob.insertAdjacentHTML('beforeend', '<span class="dot"></span>');
      if(!dotOn && had) had.remove();
    }

    /* ---------- what everything on the page does ---------- */

    var dl = document.getElementById('dlBooked');
    if(dl){
      dl.addEventListener('click', function(){
        location.href = '/api/courier/export?' + params();
      });
    }

    // the parcels sub-tabs
    $('out').querySelectorAll('button[data-ptab]').forEach(function(b){
      b.addEventListener('click', function(){
        var k = b.getAttribute('data-ptab');
        localStorage.setItem('cdParTab', k);
        $('out').querySelectorAll('button[data-ptab]').forEach(function(x){
          x.classList.toggle('on', x.getAttribute('data-ptab') === k);
        });
        $('out').querySelectorAll('.fpane[data-ppane]').forEach(function(x){
          x.classList.toggle('on', x.getAttribute('data-ppane') === k);
        });
      });
    });

    // the finance sub-tabs
    $('out').querySelectorAll('button[data-ftab]').forEach(function(b){
      b.addEventListener('click', function(){
        var k = b.getAttribute('data-ftab');
        localStorage.setItem('cdFinTab', k);
        $('out').querySelectorAll('button[data-ftab]').forEach(function(x){
          x.classList.toggle('on', x.getAttribute('data-ftab') === k);
        });
        $('out').querySelectorAll('.fpane[data-fpane]').forEach(function(x){
          x.classList.toggle('on', x.getAttribute('data-fpane') === k);
        });
      });
    });

    $('out').querySelectorAll('.more[data-jump]').forEach(function(b){
      b.addEventListener('click', function(){
        var el = document.getElementById(b.getAttribute('data-jump'));
        if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
      });
    });
    $('out').querySelectorAll('.cell').forEach(function(b){
      b.addEventListener('click', function(){
        openList({ status: b.getAttribute('data-status'), group: b.getAttribute('data-group') });
      });
    });
    // A row or a card can say which dates it was counted on. Everything on
    // the statement is cut on the day the courier delivered; everything on
    // Parcels is cut on the day it was booked. Opening one with the other's
    // dates is how a figure and its own list come to disagree.
    function datesFor(el, extra){
      var want = Object.assign({}, extra || {});
      if(el.getAttribute('data-dates') === 'delivered'){
        want.dfrom = fromEl.value;
        want.dto = toEl.value;
        want.allTime = true;          // drop the booking-date filter
      }
      return want;
    }

    $('out').querySelectorAll('tr[data-group]').forEach(function(tr){
      tr.addEventListener('click', function(){
        openList(datesFor(tr, {
          group: tr.getAttribute('data-group'),
          title: tr.cells[0] ? tr.cells[0].textContent : ''
        }));
      });
    });

    $('out').querySelectorAll('.k1[data-group]').forEach(function(el){
      el.addEventListener('click', function(){
        var lb = el.querySelector('.lb');
        openList(datesFor(el, {
          group: el.getAttribute('data-group'),
          title: lb ? lb.textContent : ''
        }));
      });
    });
    $('out').querySelectorAll('tr[data-picked]').forEach(function(tr){
      tr.addEventListener('click', function(){
        openList({
          picked: tr.getAttribute('data-picked'),
          title: tr.cells[0] ? tr.cells[0].textContent : ''
        });
      });
    });
    // Every money figure opens into its own parcels, and it opens into the
    // same period the figure was read from: the dates on screen, cut on the
    // delivery date, because that is what the figure was cut on.
    function moneyList(what, title){
      what.dfrom = fromEl.value;
      what.dto = toEl.value;
      // the dates go in as delivery dates, so the booking-date filter must
      // not come along as well or the drawer shows fewer than the figure did
      what.allTime = true;
      what.title = title;
      openList(what);
    }

    $('out').querySelectorAll('[data-due]').forEach(function(el){
      el.addEventListener('click', function(){
        var due = el.getAttribute('data-due');
        if (el.getAttribute('data-alltime') === '1') {
          openList({ due: due, allTime: true,
                     title: 'Net receivable \u2014 all time' });
          return;
        }
        moneyList({ due: due }, due === '1'
          ? 'Net receivable \u2014 delivered, not received'
          : 'Received on closed CPRs');
      });
    });
    // Charges and tax are earned on every parcel in the range, so the card
    // opens the range itself - the same parcels the figure was added up from.
    $('out').querySelectorAll('[data-charges]').forEach(function(el){
      el.addEventListener('click', function(){
        openList(datesFor(el, {
          group: 'delivered',
          title: 'Charges and tax — the parcels they came off'
        }));
      });
    });

    // The CPR cards are about the receipts rather than the parcels, and the
    // receipts have a screen of their own that can open each one and post it.
