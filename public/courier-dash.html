<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courier dashboard</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#222F34">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  .cdbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .cdbar input[type=date]{border:1px solid var(--line);border-radius:7px;padding:7px 9px;
    font:inherit;font-size:12.5px;background:#fff;height:auto;width:auto}
  .cdbar button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;
    font:inherit;font-size:12.5px;cursor:pointer;width:auto;height:auto;color:var(--ink)}
  .cdbar button:hover{border-color:var(--qbo)}
  .cdbar button.on{background:var(--qbo);border-color:var(--qbo);color:#fff;font-weight:600}
  .cdbar .find{margin-left:auto;display:flex;gap:6px}
  .cdbar .find input{border:1px solid var(--line);border-radius:7px;padding:7px 11px;
    font:inherit;font-size:12.5px;width:190px}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;
    margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 17px}
  .card .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .card .v{font-family:var(--mono);font-size:23px;font-weight:500;margin-top:6px;line-height:1.1}
  .card .n{font-size:11.5px;color:var(--muted);margin-top:4px}
  .card.good .v{color:var(--ok)}
  .card.warn .v{color:var(--warn)}

  .row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  @media(max-width:1050px){.row{grid-template-columns:1fr}}
  .wide{display:grid;grid-template-columns:1.45fr 1fr;gap:14px;margin-bottom:14px}
  @media(max-width:1050px){.wide{grid-template-columns:1fr}}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
  /* the two tabs are one page, so a heading reads the same on both */
  .box h3{margin:0 0 14px;font-size:15px;font-weight:600;font-family:var(--head);
    display:flex;align-items:baseline;gap:10px}
  .box h3 .aside{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:400}
  .box h3 a{font-size:11.5px;font-weight:400;color:var(--qbo);text-decoration:none}
  .box h3 a:hover{text-decoration:underline}

  table.t{width:100%;border-collapse:collapse;font-size:12.5px}
  table.t th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--faint);border-bottom:1px solid var(--line);padding:7px 8px;font-weight:600}
  table.t td{padding:8px;border-bottom:1px solid var(--line)}
  table.t td.r,table.t th.r{text-align:right;font-family:var(--mono)}
  table.t td.mono{font-family:var(--mono);font-size:12px}
  table.t tr:last-child td{border-bottom:0}
  table.t tr.tot td{font-weight:600;background:#FAFCFE}

  /* what the courier owes: the one thing on this page somebody is chasing,
     so it gets the room and the only big figure above the fold */
  .box.owed{border-color:#CFE3E2;background:linear-gradient(180deg,#F7FDFC,#fff 60%)}
  .owedwrap{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:22px;
    align-items:start}
  .owedbig{padding:4px 2px;cursor:pointer}
  .owedbig .l2{font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--faint)}
  .owedbig .huge{font-family:var(--mono);font-size:40px;font-weight:500;
    line-height:1.05;margin-top:6px;color:var(--ink)}
  .owedbig:hover .huge{color:var(--qbo)}
  .owedrest .sub2{font-size:11.5px;color:var(--muted)}
  .owedrest a{color:var(--qbo);text-decoration:none}
  .owedrest a:hover{text-decoration:underline}
  table.t.money td:first-child{color:var(--muted)}
  table.t.money tr.tot td{color:var(--ink)}
  table.t.money tr.big2 td{font-size:14px;background:#F2FAF9}
  .lateline{margin-top:12px;padding:9px 12px;border-radius:8px;background:#FFF6F3;
    border:1px solid #F2D6CC;font-size:12.5px;color:#8A4B3C;cursor:pointer}
  .lateline:hover{background:#FDEDE8}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  h4.sub3{margin:0 0 8px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--faint);font-weight:600}
  @media (max-width:900px){
    .owedwrap{grid-template-columns:1fr}
    .two{grid-template-columns:1fr}
  }
  table.t tr.click{cursor:pointer}
  table.t tr.click:hover td{background:#F5FAFD}

  /* one meaning per colour, the same as everywhere else in the app */
  .cpill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;
    font-weight:600;letter-spacing:.02em;white-space:nowrap}
  .cpill.ok{background:#E7F5EC;color:#1B7A44}
  .cpill.wait{background:#FFF4E0;color:#8A5A00}
  .cpill.grey{background:#EEF1F4;color:#5A6672}
  .cpill.done{background:#E9F1FD;color:#14539A}

  /* tabs across the top, the way a courier portal does it */
  .tabs{display:flex;gap:26px;border-bottom:1px solid var(--line);margin:0 0 18px;
    overflow-x:auto}
  .tabs button{border:0;background:none;padding:0 0 11px;font:inherit;font-size:13.5px;
    cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;width:auto;
    height:auto;white-space:nowrap;letter-spacing:.01em}
  .tabs button:hover{color:var(--ink)}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--qbo);font-weight:600}
  .tabs button .dot{display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--bad);margin-left:6px;vertical-align:middle}
  .pane{display:none}
  .pane.on{display:block}

  /* Overview is a wall of small panels, not a column of big ones - the point
     is to see how everything is doing without scrolling. */
  .mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px;
    margin-bottom:14px}
  .p{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;display:flex;flex-direction:column;min-height:206px}

  /* a few rows inside a tile - recent parcels, newest receipts */
  .rows{margin-top:2px}
  .rows .r1{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;
    border-bottom:1px solid var(--line);font-size:12px}
  .rows .r1:last-child{border-bottom:0}
  .rows .a{font-family:var(--mono);font-size:12px;color:#2F6FA8;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rows .b2{font-size:11px;color:var(--faint);margin-top:1px}
  .rows .c1{font-family:var(--mono);font-size:12px;text-align:right}
  .rows .d1{font-size:10.5px;color:var(--faint);text-align:right;margin-top:1px}
  .p h4{margin:0 0 10px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);font-weight:600;display:flex;align-items:center;gap:7px}
  .p h4 .rt{margin-left:auto;font-size:10.5px;letter-spacing:0;text-transform:none;
    color:var(--faint);font-weight:400}
  .p .big{font-family:var(--mono);font-size:26px;font-weight:500;line-height:1.05}
  .p .sub2{font-size:11.5px;color:var(--muted);margin-top:4px}
  .p .more{margin-top:auto;padding-top:11px;font-size:11.5px;color:var(--qbo);
    background:none;border:0;cursor:pointer;text-align:left;font-family:inherit;width:auto;
    height:auto}
  .p .more:hover{text-decoration:underline}
  .p.warn2{border-color:#E9C3C0;background:#FEF8F7}
  .p.warn2 .big{color:var(--bad)}

  /* a percentage bar, used everywhere a rate is shown */
  .meter{height:7px;border-radius:4px;background:#E8EDF3;overflow:hidden;margin-top:9px}
  .meter i{display:block;height:7px;border-radius:4px}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);
    margin-top:8px}
  .legend b{font-family:var(--mono);font-weight:500;color:var(--ink)}
  .sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;
    vertical-align:middle}

  .split{display:flex;gap:14px;flex-wrap:wrap}
  .split > div{flex:1;min-width:92px}
  .split .n2{font-family:var(--mono);font-size:18px;font-weight:500;line-height:1.1}
  .split .l2{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--faint);margin-top:3px}

  .box h3 .dl{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:7px;
    padding:5px 12px;font:inherit;font-size:11.5px;cursor:pointer;color:var(--ink);
    width:auto;height:auto;font-weight:400}
  .box h3 .dl:hover{border-color:var(--qbo);color:var(--qbo)}

  /* a box that is telling you something is wrong */
  .box.attn{border-color:#E9C3C0;background:#FEF8F7}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  @media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr)}}
  .cell{border:1px solid var(--line);border-radius:9px;padding:12px 14px;background:#fff;
    cursor:pointer;text-align:left;font:inherit;width:100%}
  .cell:hover{border-color:var(--qbo);background:#FAFDF9}
  .cell .l{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
    line-height:1.35;min-height:26px}
  .cell .n{font-family:var(--mono);font-size:22px;font-weight:500;margin-top:5px;line-height:1.1}
  .cell .m{font-size:11px;color:var(--faint);margin-top:3px}
  .cell.tot{background:#F3F7FB;border-color:#DCE7F1}

  .tx a{display:grid;grid-template-columns:1fr auto;gap:8px;padding:9px 0;
    border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
  .tx a:last-child{border-bottom:0}
  .tx a:hover .tk{text-decoration:underline}
  .tx .tk{font-family:var(--mono);font-size:12.5px;color:#2F6FA8}
  .tx .rf{font-size:11.5px;color:var(--faint);margin-top:2px}
  .tx .am{font-family:var(--mono);font-size:12.5px;text-align:right}
  .tx .dt{font-size:11px;color:var(--faint);text-align:right;margin-top:2px}

  .bars{display:flex;flex-direction:column;gap:7px}
  .bars .b{display:grid;grid-template-columns:130px 1fr 108px;align-items:center;gap:10px;
    font-size:12px}
  .bars .track{display:block;background:var(--line);border-radius:4px;height:9px;overflow:hidden}
  .bars .fill{display:block;height:9px;border-radius:4px}
  .bars .num{text-align:right;font-family:var(--mono);font-size:11.5px}

  .drawer{position:fixed;inset:0;background:rgba(12,24,20,.45);display:none;z-index:60}
  .drawer.open{display:block}
  .drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(980px,96vw);background:#fff;
    box-shadow:-8px 0 28px rgba(0,0,0,.18);display:flex;flex-direction:column}
  .drawer .hd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;
    align-items:center;gap:12px}
  .drawer .hd b{font-size:14px}
  .drawer .hd .note{font-size:12px;color:var(--faint)}
  .drawer .hd .x{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:7px;
    width:30px;height:30px;cursor:pointer;font-size:15px;line-height:1}
  .drawer .bd{overflow:auto;padding:6px 20px 24px}

  /* ============ the finance half reads like a statement ============

     Asked for in as many words: the courier's money should be presented the
     way a set of accounts is, in the words an accountant uses. So figures sit
     in a column, right aligned, in tabular figures so the digits line up;
     what is taken away is written in brackets, not with a minus sign; a
     subtotal carries a rule above it and the closing figure a double rule.
     None of that is decoration - it is how a reader's eye follows a column
     down to the one number at the bottom.                                   */

  .sched{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:18px 20px;margin-bottom:13px}
  .sched > h3{margin:0 0 14px;font-size:15px;font-weight:600;font-family:var(--head);
    display:flex;align-items:baseline;gap:10px}
  .sched > h3 .aside{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:400}
  .sched > h3 a{margin-left:auto;font-size:11.5px;font-weight:400;color:var(--qbo);
    text-decoration:none}
  .sched > h3 a:hover{text-decoration:underline}

  /* the tabs inside Finance: one table a screen, rather than one long scroll */
  .subtabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
  .subtabs button{border:1px solid var(--line);background:#fff;border-radius:20px;
    padding:6px 14px;font:inherit;font-size:12.5px;cursor:pointer;color:var(--muted);
    width:auto;height:auto}
  .subtabs button:hover{border-color:var(--qbo);color:var(--ink)}
  .subtabs button.on{background:var(--ink-3,#18212A);border-color:var(--ink-3,#18212A);
    color:#fff;font-weight:500}
  .fpane{display:none}
  .fpane.on{display:block}

  table.stmt{width:100%;border-collapse:collapse;font-size:13px;
    font-variant-numeric:tabular-nums}
  table.stmt th{font-size:10px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--faint);font-weight:600;padding:0 10px 9px;text-align:right;
    border-bottom:1px solid var(--line)}
  table.stmt th:first-child{text-align:left}
  table.stmt td{padding:9px 10px;border:0}
  table.stmt td.n,table.stmt td.v{text-align:right;font-family:var(--mono);
    white-space:nowrap}
  table.stmt td.n{color:var(--muted);font-size:12px}
  table.stmt td.lbl{color:var(--ink);width:46%}
  table.stmt td.lbl .why{color:var(--faint);font-size:11.5px;display:block;margin-top:2px}
  table.stmt tr.less td.lbl{padding-left:22px;color:var(--muted)}
  table.stmt tr.sub td{border-top:1px solid var(--ink-3,#18212A);font-weight:600}
  table.stmt tr.close td{border-top:1px solid var(--ink-3,#18212A);
    border-bottom:3px double var(--ink-3,#18212A);font-weight:700;font-size:14.5px}
  table.stmt tr.open:hover td{background:#F5FAFD;cursor:pointer}
  table.stmt tr.open td.lbl{cursor:pointer}
  .neg{color:var(--muted)}

  /* the four figures the finance tab opens with */
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;
    margin-bottom:14px}
  .kpi .k1{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px}
  .kpi .k1.lead{border-color:#CFE3E2;background:linear-gradient(180deg,#F7FDFC,#fff 62%)}
  .kpi .k1 .lb{font-size:10px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--faint);min-height:24px;line-height:1.3}
  .kpi .k1 .vl{font-family:var(--mono);font-size:25px;font-weight:500;margin-top:7px;
    line-height:1.1;font-variant-numeric:tabular-nums}
  .kpi .k1.lead .vl{font-size:31px}
  .kpi .k1 .fn{font-size:11.5px;color:var(--muted);margin-top:5px}
  .kpi .k1.open{cursor:pointer}
  .kpi .k1.open:hover{border-color:var(--qbo)}

  /* ageing: a bar per bucket, because the shape of a receivable is the point */
  .age{display:flex;flex-direction:column;gap:2px}
  .age .a1{display:grid;grid-template-columns:150px 1fr 96px 126px;align-items:center;
    gap:12px;padding:8px 10px;border-radius:7px;font-size:12.5px;cursor:pointer}
  .age .a1:hover{background:#F5FAFD}
  .age .tr2{background:#EDF1F5;border-radius:4px;height:10px;overflow:hidden}
  .age .fl{display:block;height:10px;border-radius:4px}
  .age .nn{text-align:right;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .age .vv{text-align:right;font-family:var(--mono);font-size:13px;
    font-variant-numeric:tabular-nums}
  .age .a1.sum{border-top:1px solid var(--ink-3,#18212A);border-radius:0;margin-top:5px;
    font-weight:600;cursor:default}
  .age .a1.sum:hover{background:none}
  @media(max-width:760px){.age .a1{grid-template-columns:116px 1fr 100px}
    .age .a1 .tr2{display:none}}

  /* what a word on this page means, for whoever did not write it */
  .gloss{margin-top:14px;border-top:1px solid var(--line);padding-top:11px}
  .gloss summary{font-size:11.5px;color:var(--qbo);cursor:pointer;list-style:none}
  .gloss summary::-webkit-details-marker{display:none}
  .gloss dl{margin:11px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;
    font-size:12px}
  .gloss dt{font-weight:600;color:var(--ink);white-space:nowrap}
  .gloss dd{margin:0;color:var(--muted)}
  @media(max-width:620px){.gloss dl{grid-template-columns:1fr}}

  .note{font-size:11.5px;color:var(--faint);margin-top:11px}
  .msg{padding:13px 15px;border-radius:8px;background:#FDF3F3;border:1px solid var(--bad);
    color:var(--bad);font-size:12.5px}
  .loading{color:var(--muted);font-size:12.5px;padding:22px 0}
  .fresh{font-size:11.5px;color:var(--faint)}
  .fresh b{color:var(--ok);font-weight:500}
</style>
</head>
<body>

<div class="layout">
  <aside class="rail"></aside>

  <div class="main">
    <div class="topline">
      <div>
        <h1 id="ttl">Courier dashboard</h1>
        <div class="sub" id="sub">Loading…</div>
      </div>
    </div>

    <div class="shell">

      <div id="gate" class="gate hide">
        <img src="/logo.svg" alt="">
        <h2>Connect your QuickBooks company</h2>
        <p>Courier accounts are kept per company.</p>
        <button class="solid" id="btnConnect">Connect to QuickBooks</button>
      </div>

      <div id="body" class="hide">
        <div class="tabs" id="tabs">
          <button data-tab="parcels" class="on">Parcels</button>
          <button data-tab="finance">Finance</button>
          <button data-go="receipts">Receipts</button>
        </div>

        <div class="cdbar">
          <button data-days="0">Today</button>
          <button data-days="6" class="on">7 days</button>
          <button data-days="29">30 days</button>
          <button data-days="89">3 months</button>
          <input type="date" id="from">
          <input type="date" id="to">
          <button class="on" id="go">Show</button>
          <div class="find">
            <input id="track" placeholder="Tracking number">
            <button id="btnTrack">Find</button>
          </div>
        </div>
        <div class="fresh" id="fresh"></div>
        <div id="out"><div class="loading">Reading…</div></div>
      </div>

    </div>
  </div>
</div>

<div class="drawer" id="drawer">
  <div class="panel">
    <div class="hd"><b id="dTitle">Orders</b><span class="note" id="dNote"></span>
      <button class="x" id="dClose">&times;</button></div>
    <div class="bd" id="dBody"></div>
  </div>
</div>

<script src="/nav.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  var qs = new URLSearchParams(location.search);
  var account = qs.get('account');
  var courier = qs.get('courier');
  var keeperTimer = null;

  // The tab bar lives in the page, not in the drawn output, so it stays put
  // while the numbers underneath it reload. The choice is remembered.
  // Two tabs, and the line between them is the whole point: one is about
  // parcels and carries no money anywhere, the other is about money and
  // reads like a statement. Four tabs meant "where are my parcels" and
  // "what am I owed" were half-answered on every one of them.
  var TABS = ['parcels','finance'];
  // ?tab= wins, so coming back from the receipts page lands where it said.
  // A tab name saved by the old four-tab page is not one of these, so it
  // falls through to Parcels rather than opening nothing.
  var tab = qs.get('tab') || localStorage.getItem('cdTab');
  if(TABS.indexOf(tab) < 0) tab = 'parcels';

  function showTab(k){
    if(TABS.indexOf(k) < 0) k = 'parcels';
    tab = k;
    localStorage.setItem('cdTab', k);

    document.querySelectorAll('#tabs button[data-tab]').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-tab') === k);
    });
    document.querySelectorAll('#out .pane').forEach(function(p){
      p.classList.toggle('on', p.getAttribute('data-pane') === k);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  document.querySelectorAll('#tabs button[data-tab]').forEach(function(b){
    b.addEventListener('click', function(){ showTab(b.getAttribute('data-tab')); });
  });

  // Receipts belongs to this account like the others, but a receipt of two
  // thousand orders needs a page of its own rather than a panel.
  document.querySelectorAll('#tabs button[data-go]').forEach(function(b){
    b.addEventListener('click', function(){
      location.href = '/receipts' + (account ? '?account=' + account : '');
    });
  });

  showTab(tab);

  var COLOR = {
    delivered:'#1F9D5A', returned:'#C9453F', returning:'#E08A2E', transit:'#2F7DD1',
    booked:'#6A6FD6', unbooked:'#8A99A8', cancelled:'#95A3B1', expired:'#B07A2E',
    review:'#C98B1E', transferred:'#4AA3C7', lost:'#8B2F2F', damaged:'#8B2F6B',
    other:'#B6C1CC'
  };

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function n0(v){ return Number(v||0).toLocaleString('en-US'); }
  function full(v){ return Number(v||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function money(v){
    var x = Number(v||0);
    if(Math.abs(x) >= 1000000) return (x/1000000).toFixed(2)+'M';
    if(Math.abs(x) >= 1000)    return (x/1000).toFixed(1)+'K';
    return x.toFixed(0);
  }
  function iso(d){ return d.toISOString().slice(0,10); }
  function monthStart(){ var d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'; }
  function short(day){ var p = String(day).split('-'); return p[2]+'/'+p[1]; }

  var fromEl = $('from'), toEl = $('to');

  function setRange(days){
    var t = new Date(), f = new Date();
    f.setDate(f.getDate() - days);
    fromEl.value = iso(f); toEl.value = iso(t);
  }

  // `noDates` is for the statement, which is all-time on purpose: a receivable
  // does not stop being owed because the date boxes say last week. Opening one
  // of those figures and getting a drawer cut to the dates on screen would show
  // fewer parcels than the figure it was opened from, which is how somebody
  // stops believing the figures.
  function params(extra, noDates){
    var p = new URLSearchParams();
    if(!noDates){ p.set('from', fromEl.value); p.set('to', toEl.value); }
    if(account) p.set('account', account);
    if(courier) p.set('courier', courier);
    Object.keys(extra||{}).forEach(function(k){ if(extra[k]) p.set(k, extra[k]); });
    return p.toString();
  }

  $('btnConnect').addEventListener('click', function(){ location.href = '/auth/connect'; });

  window.APP.ready.then(function(s){
    if(!s.connected){ $('gate').classList.remove('hide'); return; }
    $('body').classList.remove('hide');

    var sf = localStorage.getItem('cdFrom'), st = localStorage.getItem('cdTo');
    if(sf && st){ fromEl.value = sf; toEl.value = st; } else setRange(6);

    document.querySelectorAll('.cdbar button[data-days]').forEach(function(b){
      b.addEventListener('click', function(){
        document.querySelectorAll('.cdbar button[data-days]').forEach(function(x){ x.classList.remove('on'); });
        b.classList.add('on');
        setRange(Number(b.getAttribute('data-days')));
        load();
      });
    });
    $('go').addEventListener('click', load);
    $('btnTrack').addEventListener('click', findOne);
    $('track').addEventListener('keydown', function(e){ if(e.key === 'Enter') findOne(); });

    head();
    load();
    watchKeeper();
  });

  // courier key -> the name a person knows it by, read once from the same list
  // the rail is built from, so a courier added there needs nothing here
  var COURIER_NAME = {};
  fetch('/api/courier/kinds', { cache:'no-store' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      (d.kinds || []).forEach(function(k){ COURIER_NAME[k.key] = k.name; });
    })
    .catch(function(){});

  // "postex" is not a word anybody says. Falls back to the key itself, so a
  // courier whose adapter was taken out still reads sensibly on old rows.
  function courierName(key){
    return COURIER_NAME[key] || String(key || '');
  }

  function head(){
    var p = new URLSearchParams();
    if(account) p.set('account', account);
    if(courier) p.set('courier', courier);
    fetch('/api/courier/scope?'+p.toString(), { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error) return;
        $('ttl').textContent = d.title || 'Courier dashboard';
        $('sub').textContent = d.sub || '';
      })
      .catch(function(){});
  }

  /* ---------- the quiet catch-up, so you can see it is current ---------- */

  function watchKeeper(){
    if(document.hidden){
      if(keeperTimer) clearTimeout(keeperTimer);
      keeperTimer = setTimeout(watchKeeper, 60000);
      return;
    }
    fetch('/api/courier/keeper', { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        var el = $('fresh');
        if(d.running){
          el.innerHTML = 'Catching up with the courier\u2026';
          if(keeperTimer) clearTimeout(keeperTimer);
          keeperTimer = setTimeout(function(){ watchKeeper(); load(); }, 8000);
          return;
        }
        if(d.finishedAt){
          el.innerHTML = '<b>Up to date</b> \u00b7 last checked ' +
            new Date(d.finishedAt).toLocaleTimeString();
        }
        // Nothing is running, so there is nothing to watch closely. A minute
        // apart was close enough to Neon's five-minute sleep that one open
        // dashboard kept the database awake all day; five minutes lets it
        // sleep in between, and a tab in the background does not ask at all.
        if(keeperTimer) clearTimeout(keeperTimer);
        keeperTimer = setTimeout(watchKeeper, 5 * 60000);
      })
      .catch(function(){});
  }

  /* ---------- the page ---------- */

  var live = null;

  function load(){
    localStorage.setItem('cdFrom', fromEl.value);
    localStorage.setItem('cdTo', toEl.value);
    $('out').innerHTML = '<div class="loading">Reading\u2026</div>';

    Promise.all([
      fetch('/api/courier/dash?'+params(), { cache:'no-store' }).then(function(r){ return r.json(); }),
      // receipts come from the courier's own portal now, not our order table
      fetch('/api/receipts/recent?'+new URLSearchParams({
        account: account || '', courier: courier || '', limit: 6
      }).toString(), { cache:'no-store' }).then(function(r){ return r.json(); }),
      fetch('/api/courier/pickups?'+params({ limit: 8 }), { cache:'no-store' })
        .then(function(r){ return r.json(); })
    ])
    .then(function(all){
      var d = all[0];
      if(d.error){ $('out').innerHTML = '<div class="msg">'+esc(d.error)+'</div>'; return; }
      live = d;
      draw(d, all[1].cprs || [], all[2].days || []);
    })
    .catch(function(e){
      $('out').innerHTML = '<div class="msg">'+esc(e.message)+'</div>';
    });
  }

  function donut(done, total, colDone, colRest){
    var R = 46, C = 2*Math.PI*R;
    var part = total ? C * (done/total) : 0;
    return '<svg width="128" height="128" viewBox="0 0 130 130">' +
      '<circle cx="65" cy="65" r="'+R+'" fill="none" stroke="'+colRest+'" stroke-width="19"></circle>' +
      (part ? '<circle cx="65" cy="65" r="'+R+'" fill="none" stroke="'+colDone+'" stroke-width="19" ' +
        'stroke-dasharray="'+part.toFixed(2)+' '+(C-part).toFixed(2)+'" ' +
        'transform="rotate(-90 65 65)"></circle>' : '') +
      '<text x="65" y="63" text-anchor="middle" font-size="17" font-weight="600" fill="#123">' +
        n0(done) + '</text>' +
      '<text x="65" y="80" text-anchor="middle" font-size="10" fill="#8A99A8">of ' + n0(total) + '</text>' +
      '</svg>';
  }

  // three bars a day: booked, delivered, returned
  function dayChart(days){
    if(!days.length) return '<div class="note">No days in this range.</div>';

    var W = 700, H = 250, PL = 46, PR = 14, PT = 14, PB = 34;
    var iw = W-PL-PR, ih = H-PT-PB;

    var max = 0;
    days.forEach(function(d){
      max = Math.max(max, d.booked, d.delivered, d.returned);
    });
    if(!max) max = 1;

    var slot = iw/days.length;
    var bw = Math.max(2, (slot - 6) / 3);
    var svg = '';

    for(var i=0;i<=4;i++){
      var y = PT + ih - (ih*i/4);
      svg += '<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="#EEF3F8"></line>';
      svg += '<text x="'+(PL-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="#9AA8B6">'+n0(Math.round(max*i/4))+'</text>';
    }

    days.forEach(function(d, i){
      var x0 = PL + i*slot + 3;

      // Parcels, not money. This chart lives on the Parcels tab, and what a
      // day was worth is the Finance tab's question - it was in the tooltip,
      // which is the kind of place money leaks back onto a page that is
      // supposed to be free of it.
      function bar(n, off, fill, label){
        if(!n) return '';
        var h = ih * (n/max);
        return '<rect x="'+(x0+off*bw).toFixed(1)+'" y="'+(PT+ih-h).toFixed(1)+'" ' +
               'width="'+bw.toFixed(1)+'" height="'+h.toFixed(1)+'" fill="'+fill+'" rx="1.5">' +
               '<title>'+esc(d.day)+' \u00b7 '+label+': '+n0(n)+' parcels</title></rect>';
      }

      svg += bar(d.booked,    0, '#9EC9EE', 'booked');
      svg += bar(d.delivered, 1, '#1F9D5A', 'delivered');
      svg += bar(d.returned,  2, '#E48B85', 'returned');

      if(days.length <= 16 || i % Math.ceil(days.length/14) === 0){
        svg += '<text x="'+(x0 + bw*1.5).toFixed(1)+'" y="'+(H-12)+'" text-anchor="middle" ' +
               'font-size="10" fill="#9AA8B6">'+esc(short(d.day))+'</text>';
      }
    });

    return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto">'+svg+'</svg>' +
      '<div class="note"><span style="color:#9EC9EE">\u25AE</span> booked &nbsp; ' +
      '<span style="color:#1F9D5A">\u25AE</span> delivered &nbsp; ' +
      '<span style="color:#E48B85">\u25AE</span> returned</div>';
  }

  // the same two marks the receipts page uses - green when the money agreed,
  // amber when it did not, a hundred rupees either way being rounding
  function cprBadges(c){
    var out = '';
    if(c.dcJournalId) out += '<span class="cpill ok">posted DC</span> ';

    if(c.qbPaymentId){
      var gap = (c.expected == null || c.received == null)
        ? null : Math.abs(c.expected - c.received);
      out += (gap === null || gap <= 100)
        ? '<span class="cpill ok">received</span>'
        : '<span class="cpill wait">off by ' + full(gap) + '</span>';
    }

    return out || '<span class="cpill grey">not yet</span>';
  }

  function card(k, v, n, cls){
    return '<div class="card' + (cls ? ' '+cls : '') + '"><div class="k">' + esc(k) + '</div>' +
           '<div class="v">' + esc(v) + '</div><div class="n">' + esc(n) + '</div></div>';
  }

  /* ---------- small pieces the panels are built from ---------- */

  function pct(part, whole){ return whole ? (100 * part / whole) : 0; }
  function pc(v){ return (Math.round(v * 10) / 10) + '%'; }

  // green when it is going well, amber when it is slipping, red when it is not
  function gradeColour(rate){
    return rate >= 90 ? '#1F9D5A' : (rate >= 75 ? '#C98B1E' : '#C9453F');
  }

  function meter(parts){
    var total = parts.reduce(function(a, p){ return a + p.n; }, 0) || 1;
    return '<div class="meter" style="display:flex">' + parts.map(function(p){
      return '<i style="background:' + p.c + ';width:' +
             (100 * p.n / total).toFixed(2) + '%"></i>';
    }).join('') + '</div>';
  }

  function legend(parts){
    return '<div class="legend">' + parts.filter(function(p){ return p.n; })
      .map(function(p){
        return '<span><span class="sw" style="background:' + p.c + '"></span>' +
               esc(p.l) + ' <b>' + n0(p.n) + '</b></span>';
      }).join('') + '</div>';
  }

  // every panel can send you to the tab that explains it
  // The arrow on a tile used to carry you to another tab. With two tabs the
  // tile and the table it summarises are on the same one, so it would have
  // been a button that did nothing - it scrolls down to that table instead,
  // which is what somebody pressing it wanted either way.
  function more(where, words){
    return '<button class="more" data-jump="' + where + '">' + esc(words) + ' →</button>';
  }

  function panel(title, right, body, cls){
    return '<div class="p' + (cls ? ' ' + cls : '') + '"><h4>' + esc(title) +
           (right ? '<span class="rt">' + right + '</span>' : '') + '</h4>' + body + '</div>';
  }

  function draw(d, cprs, picks){
    var t = d.totals, st = d.statuses || [], days = d.days || [];

    var g = {};
    (d.groups || []).forEach(function(x){ g[x.group] = x; });
    var gc = function(k){ return (g[k] || {}).count || 0; };
    var ga = function(k){ return (g[k] || {}).amount || 0; };

    // Everything is sorted into one of four tabs. Overview is a wall of small
    // panels - enough of each thing to know whether it needs looking at, and a
    // way through to the tab that shows it properly.
    var T = { parcels:'', finance:'' };

    var settled  = gc('delivered') + gc('returned');
    var lost     = gc('lost') + gc('damaged');
    var expired  = gc('expired') + gc('other');
    var moving   = gc('unbooked') + gc('booked') + gc('transit') +
                   gc('review') + gc('returning');

    var deliveredRate = pct(gc('delivered'), settled);
    var returnRate    = pct(gc('returned'), settled);
    var lostRate      = pct(lost, t.orders);

    /* ==================== Overview ==================== */

    // Everything on this page is about the parcels booked inside the chosen
    // dates - not parcels delivered in them. That is the only way a rate
    // means anything: of the ones handed over, this many arrived.

    var html = '';

    var collected = t.deliveredAmount;
    var owed      = t.pendingAmount;

    /* --- what the courier is holding that is ours --- */
    //
    // First thing on the page, because it is the first thing anybody wants
    // from it. Everything below says where parcels got to; this says what
    // that is worth and how much of it has actually come back.
    //
    // The figures are all-time, not the chosen dates: money owed on a parcel
    // delivered last month is still owed today, and a date filter is no
    // reason to leave it off the screen. The dates get their own line under
    // it so both questions are answered at once.
    var M = d.money || {};
    var ever = M.ever || {}, inRange = M.range || {}, rec = M.receipts || null;

    /* ==================== Finance ====================

       Three corrections, all from the owner, all pointing the same way:

       - "finance ka structure hota hai usi base par banao" - so the money is
         a statement: COD collected, less the carrier's charges, less what it
         has paid against a CPR, and the balance still receivable.
       - "money owed to you ye to yaar kisi ko bhi samajh nahin aana" - so the
         words are the ones in the books. Except one: what the carrier pays is
         a **CPR**, not a remittance. That is the word these couriers use and
         the word on their own paperwork.
       - "finance ke tab ko itna complicated na banao... sab tab bhi to ban
         sakte hain" and "is tarah ki explanation ko remove kar do har jagah
         se" - so one screen holds one table, under its own tab, and nothing
         explains itself in a paragraph. A manager should open it and read the
         answer, not an essay about the answer.                              */

    // A figure in a column. What is deducted goes in brackets, the way a
    // ledger writes it; a dash means it does not apply.
    function amt(v, kind){
      if(v === null || v === undefined) return '—';
      var s = full(Math.abs(Number(v) || 0));
      return kind === 'less' ? '<span class="neg">(' + s + ')</span>' : s;
    }
    function pcs(n){ return (n === null || n === undefined) ? '' : n0(n); }

    function sRow(label, a, b, cls, attr, kind){
      return '<tr' + (cls ? ' class="' + cls + '"' : '') + (attr || '') + '>' +
        '<td class="lbl">' + label + '</td>' +
        '<td class="n">' + pcs(a.n) + '</td>' +
        '<td class="v">' + amt(a.v, kind) + '</td>' +
        '<td class="v">' + amt(b.v, kind) + '</td></tr>';
    }

    var netRec = ever.due || 0;

    // Each key is one sub-tab of Finance.
    var F = { statement:'', ageing:'', carriers:'', cprs:'', pending:'', cities:'' };

    /* ---------- Statement ---------- */

    F.statement +=
      '<div class="kpi">' +
        '<div class="k1 lead open" data-due="1" data-alltime="1">' +
          '<div class="lb">Net receivable</div>' +
          '<div class="vl">' + full(netRec) + '</div>' +
          '<div class="fn">' + n0(ever.dueOrders || 0) + ' parcels' +
          (ever.oldestDue ? ' &middot; oldest ' + esc(ever.oldestDue) : '') + '</div>' +
        '</div>' +
        '<div class="k1 open" data-due="0" data-alltime="1">' +
          '<div class="lb">COD collected</div>' +
          '<div class="vl">' + full(ever.cod || 0) + '</div>' +
          '<div class="fn">' + n0(ever.delivered || 0) + ' delivered</div>' +
        '</div>' +
        '<div class="k1">' +
          '<div class="lb">Charges &amp; GST</div>' +
          '<div class="vl">' + full(ever.charges || 0) + '</div>' +
          '<div class="fn">' + pc(pct(ever.charges || 0, ever.cod || 0)) + ' of COD</div>' +
        '</div>' +
        '<div class="k1 open" data-due="0" data-alltime="1">' +
          '<div class="lb">Paid against CPR</div>' +
          '<div class="vl">' + full(ever.paid || 0) + '</div>' +
          '<div class="fn">' + n0(ever.paidOrders || 0) + ' parcels</div>' +
        '</div>' +
      '</div>';

    F.statement +=
      '<div class="sched">' +
        '<h3>Receivable from couriers' +
          '<span class="aside">click a line for its parcels</span></h3>' +
        '<table class="stmt">' +
          '<tr><th>&nbsp;</th><th>Parcels</th><th>All time (Rs)</th>' +
            '<th>' + esc(d.from) + ' &rarr; ' + esc(d.to) + ' (Rs)</th></tr>' +

          sRow('COD collected on delivered parcels',
               { n: ever.delivered, v: ever.cod }, { v: inRange.cod },
               'open', ' data-due="0" data-alltime="1"') +

          sRow('Less: courier charges and GST',
               { n: null, v: ever.charges }, { v: inRange.charges },
               'less', '', 'less') +

          sRow('<b>Gross receivable</b>',
               { n: null, v: ever.net }, { v: inRange.net }, 'sub') +

          sRow('Less: paid against CPR',
               { n: ever.paidOrders, v: ever.paid }, { v: inRange.paid },
               'less open', ' data-due="0" data-alltime="1"', 'less') +

          sRow('<b>Net receivable</b>',
               { n: ever.dueOrders, v: ever.due }, { v: inRange.due },
               'close open', ' data-due="1" data-alltime="1"') +
        '</table>' +

        (ever.lateOrders
          ? '<div class="lateline click" data-late="1" style="margin-top:13px">' +
              '<b>' + n0(ever.lateOrders) + ' parcels</b> delivered over a fortnight ' +
              'ago, no CPR yet — ' + full(ever.lateCod) + ' of COD.' +
            '</div>'
          : '') +
      '</div>';

    /* ---------- Ageing ---------- */

    var AGE_KEY = ['a1','a2','a3','a4','a5','a0'];
    var ageAll = ever.ageing || [];
    var ageMax = ageAll.reduce(function(m, a){ return Math.max(m, Math.abs(a.amount)); }, 0) || 1;
    var ageHtml = ageAll.map(function(a, i){
      if(!a.n) return '';
      var col = a.old ? '#C9453F' : (a.unknown ? '#B0B7BE' : (i >= 2 ? '#C98B1E' : '#4FB477'));
      return '<div class="a1" data-age="' + AGE_KEY[i] + '">' +
        '<div>' + esc(a.label) + '</div>' +
        '<div class="tr2"><i class="fl" style="width:' +
          (100 * Math.abs(a.amount) / ageMax).toFixed(1) + '%;background:' + col + '"></i></div>' +
        '<div class="nn">' + n0(a.n) + ' pcs</div>' +
        '<div class="vv">' + full(a.amount) + '</div></div>';
    }).join('');

    F.ageing +=
      '<div class="sched">' +
      '<h3>Ageing of the net receivable' +
        '<span class="aside">from the delivery date</span></h3>' +
      '<div class="age">' + (ageHtml ||
        '<div class="a1" style="cursor:default;color:var(--muted)">' +
        '<div>Nothing outstanding.</div><div></div><div></div><div></div></div>') +
        '<div class="a1 sum"><div>Net receivable</div><div></div>' +
          '<div class="nn">' + n0(ever.dueOrders || 0) + ' pcs</div>' +
          '<div class="vv">' + full(netRec) + '</div></div>' +
      '</div></div>';

    /* --- each courier company, by its own name --- */
    // Two PostEx accounts are one PostEx. On "All courier companies" this is
    // the table that was missing: who is carrying how much, and who is
    // sitting on our money.
    var cs = d.couriers || [];
    // one row for the company you are already standing in is noise - this
    // table earns its place on "All courier companies" and wherever more than
    // one of them is in the answer
    if (cs.length > 1 || (!account && !courier && cs.length)) {
      var cRows = cs.map(function(c){
        return '<tr class="open" data-courier="' + esc(c.courier) + '">' +
          '<td class="lbl"><b>' + esc(courierName(c.courier)) + '</b>' +
            (c.accounts > 1 ? ' <span class="why">' + c.accounts + ' accounts</span>' : '') +
          '</td>' +
          '<td class="n">' + n0(c.delivered) + '</td>' +
          '<td class="v">' + full(c.deliveredAmount) + '</td>' +
          '<td class="v"><span class="neg">(' + full(c.charges) + ')</span></td>' +
          '<td class="v">' + full(c.net) + '</td>' +
          '<td class="v"><span class="neg">(' + full(c.settledAmount) + ')</span></td>' +
          '<td class="v" style="font-weight:700">' + full(c.due) + '</td></tr>';
      }).join('');

      // The same companies twice with different columns, because they are
      // two different questions. Parcels: how many, how far, how often they
      // come back. Finance: what they collected, what they kept, what is
      // still ours.
      var cRowsP = cs.map(function(c){
        return '<tr class="click" data-courier="' + esc(c.courier) + '">' +
          '<td><b>' + esc(courierName(c.courier)) + '</b>' +
            (c.accounts > 1 ? ' <span class="aside">' + c.accounts + ' accounts</span>' : '') +
          '</td>' +
          '<td class="r">' + n0(c.orders) + '</td>' +
          '<td class="r">' + n0(c.delivered) + '</td>' +
          '<td class="r">' + n0(c.returned) + '</td>' +
          '<td class="r">' + n0(c.moving) + '</td>' +
          '<td class="r" style="color:' + gradeColour(c.successRate) + ';font-weight:600">' +
            (c.delivered + c.returned ? pc(c.successRate) : '\u2014') + '</td></tr>';
      }).join('');

      T.parcels += '<div class="box" style="margin-bottom:13px"><h3>' +
        'Each courier company' +
        '<span class="aside">' + esc(d.from) + ' &rarr; ' + esc(d.to) + '</span></h3>' +
        '<table class="t"><tr><th>Courier</th><th class="r">Parcels</th>' +
        '<th class="r">Delivered</th><th class="r">Returned</th><th class="r">Moving</th>' +
        '<th class="r">Rate</th></tr>' + cRowsP + '</table></div>';

      // One carrier is one debtor. This is the schedule that says which of
      // them is sitting on the money - PostEx against M&P by name, not two
      // PostEx accounts to be added up by eye.
      F.carriers += '<div class="sched">' +
        '<h3>Receivable by carrier' +
        '<span class="aside">' + esc(d.from) + ' &rarr; ' + esc(d.to) +
        ' &middot; click a carrier to scope the page</span></h3>' +
        '<table class="stmt"><tr><th>Carrier</th><th>Delivered</th>' +
        '<th>COD collected</th><th>Charges &amp; GST</th>' +
        '<th>Gross receivable</th><th>Remitted</th>' +
        '<th>Net receivable</th></tr>' + cRows + '</table></div>';
    }

    // Where a parcel got to, and what stopped it. Every group the courier can
    // report appears in exactly one row, so the rows add up to what was booked
    // - a stage that quietly swallowed a hundred parcels is worse than no
    // stage at all.
    var stages = [
      { l:'Picked up by the courier', n:t.picked, a:null, c:'#7FA8D4', picked:1,
        note:'stamped with a pickup date' },
      { l:'Not picked up yet', n:t.unpicked, a:t.unpickedAmount, c:'#C9B8A0', picked:0,
        note:'still with you, or never collected' }
    ];

    var ends = [
      { l:'Delivered',     g:'delivered',            c:'#4FB477' },
      { l:'Returned',      g:'returned',             c:'#E48B85' },
      { l:'Coming back',   g:'returning',            c:'#E9B0A0' },
      { l:'On the way',    g:'transit',              c:'#9EC9EE' },
      { l:'Under review',  g:'review',               c:'#B7A6D6' },
      { l:'Waiting to be booked', g:'unbooked,booked', c:'#C7CDD4' },
      { l:'Cancelled',     g:'cancelled',            c:'#A8A8A8' },
      { l:'Transferred',   g:'transferred',          c:'#8FB0A8' },
      { l:'Expired',       g:'expired',              c:'#B9A24A' },
      { l:'Lost or damaged', g:'lost,damaged',       c:'#B3453F' },
      { l:'Unknown status', g:'other',               c:'#D0A0C0' }
    ].map(function(x){
      var n = 0, a = 0;
      x.g.split(',').forEach(function(k){ n += gc(k); a += ga(k); });
      return { l:x.l, g:x.g, n:n, a:a, c:x.c };
    }).filter(function(x){ return x.n; });

    function stageRow(x){
      var attr = x.picked === undefined
        ? ' class="click" data-group="' + esc(x.g) + '"'
        : ' class="click" data-picked="' + x.picked + '"';
      return '<tr' + attr + '>' +
        '<td><span class="sw" style="background:' + x.c + '"></span>' + esc(x.l) +
        (x.note ? ' <span style="color:var(--faint)">· ' + esc(x.note) + '</span>' : '') +
        '</td>' +
        '<td class="r">' + n0(x.n) + '</td>' +
        '<td class="r">' + pc(pct(x.n, t.orders)) + '</td></tr>';
    }

    var trackRows =
      '<tr class="tot"><td>Booked in this range</td>' +
      '<td class="r">' + n0(t.orders) + '</td><td class="r">100%</td></tr>' +
      stages.map(stageRow).join('') +
      '<tr class="tot"><td colspan="3" style="font-size:10px;letter-spacing:.06em;' +
        'text-transform:uppercase;color:var(--faint)">Where they ended up</td></tr>' +
      ends.map(stageRow).join('');

    // No money column, deliberately. This table answers "where did the
    // parcels get to"; what each stage is worth is the Finance tab's
    // question, and it was on here too - which is how one page ends up
    // answering neither question properly.
    T.parcels += '<div class="box" style="margin-bottom:13px"><h3>' +
      'What happened to them' +
      '<span class="aside">' + esc(d.from) + ' &rarr; ' + esc(d.to) + '</span>' +
      '<button class="dl" id="dlBooked">Download the lot</button></h3>' +
      '<table class="t"><tr><th>Stage</th><th class="r">Parcels</th>' +
      '<th class="r">Of booked</th></tr>' + trackRows +
      '</table></div>';

    /* --- one grid, every tile the same --- */

    var mix = [
      { l:'Delivered', n:gc('delivered'), c:'#4FB477' },
      { l:'Returned',  n:gc('returned'),  c:'#E48B85' },
      { l:'Moving',    n:moving,          c:'#7FA8D4' },
      { l:'Lost',      n:lost,            c:'#B3453F' },
      { l:'Expired',   n:expired,         c:'#B9A24A' }
    ];

    T.parcels += '<div class="mini">';

    // Receipts lead. Everything else on this row says where parcels got to;
    // this one is the courier's own written admission of what it has paid,
    // which is what the figures above are chased with.
    var newCprs = cprs.slice(0, 4).map(function(c){
      var st = String(c.status || '').toUpperCase();
      return '<div class="r1"><div><div class="a">' + esc(c.cpr) + '</div>' +
             '<div class="b2">' + esc(c.createdOn || '') + ' · ' +
             (c.qbPaymentId ? 'in QuickBooks' : 'not received') + '</div></div>' +
             '<div><div class="c1">' + full(c.netAmount) + '</div>' +
             '<div class="d1">' + esc(st || '') + '</div></div></div>';
    }).join('');

    T.parcels += panel('Booked', 'in the dates on screen',
      '<div class="big">' + n0(t.orders) + '</div>' +
      '<div class="sub2">parcels handed to the courier</div>' +
      more('cd-days', 'Day by day'));

    T.parcels += panel('Delivery rate', n0(settled) + ' settled',
      '<div class="big" style="color:' + gradeColour(deliveredRate) + '">' +
      pc(deliveredRate) + '</div>' +
      '<div class="sub2">' + n0(gc('delivered')) + ' delivered of ' + n0(settled) + '</div>' +
      meter([{ n:gc('delivered'), c:'#4FB477' }, { n:gc('returned'), c:'#E48B85' }]) +
      more('cd-status', 'Every status'));

    T.parcels += panel('Return rate', n0(gc('returned')) + ' came back',
      '<div class="big" style="color:' + gradeColour(100 - returnRate) + '">' +
      pc(returnRate) + '</div>' +
      '<div class="sub2">of everything that settled</div>' +
      more('cd-status', 'Every status'));

    T.parcels += panel('Where the parcels went', n0(t.orders) + ' booked',
      meter(mix) + legend(mix) + more('cd-status', 'Every status'));

    T.parcels += panel('Lost or damaged', lost ? pc(lostRate) + ' of booked' : '',
      '<div class="big">' + n0(lost) + '</div>' +
      '<div class="sub2">' + (lost ? 'parcels to claim for' : 'nothing lost or damaged') +
      '</div>' +
      more('cd-status', 'Every status'),
      lost ? 'warn2' : '');

    var cities = (d.cities || []).filter(function(c){ return c.settled >= 5; });
    var best  = cities.slice().sort(function(a, b){ return b.rate - a.rate; })[0];
    var worst = cities.slice().sort(function(a, b){ return a.rate - b.rate; })[0];

    T.parcels += panel('Best and worst city', n0((d.cities || []).length) + ' in range',
      (best
        ? '<div class="split">' +
            '<div><div class="n2" style="color:' + gradeColour(best.rate) + '">' +
              pc(best.rate) + '</div><div class="l2">' + esc(best.city) + '</div></div>' +
            '<div><div class="n2" style="color:' + gradeColour(worst.rate) + '">' +
              pc(worst.rate) + '</div><div class="l2">' + esc(worst.city) + '</div></div>' +
          '</div><div class="sub2" style="margin-top:9px">' +
          'Delivery rate, cities with 5 or more settled</div>'
        : '<div class="sub2">Not enough settled orders yet to rank cities.</div>') +
      more('cd-cities', 'Every city'));

    var recent4 = (d.recent || []).slice(0, 4).map(function(o){
      return '<div class="r1"><div><div class="a">' + esc(o.tracking) + '</div>' +
             '<div class="b2">' + esc(o.orderRef || '') + ' · ' + esc(o.city || '') + '</div></div>' +
             '<div><div class="d1">' + esc(o.on || '') + '</div></div></div>';
    }).join('');

    T.parcels += panel('Latest deliveries', n0((d.recent || []).length) + ' newest',
      '<div class="rows">' + (recent4 ||
        '<div class="sub2">Nothing delivered yet.</div>') + '</div>' +
      more('cd-recent', 'See detail'));

    var pickTotal = picks.reduce(function(a, p){ return a + p.parcels; }, 0);
    T.parcels += panel('Handed over', picks.length + ' days',
      '<div class="big">' + n0(pickTotal) + '</div>' +
      '<div class="sub2">parcels given to the courier</div>' +
      more('cd-picked', 'Handed over'));

    T.parcels += '</div>';

    /* the chart and the newest deliveries belong with the orders, not the summary */
    T.parcels += '<div class="box" id="cd-days" style="margin-bottom:13px"><h3>Day by day' +
      '<span class="aside">' + esc(d.from) + ' → ' + esc(d.to) + '</span></h3>' +
      dayChart(days) + '</div>';

    var tx = (d.recent || []).map(function(o){
      return '<a href="#" data-find="' + esc(o.tracking) + '">' +
             '<div><div class="tk">' + esc(o.tracking) + '</div>' +
             '<div class="rf">' + esc(o.orderRef || '') + '</div></div>' +
             '<div><div class="dt">' + esc(o.on || '') + '</div></div></a>';
    }).join('');

    T.parcels += '<div class="box" id="cd-recent" style="margin-bottom:13px"><h3>Latest deliveries' +
      '<span class="aside">newest first</span></h3>' +
      '<div class="tx">' + (tx || '<div class="note">Nothing yet.</div>') + '</div></div>';

    /* ==================== Orders ==================== */

    var cells = '<button class="cell tot" data-group=""><div class="l">All parcels</div>' +
                '<div class="n">' + n0(t.orders) + '</div>' +
                '<div class="m">booked in this range</div></button>';

    st.forEach(function(s){
      cells += '<button class="cell" data-status="' + esc(s.status) + '">' +
               '<div class="l">' + esc(s.status) + '</div>' +
               '<div class="n">' + n0(s.count) + '</div>' +
               '<div class="m">' + pc(pct(s.count, t.orders)) + ' of booked</div></button>';
    });

    T.parcels += '<div class="box" id="cd-status" style="margin-bottom:13px"><h3>Every status' +
                '<span class="aside">click any number to see the parcels</span></h3>' +
                '<div class="grid">' + cells + '</div></div>';

    var dayRows = '';
    var dt = { booked:0, picked:0, delivered:0, returned:0 };

    days.slice().reverse().forEach(function(x){
      if(!x.booked && !x.delivered && !x.returned && !x.picked) return;
      var s = x.delivered + x.returned;
      dayRows += '<tr><td class="mono">' + esc(x.day) + '</td>' +
                 '<td class="r">' + n0(x.booked) + '</td>' +
                 '<td class="r">' + n0(x.picked || 0) + '</td>' +
                 '<td class="r">' + n0(x.delivered) + '</td>' +
                 '<td class="r">' + n0(x.returned) + '</td>' +
                 '<td class="r">' + (s ? pc(pct(x.delivered, s)) : '—') + '</td></tr>';

      dt.booked += x.booked; dt.picked += (x.picked || 0);
      dt.delivered += x.delivered; dt.returned += x.returned;
    });

    var dts = dt.delivered + dt.returned;
    dayRows += '<tr class="tot"><td>Total</td>' +
               '<td class="r">' + n0(dt.booked) + '</td>' +
               '<td class="r">' + n0(dt.picked) + '</td>' +
               '<td class="r">' + n0(dt.delivered) + '</td>' +
               '<td class="r">' + n0(dt.returned) + '</td>' +
               '<td class="r">' + (dts ? pc(pct(dt.delivered, dts)) : '—') + '</td></tr>';

    T.parcels += '<div class="box" style="margin-bottom:13px"><h3>Every day, in numbers' +
                '<span class="aside">parcels, not money</span></h3>' +
                '<div style="max-height:360px;overflow:auto"><table class="t">' +
                '<tr><th>Day</th><th class="r">Booked</th><th class="r">Picked up</th>' +
                '<th class="r">Delivered</th>' +
                '<th class="r">Returned</th><th class="r">Rate</th></tr>' +
                dayRows + '</table></div></div>';

    var pickRows = picks.map(function(p){
      return '<tr class="click" data-pickup="' + esc(p.day) + '">' +
             '<td class="mono">' + esc(p.day) + '</td>' +
             '<td class="r">' + n0(p.parcels) + '</td>' +
             '<td class="r">' + n0(p.delivered) + '</td>' +
             '<td class="r">' + (p.parcels ? pc(pct(p.delivered, p.parcels)) : '—') +
             '</td></tr>';
    }).join('');

    T.parcels += '<div class="box" id="cd-picked" style="margin-bottom:13px"><h3>Handed over' +
                '<a href="/pickups' + (account ? '?account='+account : '') +
                '">View every day</a></h3>' +
                '<table class="t"><tr><th>Day</th><th class="r">Parcels</th>' +
                '<th class="r">Delivered since</th>' +
                '<th class="r">Rate</th></tr>' +
                (pickRows || '<tr><td colspan="4" style="color:var(--muted)">' +
                  'Nothing picked up in this range.</td></tr>') +
                '</table></div>';

    /* ==================== Payments ==================== */

    // NEW means the courier has not paid this one out yet, CLOSED means it is
    // paid. The badge on the right is our own side of it.
    var cprRows = cprs.map(function(c){
      var s = String(c.status || '').toUpperCase();
      var scls = s === 'CLOSED' ? 'ok' : (s === 'NEW' || s === 'OPEN' ? 'wait' : 'grey');

      return '<tr class="click" data-goto="' + esc(c.remoteId) + '">' +
             '<td class="mono">' + esc(c.cpr) + '</td>' +
             '<td class="mono">' + esc(c.createdOn || '') + '</td>' +
             '<td><span class="cpill ' + scls + '">' + esc(c.status || '—') + '</span></td>' +
             '<td class="r">' + full(c.netAmount) + '</td>' +
             '<td>' + cprBadges(c) + '</td></tr>';
    }).join('');

    /* ---------- the remittance side, and our own books ---------- */

    // The money chain used to be printed here a second time, once for all
    // time and once for the range, side by side - which is exactly what the
    // statement at the top now does in two columns. Two tables saying one
    // thing is how a page stops being read.

    if (rec && rec.receipts) {
      F.cprs += '<div class="sched">' +
        '<h3>CPRs against QuickBooks' +
        '<a href="/receipts' + (account ? '?account=' + account : '') +
        '">Open the receipt book</a></h3>' +
        '<table class="stmt">' +
        '<tr><th>&nbsp;</th><th>CPRs</th><th>Amount (Rs)</th></tr>' +
        '<tr><td class="lbl">CPRs issued by carriers</td>' +
          '<td class="n">' + n0(rec.receipts) + '</td>' +
          '<td class="v">' + full(rec.worth) + '</td></tr>' +
        '<tr class="less"><td class="lbl">Less: posted in QuickBooks</td>' +
          '<td class="n">' + n0(rec.inBooks) + '</td>' +
          '<td class="v"><span class="neg">(' + full(rec.inBooksAmount) + ')</span></td></tr>' +
        '<tr class="close"><td class="lbl">Not in QuickBooks yet</td>' +
          '<td class="n">' + n0(rec.notInBooks) + '</td>' +
          '<td class="v">' + full(rec.notInBooksAmount) + '</td></tr>' +
        '</table></div>';
    }

    var accs = d.accounts || [];
    if (accs.length > 1) {
      F.carriers += '<div class="sched">' +
        '<h3>By account' +
        '<span class="aside">one line per set of credentials</span></h3>' +
        '<table class="stmt"><tr><th>Account</th><th>Carrier</th>' +
        '<th>Parcels</th><th>Delivered</th>' +
        '<th>COD collected</th><th>Charges &amp; GST</th></tr>' +
        accs.map(function(a){
          return '<tr class="open" data-account="' + a.id + '">' +
            '<td class="lbl"><b>' + esc(a.label) + '</b></td>' +
            '<td class="lbl" style="width:auto">' + esc(courierName(a.courier)) + '</td>' +
            '<td class="n">' + n0(a.orders) + '</td>' +
            '<td class="n">' + n0(a.delivered) + '</td>' +
            '<td class="v">' + full(a.deliveredAmount) + '</td>' +
            '<td class="v"><span class="neg">(' + full(a.fee + a.tax) + ')</span></td></tr>';
        }).join('') + '</table></div>';
    }

    F.cprs += '<div class="sched" id="cd-receipts">' +
      '<h3>CPRs' +
      '<a href="/receipts' + (account ? '?account='+account : '') + '">Open the receipt book</a></h3>' +
      '<table class="stmt"><tr><th>CPR no.</th><th>Issued</th><th>Status</th>' +
      '<th>Net amount (Rs)</th><th>&nbsp;</th></tr>' +
      (cprRows || '<tr><td colspan="5" style="color:var(--muted);padding:14px 10px">' +
        'No CPR yet. <a href="/receipts' + (account ? '?account='+account : '') +
        '">Open the receipt book</a>.</td></tr>') +
      '</table></div>';

    // Delivered and returned are settled one way or the other. Everything
    // else is stock in the carrier's hands: money that has not been collected
    // at all yet, which is a different thing from money collected and not
    // remitted. Keeping the two apart is the whole reason this schedule is
    // not part of the statement above.
    var OWED = [
      { g:'unbooked',    label:'Not booked yet',        why:'still with you' },
      { g:'booked',      label:'Booked, awaiting pickup', why:'carrier has not collected it' },
      { g:'transit',     label:'In transit',            why:'on its way to the buyer' },
      { g:'review',      label:'Under verification',    why:'held by the carrier' },
      { g:'returning',   label:'Return in transit',     why:'coming back to you' },
      { g:'cancelled',   label:'Cancelled',             why:'' },
      { g:'transferred', label:'Transferred',           why:'' },
      { g:'expired',     label:'Expired',               why:'' },
      { g:'lost',        label:'Lost',                  why:'claim against the carrier' },
      { g:'damaged',     label:'Damaged',               why:'claim against the carrier' }
    ];

    var owedRows = '', owedCount = 0, owedAmount = 0;
    OWED.forEach(function(o){
      var x = g[o.g];
      if(!x || !x.count) return;
      owedCount += x.count; owedAmount += x.amount;
      owedRows += '<tr class="open" data-group="' + o.g + '">' +
                  '<td class="lbl">' + esc(o.label) +
                    (o.why ? '<span class="why">' + esc(o.why) + '</span>' : '') + '</td>' +
                  '<td class="n">' + n0(x.count) + '</td>' +
                  '<td class="v">' + full(x.amount) + '</td>' +
                  '<td class="n">' + pc(pct(x.count, t.orders)) + '</td></tr>';
    });

    if(owedRows){
      owedRows += '<tr class="close"><td class="lbl">Order value not yet collected</td>' +
                  '<td class="n">' + n0(owedCount) + '</td>' +
                  '<td class="v">' + full(owedAmount) + '</td>' +
                  '<td class="n">' + pc(pct(owedCount, t.orders)) + '</td></tr>';
    }

    F.pending += '<div class="sched" id="cd-notin">' +
      '<h3>Not collected yet' +
      '<span class="aside">' + esc(d.from) + ' &rarr; ' + esc(d.to) +
      ' &middot; click a line for its parcels</span></h3>' +
      '<table class="stmt"><tr><th>Where it stands</th><th>Parcels</th>' +
      '<th>Order value (Rs)</th><th>Of booked</th></tr>' +
      (owedRows || '<tr><td colspan="4" style="color:var(--muted);padding:14px 10px">' +
        'Every parcel booked in this range has settled one way or the other.</td></tr>') +
      '</table></div>';

    /* ==================== Cities ==================== */

    // This table is what decides which courier gets which city, so it holds
    // every number that bears on that - and only those. What each city is
    // worth is a finance question and has a table of its own below.
    var cityRows = (d.cities || []).map(function(c){
      return '<tr class="click" data-city="' + esc(c.city) + '">' +
             '<td>' + esc(c.city) + '</td>' +
             '<td class="r">' + n0(c.count) + '</td>' +
             '<td class="r">' + n0(c.delivered) + '</td>' +
             '<td class="r">' + n0(c.returned) + '</td>' +
             '<td class="r">' + n0(c.moving) + '</td>' +
             '<td class="r">' + (c.lost ? n0(c.lost) : '—') + '</td>' +
             '<td class="r" style="color:' + gradeColour(c.rate) + ';font-weight:600">' +
               (c.settled ? pc(c.rate) : '—') + '</td>' +
             '<td class="r">' + (c.settled ? pc(c.returnRate) : '—') + '</td></tr>';
    }).join('');

    T.parcels += '<div class="box" id="cd-cities" style="margin-bottom:13px"><h3>Every city' +
      '<span class="aside">rate is delivered out of settled · click a row for the parcels' +
      '</span></h3>' +
      '<div style="max-height:560px;overflow:auto"><table class="t">' +
      '<tr><th>City</th><th class="r">Parcels</th><th class="r">Delivered</th>' +
      '<th class="r">Returned</th><th class="r">Moving</th><th class="r">Lost</th>' +
      '<th class="r">Rate</th><th class="r">Return %</th></tr>' +
      (cityRows || '<tr><td colspan="8" style="color:var(--muted)">No cities.</td></tr>') +
      '</table></div></div>';

    var cityMoney = (d.cities || []).slice()
      .sort(function(a, b){ return (b.amount || 0) - (a.amount || 0); })
      .map(function(c){
        return '<tr class="open" data-city="' + esc(c.city) + '">' +
               '<td class="lbl">' + esc(c.city) + '</td>' +
               '<td class="n">' + n0(c.count) + '</td>' +
               '<td class="v">' + full(c.amount) + '</td>' +
               '<td class="v"><span class="neg">(' + full(c.fee + c.tax) + ')</span></td>' +
               '<td class="v">' + full((c.amount || 0) - (c.fee || 0) - (c.tax || 0)) +
               '</td></tr>';
      }).join('');

    F.cities += '<div class="sched">' +
      '<h3>Order value by city' +
      '<span class="aside">largest first &middot; click a row for its parcels</span></h3>' +
      '<div style="max-height:420px;overflow:auto"><table class="stmt">' +
      '<tr><th>City</th><th>Parcels</th><th>Order value (Rs)</th>' +
      '<th>Charges &amp; GST</th><th>Net (Rs)</th></tr>' +
      (cityMoney || '<tr><td colspan="5" style="color:var(--muted);padding:14px 10px">' +
        'No cities in this range.</td></tr>') +
      '</table></div></div>';

    var cmax = 0;
    (d.cities || []).forEach(function(c){ if(c.count > cmax) cmax = c.count; });

    var bars = (d.cities || []).slice(0, 15).map(function(c){
      return '<div class="b"><span>' + esc(c.city) + '</span>' +
        '<span class="track"><span class="fill" style="background:' + gradeColour(c.rate) +
        ';width:' + (cmax ? 100*c.count/cmax : 0).toFixed(1) + '%"></span></span>' +
        '<span class="num">' + n0(c.count) + ' · ' + pc(c.rate) + '</span></div>';
    }).join('');

    T.parcels += '<div class="box" style="margin-bottom:13px"><h3>Busiest cities' +
      '<span class="aside">bar is volume, colour is delivery rate</span></h3>' +
      '<div class="bars">' + (bars || '<div class="note">No cities.</div>') + '</div></div>';

    // Standing over every courier, or over one courier's accounts, the first
    // question is which account this is - so the breakdown by account opens the
    // overview rather than hiding at the foot of the cities tab. Inside a single
    // account there is nothing to break down and it is left off.
    if((d.accounts || []).length > 1 || !account){
      var wide = !account && !courier;   // every courier at once: say which
      var head = '<tr><th>Account</th>' + (wide ? '<th>Courier</th>' : '');
      var who = function(a){
        return '<td><a href="/courier-dash?account=' + a.id + '">' +
               esc(a.label) + '</a></td>' +
               (wide ? '<td>' + esc(COURIER_NAME[a.courier] || a.courier || '') + '</td>' : '');
      };

      var accP = (d.accounts || []).map(function(a){
        return '<tr>' + who(a) +
               '<td class="r">' + n0(a.orders) + '</td>' +
               '<td class="r">' + n0(a.delivered) + '</td>' +
               '<td class="r">' + n0(a.returned) + '</td>' +
               '<td class="r" style="color:' + gradeColour(a.successRate) +
                 ';font-weight:600">' + pc(a.successRate) + '</td></tr>';
      }).join('');

      T.parcels += '<div class="box"><h3>Accounts side by side' +
              '<span class="aside">every account on its own line, kept apart</span></h3>' +
              '<table class="t">' + head +
              '<th class="r">Parcels</th><th class="r">Delivered</th>' +
              '<th class="r">Returned</th><th class="r">Rate</th></tr>' +
              (accP || '<tr><td colspan="6" style="color:var(--muted)">No accounts.</td></tr>') +
              '</table></div>';

    }

    /* ==================== put it together ==================== */

    // Finance is six screens, not one scroll. Said in as many words:
    // "finance ke tab ko itna complicated na banao... sab tab bhi to ban
    // sakte hain". One table at a time, and the one anybody opens first -
    // the statement - is the one that opens.
    var FTABS = [
      { k:'statement', l:'Statement' },
      { k:'ageing',    l:'Ageing' },
      { k:'carriers',  l:'By carrier' },
      { k:'cprs',      l:'CPRs' },
      { k:'pending',   l:'Not collected' },
      { k:'cities',    l:'Cities' }
    ].filter(function(x){ return F[x.k]; });

    if (FTABS.length) {
      var want = localStorage.getItem('cdFinTab');
      if (!FTABS.some(function(x){ return x.k === want; })) want = FTABS[0].k;

      T.finance =
        '<div class="subtabs">' + FTABS.map(function(x){
          return '<button data-ftab="' + x.k + '"' +
                 (x.k === want ? ' class="on"' : '') + '>' + esc(x.l) + '</button>';
        }).join('') + '</div>' +
        FTABS.map(function(x){
          return '<div class="fpane' + (x.k === want ? ' on' : '') +
                 '" data-fpane="' + x.k + '">' + F[x.k] + '</div>';
        }).join('');
    }

    ['parcels','finance'].forEach(function(k){
      html += '<div class="pane' + (k === tab ? ' on' : '') + '" data-pane="' + k + '">' +
              (T[k] || '<div class="box"><div class="note">Nothing here.</div></div>') +
              '</div>';
    });

    if(t.lastSeen){
      html += '<div class="note">Newest order in the store: ' +
              esc(new Date(t.lastSeen).toLocaleString()) + '</div>';
    }

    $('out').innerHTML = html;

    // the red dot marks a tab that has something wrong sitting in it
    var dotOn = lost > 0;
    var ob = document.querySelector('#tabs button[data-tab="parcels"]');
    if(ob){
      var had = ob.querySelector('.dot');
      if(dotOn && !had) ob.insertAdjacentHTML('beforeend', '<span class="dot"></span>');
      if(!dotOn && had) had.remove();
    }

    /* ---------- what everything on the page does ---------- */

    var dl = document.getElementById('dlBooked');
    if(dl){
      dl.addEventListener('click', function(){
        location.href = '/api/courier/export?' + params();
      });
    }

    // the finance sub-tabs
    $('out').querySelectorAll('button[data-ftab]').forEach(function(b){
      b.addEventListener('click', function(){
        var k = b.getAttribute('data-ftab');
        localStorage.setItem('cdFinTab', k);
        $('out').querySelectorAll('button[data-ftab]').forEach(function(x){
          x.classList.toggle('on', x.getAttribute('data-ftab') === k);
        });
        $('out').querySelectorAll('.fpane').forEach(function(x){
          x.classList.toggle('on', x.getAttribute('data-fpane') === k);
        });
      });
    });

    $('out').querySelectorAll('.more[data-jump]').forEach(function(b){
      b.addEventListener('click', function(){
        var el = document.getElementById(b.getAttribute('data-jump'));
        if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
      });
    });
    $('out').querySelectorAll('.cell').forEach(function(b){
      b.addEventListener('click', function(){
        openList({ status: b.getAttribute('data-status'), group: b.getAttribute('data-group') });
      });
    });
    $('out').querySelectorAll('tr[data-group]').forEach(function(tr){
      tr.addEventListener('click', function(){
        openList({
          group: tr.getAttribute('data-group'),
          title: tr.cells[0] ? tr.cells[0].textContent : ''
        });
      });
    });
    $('out').querySelectorAll('tr[data-picked]').forEach(function(tr){
      tr.addEventListener('click', function(){
        openList({
          picked: tr.getAttribute('data-picked'),
          title: tr.cells[0] ? tr.cells[0].textContent : ''
        });
      });
    });
    // The money lines. due=1 is what is still owed, due=0 what has been paid,
    // late=1 the ones old enough to chase - the same three the figures above
    // are made of, so every number on this page opens into its own parcels.
    $('out').querySelectorAll('[data-due]').forEach(function(el){
      el.addEventListener('click', function(){
        var due = el.getAttribute('data-due');
        openList({
          due: due,
          allTime: el.getAttribute('data-alltime') === '1',
          title: due === '1' ? 'Net receivable — delivered, not yet remitted'
                             : 'Remitted by the carrier'
        });
      });
    });
    $('out').querySelectorAll('[data-late]').forEach(function(el){
      el.addEventListener('click', function(){
        openList({ late: '1', allTime: true,
                   title: 'Delivered over a fortnight ago, still unremitted' });
      });
    });
    // one band of the ageing table, all-time like the statement it ties to
    $('out').querySelectorAll('[data-age]').forEach(function(el){
      el.addEventListener('click', function(){
        openList({
          age: el.getAttribute('data-age'),
          allTime: true,
          title: 'Receivable outstanding — ' +
                 (el.firstChild ? el.firstChild.textContent : 'this band')
        });
      });
    });
    // a courier company, or one account of it, becomes the whole page's scope
    $('out').querySelectorAll('tr[data-courier]').forEach(function(tr){
      tr.addEventListener('click', function(){
        location.href = '/courier-dash?courier=' + encodeURIComponent(tr.getAttribute('data-courier'));
      });
    });
    $('out').querySelectorAll('tr[data-account]').forEach(function(tr){
      tr.addEventListener('click', function(){
        location.href = '/courier-dash?account=' + encodeURIComponent(tr.getAttribute('data-account'));
      });
    });
    $('out').querySelectorAll('tr[data-city]').forEach(function(tr){
      tr.addEventListener('click', function(){
        openList({ city: tr.getAttribute('data-city'), title: tr.getAttribute('data-city') });
      });
    });
    $('out').querySelectorAll('[data-find]').forEach(function(a){
      a.addEventListener('click', function(e){
        e.preventDefault();
        $('track').value = a.getAttribute('data-find');
        findOne();
      });
    });
    // a receipt is not something this page can show in full - the receipts
    // page reads the courier's portal, so it opens there
    $('out').querySelectorAll('[data-goto]').forEach(function(tr){
      tr.addEventListener('click', function(){
        location.href = '/receipts' + (account ? '?account=' + account : '') +
                        '#cpr=' + encodeURIComponent(tr.getAttribute('data-goto'));
      });
    });
    $('out').querySelectorAll('[data-pickup]').forEach(function(tr){
      tr.addEventListener('click', function(){ openPickup(tr.getAttribute('data-pickup')); });
    });
  }

  /* ---------- the drawer ---------- */

  function openDrawer(title, note, body){
    $('dTitle').textContent = title;
    $('dNote').textContent = note || '';
    $('dBody').innerHTML = body;
    $('drawer').classList.add('open');
  }
  $('dClose').addEventListener('click', function(){ $('drawer').classList.remove('open'); });
  $('drawer').addEventListener('click', function(e){
    if(e.target === $('drawer')) $('drawer').classList.remove('open');
  });

  function orderTable(rows){
    var lines = rows.map(function(o){
      return '<tr><td class="mono">' + esc(o.orderRef || '') + '</td>' +
             '<td class="mono">' + esc(o.tracking) + '</td>' +
             '<td>' + esc(o.city || '') + '</td>' +
             '<td class="r">' + full(o.amount) + '</td>' +
             '<td class="mono">' + esc(o.bookedOn || '') + '</td>' +
             '<td class="mono">' + esc(o.deliveredOn || '') + '</td>' +
             '<td>' + esc(o.status) + '</td>' +
             '<td class="mono">' + esc(o.cprNumber || '') + '</td></tr>';
    }).join('');

    return '<table class="t">' +
      '<tr><th>Order ref</th><th>Tracking</th><th>City</th><th class="r">Amount</th>' +
      '<th>Booked</th><th>Delivered</th><th>Status</th><th>CPR</th></tr>' +
      (lines || '<tr><td colspan="8">Nothing here.</td></tr>') + '</table>';
  }

  function openList(what){
    // a group has no name of its own worth showing, so the row that was
    // clicked passes the words the person actually read
    var title = what.status || what.cpr || what.title || 'All orders';
    openDrawer(title, '', '<div class="loading">Reading\u2026</div>');

    var ask = {};
    Object.keys(what).forEach(function(k){
      if(k !== 'title' && k !== 'allTime') ask[k] = what[k];
    });

    fetch('/api/courier/rows?'+params(ask, what.allTime), { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error){ $('dBody').innerHTML = '<div class="msg">'+esc(d.error)+'</div>'; return; }
        $('dNote').textContent = n0(d.count) + ' orders \u00b7 ' + full(d.amount);
        $('dBody').innerHTML = orderTable(d.orders || []);
      })
      .catch(function(e){ $('dBody').innerHTML = '<div class="msg">'+esc(e.message)+'</div>'; });
  }

  function openPickup(day){
    openDrawer('Handed over on ' + day, '', '<div class="loading">Reading\u2026</div>');

    var p = new URLSearchParams();
    p.set('day', day);
    if(account) p.set('account', account);
    if(courier) p.set('courier', courier);

    fetch('/api/courier/pickups?'+p.toString(), { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error){ $('dBody').innerHTML = '<div class="msg">'+esc(d.error)+'</div>'; return; }
        $('dNote').textContent = n0(d.parcels) + ' parcels \u00b7 ' + full(d.amount);
        $('dBody').innerHTML = orderTable(d.orders || []);
      })
      .catch(function(e){ $('dBody').innerHTML = '<div class="msg">'+esc(e.message)+'</div>'; });
  }

  function findOne(){
    var q = $('track').value.trim();
    if(!q) return;

    openDrawer('Tracking ' + q, '', '<div class="loading">Looking for it\u2026</div>');

    fetch('/api/courier/track?q=' + encodeURIComponent(q) + (account ? '&account='+account : ''),
          { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error){ $('dBody').innerHTML = '<div class="msg">'+esc(d.error)+'</div>'; return; }
        if(!d.found){
          $('dBody').innerHTML = '<div class="note">No courier here knows that number.</div>';
          return;
        }

        var p = d.payment || {}, o = d.order;
        var line = function(k, v){
          return '<tr><td style="color:var(--faint);width:190px">' + esc(k) + '</td>' +
                 '<td class="mono">' + esc(v == null || v === '' ? '\u2014' : v) + '</td></tr>';
        };

        var html = '<table class="t" style="margin-top:10px">';
        html += line('Account', d.account.label);
        html += line('Tracking number', p.tracking);
        html += line('Order reference', p.orderRef || (o && o.orderRef));
        if(o){
          html += line('Status', o.status);
          html += line('Amount', full(o.amount));
          html += line('Courier fee', full(o.fee) + ' + tax ' + full(o.tax));
          html += line('City', o.city);
          html += line('Booked on', o.bookedOn);
          html += line('Picked on', o.pickedOn);
          html += line('Delivered on', o.deliveredOn);
        }
        html += line('Settled', p.settled ? 'yes' : 'not yet');
        html += line('Settled on', p.settledOn);
        html += line('CPR number', p.cprNumber);
        html += '</table>';

        $('dBody').innerHTML = html;
      })
      .catch(function(e){ $('dBody').innerHTML = '<div class="msg">'+esc(e.message)+'</div>'; });
  }
})();
</script>
</body>
</html>
