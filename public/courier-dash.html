    // Sending somebody there with the right list already chosen beats drawing
    // a fourth table of the same thing here.
    $('out').querySelectorAll('[data-cprs]').forEach(function(el){
      el.addEventListener('click', function(){
        var which = el.getAttribute('data-cprs');
        var q = new URLSearchParams();
        if (account) q.set('account', account);
        if ($('from') && $('from').value) q.set('from', $('from').value);
        if ($('to') && $('to').value) q.set('to', $('to').value);
        q.set('show', which);
        location.href = '/receipts?' + q.toString();
      });
    });

    $('out').querySelectorAll('[data-pending]').forEach(function(el){
      el.addEventListener('click', function(){
        moneyList({ pending: '1' }, 'In a CPR, not paid yet');
      });
    });
    $('out').querySelectorAll('[data-nocpr]').forEach(function(el){
      el.addEventListener('click', function(){
        moneyList({ nocpr: '1' }, 'Delivered, in no CPR at all');
      });
    });
    $('out').querySelectorAll('tr[data-month]').forEach(function(tr){
      tr.addEventListener('click', function(){
        var m = tr.getAttribute('data-month');
        var y = Number(m.split('-')[0]), mm = Number(m.split('-')[1]);
        var last = new Date(y, mm, 0).getDate();
        openList({ dfrom: m + '-01', dto: m + '-' + String(last),
                   allTime: true, title: 'Delivered in ' + m });
      });
    });
    $('out').querySelectorAll('[data-late]').forEach(function(el){
      el.addEventListener('click', function(){
        moneyList({ late: '1' },
                  'Delivered over a fortnight ago, not received');
      });
    });
    // While a chase is running the figures on this page are still filling in,
    // so it watches one small count until there is nothing left to ask about
    // and then redraws itself. It is tied to that job and stops with it, and
    // it holds off while the tab is in the background - an always-on poller is
    // a standing charge on the month.
    if (chaseTimer) { clearTimeout(chaseTimer); chaseTimer = null; }
    if (prog && prog.left > 0) watchChase(prog.left);

    // a CPR figure opens into the CPRs themselves
    $('out').querySelectorAll('[data-gotab]').forEach(function(el){
      el.addEventListener('click', function(){
        var b = $('out').querySelector('button[data-ftab="' +
                  el.getAttribute('data-gotab') + '"]');
        if(b) b.click();
      });
    });
    // one band of the ageing table, all-time like the statement it ties to
    $('out').querySelectorAll('[data-age]').forEach(function(el){
      el.addEventListener('click', function(){
        openList({
          age: el.getAttribute('data-age'),
          allTime: true,
          title: 'Not received yet \u2014 ' +
                 (el.firstChild ? el.firstChild.textContent : 'this band')
        });
      });
    });
    // a courier company, or one account of it, becomes the whole page's scope
    $('out').querySelectorAll('tr[data-courier]').forEach(function(tr){
      tr.addEventListener('click', function(){
        location.href = '/courier-dash?courier=' + encodeURIComponent(tr.getAttribute('data-courier'));
      });
    });
    $('out').querySelectorAll('tr[data-account]').forEach(function(tr){
      tr.addEventListener('click', function(){
        location.href = '/courier-dash?account=' + encodeURIComponent(tr.getAttribute('data-account'));
      });
    });
    $('out').querySelectorAll('tr[data-city]').forEach(function(tr){
      tr.addEventListener('click', function(){
        openList({ city: tr.getAttribute('data-city'), title: tr.getAttribute('data-city') });
      });
    });
    $('out').querySelectorAll('[data-find]').forEach(function(a){
      a.addEventListener('click', function(e){
        e.preventDefault();
        $('track').value = a.getAttribute('data-find');
        findOne();
      });
    });
    // a receipt is not something this page can show in full - the receipts
    // page reads the courier's portal, so it opens there
    $('out').querySelectorAll('[data-goto]').forEach(function(tr){
      tr.addEventListener('click', function(){
        location.href = '/receipts' + (account ? '?account=' + account : '') +
                        '#cpr=' + encodeURIComponent(tr.getAttribute('data-goto'));
      });
    });
    $('out').querySelectorAll('[data-pickup]').forEach(function(tr){
      tr.addEventListener('click', function(){ openPickup(tr.getAttribute('data-pickup')); });
    });
  }

  /* ---------- the drawer ---------- */

  // Whatever the side window is showing, kept so Download can write it out
  // without asking the server the same question twice.
  var shown = { title: '', rows: [] };

  function openDrawer(title, note, body){
    $('dTitle').textContent = title;
    $('dNote').textContent = note || '';
    $('dBody').innerHTML = body;
    shown = { title: title, rows: [] };
    $('dCsv').disabled = true;
    $('drawer').classList.add('open');
  }

  // What the window is holding, as a file: the same columns in the same order
  // as the table on screen, so the file and the screen are one answer.
  function csvCell(v){
    var t = String(v == null ? '' : v);
    return /[",\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  }

  function csvOf(rows){
    var head = ['Order', 'Tracking', 'Account', 'Status', 'City', 'Booked',
                'Picked up', 'Delivered', 'Settled', 'Receipt',
                'COD', 'Charges', 'Tax'];
    var lines = rows.map(function(o){
      return [o.orderRef, o.tracking, o.account, o.status, o.city, o.bookedOn,
              o.pickedOn, o.deliveredOn, o.settledOn, o.cprNumber,
              o.amount, o.fee, o.tax].map(csvCell).join(',');
    });
    return head.join(',') + '\n' + lines.join('\n');
  }

  $('dCsv').addEventListener('click', function(){
    if(!shown.rows.length) return;
    var name = (shown.title || 'orders').toLowerCase()
      .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 60) || 'orders';
    var blob = new Blob([csvOf(shown.rows)], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name + '.csv';
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  });
  $('dClose').addEventListener('click', function(){ $('drawer').classList.remove('open'); });
  $('drawer').addEventListener('click', function(e){
    if(e.target === $('drawer')) $('drawer').classList.remove('open');
  });

  // The charges and the tax are columns of their own. They were not there,
  // so a figure made of them - "Charges and tax in this period" - opened into
  // a list that did not show either of them, and the only way to check the
  // total was to trust it.
  function orderTable(rows){
    var totals = rows.reduce(function(t, o){
      t.amount += Number(o.amount) || 0;
      t.fee    += Number(o.fee) || 0;
      t.tax    += Number(o.tax) || 0;
      return t;
    }, { amount: 0, fee: 0, tax: 0 });

    var lines = rows.map(function(o){
      return '<tr><td class="mono">' + esc(o.orderRef || '') + '</td>' +
             '<td class="mono">' + esc(o.tracking) + '</td>' +
             '<td>' + esc(o.city || '') + '</td>' +
             '<td class="r">' + full(o.amount) + '</td>' +
             '<td class="r">' + full(o.fee) + '</td>' +
             '<td class="r">' + full(o.tax) + '</td>' +
             '<td class="mono">' + esc(o.bookedOn || '') + '</td>' +
             '<td class="mono">' + esc(o.deliveredOn || '') + '</td>' +
             '<td>' + esc(o.status) + '</td>' +
             '<td class="mono">' + esc(o.cprNumber || '') + '</td></tr>';
    }).join('');

    return '<table class="t">' +
      '<tr><th>Order ref</th><th>Tracking</th><th>City</th><th class="r">COD</th>' +
      '<th class="r">Charges</th><th class="r">Tax</th>' +
      '<th>Booked</th><th>Delivered</th><th>Status</th><th>CPR</th></tr>' +
      (lines ||  '<tr><td colspan="10">Nothing here.</td></tr>') +
      (rows.length
        ? '<tr class="tot"><td colspan="3"><b>' + n0(rows.length) + ' parcels</b></td>' +
          '<td class="r"><b>' + full(totals.amount) + '</b></td>' +
          '<td class="r"><b>' + full(totals.fee) + '</b></td>' +
          '<td class="r"><b>' + full(totals.tax) + '</b></td>' +
          '<td colspan="4"></td></tr>'
        : '') +
      '</table>';
  }

  function openList(what){
    // a group has no name of its own worth showing, so the row that was
    // clicked passes the words the person actually read
    var title = what.status || what.cpr || what.title || 'All orders';
    openDrawer(title, '', '<div class="loading">Reading\u2026</div>');

    var ask = {};
    Object.keys(what).forEach(function(k){
      if(k !== 'title' && k !== 'allTime') ask[k] = what[k];
    });

    fetch('/api/courier/rows?'+params(ask, what.allTime), { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error){ $('dBody').innerHTML = '<div class="msg">'+esc(d.error)+'</div>'; return; }
        // The count and the value are of everything that matched. Where more
        // matched than one window draws, it says so rather than quietly
        // reporting the part it drew - which is how a figure of 9,315 opened
        // as "2,000 orders".
        $('dNote').textContent = n0(d.count) + ' orders \u00b7 ' + full(d.amount) +
          (d.capped ? ' \u00b7 showing the first ' + n0(d.shown) : '');
        shown.rows = d.orders || [];
        $('dCsv').disabled = !shown.rows.length;
        $('dBody').innerHTML = orderTable(d.orders || []) +
          (d.capped
            ? '<p class="hint" style="margin:10px 2px">' + n0(d.count) +
              ' parcels matched. This window and the CSV carry the first ' +
              n0(d.shown) + '.</p>'
            : '');
      })
      .catch(function(e){ $('dBody').innerHTML = '<div class="msg">'+esc(e.message)+'</div>'; });
  }

  function openPickup(day){
    openDrawer('Handed over on ' + day, '', '<div class="loading">Reading\u2026</div>');

    var p = new URLSearchParams();
    p.set('day', day);
    if(account) p.set('account', account);
    if(courier) p.set('courier', courier);

    fetch('/api/courier/pickups?'+p.toString(), { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error){ $('dBody').innerHTML = '<div class="msg">'+esc(d.error)+'</div>'; return; }
        $('dNote').textContent = n0(d.parcels) + ' parcels \u00b7 ' + full(d.amount) +
          (d.capped ? ' \u00b7 showing the first 2,000' : '');
        shown.rows = d.orders || [];
        $('dCsv').disabled = !shown.rows.length;
        $('dBody').innerHTML = orderTable(d.orders || []);
      })
      .catch(function(e){ $('dBody').innerHTML = '<div class="msg">'+esc(e.message)+'</div>'; });
  }

  function findOne(){
    var q = $('track').value.trim();
    if(!q) return;

    openDrawer('Tracking ' + q, '', '<div class="loading">Looking for it\u2026</div>');

    fetch('/api/courier/track?q=' + encodeURIComponent(q) + (account ? '&account='+account : ''),
          { cache:'no-store' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.error){ $('dBody').innerHTML = '<div class="msg">'+esc(d.error)+'</div>'; return; }
        if(!d.found){
          $('dBody').innerHTML = '<div class="note">No courier here knows that number.</div>';
          return;
        }

        var p = d.payment || {}, o = d.order;
        var line = function(k, v){
          return '<tr><td style="color:var(--faint);width:190px">' + esc(k) + '</td>' +
                 '<td class="mono">' + esc(v == null || v === '' ? '\u2014' : v) + '</td></tr>';
        };

        var html = '<table class="t" style="margin-top:10px">';
        html += line('Account', d.account.label);
        html += line('Tracking number', p.tracking);
        html += line('Order reference', p.orderRef || (o && o.orderRef));
        if(o){
          html += line('Status', o.status);
          html += line('Amount', full(o.amount));
          html += line('Courier fee', full(o.fee) + ' + tax ' + full(o.tax));
          html += line('City', o.city);
          html += line('Booked on', o.bookedOn);
          html += line('Picked on', o.pickedOn);
          html += line('Delivered on', o.deliveredOn);
        }
        html += line('Settled', p.settled ? 'yes' : 'not yet');
        html += line('Settled on', p.settledOn);
        html += line('CPR number', p.cprNumber);
        html += '</table>';

        $('dBody').innerHTML = html;
      })
      .catch(function(e){ $('dBody').innerHTML = '<div class="msg">'+esc(e.message)+'</div>'; });
  }
})();
</script>
</body>
</html>
