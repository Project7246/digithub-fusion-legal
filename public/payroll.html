<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payroll</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#222F34">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Roboto:wght@400;500&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">
<style>
  .cbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .cbar input[type=text],.cbar input[type=month],.cbar input[type=number],.cbar select{
    border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;
    font-size:12.5px;background:#fff;height:auto;width:auto}
  .cbar button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 12px;
    font:inherit;font-size:12.5px;cursor:pointer;width:auto;height:auto;color:var(--ink)}
  .cbar button:hover{border-color:var(--accent)}
  .cbar .right{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

  .ctabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}
  .ctabs button{padding:6px 13px;border:1px solid var(--line);border-radius:20px;
    font:inherit;font-size:12.5px;color:var(--muted);background:#fff;cursor:pointer;
    white-space:nowrap;width:auto;height:auto}
  .ctabs button:hover{border-color:var(--accent);color:var(--ink)}
  .ctabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .ctabs button .ct{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:5px}

  .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;margin-bottom:14px}
  .box h3{margin:0 0 14px;font-size:13.5px;font-weight:600;display:flex;
    align-items:baseline;gap:9px}
  .box h3 .aside{margin-left:auto;font-size:11.5px;color:var(--faint);font-weight:400}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;
    margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:15px 17px}
  .card .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
  .card .v{font-family:var(--mono);font-size:21px;font-weight:500;margin-top:6px;line-height:1.1}
  .card .n{font-size:11.5px;color:var(--muted);margin-top:4px}

  table.t{width:100%;border-collapse:collapse;font-size:12.5px}
  table.t th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;
    color:var(--faint);border-bottom:1px solid var(--line);padding:7px 8px;font-weight:600;
    position:sticky;top:0;background:var(--panel);z-index:1;white-space:nowrap}
  table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  table.t tfoot td{border-top:2px solid var(--ink);border-bottom:0;font-weight:600;
    background:var(--panel-2)}
  table.t tr.pick{cursor:pointer}
  table.t tr.pick:hover td{background:var(--panel-2)}
  table.t tr.on td{background:var(--accent-soft)}
  .num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;
    white-space:nowrap}
  .neg{color:var(--neg)}
  .zero{color:#DDE5E5}
  .hand{color:var(--accent-deep);font-weight:600}
  .imp{color:var(--warn);font-style:italic}
  .lst{max-height:620px;overflow:auto}
  .wide{overflow:auto;max-height:640px}

  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;
    font-weight:600;white-space:nowrap}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.no{background:#F3F5F7;color:var(--faint)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.neg{background:var(--neg-soft);color:var(--neg)}

  .f label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--faint);margin-bottom:4px}
  .f input,.f select{width:100%;border:1px solid var(--line);border-radius:7px;
    padding:8px 10px;font:inherit;font-size:13px;background:#fff}
  .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px 16px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
  .acts .grow{margin-left:auto}
  input.cell{width:104px;text-align:right;border:1px solid var(--line);border-radius:6px;
    padding:5px 7px;font:inherit;font-size:12.5px;font-family:var(--mono)}

  /* the chain a pool is worked out by, shown as a chain so it can be argued with */
  .chain{font-size:12.5px}
  .chain div{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line)}
  .chain div:last-child{border-bottom:0}
  .chain .l{color:var(--muted)}
  .chain .r{margin-left:auto;font-family:var(--mono)}
  .chain .tot{border-top:1px solid var(--ink);border-bottom:0;font-weight:600;margin-top:4px}

  .ticks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 14px;
    max-height:260px;overflow:auto;padding:4px 0}
  .ticks label{display:flex;gap:7px;align-items:center;font-size:12.5px}
  .ticks input{width:auto}

  /* their own slip, and their own report - these two are printed */
  .slip{border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px;
    background:#fff;page-break-inside:avoid}
  .slip h4{font-family:var(--head);font-size:14px;margin:0 0 3px;letter-spacing:.02em}
  .slip .meta{font-size:11.5px;color:var(--muted);margin-bottom:12px;display:flex;
    gap:16px;flex-wrap:wrap}
  .slip .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px}
  .slip table{width:100%;border-collapse:collapse;font-size:12px}
  .slip table th{text-align:left;font-size:9.5px;text-transform:uppercase;
    letter-spacing:.06em;color:var(--faint);border-bottom:1px solid var(--line);
    padding:4px 0;font-weight:600}
  .slip table td{padding:3px 0;border-bottom:1px dotted var(--line)}
  .slip table td.num{width:46%}
  .slip table tr.sum td{border-top:1px solid var(--ink);border-bottom:0;font-weight:600;
    padding-top:6px}
  .slip table tr.close td{border-top:1px solid var(--ink);
    border-bottom:3px double var(--ink);font-weight:700}
  .slip .sign{display:flex;justify-content:space-between;margin-top:22px;
    font-size:11px;color:var(--faint)}
  @media (max-width:800px){ .slip .three{grid-template-columns:1fr} }

  /* the time sheet, as it is printed and handed over */
  .ts{background:#fff;border:1px solid var(--line);border-radius:8px;padding:18px}
  .ts h4{font-family:var(--head);text-align:center;font-size:14px;margin:0 0 12px;
    letter-spacing:.06em}
  .ts .who{display:grid;grid-template-columns:1fr 1fr;gap:3px 18px;font-size:12px;
    margin-bottom:14px}
  .ts table{width:100%;border-collapse:collapse;font-size:11.5px}
  .ts th,.ts td{border:1px solid var(--line);padding:3px 6px}
  .ts th{font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint)}
  .ts .tally{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:2px 16px;font-size:12px;margin-top:12px}
  .ts .tally span{display:flex}
  .ts .tally b{margin-left:auto;font-family:var(--mono)}

  .drop{border:2px dashed var(--line-2);border-radius:10px;padding:24px;text-align:center;
    color:var(--muted);font-size:13px;cursor:pointer;background:var(--panel-2)}
  .drop:hover{border-color:var(--accent);color:var(--ink)}

  /* every rule as its own card: name, what it is, how, and the sum */
  .rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
  .rule{border:1px solid var(--line);border-radius:9px;padding:13px 15px;
    background:var(--panel-2)}
  .rule .rh{display:flex;align-items:center;gap:9px;margin-bottom:7px}
  .rule .rn{font-family:var(--mono);font-size:10.5px;color:#fff;background:var(--ink);
    border-radius:20px;width:19px;height:19px;display:flex;align-items:center;
    justify-content:center;flex:0 0 19px}
  .rule .rh b{font-size:13px}
  .rule .rk{margin-left:auto;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
    padding:2px 8px;border-radius:20px;font-weight:600}
  .rule .rk.on{background:var(--ok-soft);color:var(--ok)}
  .rule .rk.off{background:var(--neg-soft);color:var(--neg)}
  .rule .rw{font-size:12.5px;line-height:1.5}
  .rule .rm{font-size:12px;color:var(--muted);margin-top:7px;font-style:italic}
  .rule .rnote{font-size:11.5px;color:var(--warn);margin-top:6px}
  .rule .rex{font-family:var(--mono);font-size:11.5px;margin-top:9px;padding-top:8px;
    border-top:1px dashed var(--line);color:var(--ink)}
  .exsays{font-size:11.5px;color:var(--faint);margin-top:12px}

  /* one person's own arithmetic, figure by figure */
  .why{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  .why .wht{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
    color:var(--faint);margin-bottom:8px}
  .why .wr{display:flex;gap:12px;align-items:baseline;padding:5px 0;
    border-bottom:1px dashed var(--line);font-size:12.5px}
  .why .wr:last-child{border-bottom:0}
  .why .wh{min-width:160px;font-weight:600}
  .why .ws{flex:1;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  .why .wa{font-family:var(--mono);text-align:right;min-width:90px}
  @media (max-width:760px){ .why .wr{flex-wrap:wrap} .why .wh{min-width:0} }

  .msg{padding:13px 15px;border-radius:8px;background:var(--neg-soft);
    border:1px solid var(--neg);color:var(--neg);font-size:12.5px;margin-bottom:12px}
  .good{padding:13px 15px;border-radius:8px;background:var(--ok-soft);
    border:1px solid var(--ok);color:var(--ok);font-size:12.5px;margin-bottom:12px}
  .warnbox{padding:11px 14px;border-radius:8px;background:var(--warn-soft);
    border:1px solid var(--warn);color:var(--warn);font-size:12.5px;margin-bottom:12px}
  .loading{color:var(--muted);font-size:12.5px;padding:22px 0}
  .empty{color:var(--muted);font-size:12.5px;padding:16px 0}
  .note{font-size:11.5px;color:var(--faint);margin-top:11px}

  @media print{
    .rail,.topline,.ctabs,.cbar,.cards,.noprint{display:none !important}
    .main{margin-left:0}
    .shell{padding:0;max-width:none}
    .box{border:0;padding:0;margin:0}
    body{background:#fff;font-size:11px}
  }
</style>
</head>
<body>

<div class="layout">
  <aside class="rail"></aside>

  <div class="main">
    <div class="topline">
      <div>
        <h1>Payroll</h1>
        <div class="sub" id="sub">The month, worked out</div>
      </div>
    </div>

    <div class="shell">
      <div id="head"></div>
      <div class="ctabs" id="ctabs"></div>
      <div id="pane"><div class="loading">One moment&hellip;</div></div>
    </div>
  </div>
</div>

<script src="/nav.js"></script>
<script>
(function(){
  "use strict";
  var $ = function(id){ return document.getElementById(id); };

  function esc(s){
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function n0(v){ return Number(v||0).toLocaleString('en-US'); }
  // The books' own way of printing a figure: no decimals on a salary, and a
  // deduction in brackets rather than with a minus in front of it.
  function rs(v){
    var n = Math.round(Number(v||0));
    if (!n) return '<span class="zero">-</span>';
    if (n < 0) return '<span class="neg">(' + n0(-n) + ')</span>';
    return n0(n);
  }
  function plain(v){
    var n = Math.round(Number(v||0));
    return n < 0 ? '(' + n0(-n) + ')' : n0(n);
  }
  function get(url){
    return fetch(url, { cache:'no-store' }).then(function(r){ return r.json(); });
  }
  function post(url, body){
    return fetch(url, { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body || {}) }).then(function(r){ return r.json(); });
  }
  function keep(k, v){ try { localStorage.setItem(k, v); } catch (e) { /* private window */ } }
  function kept(k, d){ try { return localStorage.getItem(k) || d; } catch (e) { return d; } }

  var S = { month:'', D:null, said:'', err:'', open:null, tsCode:'', imported:null,
            rules:null, exampleSays:'', lateRules:null,
            report:null, slips:null, ledger:null, journal:null, accounts:null,
            tab: kept('fx.payroll.tab', 'working') };

  var TAB = [
    { k:'working', label:'Working' },
    { k:'pools',   label:'Bonuses and fines' },
    { k:'report',  label:'Report' },
    { k:'slips',   label:'Slips' },
    { k:'sheets',  label:'Time sheets' },
    { k:'ledger',  label:'Ledger' },
    { k:'qbo',     label:'To QuickBooks' },
    { k:'how',     label:'How it runs' }
  ];

  function monthNow(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  }
  function monthName(m){
    if (!m) return '';
    var names = ['January','February','March','April','May','June','July','August',
                 'September','October','November','December'];
    return names[Number(m.slice(5, 7)) - 1] + '-' + m.slice(0, 4);
  }

  function load(){
    S.err = '';
    S.report = S.slips = S.ledger = S.journal = null;
    return Promise.all([
      get('/api/hr/payroll?month=' + encodeURIComponent(S.month)),
      S.imported ? Promise.resolve({ months: S.imported }) : get('/api/hr/imported')
    ]).then(function(r){
      var d = r[0];
      if (d.error) { S.err = d.error; S.D = null; }
      else { S.D = d; S.month = d.month; }
      if (!r[1].error) S.imported = r[1].months || [];
      paint();
    }).catch(function(e){
      S.err = 'Could not read the month: ' + e.message;
      paint();
    });
  }

  function paint(){
    var h = '';
    if (S.err) h += '<div class="msg">' + esc(S.err) + '</div>';
    if (S.said) h += '<div class="good">' + esc(S.said) + '</div>';

    var D = S.D;
    var t = D ? D.totals : { people:0, earn:0, deduct:0, paid:0, net:0, payable:0,
                             bank:0, cash:0 };
    var run = D ? D.run : null;

    h += '<div class="cbar">' +
      '<label style="font-size:12.5px;color:var(--muted)">Month</label>' +
      '<input type="month" id="m" value="' + esc(S.month) + '">' +
      '<span style="font-size:11.5px;color:var(--faint)">' +
        (D ? esc(D.cycle.from) + ' to ' + esc(D.cycle.to) : '') + '</span>' +
      (run ? ' ' + statePill(run) : '') +
      '<span class="right">' +
      '<button id="figure">Work the month out</button>' +
      (D && D.mayApprove && run && run.state === 'open' ?
        '<button id="approve">Approve the month</button>' : '') +
      (D && D.admin && run && run.state === 'approved' ?
        '<button id="reopen">Reopen it</button>' : '') +
      '<a href="/attendance" style="font-size:12.5px;color:var(--accent-deep)">' +
      '&larr; Attendance</a></span></div>';

    h += '<div class="cards">' +
      card('People', n0(t.people), D ? D.cycle.from + ' to ' + D.cycle.to : '') +
      card('Salary and benefits', n0(Math.round(t.earn)), 'before anything is taken off') +
      card('Fines and deductions', plain(Math.round(t.deduct)), 'late, absent, loans') +
      card('Net salary', n0(Math.round(t.net)), 'what the month cost') +
      card('Paid during the month', n0(Math.round(t.paid)), 'already handed over') +
      card('Payable', n0(Math.round(t.payable)),
           n0(Math.round(t.bank)) + ' bank, ' + n0(Math.round(t.cash)) + ' cash') +
      '</div>';

    $('head').innerHTML = h;

    $('ctabs').innerHTML = TAB.map(function(x){
      return '<button data-k="' + x.k + '" class="' + (S.tab === x.k ? 'on' : '') + '">' +
        esc(x.label) + '</button>';
    }).join('');
    $('ctabs').querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        S.tab = b.getAttribute('data-k');
        keep('fx.payroll.tab', S.tab);
        S.said = ''; paint();
      });
    });

    $('m').addEventListener('change', function(){
      S.month = this.value || monthNow(); S.said = ''; S.open = null; load();
    });
    $('figure').addEventListener('click', function(){
      $('figure').disabled = true;
      post('/api/hr/payroll/figure', { month: S.month }).then(function(d){
        if (d.error) { alert(d.error); $('figure').disabled = false; return; }
        S.said = 'Worked out for ' + n0(d.people) + ' people. ' + n0(d.wrote) +
          ' figures written' + (d.kept ? ', ' + n0(d.kept) + ' you had typed left alone' : '') + '.';
        load();
      });
    });
    var ap = $('approve');
    if (ap) ap.addEventListener('click', function(){
      post('/api/hr/payroll/approve', { month: S.month }).then(function(d){
        if (d.error) return alert(d.error);
        S.said = d.already ? 'You had already approved it.'
          : (d.waiting ? 'Approved. Waiting on ' + d.waiting + ' more.'
                       : 'Approved. It can go to QuickBooks now.');
        load();
      });
    });
    var ro = $('reopen');
    if (ro) ro.addEventListener('click', function(){
      if (!confirm('Reopen ' + monthName(S.month) + '? Every approval on it is cleared.')) return;
      post('/api/hr/payroll/reopen', { month: S.month }).then(function(d){
        if (d.error) return alert(d.error);
        S.said = 'Reopened.';
        load();
      });
    });

    if (!D) { $('pane').innerHTML = ''; return; }

    if (S.tab === 'pools') paintPools();
    else if (S.tab === 'report') paintReport();
    else if (S.tab === 'slips') paintSlips();
    else if (S.tab === 'sheets') paintSheets();
    else if (S.tab === 'ledger') paintLedger();
    else if (S.tab === 'qbo') paintQbo();
    else if (S.tab === 'how') paintHow();
    else paintWorking();
  }

  function HEADKIND(head){
    return (S.D && S.D.headKind && S.D.headKind[head]) || 'earn';
  }

  function statePill(run){
    if (run.state === 'posted') {
      return '<span class="pill ok">in QuickBooks as ' + esc(run.qb_doc_number || run.qb_journal_id) + '</span>';
    }
    if (run.state === 'approved') return '<span class="pill ok">approved</span>';
    var n = (run.approvals || []).length;
    return '<span class="pill warn">open' + (n ? ', ' + n + ' approved' : '') + '</span>';
  }

  function card(k, v, n){
    return '<div class="card"><div class="k">' + esc(k) + '</div>' +
      '<div class="v">' + v + '</div><div class="n">' + esc(n) + '</div></div>';
  }

  /* ==================== working ==================== */

  function paintWorking(){
    var D = S.D;
    var h = '<div class="box"><h3>The working' +
      '<span class="aside">' + esc(monthName(S.month)) + ' &middot; click a row to change a figure</span></h3>' +
      '<div class="wide"><table class="t"><thead><tr>' +
      '<th>Id</th><th>Name</th><th>Dept</th>' +
      '<th class="num">Basic</th><th class="num">Days</th>' +
      '<th class="num">OT min</th><th class="num">Late min</th>' +
      '<th class="num">Late days</th><th class="num">Cut</th>' +
      '<th class="num">Absent</th><th class="num">Half</th><th class="num">A.half</th>' +
      '<th class="num">Leave</th>' +
      D.earn.map(function(x){ return '<th class="num">' + esc(x) + '</th>'; }).join('') +
      D.deduct.map(function(x){ return '<th class="num">' + esc(x) + '</th>'; }).join('') +
      '<th class="num">Net</th><th class="num">Paid</th><th class="num">Payable</th>' +
      '</tr></thead><tbody>';

    D.rows.forEach(function(r){
      h += '<tr class="pick' + (S.open === r.code ? ' on' : '') +
        '" data-code="' + esc(r.code) + '">' +
        '<td class="num">' + esc(r.code) + '</td>' +
        '<td style="white-space:nowrap"><b>' + esc(r.name) + '</b></td>' +
        '<td>' + esc(r.department) + '</td>' +
        '<td class="num">' + rs(r.basic) + '</td>' +
        '<td class="num">' + n0(r.workDays) + '</td>' +
        '<td class="num">' + n0(r.otMin) + '</td>' +
        '<td class="num">' + n0(r.lateMin) + '</td>' +
        '<td class="num">' + n0(r.lateDays) + '</td>' +
        '<td class="num">' + (r.lateCut ? n0(r.lateCut) : '<span class="zero">-</span>') + '</td>' +
        '<td class="num">' + (r.absent ? n0(r.absent) : '<span class="zero">-</span>') + '</td>' +
        '<td class="num">' + (r.half ? n0(r.half) : '<span class="zero">-</span>') + '</td>' +
        '<td class="num">' + (r.ahalf ? n0(r.ahalf) : '<span class="zero">-</span>') + '</td>' +
        '<td class="num">' + (r.leaves ? n0(r.leaves) : '<span class="zero">-</span>') + '</td>' +
        D.earn.concat(D.deduct).map(function(head){
          var cls = (r.typed || []).indexOf(head) >= 0 ? ' hand'
                  : (r.imported || []).indexOf(head) >= 0 ? ' imp' : '';
          return '<td class="num' + cls + '">' + rs(r.amount[head]) + '</td>';
        }).join('') +
        '<td class="num"><b>' + rs(r.net) + '</b></td>' +
        '<td class="num">' + rs(r.paid) + '</td>' +
        '<td class="num"><b>' + rs(r.payable) + '</b></td></tr>';
    });

    var t = D.totals;
    h += '</tbody><tfoot><tr><td colspan="3">' + n0(t.people) + ' people</td>' +
      '<td colspan="10"></td>' +
      D.earn.concat(D.deduct).map(function(head){
        return '<td class="num">' + rs(t.heads[head]) + '</td>';
      }).join('') +
      '<td class="num">' + rs(t.net) + '</td>' +
      '<td class="num">' + rs(t.paid) + '</td>' +
      '<td class="num">' + rs(t.payable) + '</td></tr></tfoot></table></div>' +
      '<div class="note">A figure in teal is one somebody typed; one in italics ' +
      'came out of the old ledger. Working the month out again leaves both exactly ' +
      'as they are.</div></div><div id="one"></div>';

    $('pane').innerHTML = h;

    $('pane').querySelectorAll('tr.pick').forEach(function(tr){
      tr.addEventListener('click', function(){
        var code = tr.getAttribute('data-code');
        S.open = S.open === code ? null : code;
        paintWorking();
      });
    });
    if (S.open) paintOne(S.open);
  }

  function paintOne(code){
    var D = S.D;
    var r = D.rows.filter(function(x){ return x.code === code; })[0];
    if (!r) { $('one').innerHTML = ''; return; }
    var locked = D.run && D.run.state === 'posted';

    var h = '<div class="box"><h3>' + esc(r.name) + ' (' + esc(r.code) + ')' +
      '<span class="aside">' + esc(r.department) + ' &middot; ' +
      esc(r.lateRule === 'minutes2x' ? 'late charged by the minute, double after an hour'
        : r.lateRule === 'minutes' ? 'late charged by the minute'
        : 'late charged a day for every ' + (D.policy.latePer || 3)) +
      (r.otAllowed ? '' : ' &middot; no overtime') +
      (r.bonusAllowed ? '' : ' &middot; no regular bonus') + '</span></h3>';

    if (locked) h += '<div class="warnbox">This month is in QuickBooks. Nothing can be changed.</div>';

    h += '<div class="f"><div class="form">' +
      '<div><label>Days on the payroll</label><input type="number" id="fdays" value="' +
        esc(r.workDays) + '"></div>' +
      '<div><label>Extra days of overtime</label><input type="number" id="fextra" value="' +
        esc(r.extraDays) + '"></div>' +
      '<div><label>Basic for this month</label><input type="number" id="fbasic" value="' +
        esc(r.basic) + '"></div>' +
      '<div><label>Paid by</label><select id="fmode">' +
        ['bank','cash'].map(function(x){
          return '<option value="' + x + '"' + (r.payMode === x ? ' selected' : '') +
            '>' + x + '</option>';
        }).join('') + '</select></div>' +
      '</div><div class="acts"><button id="savefacts"' + (locked ? ' disabled' : '') +
      '>Save these four</button></div></div>';

    h += '<div class="lst" style="margin-top:18px"><table class="t"><thead><tr>' +
      '<th>Head</th><th class="num">Worked out</th><th class="num">Use this instead</th>' +
      '<th></th></tr></thead><tbody>';

    D.heads.forEach(function(head){
      var auto = r.auto[head];
      var isHand = r.hand.indexOf(head) >= 0;
      var kind = D.headKind[head];
      h += '<tr><td>' + esc(head) +
        (kind === 'deduct' ? ' <small style="color:var(--faint)">deduction</small>' : '') +
        (kind === 'info' ? ' <small style="color:var(--faint)">said, not deducted</small>' : '') +
        (kind === 'paid' ? ' <small style="color:var(--faint)">already paid</small>' : '') +
        '</td>' +
        '<td class="num">' + (auto === undefined ?
          '<span class="zero">-</span>' : rs(auto)) + '</td>' +
        '<td class="num"><input type="number" class="cell" data-head="' + esc(head) +
          '" value="' + (isHand ? Math.abs(Number(r.amount[head])) : '') + '"' +
          (locked ? ' disabled' : '') + '></td>' +
        '<td>' + ((r.typed || []).indexOf(head) >= 0
          ? '<span class="pill warn">typed</span>'
          : (r.imported || []).indexOf(head) >= 0
            ? '<span class="pill no">from the old ledger</span>' : '') +
        '</td></tr>';
    });

    h += '</tbody></table></div>';

    // Why each worked-out figure is what it is, in this person's own numbers.
    // "Why is my absent fine 2,750" is the question a payroll gets asked every
    // month, and the answer should be on the screen rather than in somebody's
    // head.
    if ((r.why || []).length) {
      h += '<div class="why"><div class="wht">Why these figures</div>' +
        r.why.map(function(x){
          return '<div class="wr"><span class="wh">' + esc(x.head) + '</span>' +
            '<span class="ws">' + esc(x.sum) + '</span>' +
            '<span class="wa">' + rs(HEADKIND(x.head) === 'deduct' ?
              -Math.abs(x.amount) : x.amount) + '</span></div>';
        }).join('') + '</div>';
    }

    h += '<div class="acts"><button class="solid" id="savelines"' + (locked ? ' disabled' : '') +
      '>Save the figures typed</button>' +
      '<span class="note" style="margin:0">A deduction goes in as a plain number ' +
      '&mdash; it is taken off whichever way it is typed. An empty box goes back to ' +
      'the worked-out figure.</span></div></div>';

    $('one').innerHTML = h;
    $('one').scrollIntoView({ behavior:'smooth', block:'nearest' });

    $('savefacts').addEventListener('click', function(){
      post('/api/hr/payroll/facts', {
        month: S.month, emp_code: code,
        work_days: $('fdays').value, ot_extra_days: $('fextra').value,
        basic: $('fbasic').value, pay_mode: $('fmode').value
      }).then(function(d){
        if (d.error) return alert(d.error);
        S.said = 'Saved. Press Work the month out to put it through the figures.';
        load();
      });
    });

    $('savelines').addEventListener('click', function(){
      var jobs = [];
      $('one').querySelectorAll('input.cell').forEach(function(el){
        var head = el.getAttribute('data-head');
        var was = r.hand.indexOf(head) >= 0 ? String(Math.abs(Number(r.amount[head]))) : '';
        if (String(el.value) === was) return;
        jobs.push(post('/api/hr/payroll/line', {
          month: S.month, emp_code: code, head: head,
          amount: el.value === '' ? '' : el.value
        }));
      });
      if (!jobs.length) return alert('Nothing was changed.');
      Promise.all(jobs).then(function(out){
        var bad = out.filter(function(x){ return x.error; });
        if (bad.length) return alert(bad[0].error);
        S.said = jobs.length + ' figure' + (jobs.length > 1 ? 's' : '') + ' saved.';
        load();
      });
    });
  }

  /* ==================== bonuses and fines ==================== */

  function paintPools(){
    var D = S.D;
    var h = '<div class="cbar"><button id="fill">Bring the figures in from Fusion</button>' +
      '<span class="note" style="margin:0">It fills the boxes from the couriers and the ' +
      'shop for these dates. Every one of them can be typed over.</span></div>';

    h += poolBox('parcel', 'Parcel bonus', D.pools.parcel);
    h += poolBox('parcelfine', 'Parcel fine', D.pools.parcelfine);
    h += poolBox('order', 'Order bonus', D.pools.order);

    $('pane').innerHTML = h;
    wirePools();

    $('fill').addEventListener('click', function(){
      get('/api/hr/figures?month=' + encodeURIComponent(S.month)).then(function(d){
        if (d.error) return alert(d.error);

  function wirePools(){
    $('pane').querySelectorAll('[data-pool]').forEach(function(box){
      var kind = box.getAttribute('data-pool');
      var btn = box.querySelector('.pS');
      if (!btn || btn.dataset.wired) return;
      btn.dataset.wired = '1';
      btn.addEventListener('click', function(){
        var data = JSON.parse(JSON.stringify(S.D.pools[kind]));
        delete data.figures;
        // Each box names where in the object it belongs, so the shapes stay the
        // courier's and the brand's rather than becoming a flat list of numbers.
        box.querySelectorAll('.pf').forEach(function(el){
          var path = el.getAttribute('data-f').split('.');
          var at = data;
          for (var i = 0; i < path.length - 1; i++) {
            var k = path[i];
            if (/^[0-9]+$/.test(k)) k = Number(k);
            if (at[k] == null) at[k] = /^[0-9]+$/.test(String(path[i+1])) ? [] : {};
            at = at[k];
          }
          var last = path[path.length - 1];
          var v = el.value;
          if (el.type === 'number') v = v === '' ? null : Number(v);
          at[last] = v;
        });
        data.persons = [];
        box.querySelectorAll('.pp').forEach(function(cb){
          if (cb.checked) data.persons.push(cb.value);
        });
        post('/api/hr/payroll/pool', { month: S.month, kind: kind, data: data })
          .then(function(d){
            if (d.error) return alert(d.error);
            S.said = 'Saved &mdash; ' + plain(d.figures.each) + ' each, between ' +
              data.persons.length + ' people. Press Work the month out to put it ' +
              'into the salaries.';
            load();
          });
      });
    });
  }

    function foot(label, t){
      return '<tr style="background:var(--panel-2);font-weight:600">' +

        '<td class="num">' + rs(t.payable) + '</td><td class="num">' + rs(t.bank) + '</td>' +
        '<td class="num">' + rs(t.cash) + '</td>' +
        R.heads.map(function(x){ return '<td class="num">' + rs(t.earn[x]) + '</td>'; }).join('') +
        '<td class="num">' + rs(t.totalSalary) + '</td>' +
        '<td class="num">' + rs(t.advance) + '</td>' +
        '<td class="num">' + rs(t.credit) + '</td>' +
        R.deducts.map(function(x){ return '<td class="num">' + rs(t.deduct[x]) + '</td>'; }).join('') +
        '<td class="num">' + rs(t.totalDeduct) + '</td></tr>';
    }

    h += body(R.staff);
    h += foot('Subtotal Employees', R.subtotal.staff);
    if (R.management.length) {
      h += body(R.management);
      h += foot('Subtotal Management', R.subtotal.management);
    }
    h += '</tbody><tfoot>' + foot('Total', R.total).replace(/^<tr[^>]*>/, '<tr>') +
      '</tfoot></table></div></div>';

    $('pane').innerHTML = h;
    $('print').addEventListener('click', function(){ window.print(); });
    $('csv').addEventListener('click', function(){ reportCsv(R); });
  }

  function reportCsv(R){
    var head = ['Sr','Name','Net Salary','Paid','Payable','Bank','Cash']
      .concat(R.heads).concat(['Total Salary','Advance','Credit Purchase'])
      .concat(R.deducts).concat(['Total Deduction']);
    var lines = [head.join(',')];
    var sr = 0;
    R.staff.concat(R.management).forEach(function(r){
      sr++;
      var row = [sr, r.name, r.net, r.paid, r.payable, r.bank, r.cash]
        .concat(R.heads.map(function(x){ return r.earn[x] || 0; }))
        .concat([r.totalSalary, r.advance, r.credit])
        .concat(R.deducts.map(function(x){ return r.deduct[x] || 0; }))
        .concat([r.totalDeduct]);
      lines.push(row.map(cell).join(','));
    });
    save(lines.join('\r\n'), 'salary-report-' + R.month + '.csv');
  }

  function cell(v){
    var s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }

  function save(text, name){
    var blob = new Blob([text], { type:'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
  }

  /* ---------- the years of ledger they already have ---------- */
  //
  // Their own ledger is the whole of the money since February 2025, in exactly
  // this shape - employee, head, side, amount - so it is read in as it is. The
  // side is what carries the meaning: Payable is owed to them, Receivable is
  // owed by them, and Paid is what was handed over during the month.
  //
  // A month brought in this way can be taken back off again, which is the only
  // way to try the calculation on a month the old sheet already answered.

  var oldFile = null;

  function oldLedgerBox(){
    var done = (S.imported || []).map(function(m){
      return '<tr><td class="num">' + esc(m.month) + '</td>' +
        '<td class="num">' + n0(m.people) + '</td>' +
        '<td class="num">' + n0(m.lines) + '</td>' +
        '<td><button class="oc" data-m="' + esc(m.month) + '" style="border:1px solid ' +
        'var(--line);background:#fff;border-radius:6px;padding:4px 10px;font:inherit;' +
        'font-size:11.5px;cursor:pointer;width:auto;height:auto">Take it back off</button>' +
        '</td></tr>';
    }).join('');

    return '<div class="box noprint"><h3>Bring the old ledger in' +
      '<span class="aside">every month it holds, in one go</span></h3>' +
      '<div class="drop" id="odrop">Choose the salary workbook &mdash; the Ledger sheet' +
      '<input type="file" id="ofile" accept=".xlsx,.xls,.csv" style="display:none"></div>' +
      '<div id="ores"></div>' +
      (done ? '<div class="lst" style="margin-top:14px"><table class="t"><thead><tr>' +
        '<th>Month</th><th class="num">People</th><th class="num">Figures</th><th></th>' +
        '</tr></thead><tbody>' + done + '</tbody></table></div>' : '') +
      '<div class="note">A figure somebody has typed here is never overruled by an ' +
      'import. Taking a month back off removes only what the import wrote.</div></div>';
  }

  function wireOldLedger(){
    var d = $('odrop');
    if (!d) return;
    d.addEventListener('click', function(){ $('ofile').click(); });
    $('ofile').addEventListener('change', function(){
      if (this.files && this.files[0]) bringLedger(this.files[0], true, '');
    });
    $('pane').querySelectorAll('button.oc').forEach(function(b){
      b.addEventListener('click', function(){
        var m = b.getAttribute('data-m');
        if (!confirm('Take ' + m + ' back off? Only the figures the import wrote go; ' +
            'anything typed here stays.')) return;
        post('/api/hr/imported/clear', { month: m }).then(function(r){
          if (r.error) return alert(r.error);
          S.said = n0(r.cleared) + ' imported figures taken off ' + m + '.';
          S.ledger = null; S.imported = null; load();
        });
      });
    });
  }

  function bringLedger(file, lookFirst, sheet){
    var fd = new FormData();
    fd.append('file', file);
    if (lookFirst) fd.append('look', '1');
    if (sheet) fd.append('sheet', sheet);
    $('ores').innerHTML = '<div class="loading">Reading the ledger&hellip;</div>';
    fetch('/api/hr/payroll/import', { method:'POST', body: fd })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (d.error) {
          $('ores').innerHTML = '<div class="msg">' + esc(d.error) + '</div>' + oddities(d);
          return;
        }
        var pick = (d.sheets || []).length > 1
          ? '<div class="cbar"><label style="font-size:12.5px;color:var(--muted)">' +
            'Sheet</label><select id="osh">' + d.sheets.map(function(n){
              return '<option value="' + esc(n) + '"' + (n === d.sheet ? ' selected' : '') +
                '>' + esc(n) + '</option>';
            }).join('') + '</select></div>'
          : '';

        var body = '<div class="good">' + n0(d.rows) + ' figures across ' +
          n0((d.months || []).length) + ' months' +
          (d.written != null ? ', ' + n0(d.written) + ' written' +
            (d.kept ? ' and ' + n0(d.kept) + ' left as you had typed them' : '') : '') +
          (d.basics ? '. ' + n0(d.basics) + ' basic salaries filled in from it' : '') +
          '.</div>' + pick + monthsTable(d.summary) + oddities(d);

        if (d.dryRun) {
          oldFile = file;
          body += '<div class="acts"><button class="solid" id="ogo">Bring it all in' +
            '</button><button id="ocancel">Leave it</button></div>';
        }
        $('ores').innerHTML = body;

        var sh = $('osh');
        if (sh) sh.addEventListener('change', function(){
          bringLedger(file, true, this.value);
        });
        var go = $('ogo');
        if (go) go.addEventListener('click', function(){
          bringLedger(oldFile, false, sh ? sh.value : '');
        });
        var ca = $('ocancel');
        if (ca) ca.addEventListener('click', function(){ S.ledger = null; paintLedger(); });

        if (!d.dryRun) {
          S.said = n0(d.written) + ' figures brought in across ' +
            n0((d.months || []).length) + ' months.';
          S.ledger = null; S.imported = null; load();
        }
      })
      .catch(function(e){
        $('ores').innerHTML = '<div class="msg">' + esc(e.message) + '</div>';
      });
  }

  function monthsTable(summary){
    if (!summary || !summary.length) return '';
    return '<div class="lst" style="max-height:260px"><table class="t"><thead><tr>' +
      '<th>Month</th><th class="num">People</th><th class="num">Net salary</th>' +
      '</tr></thead><tbody>' + summary.map(function(m){
        return '<tr><td class="num">' + esc(m.month) + '</td>' +
          '<td class="num">' + n0(m.people) + '</td>' +
          '<td class="num">' + rs(m.net) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  function oddities(d){
    var out = '';
    if ((d.unknownWho || []).length) {
      out += '<div class="warnbox">The ledger names ' + n0(d.unknownWho.length) +
        ' people who are not on the staff list, and their figures were left out: ' +
        esc(d.unknownWho.map(function(u){
          return (u.code ? u.name + ' (' + u.code + ')' : u.name) + ' - ' + u.rows;
        }).join(', ')) +
        '. Add them on <a href="/employees">People</a> and bring the file in again.</div>';
    }
    if ((d.unknownHeads || []).length) {
      out += '<div class="warnbox">These words are not heads this app knows, so their ' +
        'rows were left out rather than guessed at: ' +
        esc(d.unknownHeads.map(function(u){
          return u.word + ' (' + u.rows + ')';
        }).join(', ')) + '</div>';
    }
    if (d.noMonth) {
      out += '<div class="note">' + n0(d.noMonth) + ' rows carried no month and were ' +
        'left out.</div>';
    }
    return out;
  }

  /* ==================== to QuickBooks ==================== */

  function paintQbo(){
    if (!S.journal) {
      $('pane').innerHTML = '<div class="loading">Working the entry out&hellip;</div>';
      get('/api/hr/journal?month=' + encodeURIComponent(S.month)).then(function(d){
        if (d.error) { $('pane').innerHTML = '<div class="msg">' + esc(d.error) + '</div>'; return; }
        S.journal = d; paintQbo();
      });
      return;
    }
    var J = S.journal;
    var run = J.run || {};

    var h = '';
    if (run.state === 'posted') {
      h += '<div class="good">' + esc(monthName(J.month)) +
        ' is in QuickBooks as journal entry ' + esc(run.qb_doc_number || '') +
        ' (id ' + esc(run.qb_journal_id || '') + ').</div>';
    } else if (run.state !== 'approved') {
      h += '<div class="warnbox">The month has to be approved before it can be posted. ' +
        'Press <b>Approve the month</b> at the top.</div>';
    }
    if (J.missing && J.missing.length) {
      h += '<div class="warnbox">No account set yet for: ' + esc(J.missing.join(', ')) +
        '. Set them under <b>How it runs</b>.</div>';
    }
    if (!J.balanced) {
      h += '<div class="msg">The entry does not balance: ' + plain(J.debit) +
        ' debit against ' + plain(J.credit) + ' credit. Nothing will be sent.</div>';
    }

    h += '<div class="box"><h3>The entry' +
      '<span class="aside">SAL-' + esc(J.month) + ' dated ' + esc(J.cycle.to) +
      '</span></h3><table class="t"><thead><tr><th>Head</th><th>Side</th>' +
      '<th>Account</th><th class="num">Amount</th></tr></thead><tbody>' +
      (J.lines || []).map(function(l){
        return '<tr><td>' + esc(l.head) + '</td><td>' + esc(l.side) + '</td>' +
          '<td class="num">' + esc(l.account) + '</td>' +
          '<td class="num">' + rs(l.amount) + '</td></tr>';
      }).join('') +
      '</tbody><tfoot><tr><td colspan="3">Debit ' + plain(J.debit) + ', credit ' +
      plain(J.credit) + '</td><td class="num">' +
      (J.balanced ? '<span class="pill ok">balanced</span>'
                  : '<span class="pill neg">out by ' +
                    plain(Math.abs(J.debit - J.credit)) + '</span>') +
      '</td></tr></tfoot></table>' +
      '<div class="acts"><button class="solid" id="postit"' +
      (run.state === 'approved' && J.balanced && !(J.missing || []).length ? '' : ' disabled') +
      '>Post it to QuickBooks</button>' +
      '<span class="note" style="margin:0">One entry for the month. Paying the staff ' +
      'is a payment against the payable, made in the books by hand &mdash; this app ' +
      'does not pay anybody.</span></div></div>';

    $('pane').innerHTML = h;
    $('postit').addEventListener('click', function(){
      if (!confirm('Post ' + monthName(J.month) + ' to QuickBooks? It writes one ' +
          'journal entry and cannot be undone from here.')) return;
      $('postit').disabled = true;
      post('/api/hr/post', { month: S.month }).then(function(d){
        if (d.error) { alert(d.error); $('postit').disabled = false; return; }
        S.said = 'Posted as ' + d.docNumber + ', ' + d.lines + ' lines.';
        S.journal = null;
        load();
      });
    });
  }

  /* ==================== how it runs ==================== */
  //
  // The statement of the system, the way the Shopify connector states its own:
  // every rule the salary depends on, in a sentence, with the number in it.

  function paintHow(){
    var P = S.D.policy;
    var admin = S.D.admin;

    // The rules are read once per visit to this tab, not on every page open:
    // it is a screen somebody opens to read, not a poll.
    if (!S.rules) {
      get('/api/hr/policy').then(function(d){
        if (d.error) { S.rules = []; paintHow(); return; }
        S.rules = d.rules || [];
        S.exampleSays = d.exampleSays || '';
        S.lateRules = d.lateRules || [];
        paintHow();
      });
    }

    var h = '<div class="box"><h3>How the salary is worked out' +
      '<span class="aside">' + (admin ? 'you may change these'
        : 'only the administrator may change these') + '</span></h3>' +
      '<div class="f"><div class="form">' +
      numf('cycleStart', 'The month runs from this day', P.cycleStart) +
      numf('monthDays', 'Every per-day rate divides by', P.monthDays) +
      timef('dutyFrom', 'On duty at', P.dutyFrom) +
      timef('dutyTo', 'Off duty at', P.dutyTo) +
      numf('dutyMinutes', 'Minutes in a working day', P.dutyMinutes) +
      numf('graceMinutes', 'Late starts after this many minutes', P.graceMinutes) +
      numf('lateCountOver', 'A day counts as late over this many minutes', P.lateCountOver) +
      numf('latePer', 'One day of basic goes every this many late days', P.latePer) +
      timef('otFrom', 'Overtime starts at', P.otFrom) +
      timef('otTo', 'And stops at', P.otTo) +
      '<div style="grid-column:1/-1"><label>How lateness is charged, by default</label>' +
        '<select data-p="lateRule">' +
        (S.lateRules || [{ key:'days', name:'A whole day, after every third late arrival' },
                          { key:'minutes', name:'By the minute' },
                          { key:'minutes2x', name:'By the minute, doubled past the first hour' }])
          .map(function(x){
            return '<option value="' + esc(x.key) + '"' +
              (P.lateRule === x.key ? ' selected' : '') + '>' + esc(x.name) + '</option>';
          }).join('') + '</select></div>' +
      '<div><label>Overtime is paid to (departments, commas)</label>' +
        '<input type="text" data-p="otDepts" value="' +
          esc((P.otDepts || []).join(', ')) + '"></div>' +
      '<div><label>No regular bonus for (departments, commas)</label>' +
        '<input type="text" data-p="noBonusDepts" value="' +
          esc((P.noBonusDepts || []).join(', ')) + '"></div>' +
      '<div><label>Late by the minute, doubled after an hour, for</label>' +
        '<input type="text" data-p="lateRule2x" value="' +
          esc(Object.keys(P.lateRuleByDept || {}).filter(function(k){
            return P.lateRuleByDept[k] === 'minutes2x';
          }).join(', ')) + '"></div>' +
      '<div><label>Paid during the month (heads, commas)</label>' +
        '<input type="text" data-p="paidDuringMonth" value="' +
          esc((P.paidDuringMonth || ['Food Allowance']).join(', ')) + '"></div>' +
      '<div style="grid-column:1/-1"><label>Who approves leave and the month ' +
        '(emails, commas)</label><input type="text" data-p="approvers" value="' +
          esc((P.approvers || []).join(', ')) + '"></div>' +
      '</div>' +
      '<div class="acts"><button class="solid" id="savepol"' +
        (admin ? '' : ' disabled') + '>Save how it runs</button></div></div></div>';

    h += rulesBox();

    h += '<div class="box"><h3>Where each head lands in QuickBooks' +
      '<span class="aside">' + (S.accounts ? n0(S.accounts.length) + ' accounts'
        : 'press read to fetch the chart') + '</span></h3>' +
      '<div class="cbar"><button id="readacc">Read the chart of accounts</button></div>' +
      '<div id="accmap">' + (S.accounts ? accMap(P) :
        '<div class="empty">The chart has not been read yet.</div>') + '</div></div>';

    $('pane').innerHTML = h;

    $('savepol').addEventListener('click', savePolicy);
    $('readacc').addEventListener('click', function(){
      $('accmap').innerHTML = '<div class="loading">Asking QuickBooks&hellip;</div>';
      get('/api/hr/accounts').then(function(d){
        if (d.error) {
          $('accmap').innerHTML = '<div class="msg">' + esc(d.error) + '</div>';
          return;
        }
        S.accounts = d.accounts || [];
        $('accmap').innerHTML = accMap(P);
        wireAcc();
      });
    });
    if (S.accounts) wireAcc();
  }

  /* ---------- every rule, drawn from the rules themselves ---------- */
  //
  // This list is not written here. It comes off `hrrules.js` through
  // /api/hr/policy, so the screen and the code are the same thing said once.
  // Each rule shows its name, what it is in a sentence, how it is worked out,
  // and the same sum with numbers in it - because a figure nobody can see the
  // arithmetic behind is a figure nobody can argue with.

  function rulesBox(){
    if (!S.rules) {
      return '<div class="box"><h3>How each figure is worked out</h3>' +
        '<div class="loading">Reading the rules&hellip;</div></div>';
    }
    return '<div class="box"><h3>How each figure is worked out' +
      '<span class="aside">' + n0(S.rules.length) + ' rules</span></h3>' +
      '<div class="rules">' + S.rules.map(function(r){
        return '<div class="rule">' +
          '<div class="rh"><span class="rn">' + r.no + '</span>' +
            '<b>' + esc(r.head) + '</b>' +
            '<span class="rk ' + (r.kind === 'deduct' ? 'off' : 'on') + '">' +
              (r.kind === 'deduct' ? 'taken off' : 'added') + '</span></div>' +
          '<div class="rw">' + esc(r.what) + '</div>' +
          '<div class="rm"><span>' + esc(r.how) + '</span></div>' +
          (r.note ? '<div class="rnote">' + esc(r.note) + '</div>' : '') +
          '<div class="rex">' + esc(r.sum) + '</div>' +
        '</div>';
      }).join('') + '</div>' +
      '<div class="exsays">Worked out on: ' + esc(S.exampleSays || '') + '</div>' +
      '</div>';
  }

  function rule(n, text){
    return '<tr><td class="num" style="width:30px;color:var(--faint)">' + n + '</td>' +
      '<td>' + text + '</td></tr>';
  }
  function numf(k, label, v){
    return '<div><label>' + esc(label) + '</label>' +
      '<input type="number" data-p="' + k + '" value="' + esc(v == null ? '' : v) + '"></div>';
  }
  function timef(k, label, v){
    return '<div><label>' + esc(label) + '</label>' +
      '<input type="time" data-p="' + k + '" value="' + esc(v || '') + '"></div>';
  }

  function accMap(P){
    var heads = S.D.earn.concat(S.D.deduct)
      .concat(['Paid During Month', 'Salary payable']);
    var acc = P.accounts || {};
    return '<table class="t"><thead><tr><th>Head</th><th>Account</th></tr></thead><tbody>' +
      heads.map(function(head){
        var now = head === 'Salary payable' ? (P.payableAccount || '') : (acc[head] || '');
        return '<tr><td>' + esc(head) + '</td><td><select class="am" data-head="' +
          esc(head) + '" style="width:100%;border:1px solid var(--line);border-radius:6px;' +
          'padding:6px 8px;font:inherit;font-size:12.5px">' +
          '<option value="">(not set)</option>' +
          S.accounts.map(function(a){
            return '<option value="' + esc(a.id) + '"' +
              (String(now) === String(a.id) ? ' selected' : '') + '>' +
              esc(a.name) + ' &mdash; ' + esc(a.type) + '</option>';
          }).join('') + '</select></td></tr>';
      }).join('') +
      '</tbody></table><div class="acts"><button class="solid" id="saveacc"' +
      (S.D.admin ? '' : ' disabled') + '>Save where they land</button></div>';
  }

  function wireAcc(){
    var b = $('saveacc');
    if (!b) return;
    b.addEventListener('click', function(){
      var accounts = {}, payable = '';
      $('accmap').querySelectorAll('select.am').forEach(function(sel){
        var head = sel.getAttribute('data-head');
        if (head === 'Salary payable') payable = sel.value;
        else if (sel.value) accounts[head] = sel.value;
      });
      post('/api/hr/policy', { accounts: accounts, payableAccount: payable })
        .then(function(d){
          if (d.error) return alert(d.error);
          S.said = 'Saved where each head lands.';
          S.journal = null;
          load();
        });
    });
  }

  function savePolicy(){
    var body = {};
    $('pane').querySelectorAll('[data-p]').forEach(function(el){
      body[el.getAttribute('data-p')] = el.value;
    });
    ['otDepts','noBonusDepts','approvers','paidDuringMonth'].forEach(function(k){
      body[k] = String(body[k] || '').split(',').map(function(x){ return x.trim(); })
        .filter(Boolean);
    });
    var two = String(body.lateRule2x || '').split(',').map(function(x){ return x.trim(); })
      .filter(Boolean);
    delete body.lateRule2x;
    body.lateRuleByDept = {};
    two.forEach(function(d){ body.lateRuleByDept[d] = 'minutes2x'; });
    post('/api/hr/policy', body).then(function(d){
      if (d.error) return alert(d.error);
      S.said = 'Saved. Press Work the month out to put it through the figures.';
      load();
    });
  }

  S.month = monthNow();
  window.APP.ready.then(function(){ load(); });
})();
</script>
</body>
</html>
